- title: Rozdział 7 - Programowanie Obiektowe
  content_markdown: >
    Wyrażanie idei przy pomocy funkcji to sprawdzony sposób na reprezentowanie
    zachowań i danych (język C robi tak już od dekad!). Historycznie,
    informatyka odnalazła też inne przydatne, ekspresyjne sposoby agregacji
    i abstrakcji danych. Być może znasz programowanie obiektowe (ang. *OOP*)
    jako jeden z takich sposobów. W tym rozdziale zbadamy, co Rust oferuje
    poza samymi funkcjami.
- title: Czym Jest OOP?
  content_markdown: >
    Programowanie obiektowe odnosi się z grubsza do języków programowania,
    które posiadają kilka charakterystycznych cech:

    * Enkapsulacja - łączenie danych i funkcji w pojedynczą, konceptualną
    jednostkę zwaną *obiektem*.

    * Abstrakcja - ukrywanie danych i składowych funkcji, żeby zatuszować
    szczegóły implementacyjne obiektu.

    * Polimorfizm - zdolność do interakcji z obiektem z różnych perspektyw
    funkcjonalnych.

    * Dziedziczenie - zdolność do dziedziczenia danych i zachowań od innych
    obiektów.
- title: Rust To Nie OOP
  content_markdown: >
    W Ruście brakuje w istotny sposób dziedziczenia danych i zachowań.


    * Struktury nie mogą dziedziczyć pól od struktury rodzicielskiej.

    * Struktury nie mogą dziedziczyć funkcji od struktury rodzicielskiej.


    Mimo to, Rust implementuje wiele innych cech znanych z innych języków
    programowania, więc możesz nawet nie zauważyć tego braku.
- title: Enkapsulacja Za Pomocą Metod
  code: |
    struct SeaCreature {
        noise: String,
    }

    impl SeaCreature {
        fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust wspiera koncepcję *obiektu*, czyli struktury powiązanej z pewnymi
    funkcjami (znanymi też jako *metody*).


    Pierwszym parametrem każdej metody musi być referencja do instancji
    powiązanej z wywołaniem tej metody (np. `instancjaObiektu.foo()`). Rust
    używa do tego:

    * `&self` - Niemutowalnej referencji do instancji.

    * `&mut self` - Mutowalnej referencji do instancji.


    Metody są zdefiniowane wewnątrz bloku implementacji, oznaczonego słowem
    kluczowym `impl`:


    ```rust

    impl MyStruct {
        ...
        fn foo(&self) {
            ...
        }
    }

    ```
- title: Abstrakcja Przy Pomocy Selektywnego Udostępniania
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust potrafi ukrywać wewnętrzne działanie obiektów.


    Domyślnie pola i metody są dostępne wyłącznie dla modułu, do którego
    należą.


    Słowo kluczowe `pub` udostępnia pola i metody struktury na zewnątrz
    modułu.
- title: Polimorfizm Przy Pomocy Cech
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_noise();
    }
  content_markdown: >
    Rust wspiera polimorfizm przy pomocy cech (ang. *traits*). Cechy
    pozwalają nam powiązać zestaw metod z typem struktury.


    Najpierw definiujemy sygnatury metod danej cechy:


    ```

    trait MyTrait {
        fn foo(&self);
        ...
    }

    ```


    Kiedy struktura implementuje cechę, ustanawia to kontrakt, który
    pozwala nam pośrednio wchodzić w interakcję ze strukturą poprzez typ
    cechy (np. `&dyn MyTrait`), bez konieczności znajomości jej rzeczywistego
    typu.


    Zaimplementowane przez strukturę metody cechy są zdefiniowane wewnątrz
    bloku implementacji:


    ```rust

    impl MyTrait for MyStruct {
        fn foo(&self) {
            ...
        }
        ...
    }

    ```
- title: Zaimplementowane Metody Cech
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);

        fn make_alot_of_noise(&self){
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: >
    Cechy mogą posiadać zaimplementowane metody.


    Takie funkcje nie mają bezpośredniego dostępu do wewnętrznych pól
    struktury, ale mogą być przydatne do współdzielenia zachowania pomiędzy
    wieloma implementującymi je strukturami.
- title: Dziedziczenie Cech
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    trait LoudNoiseMaker: NoiseMaker {
        fn make_alot_of_noise(&self) {
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    impl LoudNoiseMaker for SeaCreature {}

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: |
    Cechy mogą dziedziczyć metody od innych cech.
- title: Dynamiczne Kontra Statyczne Wywoływanie Metod
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn static_make_noise(creature: &SeaCreature) {
        // we know the real type
        creature.make_noise();
    }

    fn dynamic_make_noise(noise_maker: &dyn NoiseMaker) {
        // we don't know the real type
        noise_maker.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        static_make_noise(&creature);
        dynamic_make_noise(&creature);
    }
  content_markdown: >
    Metody są wykonywane na dwa sposoby:

    * wywoływanie statyczne (ang. *static dispatch*) - Kiedy typ instancji
    jest znany, mamy bezpośrednią wiedzę o tym, jaką funkcję wywołać.

    * wywoływanie dynamiczne (ang. *dynamic dispatch*) - Kiedy typ instancji
    nie jest znany, musimy znaleźć jakiś sposób na wywołanie odpowiedniej
    funkcji.


    Typy cech `&dyn MyTrait` dają nam możliwość pracy z instancjami obiektów
    w sposób pośredni, przy użyciu wywoływania dynamicznego.


    Kiedy używane jest wywoływanie dynamiczne, Rust zachęci Cię do
    umieszczenia `dyn` przed typem cechy, aby inni byli tego świadomi.


    Kilka szczegółów dotyczących pamięci:

    * Wywoływanie dynamiczne jest odrobinę wolniejsze, ze względu na
    podążanie za wskaźnikiem w celu odnalezienia rzeczywistego wywołania
    funkcji.
- title: Obiekty Cech
  content_markdown: >
    Kiedy przekazujemy instancję obiektu do parametru typu `&dyn MyTrait`,
    przekazujemy coś, co nazywamy *obiektem cechy* (ang. *trait object*).


    Obiekt cechy to coś, co pozwala nam pośrednio wywoływać właściwe metody
    instancji. Obiekt cechy to struktura, która przechowuje wskaźnik do
    naszej instancji wraz z listą wskaźników do funkcji będących metodami
    naszej instancji.


    Kilka szczegółów dotyczących pamięci:

    * Ta lista funkcji jest znana w C++ jako *vtable*.
- title: Obsługa Danych O Nieznanym Rozmiarze
  content_markdown: >
    Cechy wprowadzają ciekawe wyzwanie, kiedy chcemy przechowywać je wewnątrz
    innej struktury. Cechy zaciemniają oryginalną strukturę, przez co
    zaciemniają też jej oryginalny rozmiar. Wartości o nieznanym rozmiarze,
    przechowywane w strukturach, są w Ruście obsługiwane na dwa sposoby:


    * `generyki` (ang. *generics*) - Użycie sparametryzowanych typów
    skutecznie tworzy struktury/funkcje o znanych typach, a co za tym idzie,
    znanych rozmiarach.

    * `pośredniość` (ang. *indirection*) - Umieszczenie instancji na stercie
    daje nam poziom pośredniości, dzięki której nie musimy martwić się o
    rozmiar rzeczywistego typu, a jedynie przechowywać do niego wskaźnik.
    Istnieją też inne sposoby!
- title: Funkcje Generyczne
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise<T>(creature: &T)
    where
        T: NoiseMaker,
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: >
    Generyki w Ruście działają ramię w ramię z cechami. Kiedy opisujemy
    sparametryzowany typ `T`, możemy ograniczyć, jakie typy mogą zostać
    użyte jako argument, wymieniając jakie cechy musi implementować taki
    argument.


    W tym przykładzie typ `T` musi implementować cechę `Foo`:

    ```rust

    fn my_function<T>(foo: T)

    where
        T:Foo
    {
        ...
    }

    ```


    Używając generyków tworzymy statycznie otypowane funkcje w czasie
    kompilacji, które będą miały znane typy i rozmiary, pozwalając nam na
    wykonanie wywoływania statycznego i przechowywanie ich jako wartości o
    znanym rozmiarze.
- title: Skrócona Notacja Funkcji Generycznych
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise(creature: &impl NoiseMaker)
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: |
    Rust posiada skróconą notację do wyrażania generyków ograniczonych
    cechą:

    ```rust
    fn my_function(foo: impl Foo) {
        ...
    }
    ```

    Jest to równoważne zapisaniu:

    ```rust
    fn my_function<T>(foo: T)
    where
        T:Foo
    {
        ...
    }
    ```
- title: Box
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    struct Ocean {
        animals: Vec<Box<dyn NoiseMaker>>,
    }

    fn main() {
        let ferris = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        let sarah = SeaCreature {
            name: String::from("Sarah"),
            noise: String::from("swish"),
        };
        let ocean = Ocean {
            animals: vec![Box::new(ferris), Box::new(sarah)],
        };
        for a in ocean.animals.iter() {
            a.make_noise();
        }
    }
  content_markdown: >
    `Box` to struktura danych, która pozwala nam przenieść nasze dane ze
    stosu na stertę.


    `Box` to struktura znana jako *inteligentny wskaźnik* (ang. *smart
    pointer*), która przechowuje wskaźnik do naszych danych na stercie.


    Ponieważ `Box` jest strukturą o znanym rozmiarze (przechowuje jedynie
    wskaźnik), jest często używany jako sposób na przechowanie referencji do
    czegoś wewnątrz struktury, która musi znać rozmiar swoich pól.


    `Box` jest na tyle powszechny, że może być użyty właściwie wszędzie:


    ```rust

    Box::new(Foo { ... })

    ```
- title: Generyczne Struktury Ponownie
  content_markdown: >
    Generyczne struktury mogą również mieć swoje sparametryzowane typy
    ograniczone przez cechy.


    ```rust

    struct MyStruct<T>

    where
        T: MyTrait
    {
        foo: T
        ...
    }

    ```


    Generyczne struktury posiadają swój sparametryzowany typ również w
    bloku implementacji:


    ```rust

    impl<T> MyStruct<T> {
        ...
    }

    ```
- title: Rozdział 7 - Podsumowanie
  content_markdown: >
    Mamy teraz do dyspozycji więcej narzędzi językowych, żeby jasno
    wyrażać nasze pomysły!


    Abstrakcje w Ruście mogą być proste, ale są wystarczająco potężne, żeby
    praca z kodem sprawiała przyjemność. W tym rozdziale zerknęliśmy na
    inteligentne wskaźniki przy pomocy `Box`. W następnym rozdziale
    dowiemy się, jak inteligentne wskaźniki mogą pomóc nam w innych,
    specjalistycznych sytuacjach związanych z pamięcią.


    Zasoby (w języku angielskim):

    * [Wideo - Object-oriented Programming in 7
    minutes](https://www.youtube.com/watch?v=pTB0EiLXUC8)

    * [Artykuł - "The faster you unlearn OOP, the better for you and your
    software"](https://dpc.pw/the-faster-you-unlearn-oop-the-better-for-you-and-your-software)
