- title: Rozdział 9 - Organizacja i Struktura Projektu
  content_markdown: >
    Do tej pory wszystkie nasze przykłady kodu mieściły się w pojedynczym
    pliku. Porozmawiajmy o tym, jak nasz kod może zostać lepiej
    zorganizowany i udostępniony innym!
- title: Moduły
  content_markdown: |
    Każdy program lub biblioteka napisana w Ruście jest *crate'em*.

    Każdy crate składa się z hierarchii *modułów*.

    Każdy crate posiada moduł główny (ang. *root module*).

    Moduł może zawierać zmienne globalne, funkcje, struktury, cechy, a
    nawet inne moduły!

    W Ruście nie istnieje relacja jeden do jednego pomiędzy plikami a
    hierarchią drzewa modułów. Musimy zbudować drzewo modułów jawnie,
    ręcznie w naszym kodzie.
- title: Pisanie Programu
  content_markdown: |
    Program posiada moduł główny w pliku o nazwie `main.rs`.
- title: Pisanie Biblioteki
  content_markdown: |
    Biblioteka posiada moduł główny w pliku o nazwie `lib.rs`.
- title: Odwoływanie Się Do Innych Modułów i Crate'ów
  code: |
    use std::f64::consts::PI;

    fn main() {
        println!("Welcome to the playground!");
        println!("I would love a slice of {}!", PI);
    }
  content_markdown: >
    Do elementów wewnątrz modułów można odwoływać się przy pomocy ich
    pełnej ścieżki modułu, np. `std::f64::consts::PI`.


    Prostszym sposobem jest słowo kluczowe **use**. Pozwala nam ono
    określić konkretne elementy z modułów, których chcemy używać w całym
    naszym kodzie, bez podawania pełnej ścieżki. Na przykład `use
    std::f64::consts::PI` pozwala mi używać w mojej funkcji `main` samego
    identyfikatora `PI`.


    **std** to crate **biblioteki standardowej** Rusta, który jest pełen
    przydatnych struktur danych i funkcji do interakcji z Twoim systemem
    operacyjnym.


    Przeszukiwalny katalog crate'ów stworzonych przez społeczność znajdziesz
    pod adresem [https://crates.io](https://crates.io/).
- title: Odwoływanie Się Do Wielu Elementów
  content_markdown: |
    Do wielu elementów można odwołać się w ramach jednej ścieżki modułu w
    następujący sposób:

    ```rust
    use std::f64::consts::{PI,TAU}
    ```

    Ferris nie je TAU, je tylko PI.
- title: Tworzenie Modułów
  content_markdown: |
    Myśląc o kodzie, zazwyczaj wyobrażamy sobie hierarchię plików
    zorganizowanych w katalogach. Rust pozwala Ci tworzyć moduły ściśle
    powiązane ze strukturą Twoich plików.

    W Ruście istnieją dwa sposoby na zadeklarowanie modułu. Na przykład
    moduł `foo` może zostać przedstawiony jako:
      * plik o nazwie `foo.rs`
      * katalog o nazwie `foo`, zawierający plik `mod.rs`
- title: Hierarchia Modułów
  content_markdown: >
    Jeden moduł może zależeć od drugiego. Żeby ustanowić relację pomiędzy
    modułem a jego podmodułem, musisz zapisać w module rodzicielskim
    następujący wpis:


    ```rust

    mod foo;

    ```


    Powyższa deklaracja spowoduje wyszukanie pliku o nazwie `foo.rs` lub
    `foo/mod.rs`, a następnie wstawienie jego zawartości wewnątrz modułu o
    nazwie `foo`, w ramach tego zasięgu.
- title: Moduł Wewnętrzny
  content_markdown: >
    Podmoduł może zostać zdefiniowany bezpośrednio wewnątrz kodu innego
    modułu.


    Jednym z bardzo popularnych zastosowań modułów wewnętrznych jest
    tworzenie testów jednostkowych. Tworzymy moduł wewnętrzny, który
    istnieje jedynie wtedy, gdy Rust jest używany do testowania!


    ```

    // To makro usuwa ten moduł wewnętrzny, kiedy Rust

    // nie znajduje się w trybie testowania.

    #[cfg(test)]

    mod tests {
        // Zwróć uwagę, że nie mamy od razu dostępu do
        // modułu rodzicielskiego. Musimy zrobić to jawnie.
        use super::*;

        ... tests go here ...
    }

    ```
- title: Wewnętrzne Odwołania Do Modułów
  content_markdown: >
    Rust posiada kilka słów kluczowych, których możesz użyć w swojej
    ścieżce `use`, żeby szybko dostać się do modułu, którego potrzebujesz:


    * `crate` - moduł główny Twojego crate'a

    * `super` - moduł rodzicielski Twojego obecnego modułu

    * `self` - obecny moduł
- title: Eksportowanie
  content_markdown: >
    Domyślnie składowe *modułu* nie są dostępne spoza tego modułu (nawet
    dla jego modułów potomnych!). Udostępniamy składowe modułu przy pomocy
    słowa kluczowego `pub`.


    Domyślnie składowe *crate'a* nie są dostępne spoza tego crate'a.
    Udostępniamy składowe crate'a oznaczając je jako `pub` w *module
    głównym* Twojego crate'a (`lib.rs` lub `main.rs`).
- title: Widoczność Struktur
  content_markdown: >
    Podobnie jak funkcje, struktury mogą deklarować co chcą udostępnić
    poza swój moduł, korzystając ze słowa kluczowego `pub`.
  code: |
    // struktura SeaCreature będzie mogła być używana poza naszym modułem
    pub struct SeaCreature {
        pub animal_type: String,
        pub name: String,
        pub arms: i32,
        pub legs: i32,
        // niech uzbrojenie pozostanie prywatne
        weapon: String,
    }
- title: Prelude
  content_markdown: |
    Być może zastanawiasz się, w jaki sposób mamy dostęp wszędzie do `Vec`
    czy `Box` bez potrzeby użycia `use`, żeby je zaimportować. Dzieje się
    tak dzięki modułowi `prelude` w bibliotece standardowej.

    Wiedz, że w bibliotece standardowej Rusta wszystko, co jest
    eksportowane w `std::prelude::*`, jest automatycznie dostępne w każdej
    części Rusta. Dotyczy to zarówno `Vec` i `Box`, jak i innych (Option,
    Copy, itd.).
- title: Twój Własny Prelude
  content_markdown: >
    Ze względu na istnienie prelude biblioteki standardowej, powszechną
    praktyką jest posiadanie własnego modułu prelude w Twojej bibliotece,
    jako punktu startowego, z którego użytkownicy mogą zaimportować
    wszystkie najbardziej powszechne struktury danych potrzebne do
    korzystania z Twojej biblioteki (np. `use my_library::prelude::*`).


    Nie jest on automatycznie używany w programach/bibliotekach, które
    korzystają z Twojego crate'a, ale jest to dobra konwencja, dzięki
    której ludzie wiedzą, od czego zacząć.


    Ferris mówi: "Bądź dobrym rustowcem i pomóż koledze krabowi dobrym
    modułem prelude!"
- title: Rozdział 9 - Podsumowanie
  content_markdown: >
    Masz teraz kilka sztuczek w zanadrzu, jeśli chodzi o tworzenie
    aplikacji i bibliotek w Ruście, gotowych na spotkanie ze światem. Nie
    martw się tym, żeby zapamiętać to wszystko. W miarę jak Twoja
    biblioteka będzie rosnąć i będzie używana przez inne osoby,
    odkryjesz, co sprawdza się najlepiej na każdym etapie.


    Zasoby:

    - [Guidelines For Writing Rust
    APIs](https://rust-lang.github.io/api-guidelines/)
