- title: Rozdział 6 - Tekst
  content_markdown: >
    Teraz kiedy rozumiemy już trochę jak Rust myśli o pamięci, jesteśmy gotowi
    porozmawiać o tekście w bardziej szczegółowy sposób.


    Rust bardzo poważnie podchodzi do tematu tekstu międzynarodowego oraz
    zagadnień na poziomie bajtów, z którymi możesz nie być zaznajomiony z
    innych języków. Mimo to, Rust posiada wiele świetnych narzędzi do
    zarządzania tymi zagadnieniami.
- title: Literały Łańcuchowe
  content_markdown: >
    Literały łańcuchowe są zawsze zakodowane w Unicode.


    Typ literałów łańcuchowych to `&'static str`:


    * `&` oznacza, że odnosi się do miejsca w pamięci, a brak `&mut` oznacza,
    że kompilator nie pozwoli na jego modyfikację

    * `'static` oznacza, że dane łańcucha będą dostępne aż do końca trwania
    naszego programu (nigdy nie zostaną wypuszczone)

    * `str` oznacza, że wskazuje on na sekwencję bajtów, które muszą zawsze
    być poprawnym kodowaniem **utf-8**


    Kilka szczegółów dotyczących pamięci:

    * Kompilator Rusta najprawdopodobniej umieści Twój łańcuch znaków
    w segmencie danych pamięci Twojego programu
  code: |
    fn main() {
        let a: &'static str = "hi 🦀";
        println!("{} {}", a, a.len());
    }
- title: Czym jest utf-8
  content_markdown: "W miarę jak coraz więcej języków było używanych na komputerach, świat potrzebował sposobu na reprezentowanie większej liczby znaków tekstowych\nniż pozwalał na to ASCII (1 bajt pozwalał jedynie na 256 znaków).\n\nWprowadzono **utf-8** ze zmienną długością bajtową wynoszącą od 1 do 4 bajtów, co znacznie zwiększyło zakres możliwych do przedstawienia znaków.\n\nZaletą znaków o zmiennym rozmiarze jest to, że tekst nie posiada niepotrzebnych bajtów dla bardzo powszechnych znaków ASCII (nadal wymagających tylko 1 bajtu w **utf-8**).\n\nWadą znaków o zmiennym rozmiarze jest to, że wyszukiwanie konkretnego znaku nie może być już wykonane szybko\n(w stałym czasie **O(1)**) przy pomocy prostego indeksowania (np. `my_text[3]` żeby dostać się do 4. znaku). Możliwe jest bowiem, że\npoprzedzające znaki mają zmienną szerokość, przez co zmienia się miejsce, w którym faktycznie zaczyna się 4. znak w sekwencji bajtów.\n\nZamiast tego musimy przeiterować przez sekwencję bajtów **utf-8**, żeby zrozumieć, gdzie faktycznie zaczynają się poszczególne znaki Unicode (w liniowym czasie **O(n)**).\n\nFerris: \"Głównie cieszę się po prostu z tego, że mam **utf-8** do reprezentowania emotikon moich podwodnych przyjaciół.\"\n\n<span class=\"emoji\">\U0001F420\U0001F419\U0001F41F\U0001F42C\U0001F40B</span>\n"
- title: Znaki Ucieczki
  content_markdown: >
    Wizualne przedstawienie niektórych znaków bywa wyzwaniem, dlatego
    **sekwencje ucieczki** pozwalają nam umieścić w ich miejsce odpowiedni
    symbol.


    Rust obsługuje powszechne sekwencje ucieczki znane z języków bazujących
    na C:

    * `\n` - nowa linia

    * `\r` - powrót karetki

    * `\t` - tabulacja

    * `\\` - ukośnik wsteczny

    * `\0` - znak pusty (null)

    * `\'` - pojedynczy cudzysłów


    Kompletną listę znajdziesz
    [tutaj](https://doc.rust-lang.org/reference/tokens.html).
  code: |
    fn main() {
        let a: &'static str = "Ferris says:\t\"hello\"";
        println!("{}",a);
    }
- title: Wieloliniowe Literały Łańcuchowe
  content_markdown: |
    Łańcuchy znaków w Ruście są domyślnie wieloliniowe.

    Użyj `\` na końcu linii, jeśli nie chcesz, żeby wystąpiło w tym miejscu
    złamanie linii.
  code: |
    fn main() {
        let haiku: &'static str = "
            I write, erase, rewrite
            Erase again, and then
            A poppy blooms.
            - Tachibana Hokushi";
        println!("{}", haiku);


        println!("hello \
        world") // zwróć uwagę, że spacja przed w jest ignorowana
    }
- title: Surowe Literały Łańcuchowe
  content_markdown: >
    Surowe łańcuchy znaków pozwalają nam zapisać sekwencję znaków dosłownie,
    zaczynając od `r#"` i kończąc na `"#`. Dzięki temu możemy wstawiać
    znaki, które w normalnym łańcuchu mogłyby zostać pomylone z jego
    literałami (jak podwójny cudzysłów czy ukośnik wsteczny).
  code: |
    fn main() {
        let a: &'static str = r#"
            <div class="advice">
                Raw strings are useful for some situations.
            </div>
            "#;
        println!("{}", a);
    }
- title: Literały Łańcuchowe Z Plików
  content_markdown: >
    Jeśli posiadasz bardzo duży tekst, rozważ użycie makra `include_str!`,
    żeby dołączyć tekst z lokalnego pliku do swojego programu:


    ```rust

    let hello_html = include_str!("hello.html");

    ```
- title: Wycinek Łańcucha Znaków
  content_markdown: >
    Wycinek łańcucha znaków (ang. *string slice*) to referencja do sekwencji
    bajtów w pamięci, która zawsze musi stanowić poprawne kodowanie utf-8.


    Wycinek (podwycinek) wycinka `str` również musi stanowić poprawne
    kodowanie utf-8.


    Popularne metody `&str`:

    * `len` zwraca długość literału łańcuchowego w bajtach (nie w liczbie
    znaków).

    * `starts_with`/`ends_with` do podstawowego sprawdzania początku/końca.

    * `is_empty` zwraca `true`, jeśli długość wynosi zero.

    * `find` zwraca `Option<usize>` z pierwszą pozycją poszukiwanego tekstu.
  code: |
    fn main() {
        let a = "hi 🦀";
        println!("{}", a.len());
        let first_word = &a[0..2];
        let second_word = &a[3..7];
        // let half_crab = &a[3..5]; FAILS
        // Rust does not accept slices of invalid unicode characters
        println!("{} {}", first_word, second_word);
    }
- title: Znaki (Chars)
  content_markdown: >
    Ze względu na trudności związane z pracą z Unicode, Rust oferuje sposób
    na pobranie sekwencji bajtów utf-8 jako wektora znaków typu `char`.


    Typ `char` ma zawsze długość 4 bajtów (co pozwala na wydajne wyszukiwanie
    poszczególnych znaków).
  code: |
    fn main() {
        // collect the characters as a vector of char
        let chars = "hi 🦀".chars().collect::<Vec<char>>();
        println!("{}", chars.len()); // should be 4
        // since chars are 4 bytes we can convert to u32
        println!("{}", chars[3] as u32);
    }
- title: String
  content_markdown: >
    **String** to struktura, która jest właścicielem sekwencji bajtów utf-8
    przechowywanych na stercie.


    Ponieważ jej pamięć znajduje się na stercie, może ona być rozszerzana,
    modyfikowana itp. w sposoby niedostępne dla literałów łańcuchowych.


    Popularne metody:


    * `push_str` dodaje kolejne bajty utf-8 na koniec łańcucha.

    * `replace` zastępuje sekwencje bajtów utf-8 innymi.

    * `to_lowercase`/`to_uppercase` do zmiany wielkości liter.

    * `trim` do usuwania białych znaków z brzegów.


    Kiedy `String` zostaje wypuszczony, jego pamięć na stercie również
    zostaje wypuszczona.


    `String` posiada operator `+`, który rozszerza łańcuch o `&str` i zwraca
    sam siebie, ale może okazać się to mniej ergonomiczne, niż mógłbyś się
    spodziewać.
  code: |
    fn main() {
        let mut helloworld = String::from("hello");
        helloworld.push_str(" world");
        helloworld = helloworld + "!";
        println!("{}", helloworld);
    }
- title: Tekst Jako Parametr Funkcji
  content_markdown: >
    Literały łańcuchowe oraz `String`y są zazwyczaj przekazywane do funkcji
    jako wycinek łańcucha znaków. Daje to sporo elastyczności w większości
    scenariuszy, w których tak naprawdę nie musisz przekazywać własności.
  code: |
    fn say_it_loud(msg:&str){
        println!("{}!!!",msg.to_string().to_uppercase());
    }

    fn main() {
        // say_it_loud can borrow &'static str as a &str
        say_it_loud("hello");
        // say_it_loud can also borrow String as a &str
        say_it_loud(&String::from("goodbye"));
    }
- title: Budowanie Łańcuchów Znaków
  content_markdown: |
    `concat` oraz `join` to dwa proste, ale potężne sposoby na budowanie
    łańcuchów znaków.
  code: |
    fn main() {
        let helloworld = ["hello", " ", "world", "!"].concat();
        let abc = ["a", "b", "c"].join(",");
        println!("{}", helloworld);
        println!("{}",abc);
    }
- title: Formatowanie Łańcuchów Znaków
  content_markdown: >
    Makro `format!` pozwala nam stworzyć łańcuch znaków poprzez zdefiniowanie
    sparametryzowanego łańcucha z symbolami zastępczymi określającymi gdzie i
    jak powinny zostać umieszczone wartości (np. `{}`).


    `format!` używa tych samych sparametryzowanych łańcuchów co `println!`


    Możliwości tej funkcji są zbyt szerokie jak na zakres *Tour of Rust*;
    zajrzyj do [dokumentacji](https://doc.rust-lang.org/std/fmt/), żeby
    dowiedzieć się więcej.
  code: |
    fn main() {
        let a = 42;
        let f = format!("secret to life: {}",a);
        println!("{}",f);
    }
- title: Konwertowanie Łańcuchów Znaków
  content_markdown: |
    Wiele typów może zostać przekonwertowanych na łańcuch znaków przy użyciu
    `to_string`.

    Generyczna funkcja `parse` może zostać użyta do przekonwertowania
    łańcuchów lub literałów łańcuchowych na wartość konkretnego typu. Ta
    funkcja zwraca `Result`, ponieważ operacja ta może się nie powieść.
  code: |
    fn main() -> Result<(), std::num::ParseIntError> {
        let a = 42;
        let a_string = a.to_string();
        let b = a_string.parse::<i32>()?;
        println!("{} {}", a, b);
        Ok(())
    }
- title: Rozdział 6 - Podsumowanie
  content_markdown: >
    Teraz znasz już podstawy związane z tekstem! Jak zdążyłeś zauważyć,
    Unicode sprawia, że praca z tekstem jest odrobinę bardziej skomplikowana,
    ale biblioteka standardowa oferuje mnóstwo funkcjonalności, które
    ułatwiają zarządzanie nim.


    Do tej pory patrzyliśmy na Rusta głównie przez pryzmat paradygmatu
    proceduralnego (tj. same funkcje i dane), ale nadszedł czas, żeby
    porozmawiać o cechach (ang. *traits*) oraz możliwościach odblokowywanych
    przez obiektowy paradygmat Rusta.
