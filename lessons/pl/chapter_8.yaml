- title: Rozdział 8 - Inteligentne Wskaźniki
  content_markdown: >
    W tym rozdziale odczarujemy inteligentne wskaźniki. Zbadajmy te
    struktury danych, które pozwalają nam wchodzić w interakcję z
    najniższym poziomem pamięci.


    Ferris mówi: "Nie przytłaczaj się tym rozdziałem, jeśli nie czujesz się
    na siłach, żeby po jednej krótkiej lekturze napisać własny kod do
    niskopoziomowego zarządzania pamięcią. Ten rozdział ma za zadanie
    głównie przedstawić Ci kilka przydatnych narzędzi i dać Ci wgląd w to,
    jak one działają!"
- title: Referencje Ponownie
  content_markdown: >
    Referencja to w gruncie rzeczy po prostu liczba, będąca pozycją
    początkową pewnych bajtów w pamięci. Jej jedynym celem jest reprezentować
    koncepcję tego, gdzie istnieją dane konkretnego typu. Tym, co odróżnia
    referencję od zwykłej liczby jest to, że Rust sprawdzi, czy czas życia
    referencji nie trwa dłużej niż to, do czego się ona odnosi (inaczej
    dostalibyśmy błąd podczas jej użycia!).
- title: Surowe Wskaźniki
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    Referencje mogą zostać przekonwertowane na bardziej prymitywny typ,
    zwany *surowym wskaźnikiem*. Podobnie jak liczba, może on być
    kopiowany i przenoszony z niewielkimi ograniczeniami. Rust nie daje
    żadnych gwarancji co do poprawności miejsca w pamięci, na które on
    wskazuje.


    Istnieją dwa rodzaje surowych wskaźników:


    * `*const T` - Surowy wskaźnik do danych typu T, które nigdy nie
    powinny się zmienić.

    * `*mut T` - Surowy wskaźnik do danych typu T, które mogą się zmienić.


    Surowe wskaźniki mogą być konwertowane na liczby i z powrotem
    (np. `usize`).


    Surowe wskaźniki mogą uzyskać dostęp do danych za pomocą kodu *unsafe*
    (więcej o tym później).


    Kilka szczegółów dotyczących pamięci:

    * Referencja w Ruście jest bardzo podobna w użyciu do wskaźnika w C,
    ale posiada dużo więcej ograniczeń na etapie kompilacji dotyczących
    tego, jak może być przechowywana i przenoszona do innych funkcji.

    * Surowy wskaźnik w Ruście jest podobny do wskaźnika w C, ponieważ
    reprezentuje liczbę, którą można kopiować lub przekazywać dalej, a
    nawet zamienić na typ liczbowy, gdzie może zostać zmodyfikowana jak
    liczba, żeby wykonać na niej działania arytmetyczne.
- title: Dereferencja
  content_markdown: |
    Proces uzyskiwania dostępu/manipulowania danymi, do których odnosi się
    *referencja* (np. `&i32`), nazywamy *dereferencją*.

    Referencje są używane do uzyskiwania dostępu/manipulowania danymi na
    dwa sposoby:
    * Dostęp do danych, do których się odnosimy, podczas przypisywania
    zmiennych.
    * Dostęp do pól lub metod danych, do których się odnosimy.

    Rust posiada kilka potężnych operatorów, które pozwalają nam to zrobić.
- title: Operator *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    Operator `*` to jawny sposób na dereferencję referencji.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Kilka szczegółów dotyczących pamięci:

    - Ponieważ i32 jest typem prymitywnym, który implementuje cechę
    `Copy`, bajty zmiennej `a` na stosie zostają skopiowane do bajtów
    zmiennej `b`.
- title: Operator .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    Operator `.` jest używany do uzyskiwania dostępu do pól i metod
    referencji. Działa on odrobinę bardziej subtelnie.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    O rety, dlaczego nie musieliśmy dodać `***` przed `ref_ref_ref_f`?
    Dzieje się tak dlatego, że operator `.` automatycznie dereferencjonuje
    sekwencję referencji. Ta ostatnia linia zostaje automatycznie
    zamieniona przez kompilator na poniższą:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Inteligentne Wskaźniki
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Oprócz zdolności do tworzenia referencji do już istniejących,
    otypowanych danych przy pomocy operatora `&`, Rust daje nam również
    możliwość tworzenia struktur *podobnych do referencji*, zwanych
    **inteligentnymi wskaźnikami**.


    Możemy myśleć o referencjach na wysokim poziomie jak o typie, który
    daje nam dostęp do innego typu. Inteligentne wskaźniki różnią się w
    swoim zachowaniu od zwykłych referencji tym, że działają na podstawie
    wewnętrznej logiki napisanej przez programistę. Ty - programista -
    jesteś tą *inteligentną* częścią.


    Zazwyczaj inteligentne wskaźniki implementują cechy `Deref`,
    `DerefMut` oraz `Drop`, żeby określić logikę tego, co powinno się
    wydarzyć, kiedy struktura zostaje zdereferencjonowana przy pomocy
    operatorów `*` i `.`.
- title: Inteligentny Kod Unsafe
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Inteligentne wskaźniki dość często korzystają z kodu *unsafe*. Jak
    wspomniano wcześniej, są one popularnym narzędziem do interakcji z
    najniższymi poziomami pamięci w Ruście.


    Czym jest kod unsafe? Kod unsafe zachowuje się dokładnie tak samo jak
    zwykły kod Rusta, z wyjątkiem kilku możliwości, co do których
    kompilator Rusta nie jest w stanie zagwarantować bezpieczeństwa.


    Podstawową możliwością kodu unsafe jest *dereferencja surowego
    wskaźnika*. Oznacza to wzięcie *surowego wskaźnika* wskazującego na
    pozycję w pamięci i zadeklarowanie: "tutaj istnieje struktura danych!",
    a następnie przekształcenie jej w reprezentację danych, których możesz
    użyć (np. zamiana `*const u8` na `u8`).


    Rust nie ma sposobu na śledzenie znaczenia każdego bajtu zapisanego do
    pamięci. Ponieważ Rust nie może zagwarantować, co istnieje pod
    dowolną liczbą użytą jako *surowy wskaźnik*, umieszcza on
    dereferencję w bloku `unsafe { ... }`.


    Inteligentne wskaźniki *dereferencjonują surowe wskaźniki* na dużą
    skalę, ale są dobrze sprawdzone w tym, co robią.
- title: Znajomi Przyjaciele
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Rozważmy kilka inteligentnych wskaźników, które już widzieliśmy, takie
    jak `Vec<T>` czy `String`.


    `Vec<T>` to inteligentny wskaźnik, który po prostu posiada pewien
    region pamięci złożony z bajtów. Kompilator Rusta nie ma pojęcia, co
    istnieje w tych bajtach. Inteligentny wskaźnik interpretuje, co
    oznacza pobranie elementów z regionu pamięci, którym zarządza,
    śledzi, gdzie zaczynają się i kończą struktury danych wewnątrz tych
    bajtów, a na końcu dereferencjonuje surowy wskaźnik na struktury
    danych, tworząc ładny, przejrzysty i ergonomiczny interfejs, z którego
    możemy korzystać (np. `my_vec[3]`).


    Podobnie, `String` śledzi region pamięci złożony z bajtów i
    programistycznie ogranicza treść zapisywaną w nim, tak, żeby zawsze
    stanowiła poprawne kodowanie `utf-8`, oraz pomaga dereferencjonować
    ten region pamięci do typu `&str`.


    Obie te struktury danych korzystają z niebezpiecznej (unsafe)
    dereferencji surowych wskaźników, żeby wykonać swoją pracę.


    Kilka szczegółów dotyczących pamięci:

    * Rust posiada odpowiednik funkcji `malloc` z C, korzystając z
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html) oraz
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html), żeby
    uzyskać dostęp do własnych regionów pamięci, którymi możesz zarządzać.
- title: Pamięć Alokowana Na Stercie
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` to inteligentny wskaźnik, który pozwala nam przenieść dane ze
    stosu na stertę.


    Dereferencjonowanie go pozwala nam używać danych zaalokowanych na
    stercie w ergonomiczny sposób, tak, jakby to był oryginalny typ.
- title: Funkcja Main, Która Może Zawieść, Ponownie
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Kod Rusta może mieć wiele różnych reprezentacji błędów, ale biblioteka
    standardowa posiada uniwersalną cechę `std::error::Error` do opisywania
    błędów.


    Korzystając z inteligentnego wskaźnika `Box`, możemy użyć typu
    `Box<dyn std::error::Error>` jako wspólnego typu do zwracania błędów,
    ponieważ pozwala nam to propagować błąd na stercie i wchodzić z nim w
    interakcję na wysokim poziomie, bez potrzeby znajomości konkretnego
    typu.


    Na początku Tour of Rust dowiedzieliśmy się, że `main` może zwrócić
    błąd. Teraz możemy zwrócić typ zdolny opisać niemal każdy rodzaj błędu,
    jaki może wystąpić w naszym programie, o ile struktura danych tego
    błędu implementuje wspólną dla Rusta cechę `Error`.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Liczenie Referencji
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` to inteligentny wskaźnik, który przenosi dane ze stosu na stertę.
    Pozwala nam on klonować inne inteligentne wskaźniki `Rc`, które
    wszystkie mają zdolność do niemutowalnego pożyczania danych
    umieszczonych na stercie.


    Dopiero kiedy ostatni inteligentny wskaźnik zostaje wypuszczony, dane
    na stercie zostają zdealokowane.
- title: Współdzielony Dostęp
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` to kontenerowa struktura danych, zazwyczaj przechowywana
    przez inteligentne wskaźniki, która przyjmuje dane i pozwala nam
    pożyczać mutowalne i niemutowalne referencje do tego, co znajduje się
    w środku. Zapobiega ona nadużywaniu pożyczania, egzekwując zasady
    bezpieczeństwa pamięci Rusta w czasie wykonania, w momencie, gdy prosisz
    o pożyczenie znajdujących się w niej danych:


    **Tylko jedna mutowalna referencja ALBO wiele niemutowalnych
    referencji, ale nigdy jedno i drugie naraz!**


    Jeśli złamiesz te zasady, `RefCell` zapanikuje.
- title: Współdzielenie Pomiędzy Wątkami
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` to kontenerowa struktura danych, zazwyczaj przechowywana przez
    inteligentne wskaźniki, która przyjmuje dane i pozwala nam pożyczać
    mutowalne i niemutowalne referencje do danych znajdujących się w
    środku. Zapobiega to nadużywaniu pożyczania poprzez to, że system
    operacyjny ogranicza dostęp do danych w danym momencie tylko do
    jednego wątku procesora, blokując inne wątki, dopóki ten oryginalny
    wątek nie zakończy swojego zablokowanego pożyczenia.


    Wielowątkowość wykracza poza zakres Tour of Rust, ale `Mutex` jest
    fundamentalną częścią koordynowania wielu wątków procesora
    uzyskujących dostęp do tych samych danych.


    Istnieje specjalny inteligentny wskaźnik `Arc`, identyczny z `Rc`, z
    tą różnicą, że korzysta z bezpiecznego dla wątków inkrementowania
    liczby referencji.


    Jest on często używany, kiedy chcemy mieć wiele referencji do tego
    samego `Mutex`a.
- title: Łączenie Inteligentnych Wskaźników
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Inteligentne wskaźniki mogą wydawać się ograniczone, ale potrafią
    tworzyć bardzo potężne kombinacje.


    `Rc<Vec<Foo>>` - Pozwala na klonowanie wielu inteligentnych
    wskaźników, które mogą pożyczać ten sam wektor niemutowalnych struktur
    danych na stercie.


    `Rc<RefCell<Foo>>` - Pozwala wielu inteligentnym wskaźnikom na zdolność
    do mutowalnego/niemutowalnego pożyczania tej samej struktury `Foo`.


    `Arc<Mutex<Foo>>` - Pozwala wielu inteligentnym wskaźnikom na zdolność
    do blokowania tymczasowych mutowalnych/niemutowalnych pożyczeń w
    sposób wyłączny dla danego wątku procesora.


    Kilka szczegółów dotyczących pamięci:

    * Zauważysz powtarzający się motyw w wielu z tych kombinacji. Użycie
    niemutowalnego typu danych (być może posiadanego przez wiele
    inteligentnych wskaźników) do modyfikacji danych wewnętrznych. Nazywa
    się to w Ruście wzorcem "wewnętrznej mutowalności" (ang. *interior
    mutability*). Jest to wzorzec, który pozwala nam obchodzić zasady
    użycia pamięci w czasie wykonania, z tym samym poziomem
    bezpieczeństwa, co kontrole Rusta wykonywane w czasie kompilacji.
- title: Rozdział 8 - Podsumowanie
  content_markdown: >
    Inteligentne wskaźniki są idiomami programowania w Ruście i pozwalają
    nam nie odtwarzać wciąż od nowa bardzo popularnych wzorców użycia
    pamięci. Dzięki nim jesteś gotowy, żeby zmierzyć się z najtrudniejszymi
    wyzwaniami!


    Teraz, kiedy mamy już podstawy Rusta, porozmawiajmy trochę o tym, jak
    tworzymy większe projekty. W rozdziale 9 uwalniamy się od pisania kodu
    w jednym, pojedynczym pliku.
