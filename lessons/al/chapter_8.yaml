- title: Kapitulli 8 - Smart Pointerat
  content_markdown: >
    Në këtë kapitull do t'i zbulojmë misteret e smart pointerave.
    Le t'i eksplorojmë këto struktura të dhënash që na lejojnë të
    ndërveprojmë me nivelin më të ulët të kujtesës.


    Ferris thotë: "Mos u ndjeni të dërrmuar nga ky kapitull nëse nuk
    mendoni se mund të shkruani kodin tuaj të menaxhimit të kujtesës
    së nivelit të ulët pas një leximi të shkurtër. Ky kapitull
    synon kryesisht t'ju njohë me disa mjete të dobishme dhe t'ju
    japë një ide se si funksionojnë!"
- title: Referencat Të Rishikuara
  content_markdown: >
    Një referencë në thelb është thjesht një numër që përfaqëson
    pozicionin fillestar të disa bajtëve në kujtesë. Qëllimi i saj i
    vetëm është të përfaqësojë konceptin se ku ekzistojnë të dhënat
    e një lloji të caktuar. Ajo që e bën një referencë të
    ndryshme nga thjesht një numër është se Rust verifikon që
    jetëgjatësia e referencave të mos zgjasë më shumë se çfarë i
    referohet (përndryshe do të merrnim një gabim kur ta
    përdornim!).
- title: Pointerat E Papërpunuar
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    Referencat mund të konvertohen në një lloj më primitiv të quajtur
    *pointer i papërpunuar* (raw pointer). Ashtu si një numër, mund
    të kopjohet dhe zhvendoset me pak kufizime. Rust nuk jep asnjë
    garanci për vlefshmërinë e vendndodhjes së kujtesës drejt të
    cilës tregon.


    Ekzistojnë dy lloje pointerash të papërpunuar:


    * `*const T` - Një pointer i papërpunuar drejt të dhënave të
    llojit T që nuk duhet të ndryshojnë kurrë.

    * `*mut T` - Një pointer i papërpunuar drejt të dhënave të
    llojit T që mund të ndryshojnë.


    Pointerat e papërpunuar mund të konvertohen nga dhe në numra
    (p.sh. `usize`).


    Pointerat e papërpunuar mund të aksesojnë të dhëna me kod
    *unsafe* (më shumë për këtë më vonë).


    Detaje kujtese:

    * Një referencë në Rust ngjason shumë, për sa i përket
    përdorimit, me një pointer në C, por me shumë më tepër
    kufizime të verifikuara në kohën e përpilimit se si mund të
    ruhet dhe zhvendoset te funksione të tjera.
    * Një pointer i papërpunuar në Rust ngjason me një pointer në C,
    pasi përfaqëson një numër që mund të kopjohet ose kalohet, dhe
    madje edhe të kthehet në lloje numerike ku mund të modifikohet
    si numër për aritmetikë pointerash.
- title: Dereferencimi
  content_markdown: |
    Procesi i aksesimit/manipulimit të të dhënave drejt të cilave
    tregon një *referencë* (p.sh. `&i32`) quhet *dereferencim*.

    Referencat përdoren për të aksesuar/manipuluar të dhëna në dy
    mënyra:
    * Akses ndaj të dhënave të referuara gjatë caktimit të variablave.
    * Akses ndaj fushave ose metodave të të dhënave të referuara.

    Rust ka disa operatorë të fuqishëm që na lejojnë ta bëjmë këtë.
- title: Operatori *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    Operatori `*` është një mënyrë eksplicite për të dereferencuar
    një referencë.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Detaj kujtese:

    - Meqenëse i32 është një lloj primitiv që implementon traitin
    `Copy`, bajtet e variablit `a` në stack kopjohen në bajtet e
    variablit `b`.
- title: Operatori .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    Operatori `.` përdoret për të aksesuar fushat dhe metodat e një
    referencë. Funksionon paksa më delikat.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    Uau, pse nuk na u desh të shtonim `***` para `ref_ref_ref_f`? Kjo
    ndodh sepse operatori `.` dereferencon automatikisht një zinxhir
    referencash. Ai rresht i fundit shndërrohet automatikisht nga
    përpiluesi në këtë formë:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart Pointerat
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Përveç aftësisë për të krijuar referenca ndaj të dhënave
    ekzistuese të tipizuara me operatorin `&`, Rust na jep aftësinë
    për të krijuar struct-e *të ngjashme me referenca*, të quajtura
    **smart pointera**.


    Mund t'i mendojmë referencat, në nivel të lartë, si një lloj që
    na jep akses te një lloj tjetër. Smart pointerat ndryshojnë nga
    referencat normale në sjelljen e tyre, pasi operojnë bazuar në
    logjikën e brendshme të shkruar nga programuesi. Ju — programuesi
    — jeni pjesa *smart*.


    Zakonisht smart pointerat implementojnë traitet `Deref`,
    `DerefMut`, dhe `Drop` për të përcaktuar logjikën se çfarë duhet
    të ndodhë kur struktura dereferencohet me operatorët `*` dhe `.`.
- title: Kod Unsafe I Zgjuar
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Smart pointerat priren të përdorin mjaft shpesh kod *unsafe*.
    Siç u përmend më parë, ato janë mjete të zakonshme për të
    ndërvepruar me nivelet më të ulëta të kujtesës në Rust.


    Çfarë është kodi unsafe? Kodi unsafe sillet saktësisht si kodi
    normal i Rust, me përjashtim të disa aftësive për të cilat
    përpiluesi i Rust nuk mund të japë garanci.


    Një aftësi kryesore e kodit unsafe është *dereferencimi i një
    pointeri të papërpunuar*. Kjo do të thotë të marrësh një
    *pointer të papërpunuar* drejt një pozicioni në kujtesë dhe të
    deklarosh "këtu ekziston një strukturë e dhënash!", duke e
    shndërruar në një përfaqësim të dhënash që mund ta përdorësh
    (p.sh. `*const u8` në `u8`).


    Rust nuk ka mënyrë për të ndjekur kuptimin e çdo bajti që
    shkruhet në kujtesë. Meqenëse Rust nuk mund të japë garanci për
    çfarë ekziston te një numër arbitrar i përdorur si *pointer i
    papërpunuar*, ai e vendos dereferencimin brenda një blloku
    `unsafe { ... }`.


    Smart pointerat *dereferencojnë pointera të papërpunuar*
    gjerësisht, por janë të testuar mirë në atë që bëjnë.
- title: Miq Të Vjetër
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Le të mendojmë për disa smart pointera që i kemi parë tashmë,
    si `Vec<T>` dhe `String`.


    `Vec<T>` është një smart pointer që thjesht zotëron një rajon
    kujtese prej bajtësh. Përpiluesi i Rust nuk ka asnjë ide se çfarë
    ekziston në këto bajte. Smart pointeri interpreton se çfarë do
    të thotë të marrësh elementë nga rajoni i kujtesës që menaxhon,
    ndjek ku fillojnë dhe mbarojnë strukturat e të dhënave brenda
    këtyre bajtëve, dhe në fund dereferencon një pointer të
    papërpunuar në struktura të dhënash për të na dhënë një ndërfaqe
    të bukur dhe ergonomike për ta përdorur (p.sh. `my_vec[3]`).


    Në mënyrë të ngjashme, `String` ndjek një rajon kujtese prej
    bajtësh, dhe kufizon në mënyrë programore përmbajtjen e shkruar
    në të, në mënyrë që të jetë gjithmonë `utf-8` e vlefshme, dhe
    ndihmon në dereferencimin e atij rajoni kujtese në një lloj
    `&str`.


    Të dyja këto struktura të dhënash përdorin dereferencim unsafe
    të pointerave të papërpunuar për të kryer punën e tyre.


    Detaje kujtese:

    * Rust ka një ekuivalent të `malloc`-ut të C duke përdorur
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html) dhe
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html)
    për të marrë rajone kujtese tuajat për t'i menaxhuar.
- title: Kujtesa E Alokuar Në Grumbull
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` është një smart pointer që na lejon të zhvendosim të
    dhëna nga stack-u në grumbull.


    Dereferencimi i tij na lejon të përdorim të dhënat e alokuara në
    grumbull në mënyrë ergonomike, sikur të ishin lloji origjinal.
- title: Main-i Që Mund Të Dështojë I Rishikuar
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Kodi Rust mund të ketë një mori përfaqësimesh gabimesh, por
    biblioteka standarde ka një trait universal `std::error::Error`
    për të përshkruar gabimet.


    Duke përdorur smart pointerin `Box`, mund të përdorim llojin
    `Box<dyn Error>` si një lloj të përbashkët për kthimin e
    gabimeve, sepse na lejon të përhapim një gabim në grumbull dhe
    të ndërveprojmë me të në nivel të lartë pa pasur nevojë të dimë
    një lloj specifik.


    Herët në Tour of Rust mësuam që `main` mund të kthejë një gabim.
    Tani mund të kthejmë një lloj të aftë të përshkruajë pothuajse
    çdo lloj gabimi që mund të ndodhë në programin tonë, për sa kohë
    që struktura e të dhënave të gabimit implementon traitin e
    përbashkët `Error` të Rust.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Numërimi I Referencave
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` është një smart pointer që zhvendos të dhënat nga stack-u
    në grumbull. Na lejon të klonojmë smart pointera të tjerë `Rc`,
    të cilët të gjithë kanë aftësinë të huazojnë në mënyrë të
    pandryshueshme të dhënat e vendosura në grumbull.


    Vetëm kur smart pointeri i fundit lëshohet, të dhënat në
    grumbull dealokohen përfundimisht.
- title: Ndarja E Aksesit
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` është një strukturë e dhënash kontejner, shpesh e
    zotëruar nga smart pointera, që merr të dhëna dhe na lejon të
    huazojmë referenca të ndryshueshme dhe të pandryshueshme ndaj
    asaj që përmban. Parandalon keqpërdorimin e huazimit, duke
    zbatuar rregullat e sigurisë së kujtesës së Rust në kohën e
    ekzekutimit kur kërkoni të huazoni të dhënat brenda:


    **Vetëm një referencë e ndryshueshme OSE disa referenca të
    pandryshueshme, kurrë të dyja njëherësh!**


    Nëse i shkelni këto rregulla, `RefCell` do të bëjë panic.
- title: Ndarja Mes Fijeve
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` është një strukturë e dhënash kontejner, shpesh e
    zotëruar nga smart pointera, që merr të dhëna dhe na lejon të
    huazojmë referenca të ndryshueshme dhe të pandryshueshme ndaj
    të dhënave brenda. Kjo parandalon keqpërdorimin e huazimit, duke
    bërë që sistemi operativ të lejojë vetëm një fije CPU në një
    kohë të caktuar të aksesojë të dhënat, duke bllokuar fijet e
    tjera derisa fija origjinale të përfundojë me huazimin e saj të
    kyçur.


    Programimi me shumë fije është jashtë fushëveprimit të Tour of
    Rust, por `Mutex` është një pjesë themelore në koordinimin e
    shumë fijeve CPU që aksesojnë të njëjtat të dhëna.


    Ekziston një smart pointer i veçantë, `Arc`, i cili është
    identik me `Rc` përveçse përdor rritje të sigurt për fije të
    numëruesve të referencave. Përdoret shpesh për të pasur shumë
    referenca ndaj të njëjtit `Mutex`.
- title: Kombinimi I Smart Pointerave
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Smart pointerat mund të duken të kufizuar, por mund të krijojnë
    kombinime shumë të fuqishme.


    `Rc<Vec<Foo>>` - Lejon klonimin e shumë smart pointerave që mund
    të huazojnë të njëjtin vektor të strukturave të dhënash të
    pandryshueshme në grumbull.


    `Rc<RefCell<Foo>>` - U jep shumë smart pointerave aftësinë të
    huazojnë, në mënyrë të ndryshueshme/të pandryshueshme, të
    njëjtin struct `Foo`.


    `Arc<Mutex<Foo>>` - U jep shumë smart pointerave aftësinë të
    kyçin huazime të përkohshme të ndryshueshme/të pandryshueshme në
    mënyrë ekskluzive për një fije CPU.


    Detaj kujtese:

    * Do të vini re një temë të përsëritur në shumë nga këto
    kombinime. Përdorimin e një lloji të dhënash të pandryshueshëm
    (i zotëruar ndoshta nga shumë smart pointera) për të modifikuar
    të dhëna të brendshme. Kjo referohet si modeli "interior
    mutability" (mutabiliteti i brendshëm) në Rust. Është një model
    që na lejon të përkulim rregullat e përdorimit të kujtesës në
    kohën e ekzekutimit, me të njëjtin nivel sigurie si kontrollet e
    Rust në kohën e përpilimit.
- title: Kapitulli 8 - Përfundim
  content_markdown: >
    Smart pointerat janë idiomat e programimit në Rust dhe na lejojnë
    të mos i rikrijojmë modelet shumë të zakonshme të përdorimit të
    kujtesës. Me këto jeni gati të përballeni me sfidat më të
    vështira! Tani që kemi themelet e Rust, le të flasim pak se si
    ndërtojmë projekte më të mëdha. Në kapitullin 9 dalim jashtë
    rreshtave të kodit të një faqeje të vetme.
