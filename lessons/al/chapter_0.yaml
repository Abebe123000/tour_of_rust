    **Gëzuar 3-Vjetorin 🎉**

    Mirë se vini në *Tur e Rustit*. Ky udhëzues synon t'ju përcjellë hap pas hapi nëpër veçoritë e gjuhës së programimit Rust. Rust shpesh konsiderohet një gjuhë me një kurbë të thepisur mësimi, por shpresoj se mund t'ju bind se ka shumë për të eksploruar përpara se të arrijmë tek pjesët komplekse.

    Këtë udhëzues mund ta gjeni edhe në këto gjuhë:

    <!--TOUR_LANGUAGE_LINKS-->

    Nëse keni sugjerime për përmbajtjen ose dëshironi të kontribuoni në përkthime, shikoni [depon github](https://github.com/richardanaya/tour_of_rust) të Tur e Rustit.

    Mund të lundroni nëpër tur me tastierën <span class="emoji">⬅️</span> dhe <span class="emoji">➡️</span>.

    Në këtë shembull klasik ne tregojmë mbështetjen e Rust për vargjet Unicode.
