- title: Kapitulli 10 - Fundi
  content_markdown: >
    Ka qenë një kënaqësi t'ju kemi në Tour of Rust. Ferris dhe ekipi
    i Tour of Rust shpresojnë sinqerisht që ta shijoni udhëtimin që
    ju pret! Nëse jeni ndjerë rehat deri këtu, ju rekomandojmë
    fuqimisht të thelloheni më tej me këto burime:


    * [The Official Rust Programming
    Book](https://doc.rust-lang.org/stable/book/)
