- title: Kapitulli 4 - Llojet Gjenerike
  content_markdown: >
    Llojet gjenerike janë jashtëzakonisht të rëndësishme në Rust. Ato
    përdoren në përfaqësimin e vlerave potencialisht bosh (d.m.th.
    variabla që mund të mos kenë ende një vlerë), trajtimin e
    gabimeve, koleksionet, dhe shumë më tepër! Në këtë seksion do të
    mësojmë bazat e llojeve gjenerike, të cilat me shumë mundësi do
    t'i përdorni gjatë gjithë kohës.
- title: Çfarë Janë Llojet Gjenerike?
  content_markdown: >
    Llojet gjenerike na lejojnë të përcaktojmë pjesërisht një
    `struct` ose `enum`, duke i lejuar përpiluesit të krijojë një
    version plotësisht të përcaktuar bazuar në mënyrën se si e
    përdorim atë në kodin tonë.


    Rust zakonisht mund të konkludojë llojin përfundimtar bazuar në
    përdorimin tonë, por nëse i duhet ndihmë, gjithmonë mund të jeni
    eksplicit duke përdorur operatorin `::<T>`, i njohur gjithashtu
    me emrin `turbofish` (një mik i vjetër i imi).
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        item: T,
    }

    fn main() {
        // Note: by using generic types here, we create compile-time created types. 
        // Turbofish lets us be explicit.
        let i32_bag = BagOfHolding::<i32> { item: 42 };
        let bool_bag = BagOfHolding::<bool> { item: true };
        
        // Rust can infer types for generics too!
        let float_bag = BagOfHolding { item: 3.14 };
        
        // Note: never put a bag of holding in a bag of holding in real life
        let bag_in_bag = BagOfHolding {
            item: BagOfHolding { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_bag.item, bool_bag.item, float_bag.item, bag_in_bag.item.item
        );
    }
- title: Përfaqësimi I Asgjësë
  content_markdown: >
    Në gjuhë të tjera, fjala kyçe `null` përdoret për të përfaqësuar
    mungesën e një vlere. Kjo shpesh sjell vështirësi, sepse hap
    mundësinë që programi ynë të dështojë kur ndërvepron
    përfundimisht me një variabël ose fushë pa asnjë vlerë.


    Rust nuk ka `null`, por nuk e anashkalon rëndësinë e të pasurit
    aftësinë për të përfaqësuar konceptin *"asnjë vlerë"*.


    Konsideroni një përfaqësim të thjeshtë që përdor një mjet që e
    njohim tashmë.


    Modeli i përfshirjes së një vlere alternative `None` mes një ose
    më shumë mundësive të tjera është shumë i zakonshëm në Rust për
    shkak pikërisht të mungesës së `null`. Llojet gjenerike ndihmojnë
    në zgjidhjen e kësaj sfide.
  code: |
    enum Item {
        Inventory(String),
        // None represents the absence of an item
        None,
    }

    struct BagOfHolding {
        item: Item,
    }
- title: Option
  content_markdown: >
    Rust ka një enum gjenerik të gatshëm të quajtur `Option` që na
    lejon të përfaqësojmë vlera potencialisht bosh pa `null`.


    ```

    enum Option<T> {
        None,
        Some(T),
    }

    ```


    Ky enum është aq i zakonshëm, saqë mund të krijojmë instanca të
    këtij lloji kudo duke përdorur variantet `Some` dhe `None`.
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        // Our parameter type T can be handed to others
        item: Option<T>,
    }

    fn main() {
        // Note: A bag for i32, holding nothing! We have to specify the type
        // because otherwise Rust would not know what type of bag it is.
        let i32_bag = BagOfHolding::<i32> { item: None };

        if i32_bag.item.is_none() {
            println!("there's nothing in the bag!")
        } else {
            println!("there's something in the bag!")
        }

        let i32_bag = BagOfHolding::<i32> { item: Some(42) };

        if i32_bag.item.is_some() {
            println!("there's something in the bag!")
        } else {
            println!("there's nothing in the bag!")
        }

        // match lets us deconstruct Option elegantly and ensure we handle all cases!
        match i32_bag.item {
            Some(v) => println!("found {} in bag!", v),
            None => println!("found nothing"),
        }
    }
- title: Result
  content_markdown: >
    Rust ka gjithashtu një enum gjenerik të gatshëm të quajtur
    `Result` që na lejon të kthejmë një rezultat që ka mundësinë të
    dështojë. Kjo është mënyra idiomatike e gjuhës për të trajtuar
    gabimet.


    ```

    enum Result<T, E> {
        Ok(T),
        Err(E),
    }

    ```


    Vini re se lloji ynë gjenerik tani ka disa *parametra lloji*
    (`<T, E>`), të ndarë me presje.


    Ky enum është gjithashtu shumë i zakonshëm, kështu që mund të
    krijojmë instanca të këtij lloji kudo duke përdorur variantet
    `Ok` dhe `Err`.
  code: |
    fn do_something_that_might_fail(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))   
        }
    }

    fn main() {
        let result = do_something_that_might_fail(12);

        // match lets us deconstruct Result elegantly and ensure we handle all cases!
        match result {
            Ok(v) => println!("found {}", v),
            Err(e) => println!("Error: {}",e),
        }
    }
- title: Main Që Mund Të Dështojë
  content_markdown: |
    `main` ka mundësinë të kthejë një `Result`! (`Option` nuk mundet,
    e provova.)
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    // Main returns no value, but could return an error!
    fn main() -> Result<(), String> {
        let result = do_something_that_might_fail(12);

        match result {
            Ok(v) => println!("found {}", v),
            Err(_e) => {
                // handle this error gracefully
                
                // return a new error from main that said what happened!
                return Err(String::from("something went wrong in main!"));
            }
        }

        // Notice we use a unit value inside a Result Ok
        // to represent everything is fine
        Ok(())
    }
- title: Trajtimi Elegant I Gabimeve
  content_markdown: >
    Llojet e të dhënave që mund të dështojnë, `Result` dhe `Option`,
    janë aq të zakonshme sa Rust na jep një operator shumëpërdorues
    dhe të fuqishëm për të punuar me to: `?`. Këto dy pjesë kodi janë
    ekuivalente:


    ```

    do_something_that_might_fail()?

    ```


    ```

    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }

    ```


    E njëjta gjë vlen edhe për `Option`.
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // Look at how much code we saved!
        let v = do_something_that_might_fail(42)?;
        println!("found {}", v);
        Ok(())
    }
- title: Trajtimi I Vrazhdë I Option-it Dhe Result-it
  content_markdown: >
    Për shkrim të shpejtë dhe të thjeshtë kodi, puna me `Option`/
    `Result` mund të bëhet lodhëse. Të dyja llojet kanë një funksion
    të quajtur `unwrap` që është i dobishëm për të marrë një vlerë
    pa shumë telashe. Ky funksion:


    1. Merr vlerën e përmbajtur brenda Option/Result

    2. Nëse nuk gjen një vlerë të tillë, ndalon të gjithë programin
    duke përdorur makron `panic!`.


    Këto dy pjesë kodi janë ekuivalente:


    ```

    my_option.unwrap()

    ```


    ```

    match my_option {
        Some(v) => v,
        None => panic!("some error message generated by Rust!"),
    }

    ```


    Njësoj:


    ```

    my_result.unwrap()

    ```


    ```

    match my_result {
        Ok(v) => v,
        Err(e) => panic!("some error message generated by Rust!"),
    }

    ```


    Është gjithmonë shumë më mirë të përdorni aftësitë që lejojnë
    vazhdimin e programit edhe nëse ka ndodhur një gabim, si `match`
    dhe `?`. Ka gjithashtu opsione më të përshtatshme, si `unwrap_or`
    ose `map` dhe `and_then`. Prandaj sigurohuni ta përdorni
    `unwrap` sa më pak të jetë e mundur!
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // concise but assumptive and gets ugly fast
        let v = do_something_that_might_fail(42).unwrap();
        println!("found {}", v);
        
        // this will panic!
        let v = do_something_that_might_fail(1).unwrap();
        println!("found {}", v);
        
        Ok(())
    }
- title: Vektorët
  content_markdown: >
    Disa nga llojet gjenerike më të dobishme janë të ashtuquajturat
    "lloje koleksionesh". Për shembull, një vektor është një listë me
    gjatësi arbitrare vlerash të ngjashme, e përfaqësuar nga struct-i
    `Vec`.


    Makro-ja `vec!` na lejon të mbushim lehtësisht një vektor, në
    vend që ta bëjmë manualisht elementë-nga-elementi.


    Vektorët kanë metodën `iter()` e cila e kthen një vektor në
    përsëritës, duke na lejuar ta përdorim lehtësisht brenda një
    cikli `for`.


    Detaje kujtese:

    * Vektori është një struct, dhe ruhet në stack; *përmbajtja* e
    një vektori ruhet megjithatë në grumbull, në mënyrë që të mund
    të rritet në gjatësi. Stack-u ruan referencën ndaj asaj
    vendndodhjeje kujtese në grumbull.

    * Një vektor fillon me një kapacitet të parazgjedhur. Kur i
    shtohen më shumë elementë sesa lejon ky kapacitet, ai
    rialokon të dhënat në grumbull për të pasur një hapësirë të re
    të disponueshme me kapacitet më të madh, zakonisht të dyfishtë.
  code: |
    fn main() {
        // We can be explicit with type
        let mut i32_vec = Vec::<i32>::new(); // turbofish <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // But look how clever Rust is about determining the type automatically
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // That's a beautiful macro!
        let string_vec = vec![String::from("Hello"), String::from("World")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: Kapitulli 4 - Përfundim
  content_markdown: >
    Në një kapitull të vetëm mësuam sa të fuqishme janë llojet
    gjenerike! Mos u shqetësoni nëse nuk i kuptoni ende plotësisht se
    si t'i përdorni të gjitha; për tani mjafton të dini se ekzistojnë,
    pasi do t'i hasni gjithnjë e më shpesh ndërsa lexoni kod.
    Funksionet tona kanë filluar të bëhen mjaft të gjata! Në
    kapitullin tjetër do të flasim për një koncept të rëndësishëm në
    Rust: pronësinë e të dhënave.
