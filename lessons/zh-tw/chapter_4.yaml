- title: 第四章 - 泛型 (generic types)
  content_markdown: >
    泛型在 Rust 裡是非常重要的。它們被用來表示空值 (即那些還沒有值的變量)、錯誤處理、集合及其他更多東西！
    在此章節我們將會學習泛型的基礎，你很有可能將會一直使用到它。
- title: 什麼是泛型？
  content_markdown: >
    泛型允許我們定義一部份的`結構` (struct) 或`列舉` (enum)，使編譯器根據我們的程式碼，在編譯時期就產生一個完整的版本。


    Rust 大多時候可以根據我們的實體 (instantiation) 來推斷最終型別，但如果你需要幫忙的話，只要使用 `::<T>` 運算子，
    你也可以明確的表示出來，我們也稱之為 `turbofish` (他也是我的其中一個好朋友！)。
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        item: T,
    }

    fn main() {
        // Note: by using generic types here, we create compile-time created types. 
        // Turbofish lets us be explicit.
        let i32_bag = BagOfHolding::<i32> { item: 42 };
        let bool_bag = BagOfHolding::<bool> { item: true };
        
        // Rust can infer types for generics too!
        let float_bag = BagOfHolding { item: 3.14 };
        
        // Note: never put a bag of holding in a bag of holding in real life
        let bag_in_bag = BagOfHolding {
            item: BagOfHolding { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_bag.item, bool_bag.item, float_bag.item, bag_in_bag.item.item
        );
    }
- title: 空值表示
  content_markdown: >
    在其他語言裡，關鍵字 `null` 用來表示空值。這在程式語言裡產生了一些問題，因為它有可能讓我們的程式因為存取變量或欄位時失敗。


    Rust 沒有 `null`，但這不代表我們不知道表示空值的重要性！我們用一個已知的工具來簡單的表示。


    透過給定一個 `None` 來表示一個或多個其他數值，在 Rust 是非常常見的，因為它沒有 `null`。泛型可以用來幫助解決這個問題。
  code: |
    enum Item {
        Inventory(String),
        // None represents the absence of an item
        None,
    }

    struct BagOfHolding {
        item: Item,
    }
- title: 選項 (option)
  content_markdown: >
    Rust 有一個內建的泛型列舉 (generic enum) 稱作 `Option`，它允許我們表示空值而卻不使用 `null`。


    ```

    enum Option<T> {
        None,
        Some(T),
    }

    ```


    這種列舉非常常見，它可以在任何地方透過 `Some` 及 `None` 來產生。
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        // Our parameter type T can be handed to others
        item: Option<T>,
    }

    fn main() {
        // Note: A bag for i32, holding nothing! We have to specify the type
        // because otherwise Rust would not know what type of bag it is.
        let i32_bag = BagOfHolding::<i32> { item: None };

        if i32_bag.item.is_none() {
            println!("there's nothing in the bag!")
        } else {
            println!("there's something in the bag!")
        }

        let i32_bag = BagOfHolding::<i32> { item: Some(42) };

        if i32_bag.item.is_some() {
            println!("there's something in the bag!")
        } else {
            println!("there's nothing in the bag!")
        }

        // match lets us deconstruct Option elegantly and ensure we handle all cases!
        match i32_bag.item {
            Some(v) => println!("found {} in bag!", v),
            None => println!("found nothing"),
        }
    }
- title: 結果 (result)
  content_markdown: >
    Rust 有一個內建的泛型列舉稱作 `Result`，它允許我們回傳一個可能會失敗的數值。
    這是處理錯誤的慣用手法。


    ```

    enum Result<T, E> {
        Ok(T),
        Err(E),
    }

    ```


    要注意我們的泛型型別有多個*參數化型別*，它們被逗號隔開。


    這個列舉非常常見，它可以在任何地方透過 `Ok` 及 `Err` 來產生。
  code: |
    fn do_something_that_might_fail(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))   
        }
    }

    fn main() {
        let result = do_something_that_might_fail(12);

        // match lets us deconstruct Result elegantly and ensure we handle all cases!
        match result {
            Ok(v) => println!("found {}", v),
            Err(e) => println!("Error: {}",e),
        }
    }
- title: 失敗的主函式 (failable main)
  content_markdown: |
    `main` 有能力回傳一個 `Result`！
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    // Main returns no value, but could return an error!
    fn main() -> Result<(), String> {
        let result = do_something_that_might_fail(12);

        match result {
            Ok(v) => println!("found {}", v),
            Err(_e) => {
                // handle this error gracefully
                
                // return a new error from main that said what happened!
                return Err(String::from("something went wrong in main!"));
            }
        }

        // Notice we use a unit value inside a Result Ok
        // to represent everything is fine
        Ok(())
    }
- title: 優雅的錯誤處理
  content_markdown: >
    `Result` 實在太常見了，所以 Rust 有個強大的 `?` 運算子來跟它們一起使用。
    底下這兩個敘述是等價的：


    ```

    do_something_that_might_fail()?

    ```


    ```

    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }

    ```
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // Look at how much code we saved!
        let v = do_something_that_might_fail(42)?;
        println!("found {}", v);
        Ok(())
    }
- title: 醜陋的選項 (optino)/結果 (result) 處理
  content_markdown: >
    如果你只是想快速寫點程式，使用 `Option`/`Result` 可能會讓你覺得煩躁。
    `Option` 和 `Result` 都有個函式稱作`展開` (unwrap)，它可以幫你迅速但骯髒的取得數值。
    `unwrap` 將會：

    1. 取得選項 (optino)/結果 (result) 裡的數值

    2. 如果列舉 (enum) 是 None/Err 型別，那將發生 `panic` 


    下列這兩段程式碼是等價的：


    ```

    my_option.unwrap()

    ```


    ```

    match my_option {
        Some(v) => v,
        None => panic!("some error message generated by Rust!"),
    }

    ```


    同樣的：


    ```

    my_result.unwrap()

    ```


    ```

    match my_result {
        Ok(v) => v,
        Err(e) => panic!("some error message generated by Rust!"),
    }

    ```


    當個良好的 Rust 人，當你可以的時候，盡量正確的使用 `match`！
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // concise but assumptive and gets ugly fast
        let v = do_something_that_might_fail(42).unwrap();
        println!("found {}", v);
        
        // this will panic!
        let v = do_something_that_might_fail(1).unwrap();
        println!("found {}", v);
        
        Ok(())
    }
- title: 向量 (vectors)
  content_markdown: >
    一些非常有用的泛型型別即是集合型別。一個向量是一個可變長度的物品清單 (list)，用結構 (struct) `Vec` 來表示。


    巨集 `vec!` 讓我們可以簡單的產生向量，而不用手動建立。


    `Vec` 有個方法叫 `iter()`，它可以產生一個向量迭代器，讓我們可以簡單的把一個向量放到 for 迴圈裡。


    記憶體細節：

    * `Vec` 是一個結構 (struct)，但在內部裡，它包含一個參考 (reference)，該參考指向一個固定於堆 (heap) 上的物品清單。

    * 一個向量一開始有初始容量，當越來越多物品加入而超過它的容量時，它會重新配置位於在堆 (heap) 上的資料，得到一個有更大容量的固定清單。
  code: |
    fn main() {
        // We can be explicit with type
        let mut i32_vec = Vec::<i32>::new(); // turbofish <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // But look how clever Rust is about determining the type automatically
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // That's a beautiful macro!
        let string_vec = vec![String::from("Hello"), String::from("World")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: 第四章 - 總結
  content_markdown: >
    在這個章節，我們學到了泛型給了我們多強大的力量！如果你沒有完全理解你要怎麼使用，那也別擔心，
    現在開始正是時候好好的注意這些主要概念，而且你將會一而再，再而三的在程式碼裡看到它們。

    我們的函數將將會越來越長！在下一章節裡，我們將會討論 Rust 裡很重要的概念：資料擁有權 (data ownership)。
