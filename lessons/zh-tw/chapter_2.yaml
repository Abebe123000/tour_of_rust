- title: 第二章 - 基本流程控制
  content_markdown: >
    在這個章節，我們會探討 Rust 裡的基本流程控制。

    如果你已經熟悉 C 相關語言，那你將會猶如處在自家廚房般，甚至偶爾會碰上一兩個驚喜呢！
- title: if/else if/else
  content_markdown: >
    程式碼分支在 Rust 裡並不是什麼新奇的東西。


    條件敘述沒有括號！我們真的需要它們嗎？我們的邏輯現在看起來漂亮且清晰。


    所有你常用的關係式及邏輯運算符號仍然正常運作：`==`、`!=`、`<`、
    `>`、`<=`、`>=`、`!`、`||`、`&&`。
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("less than 42");
        } else if x == 42 {
            println!("is 42");
        } else {
            println!("greater than 42");
        }
    }
- title: loop
  content_markdown: |
    需要一個無窮迴圈嗎？

    Rust 將它變得很簡單。

    當你準備好時，`break` 會離開一個迴圈。

    `loop` 有個秘密，我們很快就會談到它。
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    `while` 讓你輕鬆的加入一個條件到迴圈裡。

    如果該條件的結果是 `false`，那迴圈將會中止。
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
    }
- title: for
  content_markdown: >
    Rust 的 `for` 迴圈是個強大升級版。
    它會迭代任何表達式的數值，並且將該數值放入迭代器 (iterator) 裡。
    什麼是迭代器？迭代器是一個物件，你可以向這個物件詢問：「下一個物品是什麼？」，直到沒有下一個物品了。


    我們在後續章節會探討更多。同時，現在只需要知道 Rust 可以讓你輕鬆的建立一個產生整數數列的迭代器就好了。


    `..` 運算子產生一個迭代器，而這個迭代器產生一連串的數字，從起始數字開始，但不包含最後一個數字。


    `..=` 運算子產生一個迭代器，而這個迭代器產生一連串的數字，從起始數字開始直到最後一個數字。
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: >
    懷念你的 switch 條件判斷式嗎？Rust 有一個神妙的關鍵字 (keyword) 可以匹配所有可能的條件結果，
    一旦該結果為真就執行該區間的程式碼。
    現在讓我們看看這些是怎麼在數字上運作。在後續章節我們會探討更多有關複雜資料的配對。我向你保證這是值得等待的。


    `match` 會徹底的檢查，所以所有可能性都必需被掌控。


    配對與解構 (destructuring) 一起使用，是你目前為止看到 Rust 最常使用的模式之一。
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // we can match against multiple values
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // we can match against ranges
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // we can bind the matched number to a variable
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // this is the default match that must exist if not all cases are handled
            _ => {
                println!("found something else!");
            }
        }
    }
- title: 從迴圈回傳數值
  content_markdown: |
    `loop` 可以用 break 來回傳數值。
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "found the 13";
            }
        };
        println!("from loop: {}", v);
    }
- title: 從區塊表達式回傳數值
  content_markdown: >
    在 Rust 裡，`if`、`match`、functions 及區塊範疇 (scope blocks) 都有一個獨特的方式用來回傳數值。


    如果在 `if`、`match`、function 或是區塊範疇裡的最後一個敘述是一個表達式，而且它並沒有 `;` 結尾，
    那 Rust 將會從該區塊回傳該數值。
    這是一個很棒的方式用來產生一段簡結的邏輯，將回傳數值指定給一個新的變量。


    要注意 Rust 同時也允許 `if` 敘述可以用來當作簡潔的三元運算。
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust's ternary expression
        let v = if x < 42 { -1 } else { 1 };
        println!("from if: {}", v);

        let food = "hamburger";
        let result = match food {
            "hotdog" => "is hotdog",
            // notice the braces are optional when its just a single return expression
            _ => "is not hotdog",
        };
        println!("identifying food: {}", result);

        let v = {
            // This scope block lets us get a result without polluting function scope
            let a = 1;
            let b = 2;
            a + b
        };
        println!("from block: {}", v);

        // The idiomatic way to return a value in rust from a function at the end
        v + 4
    }

    fn main() {
        println!("from function: {}", example());
    }
- title: 第二章 - 總結
  content_markdown: >
    希望即使是最基本的語言特性，我也讓你一瞥 Rust 的力量。
    我們將會更深入的探討 `for` 及 `match`，以取得更多相關知識進而利用它們的能力。
    下一章節我們會進入 Rust 的基本資料結構 (data structures)。
