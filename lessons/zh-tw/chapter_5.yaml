- title: 第五章 - 擁有權 (ownership) 與借資料 (borrowing data)
  content_markdown: >
    與其他語言相比，Rust 有一套獨特的方式管理記憶體。我們將會逐一檢視這些行為以及編譯器的驗證，以免一下壓垮你。
    有一點要特別記得的是，這些規則的最終目標都是為了幫助你的程式碼有較少錯誤，而不是讓你的人生更痛苦。
- title: 擁有權 (ownership)
  content_markdown: >
    實體化一種型別並**綁**到一個變量時，會產生記憶體資源，而該記憶體資源的整個**生命週期**都會被 Rust 編譯器驗證過。
    綁定的變量就稱作記憶體資源的**擁有者**。
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        // We instantiate structs and bind to variables
        // to create memory resources
        let foo = Foo { x: 42 };
        // foo is the owner
    }
- title: 範圍 (scope-based) 資源管理
  content_markdown: |
    Rust 以範圍的邊界來解構及回收資源。
    這類解構及回收的專有名詞稱作**徹下** (drop)。

    記憶體細節：
    * Rust 沒有垃圾回收 (garbage collection)
    * 在 C++ 這被稱作資源取得即初始化 (resource acquisition is initialization)。
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 13 };

        println!("{}", foo_a.x);

        println!("{}", foo_b.x);
        // foo_b is dropped here 
        // foo_a is dropped here
    }
- title: 徹下是有階級的
  content_markdown: >
    當一備結構被徹下時，該結構本身會先被徹下，再來是它的子結構逐一被徹下。


    記憶體細節：

    * 當自動釋放記憶體時，Rust 會幫你確保有更少的記憶體洩漏 (memory leaks)

    * 記憶體資源只能被徹下一次
  code: |
    struct Bar {
        x: i32,
    }

    struct Foo {
        bar: Bar,
    }

    fn main() {
        let foo = Foo { bar: Bar { x: 42 } };
        println!("{}", foo.bar.x);
        // foo is dropped first
        // then foo.bar is dropped
    }
- title: 擁有權轉移
  content_markdown: >
    當一個擁有者被當作參數 (argument) 傳遞到函數時，擁有權則被轉移給該函式的參數 (parameter)。


    在經過**轉移**後，在原本函數的變量就無法再被使用了。


    記憶體細節：

    * 在**轉移**的過程中，堆疊記憶體的擁有者將被複製到函數參數的堆疊記憶體。
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let foo = Foo { x: 42 };
        // foo is moved to do_something
        do_something(foo);
        // foo can no longer be used
    }
- title: 擁有權歸還
  content_markdown: |
    擁有權可以從一個函式被歸還。
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something() -> Foo {
        Foo { x: 42 }
        // ownership is moved out
    }

    fn main() {
        let foo = do_something();
        // foo becomes the owner
        // foo is dropped because of end of function scope
    }
- title: 從參考 (references) 借擁有權
  content_markdown: |
    參考允許我們透過 `&` 運算子向一個資源借進入權。

    參考與其他資源一樣會被徹下。
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo = Foo { x: 42 };
        let f = &foo;
        println!("{}", f.x);
        // f is dropped here
        // foo is dropped here
    }
- title: 從參考借可變 (mutable) 的擁有權
  content_markdown: >
    我們可以透過 `&mut` 運算子向一個資源借可變的進入權。


    在可變動的借出時，一個資源擁有者無法被轉移或修改。


    記憶體細節：

    * Rust 避免有兩種方式可以修改一個被他人擁有的數值，因為這使得資料競爭 (data race) 有機會發生。
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let f = &mut foo;

        // FAILURE: do_something(foo) would fail because
        // foo cannot be moved while mutably borrowed

        // FAILURE: foo.x = 13; would fail here because
        // foo is not modifiable while mutably borrowed

        f.x = 13;
        // f is dropped here because it's no longer used after this point
        
        println!("{}", foo.x);
        
        // this works now because all mutable references were dropped
        foo.x = 7;
        
        // move foo's ownership to a function
        do_something(foo);
    }
- title: 解參考 (dereferencing)
  content_markdown: >
    使用 `&mut` 參考時，你可以透過 `*` 運算子來設定擁有者的數值。


    你也可以透過 `*` 運算子得到一份複製的數值 (如果該數值是可以被複製的話，我們將會在後續章節探討型別的可複製性)。
  code: |
    fn main() {
        let mut foo = 42;
        let f = &mut foo;
        let bar = *f; // get a copy of the owner's value
        *f = 13;      // set the reference's owner's value
        println!("{}", bar);
        println!("{}", foo);
    }
- title: 傳遞借來的資料 (borrowed data)
  content_markdown: >
    對 Rust 的參考規則最好的總結可能是：
    Rust's rules for references might best be summarized by:


    * Rust 只允許一個可變的參考**或者**多個不可變的參考，**但不會同時發生**。

    * 一個參考絕對不能**活得比它的擁有者還長**。


    這並不會造成當你想傳遞參考到一個函式的困擾。


    記憶體細節：

    * 參考的第一條規則是為了避免資料競爭 (data race)。什麼是資料競爭？當你在讀取資料時，有機會因為其他寫入而拿到舊資料即是資料競爭。
      這常常發生在多執行緒 (multi-threaded) 的程式裡。
    * 第二條規則是為了避免誤用了參考到不存在的資料的參考 (在 C 裡稱作懸空指標 (dangling pointers))。
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: &mut Foo) {
        f.x += 1;
        // mutable reference f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        do_something(&mut foo);
        // because all mutable references are dropped within
        // the function do_something, we can create another.
        do_something(&mut foo);
        // foo is dropped here
    }
- title: 參考的參考 (references of references)
  content_markdown: |
    參考甚至可以被用在其他參考上。
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(a: &Foo) -> &i32 {
        return &a.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here allow us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: 明確的生命週期
  content_markdown: >
    雖然 Rust 並不一定會把生命週期顯示在程式碼中，但編譯器會理解每個變量的生命週期，並試著驗證參考不會存在比它的擁有者還久。


    函式可以透過參數化函式簽章幫助我們確認哪些參數及回傳值是共享相同的生命週期。


    生命週期標示永遠都以 `'` 開頭 (例如：`'a`、`'b`、`'c`)
  code: |
    struct Foo {
        x: i32,
    }

    // the parameter foo and return value share the same lifetime
    fn do_something<'a>(foo: &'a Foo) -> &'a i32 {
        return &foo.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here, allowing us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: 多個生命週期
  content_markdown: >
    在編譯器無法解析的特定場合裡，生命週期標示允許我們明確的分辨所有函式簽章的生命週期。
  code: |
    struct Foo {
        x: i32,
    }

    // foo_b and the return value share the same lifetime
    // foo_a has an unrelated lifetime
    fn do_something<'a, 'b>(foo_a: &'a Foo, foo_b: &'b Foo) -> &'b i32 {
        println!("{}", foo_a.x);
        println!("{}", foo_b.x);
        return &foo_b.x;
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 12 };
        let x = do_something(&foo_a, &foo_b);
        // foo_a is dropped here because only foo_b's lifetime exist beyond here
        println!("{}", x);
        // x is dropped here
        // foo_b is dropped here
    }
- title: 靜態生命週期 (static lifetimes)
  content_markdown: >
    一個**靜態**變量是在編譯時間就被產生的記憶體資源，它從程式一開始就存在，直到結束。它們一定要明確的表示型別。


    一個**靜態生命週期**為一塊記憶體資源，它永遠存在直到程式結束。要注意的是，根據這項定義，有些靜態生命週期可以在執行時間才被產生出來。


    有著靜態生命週期的資源，會有一個特殊的標示 `'static'`。


    `'static'` 資源永遠不會被**徹下** (drop)。


    如果靜態生命週期資源包含了參考，那它們必須都得是 `'static'` (少了任何東西則將活得不夠久)。


    記憶體細節：


    * 修改靜態變量本質上就是危險的，因為任何人在任何地方都可以存取它們，而這有可能會造成資料競爭 (data race)。我們後續會再探討全域資料的問題。

    * Rust 允許使用 `unsafe { ... }` 區塊來操作一些編譯器無法確保的記憶體行為。[<span
    style="color:red; font-weight:
    bold;">R̸͉̟͈͔̄͛̾̇͜U̶͓͖͋̅Ṡ̴͉͇̃̉̀T̵̻̻͔̟͉́͆Ơ̷̥̟̳̓͝N̶̨̼̹̲͛Ö̵̝͉̖̏̾̔M̶̡̠̺̠̐͜Î̷̛͓̣̃̐̏C̸̥̤̭̏͛̎͜O̶̧͚͖͔̊͗̇͠N̸͇̰̏̏̽̃</span>](https://doc.rust-lang.org/nomicon/) 不應該輕易的被討論。
  code: |
    static PI: f64 = 3.1415;

    fn main() {
        // static variables can also be scoped to a function
        static mut SECRET: &'static str = "swordfish";

        // string literals have a 'static lifetime
        let msg: &'static str = "Hello World!";
        let p: &'static f64 = &PI;
        println!("{} {}", msg, p);

        // You can break some rules, but you must be explicit
        unsafe {
            // we can set SECRET to a string literal because it is also `static
            SECRET = "abracadabra";
            println!("{}", SECRET);
        }
    }
- title: 資料型別的生命週期
  content_markdown: >
    與函式類似，資料型別也可以透過參數對它的成員設定生命週期。


    Rust 會驗證包含資料結構的參考永遠不會存活的比它的擁有者的參考還久。


    我們無法讓一個結構有一個不指到任何地方的參考到處執行。
  code: |
    struct Foo<'a> {
        i:&'a i32
    }

    fn main() {
        let x = 42;
        let foo = Foo {
            i: &x
        };
        println!("{}",foo.i);
    }
- title: 第五章 - 總結
  content_markdown: >
    呼，恭喜撐過這章！我知道你有很多要消化，但你正以很棒的姿態成為一名 Rust 人。
    希望你清楚的了解 Rust 以一門語言來說，是如何解決下列許多系統程式 (systems programming) 的共同問題：


    * 無意的修改資源

    * 忘記釋放資源

    * 資源不小心被釋放了兩次

    * 在資源被釋放後還使用它

    * 當有人正在讀取資料，而另外有人正在修改資料而引起的資料競爭

    * 清楚的看到哪一段 code 是編譯器無法保證的


    在下一章節裡，我們將會應用一些這裡的知識，來看看 Rust 怎麼處理文字。
