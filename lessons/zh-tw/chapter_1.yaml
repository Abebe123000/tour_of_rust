- title: 第一章 - 基礎概念
  content_markdown: >
    在此第一章中，我們會探討最基本的函數(functions)，變量(variables)，及大部份的基本類型 
    (primitive types)。歡迎你的參加這次 Rust 之旅。

    還有如果您好奇這一隻正在跟您說話的，又可愛的螃蟹是誰。請容許我自我介紹！
    我是 **Ferris**，非官方的 Rust 語言吉祥物，很高興認識您！

- title: The Rust Playground (Rust 語言遊樂場)
  code: |
    fn main() {
        println!("Welcome to the playground! You can modify the code in here.");
    }
  content_markdown: >
    本旅程我們會使用這個互動的編程工具 [Rust Playground](https://play.rust-lang.org).

    使用這工具是一個很好的方法去試驗您的 Rust 程序，和展示你的創作及挑戰給其他人看。

- title: 變量 (Variables)
  code: |
    fn main() {
        // rust infers the type of x
        let x = 13;
        println!("{}", x);

        // rust can also be explicit about the type
        let x: f64 = 3.14159;
        println!("{}", x);

        // rust can also declare and initialize later, but this is rarely done
        let x;
        x = 0;
        println!("{}", x);
    }
  content_markdown: >
    變量是通過 **let** 關鍵字來宣告。

    當賦予一個值，在 99% 的情況下 Rust 能夠自行判斷變量的類型。如果不能自行判斷，您就要在
    宣告變量是指明變量的類型。

    留意，我們可以用同一個變量名稱重覆宣告變量，這稱為變量遮蔽。
    變量遮蔽容許使用同一個變量名稱，但不同的類型宣告。

    變量的命名是用`snake_case`啊！

- title: 改變變數的值
  code: |
    fn main() {
        let mut x = 42;
        println!("{}", x);
        x = 13;
        println!("{}", x);
    }
  content_markdown: >
    Rust 語言非常看重變量的可改變性，變量的可改變性分為以下兩種：


    * **可改變 (mutable)** - 編譯器容許此變量被寫入和讀取。

    * **不可改變 (immutable)** - 編譯器只容許此變量被讀取


    可改變的變量用 **mut** 關鍵字來標明。

    稍後我們將在這個概念上有更多的探討，但是現在暫時將它放在一旁吧。

- title: 基本類型 (Primitive types)
  code: |
    fn main() {
        let x = 12; // by default this is i32
        let a = 12u8;
        let b = 4.3; // by default this is f64
        let c = 4.3f32;
        let bv = true;
        let t = (13, false);
        let sentence = "hello world!";
        println!(
            "{} {} {} {} {} {} {} {}",
            x, a, b, c, bv, t.0, t.1, sentence
        );
    }
  content_markdown: >
    Rust 具有多種常見的類型：

    * (布林值)booleans - `bool` 來表達 true/false

    * (無符號整數) unsigned integers - `u8` `u16` `u32` `u64` `u128` 來表達正整數

    * (有符號整數) signed integers - `i8` `i16` `i32` `i64` `i128` 來表達正負整數

    * (指針大小的整數) pointer sized integers - `usize` `isize` 來表達索引或記憶體內的東西大小

    * (浮點) floating point - `f32` `f64`

    * (元組) tuple - `(value, value, ...)` 用於在傳遞多個固定的值

    * (陣列) array - `[value, value, ...]` 在編譯時已知具有固定長度的相似元素的集合

    * (片段) slices - 在運行時已知長度的相似元素的集合

    * `str`(字串片段 string slice) - 在運行時已知長度的字串

    在 Rust 裡面，文字處理可能比您在其他程式語言中所理解到的複雜

    Rust 是一個系統程式語言 (system programming language)，所以它所關注的記憶體問題

    對於您可能是前所未見。我們遲一點會深入了解。

    數字類型可以在後邊這樣明確標明它的類型： `13u32`, `2u8`

- title: 基本的數據類型轉換
  code: |
    fn main() {
        let a = 13u8;
        let b = 7u32;
        let c = a as u32 + b;
        println!("{}", c);

        let t = true;
        println!("{}", t as u8);
    }
  content_markdown: >
    當用到數字類型(numeric types)，Rust 要求明確指出哪一個類型。
    您不可以把 `u32` 和 `u8` 混著來使用。

    幸運地 Rust 有 **as** 這個關鍵字來讓數字類型轉換變得容易。

- title: 常數 (Constant)
  code: |
    const PI: f32 = 3.14159;

    fn main() {
        println!(
            "To make an apple {} from scratch, you must first create a universe.",
            PI
        );
    }
  content_markdown: >
    常數(Constant)讓我們可以定義一些常用的值，在程式中有效地重覆使用。

    跟變數不同，常數的值不會在運行的時候把值複製到使用的地方。
    編譯器會在編譯時直接以字串取代的方法把值取代常數。

    跟變數不同，常數的數據類型是必須指明的。


    常數通常是以 `SCREAMING_SNAKE_CASE` 命名的。
- title: 陣列 (Array)
  code: |
    fn main() {
        let nums: [i32; 3] = [1, 2, 3];
        println!("{:?}", nums);
        println!("{}", nums[1]);
    }
  content_markdown: >
    *陣列(Array)* 是一個固定長度的數據集。裡面只會放著同一種類型的值。

    *陣列* 類型是以 `[T;N]` 來宣告。T 是數據元件的類型，而 N 是在編譯時已經知道的陣列長度。


    *陣列* 中的數據元件可以透過`[x]` 來提取。 *x* 是一個由零開始計的 *usize* 類索引。

- title: 函數 (Functions)
  code: |
    fn add(x: i32, y: i32) -> i32 {
        return x + y;
    }

    fn main() {
        println!("{}", add(42, 13));
    }
  content_markdown: >
    函數(Functions)的參數數量可以從沒有到多個都可以

    在這個例子中, `add` 有兩個 `i32` 類型的參數 (有符號的 32-bit 整數)

    函數的名字通常是使用 `snake_case` 來命名。
- title: 多個回傳值
  code: |
    fn swap(x: i32, y: i32) -> (i32, i32) {
        return (y, x);
    }

    fn main() {
        // return a tuple of return values
        let result = swap(123, 321);
        println!("{} {}", result.0, result.1);

        // destructure the tuple into two variables names
        let (a, b) = swap(result.0, result.1);
        println!("{} {}", a, b);
    }
  content_markdown: >
    當函數要回傳幾個值的時候，可以把回傳值放到**元組(Tuple)**回傳。

    元組的元素可以通過索引(Index)來獲取。

    Rust 支持幾種不同的手法來拆解元組，
    讓我們可以漂亮的從數據結構中分解出部份有用的值來使用。

- title: 沒有回傳類型
  content_markdown: >
    當一沒有標明函數的回傳類型時，Rust 會默認回傳空的元組，稱為一個*單元(Unit)*。


    一個空的元組是以 `()` 來展示。

    直接使用`()`並不常見，但會經常出現。所以最好也能夠知道它是什麽。
  code: |
    fn make_nothing() -> () {
        return ();
    }

    // the return type is implied as ()
    fn make_nothing2() {
        // this function will return () if nothing is specified to return
    }

    fn main() {
        let a = make_nothing();
        let b = make_nothing2();

        // Printing a debug string for a and b
        // Because it's hard to print nothingness
        println!("The value of a: {:?}", a);
        println!("The value of b: {:?}", b);
    }
