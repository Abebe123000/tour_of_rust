- title: 第二章 - 基本控制流
  content_markdown: |
    在本章中，我们将讨论 Rust 中的基本控制流方法。 如果你熟悉类 C 的语言，你会感到宾至如归，兴许还能享受到一些小惊喜。
- title: if/else if/else
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("less than 42");
        } else if x == 42 {
            println!("is 42");
        } else {
            println!("greater than 42");
        }
    }
  content_markdown: |
    Rust 中的代码分支不足为奇。

    Rust 的条件判断没有括号！~~需要括号干什么。~~我们现有的逻辑就看起来就很干净整洁呀。

    不过呢，所有常见的逻辑运算符仍然适用：`==`，`!=`， `<`， `>`， `<=`， `>=`， `!`， `||`， `&&`。
- title: 循环
  content_markdown: |
    需要一个无限循环？

    使用 Rust 很容易实现。

    `break` 会退出当前循环。但 `loop` 还有个秘密，我们很快讲到。
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    `while` 允许你轻松地向循环添加条件。

    如果条件变为 `false`，循环就会退出。
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
        println!("x is {}", x);
    }
- title: for
  content_markdown: |
    Rust 的 `for` 循环是一个强大的升级。它遍历来自计算结果为迭代器的任意表达式的值。
    迭代器是什么？迭代器是一个你可以一直询问“下一项是什么？”直到没有其他项的对象。

    我们将在以后的章节中进一步探讨这一点，与此同时，我们知道 Rust 使创建生成整数序列的迭代器变得容易。

    `..` 运算符创建一个可以生成包含起始数字、但不包含末尾数字的数字序列的迭代器。

    `..=` 运算符创建一个可以生成包含起始数字、且包含末尾数字的数字序列的迭代器。
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: |
    想念你的 switch 语句吗？Rust 有一个非常有用的关键字，用于匹配值的所有可能条件，
    并在匹配为真时执行相应代码。我们先来看看对数字的使用。在未来章节中，我们将有更多
    更复杂的数据模式匹配的说明，我向你保证，它将值得等待。

    `match` 是穷尽的，意为所有可能的值都必须被考虑到。

    匹配与解构相结合是迄今为止你在 Rust 中看到的最常见的模式之一。
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // 我们可以匹配多个值
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // 我们可以匹配范围
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // 我们可以将匹配数值绑定到变量
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // 这是默认匹配，如果没有处理所有情况，则必须存在该匹配
            _ => {
                println!("found something else!");
            }
        }
    }
- title: 从循环中返回值
  content_markdown: |
    `loop` 可以被中断以返回一个值。
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "found the 13";
            }
        };
        println!("from loop: {}", v);
    }
- title: 从块表达式返回值
  content_markdown: |
    `if`，`match`，函数，以及作用域块都有一种返回值的独特方式。

    如果 `if`、`match`、函数或作用域块中的最后一条语句是不带 `;` 的表达式，
    Rust 将把它作为一个值从块中返回。这是一种创建简洁逻辑的好方法，它返回一个
    可以放入新变量的值。

    注意，它还允许 `if` 语句像简洁的三元表达式一样操作。
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust的三元表达式
        let v = if x < 42 { -1 } else { 1 };
        println!("from if: {}", v);

        let food = "hamburger";
        let result = match food {
            "hotdog" => "is hotdog",
            // 注意，当它只是一个返回表达式时，大括号是可选的
            _ => "is not hotdog",
        };
        println!("identifying food: {}", result);

        let v = {
            // 这个作用域块让我们得到一个不影响函数作用域的结果
            let a = 1;
            let b = 2;
            a + b
        };
        println!("from block: {}", v);

        // 在最后从函数中返回值的惯用方法
        v + 4
    }

    fn main() {
        println!("from function: {}", example());
    }
- title: 第二章总结
  content_markdown: |
    希望即便是在最基本的语言特性中，我也已经向你展示了 Rust 的强大功能。
    我们将在后续章节更深入地讨论 `for` 和 `match`，因为我们将获得更多可以
    利用它们能力的知识。接下来，我们将讨论 Rust 的基本数据结构。
