- title: فصل 8 - Smart Pointer ها
  content_markdown: >
    توی این فصل smart pointer ها رو براتون شفاف می‌کنیم. بیاید این
    ساختارهای داده‌ای رو کشف کنیم که بهمون اجازه می‌دن با پایین‌ترین
    سطح حافظه تعامل داشته باشیم.


    فریس می‌گه: «اگه حس می‌کنی که نمی‌تونی توی یه خوندن کوتاه، کد
    مدیریت حافظه‌ی سطح پایین خودت رو بنویسی، از این فصل خسته نشو.
    این فصل بیشتر برای اینه که باهات چند تا ابزار مفید رو آشنا کنه
    و یه نمای کلی از نحوه‌ی کارشون بهت بده!»
- title: رفرنس‌ها، دوباره بررسی می‌کنیم
  content_markdown: >
    یه رفرنس اساساً فقط یه عدده که موقعیت شروع چند تا بایت توی
    حافظه‌ست. تنها هدفش نمایش این مفهومه که داده‌ای از یه نوع خاص
    کجا وجود داره. چیزی که یه رفرنس رو از یه عدد ساده متفاوت می‌کنه
    اینه که راست تأیید می‌کنه که طول عمر رفرنس‌ها بیشتر از چیزی که
    بهش اشاره می‌کنن دوام نمیاره (وگرنه موقع استفاده ازش خطا
    می‌گرفتیم!).
- title: Pointer های خام (Raw)
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    رفرنس‌ها رو می‌شه به یه نوع ساده‌تر به اسم *pointer خام (raw
    pointer)* تبدیل کرد. درست مثل یه عدد، می‌شه با محدودیت کمی
    کپیش کرد و جابه‌جاش کرد. راست هیچ تضمینی در مورد اعتبار موقعیت
    حافظه‌ای که بهش اشاره می‌کنه، نمی‌ده.


    دو نوع pointer خام وجود داره:


    * `*const T` - یه pointer خام به داده‌ای از نوع T که هیچ‌وقت
    نباید تغییر کنه.

    * `*mut T` - یه pointer خام به داده‌ای از نوع T که می‌تونه تغییر
    کنه.


    pointer های خام رو می‌شه به عدد تبدیل کرد و برعکس (مثلاً به
    `usize`).


    pointer های خام می‌تونن با کد *unsafe* به داده دسترسی پیدا کنن
    (بعداً بیشتر در موردش صحبت می‌کنیم).


    جزئیات حافظه:

    * یه رفرنس توی راست از نظر نحوه‌ی استفاده خیلی شبیه یه pointer
    توی C هست، ولی با محدودیت‌های خیلی بیشتری در زمان کامپایل برای
    اینکه چطور می‌شه ذخیره‌ش کرد و به تابع‌های دیگه منتقلش کرد.
    * یه pointer خام توی راست شبیه یه pointer توی C هست، چون یه عدد
    رو نمایش می‌ده که می‌شه کپی کرد یا جابه‌جاش کرد، و حتی می‌شه
    به نوع‌های عددی تبدیلش کرد و به‌عنوان یه عدد برای محاسبات
    pointer تغییرش داد.
- title: دیرفرنس کردن (Dereferencing)
  content_markdown: |
    به فرآیند دسترسی/دستکاری داده‌ای که یه *رفرنس* (مثلاً `&i32`)
    بهش اشاره می‌کنه، *دیرفرنس کردن (dereferencing)* می‌گن.

    از رفرنس‌ها به دو روش برای دسترسی/دستکاری داده استفاده می‌شه:
    * دسترسی به داده‌ی اشاره‌شده در زمان انتساب متغیرها.
    * دسترسی به فیلدها یا متدهای داده‌ی اشاره‌شده.

    راست چند تا عملگر قدرتمند داره که بهمون اجازه‌ی این کار رو می‌ده.
- title: عملگر *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    عملگر `*` یه روش صریح برای دیرفرنس کردن یه رفرنسه.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    جزئیات حافظه:

    - چون i32 یه نوع پایه‌ست که trait به اسم `Copy` رو پیاده‌سازی
    می‌کنه، بایت‌های متغیر `a` روی پشته توی بایت‌های متغیر `b` کپی
    می‌شن.
- title: عملگر .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    عملگر `.` برای دسترسی به فیلدها و متدهای یه رفرنس استفاده می‌شه.
    یه‌کم ظریف‌تر عمل می‌کنه.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    وای، چرا لازم نبود قبل از `ref_ref_ref_f` سه‌تا `*` بذاریم؟ به
    این خاطره که عملگر `.` به‌طور خودکار یه زنجیره از رفرنس‌ها رو
    دیرفرنس می‌کنه. اون خط آخر رو کامپایلر به‌طور خودکار به این شکل
    تبدیل می‌کنه:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart Pointer ها
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    راست علاوه بر توانایی ساختن رفرنس به داده‌های تایپ‌شده‌ی موجود با
    عملگر `&`، این توانایی رو هم بهمون می‌ده که struct هایی *شبیه
    رفرنس* بسازیم که بهشون **smart pointer** می‌گن.


    می‌تونیم رفرنس‌ها رو در سطح بالا مثل یه نوع در نظر بگیریم که
    بهمون دسترسی به یه نوع دیگه رو می‌ده. smart pointer ها توی رفتار
    خودشون با رفرنس‌های معمولی فرق دارن، چون بر اساس یه منطق داخلی
    که برنامه‌نویس می‌نویسه، عمل می‌کنن. تو — برنامه‌نویس — همون
    بخش *smart* هستی.


    معمولاً smart pointer ها trait های `Deref`، `DerefMut` و `Drop`
    رو پیاده‌سازی می‌کنن تا مشخص کنن وقتی ساختار با عملگرهای `*` و
    `.` دیرفرنس می‌شه، چه اتفاقی باید بیفته.
- title: کد Unsafe هوشمند
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    smart pointer ها معمولاً کد *unsafe* رو خیلی استفاده می‌کنن.
    همون‌طور که قبلاً گفته شد، اونا ابزارهای رایجی برای تعامل با
    پایین‌ترین سطح‌های حافظه توی راست هستن.


    کد unsafe چیه؟ کد unsafe دقیقاً مثل کد معمولی راست رفتار می‌کنه،
    به جز چند تا قابلیت که کامپایلر راست نمی‌تونه در موردشون تضمینی
    بده.


    یه قابلیت اصلی کد unsafe اینه که یه *pointer خام رو دیرفرنس
    می‌کنه*. یعنی یه *pointer خام* به یه موقعیت توی حافظه رو می‌گیره
    و اعلام می‌کنه "این‌جا یه ساختار داده وجود داره!" و تبدیلش
    می‌کنه به یه نمایش از داده که می‌شه ازش استفاده کرد (مثلاً
    `*const u8‎` به `u8`).


    راست هیچ راهی برای پیگیری معنای هر بایتی که توی حافظه نوشته
    می‌شه، نداره. چون راست نمی‌تونه در مورد اینکه چی توی یه عدد
    دلخواه که به‌عنوان *pointer خام* استفاده می‌شه وجود داره، تضمینی
    بده، دیرفرنس کردن رو توی یه بلوک `unsafe { ... }‎` قرار می‌ده.


    smart pointer ها به‌شکل گسترده‌ای *pointer های خام رو دیرفرنس
    می‌کنن*، ولی توی کاری که انجام می‌دن خیلی خوب آزمایش شدن.
- title: دوستای آشنا
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    بیاید به چند تا smart pointer که قبلاً دیدیم فکر کنیم، مثل
    `Vec<T>‎` و `String`.


    `Vec<T>‎` یه smart pointer هست که فقط مالک یه ناحیه از حافظه‌ی
    بایتیه. کامپایلر راست هیچ ایده‌ای نداره که توی این بایت‌ها چیه.
    smart pointer تفسیر می‌کنه که برداشتن آیتم‌ها از ناحیه‌ی حافظه‌ای
    که مدیریتش می‌کنه یعنی چی، پیگیری می‌کنه که ساختارهای داده داخل
    اون بایت‌ها از کجا شروع و کجا تموم می‌شن، و در نهایت یه pointer
    خام رو به ساختارهای داده دیرفرنس می‌کنه تا یه رابط تمیز و
    ارگونومیک برای استفاده‌ی ما بسازه (مثلاً `my_vec[3]‎`).


    به همین شکل، `String` هم یه ناحیه از حافظه‌ی بایتی رو پیگیری
    می‌کنه، و به‌شکل برنامه‌ای محتوایی که توش نوشته می‌شه رو محدود
    می‌کنه که همیشه `utf-8` معتبر باشه، و کمک می‌کنه اون ناحیه‌ی
    حافظه به یه نوع `&str‎` دیرفرنس بشه.


    هر دوی این ساختارهای داده از دیرفرنس کردن unsafeِ pointer های
    خام برای انجام کارشون استفاده می‌کنن.


    جزئیات حافظه:

    * راست معادلی برای `malloc` توی C داره؛ با استفاده از
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html) و
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html)
    برای گرفتن ناحیه‌های حافظه‌ی خودتون برای مدیریتشون.
- title: حافظه‌ی تخصیص‌یافته روی هیپ
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` یه smart pointer هست که بهمون اجازه می‌ده داده رو از پشته
    به هیپ منتقل کنیم.


    دیرفرنس کردنش بهمون اجازه می‌ده داده‌ی تخصیص‌یافته روی هیپ رو
    ارگونومیک استفاده کنیم، انگار که نوع اصلی خودشه.
- title: Main شکست‌پذیر، دوباره بررسی می‌کنیم
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    کد راست ممکنه نمایش‌های زیادی برای خطاها داشته باشه، ولی
    کتابخونه‌ی استاندارد یه trait جهانی به اسم `std::error::Error`
    برای توصیف خطاها داره.


    با استفاده از یه smart pointer به اسم `Box`، می‌تونیم از نوع
    `Box<dyn std::error::Error>‎` به‌عنوان یه نوع مشترک برای
    برگردوندن خطاها استفاده کنیم، چون بهمون اجازه می‌ده یه خطا رو
    روی هیپ منتشر کنیم و باهاش توی سطح بالا تعامل داشته باشیم، بدون
    اینکه لازم باشه یه نوع خاص رو بشناسیم.


    اوایل تور راست یاد گرفتیم که `main` می‌تونه یه خطا برگردونه.
    الان می‌تونیم یه نوع برگردونیم که تقریباً هر نوع خطایی که ممکنه
    توی برنامه‌مون اتفاق بیفته رو توصیف کنه، به شرطی که ساختار داده‌ی
    خطا، trait مشترک `Error` راست رو پیاده‌سازی کنه.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: شمارش رفرنس (Reference Counting)
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` یه smart pointer هست که داده رو از پشته به هیپ منتقل می‌کنه.
    بهمون اجازه می‌ده smart pointer های `Rc` دیگه رو کلون کنیم که
    همه‌شون توانایی قرض گرفتن غیرقابل‌تغییر (immutable) داده‌ای که
    روی هیپ گذاشته شده رو دارن.


    فقط وقتی که آخرین smart pointer دراپ بشه، داده روی هیپ آزاد
    می‌شه.
- title: به اشتراک گذاشتن دسترسی
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` یه ساختار داده‌ی کانتینره که معمولاً توسط smart pointer
    ها نگه داشته می‌شه، داده می‌گیره و بهمون اجازه می‌ده رفرنس‌های
    mutable و immutable به محتوای داخلش قرض بگیریم. این کار جلوی
    سوءاستفاده از قرض گرفتن رو می‌گیره، چون قوانین ایمنی حافظه‌ی راست
    رو در زمان اجرا، وقتی که درخواست قرض گرفتن داده‌های داخلش رو
    می‌دی، اجرا می‌کنه:


    **فقط یه رفرنس mutable یا چند تا رفرنس immutable، ولی نه هر دو
    با هم!**


    اگه این قوانین رو نقض کنی، `RefCell` panic می‌کنه.
- title: به اشتراک گذاشتن بین Thread ها
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` یه ساختار داده‌ی کانتینره که معمولاً توسط smart pointer
    ها نگه داشته می‌شه، داده می‌گیره و بهمون اجازه می‌ده رفرنس‌های
    mutable و immutable به داده‌های داخلش قرض بگیریم. این کار جلوی
    سوءاستفاده از قرض گرفتن رو می‌گیره، چون سیستم‌عامل فقط اجازه
    می‌ده یه thread پردازنده در یه لحظه به داده دسترسی داشته باشه، و
    thread های دیگه رو بلاک می‌کنه تا وقتی که اون thread اصلی با قرض
    قفل‌شده‌ش کارش تموم بشه.


    چندریسمانی (multithreading) فراتر از حوصله‌ی تور راست هست، ولی
    `Mutex` یه بخش بنیادی توی هماهنگ کردن چند تا thread پردازنده که
    به یه داده‌ی مشترک دسترسی دارن، محسوب می‌شه.


    یه smart pointer خاص به اسم `Arc` هست که دقیقاً مثل `Rc` هست، با
    این تفاوت که از یه افزایش thread-safe برای شمارش رفرنس‌ها
    استفاده می‌کنه. معمولاً برای داشتن رفرنس‌های زیاد به یه `Mutex`
    یکسان استفاده می‌شه.
- title: ترکیب کردن Smart Pointer ها
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    smart pointer ها ممکنه محدود به نظر برسن، ولی می‌تونن ترکیب‌های
    خیلی قدرتمندی بسازن.


    `Rc<Vec<Foo>>‎` - اجازه‌ی کلون کردن چند تا smart pointer رو می‌ده
    که می‌تونن یه وکتور مشترک از ساختارهای داده‌ی immutable روی هیپ
    رو قرض بگیرن.


    `Rc<RefCell<Foo>>‎` - به چند تا smart pointer این توانایی رو
    می‌ده که یه struct یکسان به اسم `Foo` رو mutable/immutable قرض
    بگیرن.


    `Arc<Mutex<Foo>>‎` - به چند تا smart pointer این توانایی رو
    می‌ده که قرض‌های موقت mutable/immutable رو به‌شکلی انحصاری برای
    یه thread پردازنده قفل کنن.


    جزئیات حافظه:

    * یه الگوی تکرارشونده رو توی خیلی از این ترکیب‌ها می‌بینی.
    استفاده از یه نوع داده‌ی immutable (که شاید توسط چند تا smart
    pointer مالکیتش انجام بشه) برای تغییر داده‌ی داخلی. به این کار
    توی راست الگوی "interior mutability" (تغییرپذیری داخلی) می‌گن.
    این یه الگوئه که بهمون اجازه می‌ده قوانین استفاده از حافظه رو در
    زمان اجرا خم کنیم، با همون سطح ایمنی که چک‌های راست در زمان
    کامپایل دارن.
- title: فصل 8 - جمع‌بندی
  content_markdown: >
    smart pointer ها اصطلاحات رایج برنامه‌نویسی راست هستن و بهمون
    اجازه می‌دن مجبور نباشیم الگوهای خیلی رایج استفاده از حافظه رو
    دوباره بسازیم. با اینا آماده‌ای که سخت‌ترین چالش‌ها رو حل کنی!
    حالا که مبانی راست رو داریم، بیا یه‌کم در مورد اینکه چطوری
    پروژه‌های بزرگ‌تر می‌سازیم صحبت کنیم. توی فصل 9 از خطوط کد یه
    صفحه‌ی تنها آزاد می‌شیم.
