- title: فصل 7 - برنامه‌نویسی شیءگرا
  content_markdown: >
    بیان ایده‌ها با تابع‌ها یه روش امتحان‌شده برای نمایش رفتار و داده‌ست
    (C دهه‌هاست که این کار رو می‌کنه!). از نظر تاریخی، علوم کامپیوتر
    راه‌های بیانی مفید دیگه‌ای هم برای تجمیع و انتزاع داده پیدا کرده.
    شاید با برنامه‌نویسی شیءگرا (OOP) به‌عنوان یکی از این راه‌ها آشنا
    باشی. توی این فصل، زبان راست رو فراتر از تابع‌ها بررسی می‌کنیم.
- title: OOP چیه؟
  content_markdown: >
    برنامه‌نویسی شیءگرا تقریباً به زبان‌های برنامه‌نویسی‌ای اشاره
    داره که چند تا ویژگی مشخص دارن:

    * کپسوله‌سازی (Encapsulation) - مرتبط کردن داده و تابع‌ها توی
    یه واحد مفهومی از یه نوع واحد به اسم *شیء (object)*.

    * انتزاع (Abstraction) - پنهون کردن داده و اعضای تابعی برای
    مبهم کردن جزئیات پیاده‌سازی یه شیء.

    * چندریختی (Polymorphism) - توانایی تعامل با شیءهایی از نوع‌های
    مختلف از طریق یه رابط واحد.

    * وراثت (Inheritance) - توانایی به ارث بردن داده و رفتار از
    شیءهای دیگه.
- title: راست OOP نیست
  content_markdown: >
    راست به‌شکل معناداری فاقد وراثت داده و رفتاره.


    * struct ها نمی‌تونن فیلدها رو از یه struct والد به ارث ببرن.

    * struct ها نمی‌تونن تابع‌ها رو از یه struct والد به ارث ببرن.


    با این حال، راست خیلی از ویژگی‌های زبان‌های برنامه‌نویسی رو
    پیاده‌سازی کرده، پس شاید اصلاً به این کمبود اهمیتی ندی.
- title: کپسوله‌سازی با متدها
  code: |
    struct SeaCreature {
        noise: String,
    }

    impl SeaCreature {
        fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    راست از مفهوم *شیء (object)* پشتیبانی می‌کنه که یه struct مرتبط
    با چند تا تابع (که بهشون *متد* هم می‌گن) هست.


    اولین پارامتر هر متد باید یه رفرنس به نمونه‌ی (instance) مرتبط
    با فراخوانی اون متد باشه (مثلاً `instanceOfObj.foo()‎`). راست
    از این‌ها استفاده می‌کنه:

    * `&self` - رفرنس immutable به نمونه.

    * `&mut self` - رفرنس mutable به نمونه.


    متدها توی یه بلوک پیاده‌سازی با کلیدواژه‌ی `impl` تعریف می‌شن:


    ```rust

    impl MyStruct {
        ...
        fn foo(&self) {
            ...
        }
    }

    ```
- title: انتزاع با نمایش انتخابی
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    راست می‌تونه کارکرد داخلی شیءها رو پنهون کنه.


    به‌طور پیش‌فرض، فیلدها و متدها فقط توی ماژولی که بهش تعلق دارن
    قابل دسترسی هستن.


    کلیدواژه‌ی `pub` فیلدها و متدهای struct رو بیرون از ماژول هم
    قابل‌دسترس می‌کنه.
- title: چندریختی با Trait ها
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_noise();
    }
  content_markdown: >
    راست از چندریختی با trait ها پشتیبانی می‌کنه. trait ها بهمون
    اجازه می‌دن یه مجموعه از متدها رو با یه نوع struct مرتبط کنیم.


    اول امضای متدهای یه trait رو این‌طوری تعریف می‌کنیم:


    ```

    trait MyTrait {
        fn foo(&self);
        ...
    }

    ```


    وقتی یه struct یه trait رو پیاده‌سازی می‌کنه، یه قرارداد برقرار
    می‌شه که بهمون اجازه می‌ده به‌شکل غیرمستقیم از طریق نوع trait
    (مثلاً `&dyn MyTrait`) با اون struct تعامل کنیم، بدون اینکه لازم
    باشه نوع واقعیش رو بدونیم.


    متدهای trait که یه struct پیاده‌سازیشون کرده، توی یه بلوک
    پیاده‌سازی تعریف می‌شن:


    ```rust

    impl MyTrait for MyStruct {
        fn foo(&self) {
            ...
        }
        ...
    }

    ```
- title: متدهای پیاده‌سازی‌شده روی Trait ها
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
        
        fn make_alot_of_noise(&self){
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: >
    trait ها می‌تونن متدهای پیاده‌سازی‌شده هم داشته باشن.


    این تابع‌ها دسترسی مستقیم به فیلدهای داخلی یه struct ندارن، ولی
    می‌تونن برای به اشتراک گذاشتن رفتار بین پیاده‌سازهای مختلف یه
    trait مفید باشن.
- title: وراثت Trait ها
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    trait LoudNoiseMaker: NoiseMaker {
        fn make_alot_of_noise(&self) {
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    impl LoudNoiseMaker for SeaCreature {}

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: |
    trait ها می‌تونن متدها رو از trait های دیگه به ارث ببرن.
- title: دیسپچ داینامیک در مقابل استاتیک
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn static_make_noise(creature: &SeaCreature) {
        // we know the real type
        creature.make_noise();
    }

    fn dynamic_make_noise(noise_maker: &dyn NoiseMaker) {
        // we don't know the real type
        noise_maker.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        static_make_noise(&creature);
        dynamic_make_noise(&creature);
    }
  content_markdown: >
    متدها به دو روش اجرا می‌شن:

    * دیسپچ استاتیک - وقتی نوع نمونه (instance) مشخصه، مستقیماً
    می‌دونیم کدوم تابع رو صدا بزنیم.

    * دیسپچ داینامیک - وقتی نوع یه نمونه مشخص نیست، باید یه راهی
    برای صدا زدن تابع درست پیدا کنیم.


    نوع‌های trait مثل `&dyn MyTrait` بهمون این امکان رو می‌دن که
    به‌شکل غیرمستقیم با نمونه‌های شیءها با استفاده از دیسپچ داینامیک
    کار کنیم.


    وقتی از دیسپچ داینامیک استفاده می‌شه، راست تشویقت می‌کنه که
    `dyn` رو قبل از نوع trait ات بذاری تا بقیه هم متوجه بشن.


    جزئیات حافظه:

    * دیسپچ داینامیک به خاطر دنبال کردن pointer برای پیدا کردن
    فراخوانی واقعی تابع، یه‌کم کندتره.
- title: شیءهای Trait
  content_markdown: >
    وقتی یه نمونه از یه شیء رو به یه پارامتر از نوع `&dyn MyTrait`
    پاس می‌دیم، چیزی رو پاس می‌دیم که بهش *شیء trait (trait object)*
    می‌گن.


    یه شیء trait چیزیه که بهمون اجازه می‌ده به‌شکل غیرمستقیم متدهای
    درست یه نمونه رو صدا بزنیم. یه شیء trait یه struct هست که
    pointer نمونه‌مون رو به همراه یه لیست از pointerهای تابع به
    متدهای نمونه‌مون نگه می‌داره.


    جزئیات حافظه:

    * این لیست از تابع‌ها توی ++C به اسم *vtable* شناخته می‌شه.
- title: کار کردن با داده‌ی اندازه‌نامشخص
  content_markdown: >
    trait ها وقتی می‌خوایم اونا رو داخل یه struct دیگه ذخیره کنیم،
    یه چالش جالب ایجاد می‌کنن. trait ها struct اصلی رو مبهم می‌کنن،
    پس اندازه‌ی اصلیش رو هم مبهم می‌کنن. مقدارهایی با اندازه‌ی
    نامشخص که توی struct ها ذخیره می‌شن، توی راست به دو روش مدیریت
    می‌شن:


    * `generics` - استفاده از نوع‌های پارامتری‌شده، به‌شکل مؤثری
    struct/تابع‌هایی با نوع‌های مشخص و در نتیجه اندازه‌های مشخص
    می‌سازه.

    * `indirection` - گذاشتن نمونه‌ها روی هیپ، یه سطح از غیرمستقیم‌سازی
    بهمون می‌ده که بهمون اجازه می‌ده نگران اندازه‌ی نوع واقعی نباشیم
    و فقط یه pointer بهش ذخیره کنیم. راه‌های دیگه‌ای هم وجود داره!
- title: تابع‌های جنریک
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise<T>(creature: &T)
    where
        T: NoiseMaker,
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: >
    جنریک‌ها توی راست دست‌به‌دست با trait ها کار می‌کنن. وقتی یه
    نوع پارامتری‌شده‌ی `T` رو توصیف می‌کنیم، می‌تونیم با لیست کردن
    trait هایی که آرگومان باید پیاده‌سازی کنه، محدود کنیم که چه
    نوع‌هایی می‌تونن به‌عنوان آرگومان استفاده بشن.


    توی این مثال، نوع `T` باید trait به اسم `Foo` رو پیاده‌سازی کنه:

    ```rust

    fn my_function<T>(foo: T)

    where
        T:Foo
    {
        ...
    }

    ```


    با استفاده از جنریک‌ها، در زمان کامپایل تابع‌هایی با تایپ استاتیک
    می‌سازیم که نوع‌ها و اندازه‌های مشخصی دارن و همین بهمون اجازه
    می‌ده دیسپچ استاتیک انجام بدیم و اونا رو به‌عنوان یه مقدار با
    اندازه‌ی مشخص ذخیره کنیم.
- title: شکل خلاصه‌ی تابع‌های جنریک
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise(creature: &impl NoiseMaker)
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: |
    راست یه شکل خلاصه هم برای بیان جنریک‌هایی که با یه trait محدود
    شدن داره:

    ```rust
    fn my_function(foo: impl Foo) {
        ...
    }
    ```

    که معادل نوشتن این هست:

    ```rust
    fn my_function<T>(foo: T)
    where
        T:Foo
    {
        ...
    }
    ```
- title: Box
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    struct Ocean {
        animals: Vec<Box<dyn NoiseMaker>>,
    }

    fn main() {
        let ferris = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        let sarah = SeaCreature {
            name: String::from("Sarah"),
            noise: String::from("swish"),
        };
        let ocean = Ocean {
            animals: vec![Box::new(ferris), Box::new(sarah)],
        };
        for a in ocean.animals.iter() {
            a.make_noise();
        }
    }
  content_markdown: >
    `Box` یه ساختار داده‌ست که بهمون اجازه می‌ده داده‌مون رو از
    پشته به هیپ منتقل کنیم.


    `Box` یه struct هست که به اسم *smart pointer* شناخته می‌شه و
    pointer داده‌مون روی هیپ رو نگه می‌داره.


    چون `Box` یه struct با اندازه‌ی مشخصه (چون فقط یه pointer نگه
    می‌داره)، اغلب به‌عنوان یه راه برای ذخیره‌ی یه رفرنس به چیزی
    توی یه struct که باید اندازه‌ی فیلدهاش رو بدونه، استفاده می‌شه.


    `Box` اونقدر رایجه که می‌شه از هر جایی استفادش کرد:


    ```rust

    Box::new(Foo { ... })

    ```
- title: struct های جنریک، دوباره بررسی می‌کنیم
  content_markdown: >
    struct های جنریک هم می‌تونن نوع‌های پارامتری‌شده‌شون رو با trait
    محدود کنن.


    ```rust

    struct MyStruct<T>

    where
        T: MyTrait
    {
        foo: T
        ...
    }

    ```


    struct های جنریک نوع پارامتری‌شده‌شون رو توی بلوک پیاده‌سازیشون
    هم دارن:


    ```rust

    impl<T> MyStruct<T> {
        ...
    }

    ```
- title: فصل 7 - جمع‌بندی
  content_markdown: >
    حالا ویژگی‌های زبانی بیشتری دست‌مونه تا ایده‌هامون رو واضح نشون
    بدیم!


    شاید انتزاع‌های راست ساده باشن، ولی به‌اندازه‌ی کافی قدرتمندن که
    کار کردن با کد رو لذت‌بخش کنن. توی این فصل، یه نگاه اجمالی به
    smart pointer ها با `Box` انداختیم. توی فصل بعدی می‌بینیم که
    smart pointer ها چطور می‌تونن توی موقعیت‌های تخصصی‌تر حافظه
    کمکمون کنن.


    منابع:

    * [Video - Object-oriented Programming in 7
    minutes](https://www.youtube.com/watch?v=pTB0EiLXUC8)

    * [Article - "The faster you unlearn OOP, the better for you and
    your
    software"](https://dpc.pw/the-faster-you-unlearn-oop-the-better-for-you-and-your-software)
