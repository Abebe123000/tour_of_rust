- title: فصل 9 - سازمان‌دهی و ساختار پروژه
  content_markdown: >
    تا الان همه‌ی مثال‌های کدمون توی یه فایل تنها بودن. بیاید در
    مورد اینکه چطور می‌شه کدمون رو بهتر سازمان‌دهی کرد و با بقیه به
    اشتراک گذاشت، صحبت کنیم!
- title: ماژول‌ها
  content_markdown: |
    هر برنامه یا کتابخونه‌ی راست یه *crate* هست.

    هر crate از یه سلسله‌مراتب از *ماژول‌ها* تشکیل شده.

    هر crate یه ماژول ریشه (root module) داره.

    یه ماژول می‌تونه متغیرهای سراسری، تابع‌ها، struct ها، trait ها،
    یا حتی ماژول‌های دیگه رو نگه‌داره!

    توی راست، یه تناظر یک‌به‌یک بین فایل‌ها و سلسله‌مراتب درخت ماژول
    وجود نداره. باید درخت ماژول رو به‌شکل صریح و دستی توی کدمون
    بسازیم.
- title: نوشتن یه برنامه
  content_markdown: |
    یه برنامه یه ماژول ریشه توی یه فایل به اسم `main.rs` داره.
- title: نوشتن یه کتابخونه
  content_markdown: |
    یه کتابخونه یه ماژول ریشه توی یه فایل به اسم `lib.rs` داره.
- title: ارجاع به ماژول‌ها و Crate های دیگه
  code: |
    use std::f64::consts::PI;

    fn main() {
        println!("Welcome to the playground!");
        println!("I would love a slice of {}!", PI);
    }
  content_markdown: >
    به آیتم‌های داخل ماژول‌ها می‌شه با مسیر کامل ماژولشون ارجاع داد؛
    مثلاً `std::f64::consts::PI`.


    یه راه ساده‌تر، کلیدواژه‌ی **use** هست. این کلیدواژه بهمون اجازه
    می‌ده آیتم‌های خاصی رو از ماژول‌هایی که می‌خوایم تو کل کدمون
    استفاده کنیم بدون مسیر کامل مشخص کنیم. مثلاً `use
    std::f64::consts::PI` بهم اجازه می‌ده توی تابع main فقط از
    شناسه‌ی `PI` استفاده کنم.


    **std** همون crateِ **کتابخونه‌ی استاندارد** راست هست که پر از
    ساختارهای داده و تابع‌های مفید برای تعامل با سیستم‌عاملته.


    یه دایرکتوری قابل جستجو از crate هایی که توسط کامیونیتی ساخته
    شدن رو می‌تونی توی
    [https://crates.io](https://crates.io/) پیدا کنی.
- title: ارجاع به چند آیتم
  content_markdown: |
    می‌شه چند تا آیتم رو توی یه مسیر ماژول این‌طوری ارجاع داد:

    ```rust
    use std::f64::consts::{PI,TAU}
    ```

    فریس TAU نمی‌خوره، فقط PI می‌خوره.
- title: ساختن ماژول‌ها
  content_markdown: |
    وقتی به کد فکر می‌کنیم، معمولاً یه سلسله‌مراتب از فایل‌ها که توی
    دایرکتوری‌ها سازمان‌دهی شدن رو تصور می‌کنیم. راست بهت اجازه
    می‌ده ماژول‌هایی بسازی که خیلی به ساختار فایل‌هات مرتبط باشن.

    توی راست دو راه برای اعلام کردن یه ماژول وجود داره. مثلاً یه
    ماژول به اسم `foo` رو می‌شه این‌طوری نمایش داد:
      * یه فایل به اسم `foo.rs`
      * یه دایرکتوری به اسم `foo` که یه فایل `mod.rs` توشه
- title: سلسله‌مراتب ماژول
  content_markdown: >
    یه ماژول می‌تونه به یه ماژول دیگه وابسته باشه. برای برقرار کردن
    یه رابطه بین یه ماژول و زیرماژولش، باید توی ماژول والد این‌طوری
    بنویسی:


    ```rust

    mod foo;

    ```


    اعلام بالا دنبال یه فایل به اسم `foo.rs` یا `foo/mod.rs` می‌گرده
    و محتواش رو داخل یه ماژول به اسم `foo`، زیر همین scope، درج
    می‌کنه.
- title: ماژول درون‌خطی (Inline)
  content_markdown: >
    یه زیرماژول رو می‌شه مستقیماً داخل کد یه ماژول درون‌خطی
    (inline) کرد.


    یکی از رایج‌ترین استفاده‌ها از ماژول‌های inline، ساختن تست‌های
    واحد (unit test) هست. یه ماژول inline می‌سازیم که فقط وقتی راست
    برای تست استفاده می‌شه، وجود داره!


    ```

    // This macro removes this inline module when Rust

    // is not in test mode.

    #[cfg(test)]

    mod tests {
        // Notice that we don't immediately get access to the
        // parent module. We must be explicit.
        use super::*;

        ... tests go here ...
    }

    ```
- title: ارجاع داخلی ماژول‌ها
  content_markdown: >
    راست چند تا کلیدواژه داره که می‌تونی توی مسیر `use`ـت استفاده
    کنی تا سریع به ماژولی که می‌خوای برسی:


    * `crate` - ماژول ریشه‌ی crate ات

    * `super` - ماژول والد ماژول فعلیت

    * `self` - ماژول فعلی
- title: اکسپورت کردن
  content_markdown: >
    به‌طور پیش‌فرض، اعضای یه *ماژول* از بیرون ماژول قابل دسترسی
    نیستن (حتی برای ماژول‌های فرزندش هم نیستن!). با کلیدواژه‌ی
    `pub`، اعضای یه ماژول رو قابل‌دسترس می‌کنیم.


    به‌طور پیش‌فرض، اعضای یه *crate* هم بیرون از اون crate قابل
    دسترسی نیستن. با علامت‌گذاری اونا به‌عنوان `pub` توی *ماژول
    ریشه*ی crate ات (`lib.rs` یا `main.rs`)، اعضای یه crate رو
    قابل‌دسترس می‌کنیم.
- title: قابلیت دید Struct ها
  content_markdown: >
    درست مثل تابع‌ها، struct ها هم می‌تونن با `pub` مشخص کنن که چی
    رو می‌خوان بیرون از ماژولشون نمایش بدن.
  code: |
    // SeaCreature struct will be usable outside of our module
    pub struct SeaCreature {
        pub animal_type: String,
        pub name: String,
        pub arms: i32,
        pub legs: i32,
        // let's keep our weapon private
        weapon: String,
    }
- title: Prelude
  content_markdown: |
    شاید برات سؤال شده باشه که چطور همه‌جا بدون `use` برای وارد
    کردن، به `Vec` یا `Box` دسترسی داریم. دلیلش ماژول `prelude` توی
    کتابخونه‌ی استانداردـه.

    بدون که توی کتابخونه‌ی استاندارد راست، هر چیزی که توی
    `std::prelude::*` اکسپورت بشه، به‌طور خودکار توی همه‌جای راست
    در دسترسه. این برای `Vec` و `Box` صدق می‌کنه، و همین‌طور برای
    بقیه (Option، Copy، و غیره).
- title: Prelude خودت
  content_markdown: >
    به خاطر وجود prelude توی کتابخونه‌ی استاندارد، رایجه که
    کتابخونه‌ی خودت هم یه ماژول prelude داشته باشه؛ به‌عنوان یه
    نقطه‌ی شروع برای جایی که کاربرها باید رایج‌ترین ساختارهای داده
    برای استفاده از کتابخونه‌ت رو ازش وارد کنن (مثلاً `use
    my_library::prelude::*`).


    این ماژول به‌طور خودکار توی برنامه‌ها/کتابخونه‌هایی که از
    crate ات استفاده می‌کنن، استفاده نمی‌شه، ولی رعایتش یه قرارداد
    خوبه تا مردم بدونن از کجا شروع کنن.


    فریس می‌گه: «یه rustacean خوب باش و به یه خرچنگ دیگه با یه
    prelude خوب کمک کن!»
- title: فصل 9 - جمع‌بندی
  content_markdown: >
    الان چند تا ترفند توی چنته داری برای وقتی که می‌خوای برنامه‌ها و
    کتابخونه‌های راست بسازی که آماده‌ی دنیای واقعی باشن. نگران به
    خاطر سپردن همه‌ی اینا نباش. همون‌طور که کتابخونه‌ت رشد می‌کنه و
    توسط بقیه استفاده می‌شه، خودت می‌فهمی که توی هر مرحله چی بهتر
    جواب می‌ده.


    منابع:

    - [Guidelines For Writing Rust
    APIs](https://rust-lang.github.io/api-guidelines/)
