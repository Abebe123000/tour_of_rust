- title: فصل 1 - مبانی
  content_markdown: >
    توی این فصل اول، می‌ریم سراغ ابتدایی‌ترین مفاهیم راست: تابع‌ها،
    متغیرها و ساده‌ترین نوع‌های داده‌ای. خوشحالیم که همراه ما هستی!


    راستی، اگه داری فکر می‌کنی این خرچنگ بامزه که داره باهات حرف
    می‌زنه کیه، من **Ferris** هستم، ماسکوت غیررسمی زبان برنامه‌نویسی
    راست. از آشناییت خوشحالم.
- title: زمین بازی راست
  code: |
    fn main() {
        println!("Welcome to the playground! You can modify the code in here.");
    }
  content_markdown: >
    این تور از یک ابزار کدنویسی تعاملی به اسم [Rust
    Playground](https://play.rust-lang.org) استفاده می‌کنه.


    این ابزار راه خوبیه برای بازی کردن با راست و نشون دادن خلاقیت و
    چالش‌هات به بقیه!
- title: متغیرها
  code: |
    fn main() {
        // rust infers the type of x
        let x = 13;
        println!("{}", x);

        // rust can also be explicit about the type
        let x: f64 = 3.14159;
        println!("{}", x);

        // rust can also declare and initialize later, but this is rarely done
        let x;
        x = 0;
        println!("{}", x);
    }
  content_markdown: >
    متغیرها با کلیدواژه‌ی **let** تعریف می‌شن.


    وقتی داری یه مقدار به متغیر می‌دی، راست ۹۹٪ مواقع می‌تونه نوع
    متغیرت رو خودش تشخیص بده. اگه نتونه، می‌تونی نوعش رو توی تعریف
    متغیر مشخص کنی.


    توجه کن که می‌تونیم چند بار به یه اسم متغیر یکسان مقدار بدیم. به
    این کار میگن سایه‌اندازی متغیر (variable shadowing) و نوع متغیر
    می‌تونه برای ارجاع‌های بعدی به اون اسم عوض بشه.


    اسم متغیرها همیشه به شکل `snake_case` نوشته می‌شن.
- title: تغییر دادن متغیرها
  code: |
    fn main() {
        let mut x = 42;
        println!("{}", x);
        x = 13;
        println!("{}", x);
    }
  content_markdown: >
    راست خیلی به این موضوع اهمیت می‌ده که کدوم متغیرها قابل تغییرن.
    مقدارها به دو دسته تقسیم می‌شن:


    * **mutable (قابل تغییر)** - کامپایلر اجازه می‌ده که هم توی
    متغیر بنویسیم و هم ازش بخونیم.

    * **immutable (غیرقابل تغییر)** - کامپایلر فقط اجازه‌ی خوندن از
    متغیر رو می‌ده.


    مقدارهای قابل تغییر با کلیدواژه‌ی **mut** مشخص می‌شن.


    بعداً بیشتر در مورد این مفهوم صحبت می‌کنیم، ولی فعلاً فقط حواست
    به این کلیدواژه باشه.
- title: نوع‌های پایه
  code: |
    fn main() {
        let x = 12; // by default this is i32
        let a = 12u8;
        let b = 4.3; // by default this is f64
        let c = 4.3f32;
        let d = 'r'; // unicode character
        let ferris = '🦀'; // also a unicode character
        let bv = true;
        let t = (13, false);
        let sentence = "hello world!";
        println!(
            "{} {} {} {} {} {} {} {} {} {}",
            x, a, b, c, d, ferris, bv, t.0, t.1, sentence
        );
    }
  content_markdown: >
    راست انواع مختلفی از نوع‌های آشنا داره:


    * بولین (boolean) - `bool` برای نمایش درست/نادرست

    * عدد صحیح بدون علامت - `u8` `u16` `u32` `u64` `u128` برای نمایش
    عددهای صحیح نامنفی

    * عدد صحیح با علامت - `i8` `i16` `i32` `i64` `i128` برای نمایش
    عددهای صحیح

    * عدد صحیح به اندازه‌ی pointer - `usize` `isize` برای نمایش
    ایندکس‌ها و اندازه‌ی چیزها توی حافظه

    * اعشاری - `f32` `f64`

    * کاراکتر - `char` برای نمایش یک کاراکتر یونیکد

    * تاپل (tuple) - `(value, value, ...)‎` برای عبور دادن دنباله‌ای
    ثابت از مقدارها روی پشته (stack)

    * آرایه - `[value, value, ...]‎` مجموعه‌ای از عناصر مشابه با
    طول ثابتی که در زمان کامپایل مشخصه

    * اسلایس (slice) - مجموعه‌ای از عناصر مشابه با طولی که در زمان
    اجرا مشخص می‌شه

    * `str`‎ (اسلایس رشته) - متنی با طولی که در زمان اجرا مشخص می‌شه


    ممکنه متن پیچیده‌تر از چیزی باشه که توی زبان‌های دیگه بهش عادت
    داری؛ چون راست یه زبان برنامه‌نویسی سیستمی‌ـه، به مسائل حافظه‌ای
    که شاید بهشون عادت نداشته باشی اهمیت می‌ده. بعداً با جزئیات بیشتر
    بهش می‌پردازیم.


    نوع‌های عددی رو می‌شه با اضافه کردن نوع به انتهای عدد به‌صورت
    صریح مشخص کرد (مثلاً `13u32`، `2u8`).
- title: تبدیل نوع پایه
  code: |
    fn main() {
        let a = 13u8;
        let b = 7u32;
        let c = a as u32 + b;
        println!("{}", c);

        let t = true;
        println!("{}", t as u8);
    }
  content_markdown: >
    راست وقتی پای نوع‌های عددی وسط میاد، به وضوح داشتن نیاز داره.
    نمی‌شه یه `u8` رو همینطوری بدون خطا به‌جای `u32` استفاده کرد.


    خوشبختانه راست تبدیل نوع‌های عددی رو با کلیدواژه‌ی **as** خیلی
    ساده می‌کنه.
- title: ثابت‌ها
  code: |
    const PI: f32 = 3.14159;

    fn main() {
        println!(
            "To make an apple {} from scratch, you must first create a universe.",
            PI
        );
    }
  content_markdown: >
    ثابت‌ها به ما اجازه می‌دن یه مقدار مشترک رو که چندین بار توی کد
    استفاده می‌شه، به شکل کارآمدی مشخص کنیم. برخلاف متغیرها که هر بار
    مقدارشون کپی می‌شه، ثابت‌ها مستقیماً شناسه‌ی متنی رو در همون
    نقطه‌ای که استفاده می‌شن، در زمان کامپایل با مقدارشون جایگزین
    می‌کنن.


    برخلاف متغیرها، ثابت‌ها همیشه باید نوع صریح داشته باشن.


    اسم ثابت‌ها همیشه به شکل `SCREAMING_SNAKE_CASE` نوشته می‌شه.
- title: آرایه‌ها
  code: |
    fn main() {
        let nums: [i32; 3] = [1, 2, 3];
        println!("{:?}", nums);
        println!("{}", nums[1]);
    }
  content_markdown: >
    یه *آرایه* مجموعه‌ای با طول ثابت از عناصر داده‌ایه که همه از یک
    نوع هستن.


    نوع داده‌ای یه *آرایه* به شکل `[T;N]‎` نوشته می‌شه که توش T نوع
    عناصره و N طول ثابتیه که در زمان کامپایل مشخصه.


    به تک‌تک عناصر می‌شه با عملگر `[x]‎` دسترسی پیدا کرد؛ جایی که *x*
    یه ایندکس از نوع *usize* هست (که از 0 شروع می‌شه) و مربوط به
    عنصری‌ه که می‌خوای.


    مجموعه‌هایی با طول پویا، که اغلب بهشون آرایه‌ی پویا یا متغیر
    می‌گن، توی یه فصل بعدی به اسم **وکتورها (Vectors)** معرفی می‌شن.
- title: تابع‌ها
  code: |
    fn add(x: i32, y: i32) -> i32 {
        return x + y;
    }

    fn subtract(x: i32, y: i32) -> i32 {
        x - y
    }

    fn main() {
        println!("42 + 13 = {}", add(42, 13));
        println!("42 - 13 = {}", subtract(42, 13));
    }
  content_markdown: >
    یه تابع صفر یا چند پارامتر داره.


    توی این مثال، تابع *add* دو تا آرگومان از نوع `i32` می‌گیره (یه
    عدد صحیح ۳۲ بیتی با علامت).


    اگه فقط بخوای یه عبارت رو برگردونی، می‌تونی کلیدواژه‌ی `return`
    و سمی‌کالن آخرش رو حذف کنی؛ همون کاری که توی تابع *subtract*
    انجام دادیم.


    اسم تابع‌ها همیشه به شکل `snake_case` نوشته می‌شن.


    نکته: وقتی یه تابع تعریف می‌کنی، داده‌هایی که می‌گیره رو
    پارامتر (parameter) می‌گن. وقتی همون تابع رو صدا می‌زنی و بهش
    داده می‌دی، به اون داده‌ها آرگومان (argument) می‌گن.
- title: چند مقدار بازگشتی
  code: |
    fn swap(x: i32, y: i32) -> (i32, i32) {
        return (y, x);
    }

    fn main() {
        // return a tuple of return values
        let result = swap(123, 321);
        println!("{} {}", result.0, result.1);

        // destructure the tuple into two variables names
        let (a, b) = swap(result.0, result.1);
        println!("{} {}", a, b);
    }
  content_markdown: >
    تابع‌ها می‌تونن با برگردوندن یه **تاپل** چند تا مقدار رو با هم
    برگردونن.


    به عناصر تاپل می‌شه با شماره‌ی ایندکسشون ارجاع داد.


    راست از انواع مختلفی از تجزیه‌ی مقدار (destructuring) پشتیبانی
    می‌کنه که به شکل‌های مختلفی می‌بینیمشون؛ این کار بهمون اجازه
    می‌ده که زیرمجموعه‌های ساختارهای داده رو به شکل راحتی استخراج
    کنیم. حواست بهش باشه!
- title: هیچ‌چیز برنگردوندن
  content_markdown: >
    اگه برای یه تابع نوع بازگشتی مشخص نشده باشه، اون تابع یه تاپل
    خالی برمی‌گردونه که بهش *یونیت* (unit) هم می‌گن.


    تاپل خالی با `()‎` نشون داده می‌شه.


    استفاده از `()‎` زیاد رایج نیست، ولی به اندازه‌ی کافی پیش میاد که
    خوبه بدونی چه اتفاقی داره میفته.
  code: |
    fn make_nothing() -> () {
        return ();
    }

    // the return type is implied as ()
    fn make_nothing2() {
        // this function will return () if nothing is specified to return
    }

    fn main() {
        let a = make_nothing();
        let b = make_nothing2();

        // Printing a debug string for a and b
        // Because it's hard to print nothingness
        println!("The value of a: {:?}", a);
        println!("The value of b: {:?}", b);
    }
- title: فصل 1 - جمع‌بندی
  content_markdown: >
    تا اینجا کارت خوب بوده! مبانی راست که اونقدرها هم بد نیست، نه؟
    داریم یه نگاه به طرز فکر کامپایلر راست می‌ندازیم. چون راست یه
    زبان برنامه‌نویسی سیستمی‌ـه، خیلی به اندازه‌ی مقدارها توی حافظه
    اهمیت می‌ده، به اینکه چیزها قابل تغییرن یا نه، و به اینکه مطمئن
    بشه محاسباتت همون چیزیه که می‌خوای باشه. توی قسمت بعدی می‌ریم
    سراغ چند تا دوست قدیمی: تست‌های `if` و حلقه‌های `for`.


    منابع بیشتر:


    * [Youtube: Rust Cast - A deeper dive on Rust's primitive number
    types](https://www.youtube.com/watch?v=n5TRBkbystY)

    * [Website: Rust Book 2018 - A deeper description on basic data
    types](https://doc.rust-lang.org/1.30.0/book/2018-edition/ch03-02-data-types.html)

    * [Website: Rust Cheat Sheet - Data Types](https://cheats.rs/#basic-types)
