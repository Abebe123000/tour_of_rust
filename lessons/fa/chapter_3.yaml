- title: فصل 3 - ساختارهای داده‌ی پایه
  content_markdown: >
    وقتشه که از نوع‌های پایه فراتر بریم! توی این فصل به ابتدایی‌ترین
    ساختارهای داده‌ی راست نگاه می‌کنیم و دقت می‌کنیم که چطوری توی
    حافظه نمایش داده می‌شن. فکر کنم خوشت بیاد که راست چقدر کم چیزی
    رو ازت در مورد نحوه‌ی کار کردن چیزها پنهون می‌کنه.
- title: ساختارها (Structs)
  content_markdown: >
    یه `struct` مجموعه‌ای از فیلدهاست.


    یه *فیلد* به سادگی یه مقدار داده‌ایه که به یه ساختار داده مرتبطه.
    مقدارش می‌تونه یه نوع پایه باشه یا یه ساختار داده‌ی دیگه.


    تعریفش مثل یه نقشه برای کامپایلره که چطوری فیلدها رو کنار هم توی
    حافظه بچینه.
  code: |-
    struct SeaCreature {
        // String is a struct
        animal_type: String,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }
- title: صدا زدن متدها
  content_markdown: >
    برخلاف تابع‌ها، متدها تابع‌هایی هستن که به یه نوع داده‌ی خاص
    مرتبطن.


    **متدهای static** — متدهایی که به خود نوع تعلق دارن، با عملگر
    `::` صدا زده می‌شن.


    **متدهای instance** — متدهایی که به یه نمونه (instance) از یه
    نوع تعلق دارن، با عملگر `.` صدا زده می‌شن.


    توی فصل‌های بعدی بیشتر در مورد ساختن متدهای خودت صحبت می‌کنیم.
  code: |
    fn main() {
        // Using a static method to create an instance of String
        let s = String::from("Hello world!");
        // Using a method on the instance
        println!("{} is {} characters long.", s, s.len());
    }
- title: حافظه
  content_markdown: >
    برنامه‌های راست ۳ ناحیه‌ی حافظه دارن که داده توشون ذخیره می‌شه:

    * **حافظه‌ی داده (data memory)** - برای داده‌هایی با اندازه‌ی
    ثابت که **static** هستن (یعنی همیشه در طول عمر برنامه در
    دسترسن). متن توی برنامه‌ت رو در نظر بگیر (مثلاً "Hello World!"):
    بایت‌های این متن فقط از یه جا خونده می‌شن، پس می‌شه توی این
    ناحیه ذخیره‌شون کرد. کامپایلرها با این نوع داده بهینه‌سازی‌های
    زیادی انجام می‌دن و معمولاً استفاده ازشون خیلی سریع در نظر گرفته
    می‌شه، چون مکانشون مشخص و ثابته.

    * **حافظه‌ی پشته (stack memory)** - برای داده‌هایی که به‌عنوان
    متغیر داخل یه تابع تعریف می‌شن. مکان این حافظه در طول یه فراخوانی
    تابع هیچ‌وقت عوض نمی‌شه؛ به همین خاطر کامپایلرها می‌تونن کد رو
    طوری بهینه کنن که دسترسی به داده‌های پشته خیلی سریع باشه.

    * **حافظه‌ی هیپ (heap memory)** - برای داده‌هایی که وقتی برنامه
    داره اجرا می‌شه ساخته می‌شن. داده‌های این ناحیه ممکنه اضافه،
    جابه‌جا، حذف، یا تغییر اندازه داده بشن و غیره. به خاطر ماهیت
    پویاش، معمولاً استفاده ازش کندتر در نظر گرفته می‌شه، ولی
    استفاده‌های خلاقانه‌تری از حافظه رو ممکن می‌کنه. وقتی داده‌ای به
    این ناحیه اضافه بشه، بهش می‌گیم **تخصیص (allocation)**. وقتی
    داده‌ای از این ناحیه حذف بشه، بهش می‌گیم **آزادسازی
    (deallocation)**.
- title: ساختن داده توی حافظه
  content_markdown: >
    وقتی یه **struct** رو توی کدمون **نمونه‌سازی (instantiate)**
    می‌کنیم، برنامه‌مون داده‌های فیلد مرتبط رو کنار هم توی حافظه
    می‌سازه.


    نمونه‌سازی رو با مشخص کردن همه‌ی مقدارهای فیلد داخل


    `StructName { ... }‎`


    انجام می‌دیم.


    به فیلدهای struct با عملگر نقطه‌ی `.` دسترسی پیدا می‌کنیم.


    جزئیات حافظه‌ی مثالمون:

    * متن داخل گیومه‌ها داده‌ی فقط‌خواندنیه (مثلاً "Ferris")، پس توی
    *ناحیه‌ی حافظه‌ی داده* قرار می‌گیره.

    * فراخوانی تابع `String::from` یه struct از نوع `String` می‌سازه
    که کنار فیلدهای SeaCreature روی *پشته* قرار می‌گیره. یه String
    نشون‌دهنده‌ی متنیه که می‌شه تغییرش داد و این کار رو این‌طوری
    انجام می‌ده:
      1. ساختن حافظه روی *هیپ* برای متن، جایی که می‌شه اون رو تغییر داد
      2. ذخیره کردن یه ارجاع (reference) به اون مکان حافظه روی *هیپ* و ذخیره‌ی همون ارجاع توی struct از نوع `String`‎ (بیشتر در مورد این توی درس‌های بعدی)
    * در نهایت، دو تا از دوستامون *Ferris* و *Sarah* ساختارهای
    داده‌ای دارن که همیشه یه مکان ثابت توی برنامه‌مون خواهند داشت،
    پس روی *پشته* قرار می‌گیرن.
  code: |
    struct SeaCreature {
        animal_type: String,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }

    fn main() {
        // SeaCreature's data is on stack
        let ferris = SeaCreature {
            // String struct is also on stack,
            // but holds a reference to data on heap
            animal_type: String::from("crab"),
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: String::from("claw"),
        };

        let sarah = SeaCreature {
            animal_type: String::from("octopus"),
            name: String::from("Sarah"),
            arms: 8,
            legs: 0,
            weapon: String::from("brain"),
        };
        
        println!(
            "{} is a {}. They have {} arms, {} legs, and a {} weapon",
            ferris.name, ferris.animal_type, ferris.arms, ferris.legs, ferris.weapon
        );
        println!(
            "{} is a {}. They have {} arms, and {} legs. They have no weapon..",
            sarah.name, sarah.animal_type, sarah.arms, sarah.legs
        );
    }
- title: ساختارهای شبیه تاپل
  content_markdown: |
    برای مختصر بودن، می‌تونی struct هایی بسازی که مثل تاپل استفاده
    بشن.
  code: |
    struct Location(i32, i32);

    fn main() {
        // This is still a struct on a stack
        let loc = Location(42, 32);
        println!("{}, {}", loc.0, loc.1);
    }
- title: ساختارهای شبیه یونیت
  content_markdown: >
    اصلاً لازم نیست struct ها هیچ فیلدی داشته باشن.


    همون‌طور که توی فصل 1 گفته شد، یه *یونیت (unit)* یه کلمه‌ی دیگه
    برای تاپل خالی `()‎` هست. به همین خاطره که به این نوع struct
    میگن *شبیه یونیت (Unit-like)*.


    از این نوع struct خیلی کم استفاده می‌شه.
  code: |
    struct Marker;

    fn main() {
        let _m = Marker;
    }
- title: انامریشن‌ها (Enumerations)
  content_markdown: >
    انامریشن‌ها بهت اجازه می‌دن با کلیدواژه‌ی `enum`، یه نوع جدید
    بسازی که می‌تونه مقدار یکی از چند تا عنصر برچسب‌دار رو داشته
    باشه.


    `match` کمک می‌کنه که مدیریت همه‌ی مقدارهای ممکن یه enum رو
    جامع انجام بدیم و همین باعث می‌شه ابزار قدرتمندی برای تضمین
    کیفیت کد باشه.
  code: |
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Species {
        Crab,
        Octopus,
        Fish,
        Clam
    }

    struct SeaCreature {
        species: Species,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }

    fn main() {
        let ferris = SeaCreature {
            species: Species::Crab,
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: String::from("claw"),
        };

        match ferris.species {
            Species::Crab => println!("{} is a crab",ferris.name),
            Species::Octopus => println!("{} is an octopus",ferris.name),
            Species::Fish => println!("{} is a fish",ferris.name),
            Species::Clam => println!("{} is a clam",ferris.name),
        }
    }
- title: انامریشن‌ها با داده
  content_markdown: >
    عناصر `enum` می‌تونن یک یا چند نوع داده هم داشته باشن، که بهشون
    اجازه می‌ده مثل *union* توی C رفتار کنن.


    وقتی یه `enum` با `match` مچ می‌شه، می‌تونی یه اسم متغیر رو به
    هر مقدار داده مرتبط کنی.


    جزئیات حافظه‌ی `enum`:

    * مقدار داده‌ی یه enum اندازه‌ی حافظه‌ای برابر با بزرگ‌ترین
    عنصرش خواهد داشت. این باعث می‌شه همه‌ی مقدارهای ممکن توی همون
    فضای حافظه جا بشن.

    * علاوه بر نوع داده‌ی هر عنصر (اگه داشته باشه)، هر عنصر یه مقدار
    عددی هم داره که نشون می‌ده کدوم برچسب (tag) هست.


    جزئیات دیگه:

    * `enum` توی راست چیزیه که بهش *tagged union* هم می‌گن.

    * ترکیب کردن نوع‌ها برای ساختن یه نوع جدید همون چیزیه که آدم‌ها
    وقتی می‌گن راست *نوع‌های جبری (algebraic types)* داره، منظورشونه.
  code: |-
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Species { Crab, Octopus, Fish, Clam }
    enum PoisonType { Acidic, Painful, Lethal }
    enum Size { Big, Small }
    enum Weapon {
        Claw(i32, Size),
        Poison(PoisonType),
        None
    }

    struct SeaCreature {
        species: Species,
        name: String,
        arms: i32,
        legs: i32,
        weapon: Weapon,
    }

    fn main() {
        // SeaCreature's data is on stack
        let ferris = SeaCreature {
            // String struct is also on stack,
            // but holds a reference to data on heap
            species: Species::Crab,
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: Weapon::Claw(2, Size::Small),
        };

        match ferris.species {
            Species::Crab => {
                match ferris.weapon {
                    Weapon::Claw(num_claws,size) => {
                        let size_description = match size {
                            Size::Big => "big",
                            Size::Small => "small"
                        };
                        println!("ferris is a crab with {} {} claws", num_claws, size_description)
                    },
                    _ => println!("ferris is a crab with some other weapon")
                }
            },
            _ => println!("ferris is some other animal"),
        }
    }
- title: فصل 3 - جمع‌بندی
  content_markdown: >
    چه هیجان‌انگیز! الان ابتدایی‌ترین ابزارها رو برای نمایش شکل
    ایده‌هامون توی کد داریم. امیدواریم الان بشه یه پرتوی نور از این
    دید که چطوری عملیات‌های بنیادی راست به شکل هماهنگ و مختصری با
    نوع‌هاش کار می‌کنن. توی قسمت بعدی در مورد مفهومی صحبت می‌کنیم
    که به نوع‌های داده‌مون انعطاف‌پذیری بیشتری توی نمایش می‌ده:
    *جنریک‌ها (generics)*.
