- title: فصل 4 - نوع‌های جنریک
  content_markdown: >
    نوع‌های جنریک توی راست فوق‌العاده مهمن. توی نمایش مقدارهای
    nullable (یعنی متغیرهایی که هنوز شاید مقداری نداشته باشن)،
    مدیریت خطا، مجموعه‌ها، و خیلی چیزهای دیگه استفاده می‌شن! توی
    این بخش با نوع‌های جنریک بنیادی‌ای آشنا می‌شیم که احتمالاً همیشه
    ازشون استفاده می‌کنی.
- title: نوع‌های جنریک چی هستن؟
  content_markdown: >
    نوع‌های جنریک بهمون اجازه می‌دن یه `struct` یا `enum` رو به‌طور
    ناقص تعریف کنیم و به کامپایلر اجازه بدیم که در زمان کامپایل، بر
    اساس نحوه‌ی استفاده‌مون توی کد، یه نسخه‌ی کاملاً مشخص بسازه.


    راست معمولاً می‌تونه نوع نهایی رو با نگاه کردن به نحوه‌ی
    نمونه‌سازی‌مون تشخیص بده، ولی اگه کمک لازم داشته باشه، همیشه
    می‌تونی با عملگر `::<T>‎` صریح باشی؛ این عملگر با اسم `turbofish`
    هم شناخته می‌شه (اون یکی از دوستای خوب منه!).
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        item: T,
    }

    fn main() {
        // Note: by using generic types here, we create compile-time created types. 
        // Turbofish lets us be explicit.
        let i32_bag = BagOfHolding::<i32> { item: 42 };
        let bool_bag = BagOfHolding::<bool> { item: true };
        
        // Rust can infer types for generics too!
        let float_bag = BagOfHolding { item: 3.14 };
        
        // Note: never put a bag of holding in a bag of holding in real life
        let bag_in_bag = BagOfHolding {
            item: BagOfHolding { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_bag.item, bool_bag.item, float_bag.item, bag_in_bag.item.item
        );
    }
- title: نمایش هیچ‌چیز
  content_markdown: >
    توی زبان‌های دیگه، از کلیدواژه‌ی `null` برای نمایش نبود یه مقدار
    استفاده می‌شه. این کار توی زبان‌های برنامه‌نویسی مشکل ایجاد
    می‌کنه، چون این امکان رو به وجود میاره که برنامه‌مون وقتی با یه
    متغیر یا فیلد کار می‌کنه، شکست بخوره.


    راست `null` نداره، ولی از اهمیت نمایش هیچ‌چیز هم غافل نیست!
    بیا یه نمایش ساده رو با یه ابزاری که از قبل می‌شناسیم در نظر
    بگیریم.


    این الگوی ارائه‌ی یه نمایش جایگزین به اسم `None` برای یه مقدار
    دیگه یا چند تا مقدار جایگزین، توی راست خیلی رایجه؛ چون راست
    `null` نداره. نوع‌های جنریک کمک می‌کنن این چالش رو حل کنیم.
  code: |
    enum Item {
        Inventory(String),
        // None represents the absence of an item
        None,
    }

    struct BagOfHolding {
        item: Item,
    }
- title: Option
  content_markdown: >
    راست یه enum جنریک توکار به اسم `Option` داره که بهمون اجازه
    می‌ده مقدارهای nullable رو بدون استفاده از `null` نمایش بدیم.


    ```

    enum Option<T> {
        None,
        Some(T),
    }

    ```


    این enum اونقدر رایجه که می‌شه توی هر جایی، نمونه‌های این enum
    رو با انواع `Some` و `None` ساخت.
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        // Our parameter type T can be handed to others
        item: Option<T>,
    }

    fn main() {
        // Note: A bag for i32, holding nothing! We have to specify the type
        // because otherwise Rust would not know what type of bag it is.
        let i32_bag = BagOfHolding::<i32> { item: None };

        if i32_bag.item.is_none() {
            println!("there's nothing in the bag!")
        } else {
            println!("there's something in the bag!")
        }

        let i32_bag = BagOfHolding::<i32> { item: Some(42) };

        if i32_bag.item.is_some() {
            println!("there's something in the bag!")
        } else {
            println!("there's nothing in the bag!")
        }

        // match lets us deconstruct Option elegantly and ensure we handle all cases!
        match i32_bag.item {
            Some(v) => println!("found {} in bag!", v),
            None => println!("found nothing"),
        }
    }
- title: Result
  content_markdown: >
    راست یه enum جنریک توکار به اسم `Result` هم داره که بهمون اجازه
    می‌ده یه مقدار رو برگردونیم که امکان شکست خوردن داره. این روش
    idiomatic این زبان برای مدیریت خطاست.


    ```

    enum Result<T, E> {
        Ok(T),
        Err(E),
    }

    ```


    توجه کن که نوع جنریکمون چند تا *پارامتر نوع* داره که با کاما از
    هم جدا شدن.


    این enum هم اونقدر رایجه که می‌شه توی هر جایی، نمونه‌های این
    enum رو با انواع `Ok` و `Err` ساخت.
  code: |
    fn do_something_that_might_fail(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))   
        }
    }

    fn main() {
        let result = do_something_that_might_fail(12);

        // match lets us deconstruct Result elegantly and ensure we handle all cases!
        match result {
            Ok(v) => println!("found {}", v),
            Err(e) => println!("Error: {}",e),
        }
    }
- title: Main شکست‌پذیر
  content_markdown: |
    `main` این قابلیت رو داره که یه `Result` برگردونه!
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    // Main returns no value, but could return an error!
    fn main() -> Result<(), String> {
        let result = do_something_that_might_fail(12);

        match result {
            Ok(v) => println!("found {}", v),
            Err(_e) => {
                // handle this error gracefully
                
                // return a new error from main that said what happened!
                return Err(String::from("something went wrong in main!"));
            }
        }

        // Notice we use a unit value inside a Result Ok
        // to represent everything is fine
        Ok(())
    }
- title: مدیریت زیبای خطا
  content_markdown: >
    `Result` اونقدر رایجه که راست یه عملگر قدرتمند `?‎` برای کار
    باهاش داره. این دو دستور با هم برابرن:


    ```

    do_something_that_might_fail()?

    ```


    ```

    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }

    ```
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // Look at how much code we saved!
        let v = do_something_that_might_fail(42)?;
        println!("found {}", v);
        Ok(())
    }
- title: مدیریت زشت Option/Result
  content_markdown: >
    کار کردن با `Option`/`Result` وقتی که فقط می‌خوای یه کد سریع
    بنویسی می‌تونه خسته‌کننده باشه. هم `Option` و هم `Result` یه
    تابع به اسم `unwrap` دارن که برای گرفتن یه مقدار به شکل سریع و
    نه‌چندان تمیز مفیده. `unwrap`:


    1. مقدار داخل Option/Result رو می‌گیره

    2. اگه enum از نوع None/Err باشه، `panic!‎` می‌کنه


    این دو تیکه کد با هم برابرن:


    ```

    my_option.unwrap()

    ```


    ```

    match my_option {
        Some(v) => v,
        None => panic!("some error message generated by Rust!"),
    }

    ```


    به همین ترتیب:


    ```

    my_result.unwrap()

    ```


    ```

    match my_result {
        Ok(v) => v,
        Err(e) => panic!("some error message generated by Rust!"),
    }

    ```


    یه rustacean خوب باش و هر وقت که می‌تونی، درست و حسابی از
    `match` استفاده کن!
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // concise but assumptive and gets ugly fast
        let v = do_something_that_might_fail(42).unwrap();
        println!("found {}", v);
        
        // this will panic!
        let v = do_something_that_might_fail(1).unwrap();
        println!("found {}", v);
        
        Ok(())
    }
- title: وکتورها (Vectors)
  content_markdown: >
    بعضی از کاربردی‌ترین نوع‌های جنریک، نوع‌های مجموعه‌ای هستن. یه
    وکتور یه لیست با اندازه‌ی متغیره از آیتم‌ها که با struct از نوع
    `Vec` نمایش داده می‌شه.


    ماکروی `vec!‎` بهمون اجازه می‌ده به‌جای ساختن دستی یه وکتور، خیلی
    راحت یکی بسازیم.


    `Vec` متد `iter()‎` رو داره که یه iterator از یه وکتور می‌سازه و
    بهمون اجازه می‌ده به راحتی یه وکتور رو توی حلقه‌ی `for` بذاریم.


    جزئیات حافظه:

    * `Vec` یه struct هست، ولی داخلش یه ارجاع (reference) به یه
    لیست ثابت از آیتم‌هاش روی هیپ نگه می‌داره.

    * یه وکتور با یه ظرفیت پیش‌فرض شروع می‌شه؛ وقتی آیتم‌های بیشتری
    از ظرفیتش بهش اضافه بشن، داده‌هاش رو دوباره روی هیپ تخصیص می‌ده
    تا یه لیست ثابت جدید با ظرفیت بزرگ‌تر داشته باشه.
  code: |
    fn main() {
        // We can be explicit with type
        let mut i32_vec = Vec::<i32>::new(); // turbofish <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // But look how clever Rust is about determining the type automatically
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // That's a beautiful macro!
        let string_vec = vec![String::from("Hello"), String::from("World")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: فصل 4 - جمع‌بندی
  content_markdown: >
    توی یه فصل یاد گرفتیم که نوع‌های جنریک چقدر قدرت بهمون می‌دن!
    نگران نباش اگه هنوز کامل نمی‌دونی چطوری از همه چیز استفاده کنی؛
    فعلاً همین بس که با ایده‌های اصلی‌ای که بارها و بارها توی کد
    می‌بینیشون آشنا بشی. تابع‌هامون دارن نسبتاً طولانی می‌شن! توی
    فصل بعدی در مورد یه مفهوم مهم توی راست صحبت می‌کنیم: مالکیت
    داده (data ownership).
