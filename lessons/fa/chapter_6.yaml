- title: فصل 6 - متن
  content_markdown: >
    حالا که یه‌کم فهمیدیم راست چطوری به حافظه فکر می‌کنه، آماده‌ایم
    که با جزئیات بیشتری در مورد متن صحبت کنیم.


    راست خیلی به متن بین‌المللی و مسائل سطح بایت که شاید از زبان‌های
    دیگه باهاشون آشنا نباشی، اهمیت می‌ده. با این حال، راست ابزارهای
    عالی زیادی برای مدیریت این مسائل داره.
- title: رشته‌های لیترال (String Literals)
  content_markdown: >
    رشته‌های لیترال همیشه یونیکد هستن.


    نوع رشته‌های لیترال `&'static str‎` هست:


    * `&` یعنی به یه جایی توی حافظه اشاره می‌کنه، و چون `&mut`
    نداره، یعنی کامپایلر اجازه‌ی تغییرش رو نمی‌ده

    * `'static` یعنی داده‌ی رشته تا پایان برنامه‌مون در دسترس می‌مونه
    (هیچ‌وقت دراپ نمی‌شه)

    * `str` یعنی به یه دنباله از بایت اشاره می‌کنه که همیشه
    **utf-8** معتبره


    جزئیات حافظه:

    * کامپایلر راست احتمالاً رشته‌ت رو توی سگمنت داده‌ی حافظه‌ی
    برنامه‌ت قرار می‌ده
  code: |
    fn main() {
        let a: &'static str = "hi 🦀";
        println!("{} {}", a, a.len());
    }
- title: utf-8 چیه
  content_markdown: "همون‌طور که زبان‌های بیشتری روی کامپیوترها استفاده می‌شدن، دنیا نیاز داشت که کاراکترهای متنی بیشتری رو نسبت به چیزی که ASCII اجازه می‌داد نمایش بده (۱ بایت فقط اجازه‌ی ۲۵۶ کاراکتر رو می‌داد).\n\n**utf-8** با طول بایتی متغیر بین ۱ تا ۴ بایت معرفی شد و این کار بازه‌ی کاراکترهای ممکن رو خیلی زیاد کرد.\n\nیه مزیت کاراکترهای با اندازه‌ی متغیر اینه که متن برای کاراکترهای خیلی رایج ASCII بایت اضافه نداره (توی **utf-8** هم فقط ۱ بایت لازم دارن).\n\nیه عیب کاراکترهای با اندازه‌ی متغیر اینه که دیگه نمی‌شه جستجوی کاراکتر رو سریع\n(با زمان ثابت **O(1)**) و با یه ایندکس‌گذاری ساده انجام داد (مثلاً `my_text[3]` برای گرفتن کاراکتر چهارم). ممکنه\nکاراکترهای قبلی عرض متغیری داشته باشن و همین باعث بشه که کاراکتر چهارم واقعاً از کجای دنباله‌ی بایت‌ها شروع بشه، تغییر کنه.\n\nبه جاش باید روی یه دنباله‌ی بایت **utf-8** پیمایش کنیم تا بفهمیم کاراکترهای یونیکد واقعاً از کجا شروع می‌شن (با زمان خطی **O(n)**).\n\nفریس: «من بیشتر فقط خوشحالم که **utf-8** رو دارم تا بتونم ایموجی‌های دوستای زیردریاییم رو نمایش بدم.»\n\n<span class=\"emoji\">\U0001F420\U0001F419\U0001F41F\U0001F42C\U0001F40B</span>\n"
- title: کاراکترهای Escape
  content_markdown: >
    نمایش بصری بعضی از کاراکترها سخته، پس **کدهای escape** بهمون
    اجازه می‌دن یه نماد رو جای اونا بذاریم.


    راست از کدهای escape رایج زبان‌های بر پایه‌ی C پشتیبانی می‌کنه:

    * `\n` - خط جدید

    * `\r` - carriage return

    * `\t` - تب

    * `\\` - بک‌اسلش

    * `\0` - کاراکتر null

    * `\'` - تک‌کوتیشن


    لیست کامل رو
    [اینجا](https://doc.rust-lang.org/reference/tokens.html) پیدا
    می‌کنی.
  code: |
    fn main() {
        let a: &'static str = "Ferris says:\t\"hello\"";
        println!("{}",a);
    }
- title: رشته‌های لیترال چندخطی
  content_markdown: |
    رشته‌های راست به‌طور پیش‌فرض چندخطی هستن.

    اگه نمی‌خوای شکست خط داشته باشی، از یه `\` توی انتهای خط استفاده
    کن.
  code: |
    fn main() {
        let haiku: &'static str = "
            I write, erase, rewrite
            Erase again, and then
            A poppy blooms.
            - Tachibana Hokushi";
        println!("{}", haiku);
        
        
        println!("hello \
        world") // notice that the spacing before w is ignored
    }
- title: رشته‌های لیترال خام (Raw)
  content_markdown: >
    رشته‌های خام (raw strings) بهمون اجازه می‌دن یه دنباله از
    کاراکترها رو عیناً بنویسیم؛ فقط کافیه با `r#"‎` شروع کنیم و با
    `"#‎` تموم کنیم. این کار بهمون اجازه می‌ده کاراکترهایی رو وارد
    کنیم که در غیر این صورت ممکنه یه رشته‌ی معمولی رو با لیترال‌هاش
    قاطی کنن (مثل کوتیشن دوتایی و بک‌اسلش).
  code: |
    fn main() {
        let a: &'static str = r#"
            <div class="advice">
                Raw strings are useful for some situations.
            </div>
            "#;
        println!("{}", a);
    }
- title: رشته‌های لیترال از فایل‌ها
  content_markdown: >
    اگه یه متن خیلی بزرگ داری، استفاده از ماکروی `include_str!‎` رو
    برای اضافه کردن متن از فایل‌های محلی به برنامه‌ت در نظر بگیر:


    ```rust

    let hello_html = include_str!("hello.html");

    ```
- title: اسلایس رشته
  content_markdown: >
    یه اسلایس رشته یه رفرنس به یه دنباله از بایت‌ها توی حافظه‌ست که
    همیشه باید utf-8 معتبر باشه.


    یه اسلایس (یه ساب‌اسلایس) از یه اسلایس `str` هم باید utf-8
    معتبر باشه.


    متدهای رایج `&str`:

    * `len` طول رشته‌ی لیترال رو بر حسب بایت برمی‌گردونه (نه تعداد
    کاراکتر).

    * `starts_with`‎/`ends_with`‎ برای تست‌های ساده.

    * `is_empty` اگه طول صفر باشه، true برمی‌گردونه.

    * `find` یه `Option<usize>‎` از اولین موقعیت یه متن رو برمی‌گردونه.
  code: |
    fn main() {
        let a = "hi 🦀";
        println!("{}", a.len());
        let first_word = &a[0..2];
        let second_word = &a[3..7];
        // let half_crab = &a[3..5]; FAILS
        // Rust does not accept slices of invalid unicode characters
        println!("{} {}", first_word, second_word);
    }
- title: کاراکترها (Chars)
  content_markdown: >
    با توجه به سختی کار کردن با یونیکد، راست یه راهی به ما می‌ده که
    یه دنباله از بایت‌های utf-8 رو به شکل یه وکتور از کاراکترهای نوع
    `char` بگیریم.


    یه `char` همیشه ۴ بایت طول داره (که جستجوی کارآمد کاراکترهای
    منفرد رو ممکن می‌کنه).
  code: |
    fn main() {
        // collect the characters as a vector of char
        let chars = "hi 🦀".chars().collect::<Vec<char>>();
        println!("{}", chars.len()); // should be 4
        // since chars are 4 bytes we can convert to u32
        println!("{}", chars[3] as u32);
    }
- title: String
  content_markdown: >
    یه **String** یه struct هست که مالک یه دنباله از بایت‌های
    utf-8 روی حافظه‌ی هیپه.


    چون حافظه‌ش روی هیپه، می‌شه اون رو گسترش داد، تغییرش داد، و غیره؛
    کارهایی که با رشته‌های لیترال نمی‌شه انجام داد.


    متدهای رایج:


    * `push_str` برای اضافه کردن بایت‌های utf-8 بیشتر به انتهای یه
    رشته.

    * `replace` برای جایگزین کردن دنباله‌های بایت utf-8 با دنباله‌ی
    دیگه.

    * `to_lowercase`‎/`to_uppercase`‎ برای تغییر حروف بزرگ/کوچک.

    * `trim` برای حذف فاصله‌های اضافه.


    وقتی یه String دراپ می‌شه، حافظه‌ی هیپش هم دراپ می‌شه.


    `String` یه عملگر `+‎` داره که رشته رو با یه `&str‎` گسترش می‌ده
    و خودش رو برمی‌گردونه، ولی شاید به اندازه‌ای که امیدواری، ارگونومیک
    نباشه.
  code: |
    fn main() {
        let mut helloworld = String::from("hello");
        helloworld.push_str(" world");
        helloworld = helloworld + "!";
        println!("{}", helloworld);
    }
- title: متن به‌عنوان پارامتر تابع
  content_markdown: >
    رشته‌های لیترال و String ها معمولاً به‌عنوان یه اسلایس رشته به
    تابع‌ها پاس داده می‌شن. این کار توی بیشتر سناریوهایی که واقعاً
    لازم نیست مالکیت رو منتقل کنی، انعطاف‌پذیری زیادی می‌ده.
  code: |
    fn say_it_loud(msg:&str){
        println!("{}!!!",msg.to_string().to_uppercase());
    }

    fn main() {
        // say_it_loud can borrow &'static str as a &str
        say_it_loud("hello");
        // say_it_loud can also borrow String as a &str
        say_it_loud(&String::from("goodbye"));
    }
- title: ساختن رشته‌ها
  content_markdown: |
    `concat` و `join` دو تا راه ساده ولی قدرتمند برای ساختن رشته‌ها
    هستن.
  code: |
    fn main() {
        let helloworld = ["hello", " ", "world", "!"].concat();
        let abc = ["a", "b", "c"].join(",");
        println!("{}", helloworld);
        println!("{}",abc);
    }
- title: قالب‌بندی رشته‌ها
  content_markdown: >
    ماکروی `format!‎` بهمون اجازه می‌ده با تعریف یه رشته‌ی
    پارامتری‌شده با جای‌نگه‌دارهایی که مشخص می‌کنن مقدارها کجا و
    چطوری باید قرار بگیرن (مثلاً `{}‎`)، یه رشته بسازیم.


    `format!‎` از همون رشته‌های پارامتری‌شده‌ای استفاده می‌کنه که
    `println!‎` استفاده می‌کنه.


    قابلیت‌های این تابع خیلی گسترده‌تر از حوصله‌ی *تور راست* هستن؛
    برای اطلاعات بیشتر
    [مستندات](https://doc.rust-lang.org/std/fmt/) رو ببین.
  code: |
    fn main() {
        let a = 42;
        let f = format!("secret to life: {}",a);
        println!("{}",f);
    }
- title: تبدیل رشته‌ها
  content_markdown: |
    خیلی از نوع‌ها رو می‌شه با `to_string` به یه رشته تبدیل کرد.

    از تابع جنریک `parse` می‌شه برای تبدیل رشته‌ها یا رشته‌های لیترال
    به یه مقدار تایپ‌شده استفاده کرد. این تابع یه `Result` برمی‌گردونه،
    چون ممکنه شکست بخوره.
  code: |
    fn main() -> Result<(), std::num::ParseIntError> {
        let a = 42;
        let a_string = a.to_string();
        let b = a_string.parse::<i32>()?;
        println!("{} {}", a, b);
        Ok(())
    }
- title: فصل 6 - جمع‌بندی
  content_markdown: >
    حالا مبانی متن رو می‌دونی! همون‌طور که دیدی، یونیکد کار کردن با
    متن رو یه‌کم سخت‌تر می‌کنه، ولی کتابخونه‌ی استاندارد قابلیت‌های
    زیادی داره که مدیریتش رو راحت می‌کنه.


    تا الان بیشتر راست رو از دید یه پارادایم رویه‌ای (procedural)
    نگاه کردیم (یعنی فقط تابع‌ها و داده‌ها)، ولی وقتشه که در مورد
    trait ها و قابلیت‌هایی صحبت کنیم که پارادایم شیءگرای راست بازشون
    می‌کنه.
