- title: فصل 2 - جریان کنترل پایه
  content_markdown: >
    توی این فصل بیا در مورد روش‌های پایه‌ی جریان کنترل (control flow)
    توی راست حرف بزنیم.


    اگه با زبان‌های بر پایه‌ی C آشنا باشی، حس خونه رو می‌گیری و شاید
    یکی دو تا سورپرایز هم در انتظارت باشه.
- title: if/else
  content_markdown: >
    شاخه‌بندی کد (code branching) توی راست غافلگیرکننده نیست.


    شرط‌ها پرانتز ندارن! اصلاً بهشون نیاز داشتیم؟ الان منطقمون خیلی
    تمیز و مرتب به نظر می‌رسه.


    همه‌ی عملگرهای رابطه‌ای و منطقی معمولی هنوز کار می‌کنن: `==`،
    `!=`، `<`، `>`، `<=`، `>=`، `!`، `||`، `&&`.
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("less than 42");
        } else if x == 42 {
            println!("is 42");
        } else {
            println!("greater than 42");
        }
    }
- title: loop
  content_markdown: |
    یه حلقه‌ی بی‌نهایت لازم داری؟

    راست کارش رو راحت می‌کنه.

    `break` وقتی آماده باشی، از حلقه خارجت می‌کنه.

    `loop` یه رازی داره که بزودی در موردش صحبت می‌کنیم.
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    با `while` می‌تونی خیلی راحت یه شرط به یه حلقه اضافه کنی.

    اگه شرط به `false` برسه، حلقه تموم می‌شه.
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
        println!("x is {}", x);
    }
- title: for
  content_markdown: >
    حلقه‌ی `for` توی راست یه ارتقای قدرتمنده. این حلقه روی مقدارهای
    هر عبارتی که به یه iterator تبدیل می‌شه، پیمایش می‌کنه. iterator
    چیه؟ یه iterator یه شیه که می‌شه ازش پرسید "آیتم بعدیت چیه؟" تا
    وقتی که دیگه آیتمی نمونده باشه.


    توی یه فصل بعدی بیشتر در موردش صحبت می‌کنیم. فعلاً همین بس که
    بدونی راست کار ساختن iterator هایی که یه دنباله از اعداد صحیح
    تولید می‌کنن رو راحت کرده.


    عملگر `..` یه iterator می‌سازه که از یه عدد شروع، اعداد رو تا
    قبل از یه عدد پایانی تولید می‌کنه (بدون خود عدد پایانی).


    عملگر `..=` یه iterator می‌سازه که از یه عدد شروع، اعداد رو تا
    عدد پایانی تولید می‌کنه (این بار شامل خود عدد پایانی هم می‌شه).
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: >
    دلت برای switch statement تنگ شده؟ راست یه کلیدواژه‌ی خیلی
    کاربردی داره برای مچ کردن همه‌ی حالت‌های ممکن یه مقدار و اجرای
    یه مسیر کد در صورتی که مچ درست باشه. بیا ببینیم این برای اعداد
    چطوری کار می‌کنه. توی فصل‌های بعدی بیشتر در مورد pattern matching
    داده‌های پیچیده‌تر صحبت می‌کنیم؛ قول می‌دم ارزش صبر کردن رو
    داره.


    `match` جامعه، یعنی همه‌ی حالت‌ها باید مدیریت بشن.


    مچ کردن به همراه destructuring یکی از رایج‌ترین الگوهاییه که توی
    کل راست می‌بینی.
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // we can match against multiple values
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // we can match against ranges
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // we can bind the matched number to a variable
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // this is the default match that must exist if not all cases are handled
            _ => {
                println!("found something else!");
            }
        }
    }
- title: برگردوندن مقدار از loop
  content_markdown: |
    `loop` می‌تونه با break یه مقدار برگردونه.
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "found the 13";
            }
        };
        println!("from loop: {}", v);
    }
- title: برگردوندن مقدار از عبارت‌های بلوکی
  content_markdown: >
    `if`، `match`، تابع‌ها، و بلوک‌های scope، همشون یه روش خاص برای
    برگردوندن مقدار توی راست دارن.


    اگه آخرین دستور توی یه بلوک `if`، `match`، تابع، یا بلوک scope،
    یه عبارت بدون `;‎` باشه، راست اون رو به‌عنوان مقدار اون بلوک
    برمی‌گردونه. این روش خیلی خوبیه برای ساختن منطق مختصری که یه
    مقدار برمی‌گردونه و می‌شه اون رو توی یه متغیر جدید ریخت.


    توجه کن که این کار همچنین اجازه می‌ده یه دستور `if` مثل یه
    عبارت شرطی سه‌گانه‌ی (ternary) مختصر عمل کنه.
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust's ternary expression
        let v = if x < 42 { -1 } else { 1 };
        println!("from if: {}", v);

        let food = "hamburger";
        let result = match food {
            "hotdog" => "is hotdog",
            // notice the braces are optional when its just a single return expression
            _ => "is not hotdog",
        };
        println!("identifying food: {}", result);

        let v = {
            // This scope block lets us get a result without polluting function scope
            let a = 1;
            let b = 2;
            a + b
        };
        println!("from block: {}", v);

        // The idiomatic way to return a value in rust from a function at the end
        v + 4
    }

    fn main() {
        println!("from function: {}", example());
    }
- title: فصل 2 - جمع‌بندی
  content_markdown: >
    امیدوارم تونسته باشم یه نمایی از قدرت راست رو نشونت بدم؛ حتی توی
    ابتدایی‌ترین ویژگی‌های زبان. در مورد `for` و `match` بیشتر و
    عمیق‌تر صحبت می‌کنیم، همون‌طور که دانشمون برای استفاده از
    قابلیت‌هاشون بیشتر می‌شه. دفعه‌ی بعد می‌ریم سراغ ساختارهای داده‌ی
    پایه‌ی راست.
