- title: فصل 5 - مالکیت و قرض گرفتن داده
  content_markdown: >
    راست در مقایسه با بقیه‌ی زبان‌های برنامه‌نویسی، یه پارادایم
    منحصربه‌فرد برای مدیریت حافظه داره. می‌ریم سراغ رفتارها و
    اعتبارسنجی‌های کامپایلر یکی‌یکی، تا زیاد سنگین نباشه. مهمه که
    یادت باشه، در نهایت قوانینی که نشونت می‌دیم برای سخت کردن زندگیت
    نیستن، بلکه برای این هستن که کمکت کنن کدت کمتر مستعد خطا باشه!
- title: مالکیت (Ownership)
  content_markdown: >
    نمونه‌سازی یه نوع و **بایند کردنش** به یه اسم متغیر، یه منبع
    حافظه می‌سازه که کامپایلر راست در طول کل **طول عمرش (lifetime)**
    اعتبارسنجیش می‌کنه. متغیر بایند شده رو **مالک (owner)** اون منبع
    می‌گن.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        // We instantiate structs and bind to variables
        // to create memory resources
        let foo = Foo { x: 42 };
        // foo is the owner
    }
- title: مدیریت منابع بر اساس Scope
  content_markdown: |
    راست از پایان یه scope به‌عنوان جایی برای واسازی (deconstruct)
    و آزادسازی یه منبع استفاده می‌کنه.

    به این واسازی و آزادسازی، **drop** می‌گن.

    جزئیات حافظه:
    * راست garbage collection نداره.
    * توی ++C به این کار Resource Acquisition Is Initialization (RAII) هم می‌گن.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 13 };

        println!("{}", foo_a.x);

        println!("{}", foo_b.x);
        // foo_b is dropped here 
        // foo_a is dropped here
    }
- title: دراپ شدن سلسله‌مراتبیه
  content_markdown: >
    وقتی یه struct دراپ می‌شه، اول خود struct دراپ می‌شه، بعدش
    فرزندهاش تک‌تک دراپ می‌شن، و همین‌طور ادامه پیدا می‌کنه.


    جزئیات حافظه:

    * با آزاد کردن خودکار حافظه، راست کمک می‌کنه که نشتی حافظه
    کمتری داشته باشیم.

    * یه منبع حافظه فقط یه بار می‌تونه دراپ بشه.
  code: |
    struct Bar {
        x: i32,
    }

    struct Foo {
        bar: Bar,
    }

    fn main() {
        let foo = Foo { bar: Bar { x: 42 } };
        println!("{}", foo.bar.x);
        // foo is dropped first
        // then foo.bar is dropped
    }
- title: جابه‌جا کردن مالکیت
  content_markdown: >
    وقتی یه مالک به‌عنوان آرگومان به یه تابع پاس داده می‌شه، مالکیت
    به پارامتر اون تابع منتقل می‌شه.


    بعد از یه **move (جابه‌جایی)**، دیگه نمی‌شه از متغیر توی تابع
    اصلی استفاده کرد.


    جزئیات حافظه:

    * توی یه **move**، حافظه‌ی پشته‌ی مقدار مالک، توی حافظه‌ی پشته‌ی
    پارامترِ فراخوانی تابع کپی می‌شه.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let foo = Foo { x: 42 };
        // foo is moved to do_something
        do_something(foo);
        // foo can no longer be used
    }
- title: برگردوندن مالکیت
  content_markdown: |
    مالکیت رو هم می‌شه از یه تابع برگردوند.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something() -> Foo {
        Foo { x: 42 }
        // ownership is moved out
    }

    fn main() {
        let foo = do_something();
        // foo becomes the owner
        // foo is dropped because of end of function scope
    }
- title: قرض گرفتن مالکیت با رفرنس‌ها
  content_markdown: |
    رفرنس‌ها بهمون اجازه می‌دن با عملگر `&` دسترسی به یه منبع رو
    قرض بگیریم.

    رفرنس‌ها هم مثل بقیه‌ی منابع دراپ می‌شن.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo = Foo { x: 42 };
        let f = &foo;
        println!("{}", f.x);
        // f is dropped here
        // foo is dropped here
    }
- title: قرض گرفتن مالکیت قابل تغییر با رفرنس‌ها
  content_markdown: >
    می‌تونیم با عملگر `&mut` دسترسی قابل تغییر (mutable) به یه منبع
    رو هم قرض بگیریم.


    مالک یه منبع، تا وقتی که به‌شکل mutable قرض داده شده، نه می‌شه
    جابه‌جاش کرد و نه می‌شه تغییرش داد.


    جزئیات حافظه:

    * راست جلوی این رو می‌گیره که دو تا راه برای تغییر یه مقدار
    مالکیت‌دار وجود داشته باشه، چون این کار امکان data race رو به
    وجود میاره.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let f = &mut foo;

        // FAILURE: do_something(foo) would fail because
        // foo cannot be moved while mutably borrowed

        // FAILURE: foo.x = 13; would fail here because
        // foo is not modifiable while mutably borrowed

        f.x = 13;
        // f is dropped here because it's no longer used after this point
        
        println!("{}", foo.x);
        
        // this works now because all mutable references were dropped
        foo.x = 7;
        
        // move foo's ownership to a function
        do_something(foo);
    }
- title: دیرفرنس کردن (Dereferencing)
  content_markdown: >
    با استفاده از رفرنس‌های `&mut`، می‌تونی با عملگر `*` مقدار مالک
    رو تنظیم کنی.


    همچنین می‌تونی با عملگر `*` یه کپی از یه مقدار مالکیت‌دار بگیری
    (اگه مقدار قابل کپی باشه - در مورد نوع‌های قابل کپی توی فصل‌های
    بعدی صحبت می‌کنیم).
  code: |
    fn main() {
        let mut foo = 42;
        let f = &mut foo;
        let bar = *f; // get a copy of the owner's value
        *f = 13;      // set the reference's owner's value
        println!("{}", bar);
        println!("{}", foo);
    }
- title: کار کردن با داده‌ی قرض‌گرفته‌شده
  content_markdown: >
    شاید بشه قوانین راست برای رفرنس‌ها رو این‌طوری خلاصه کرد:


    * راست فقط اجازه می‌ده یا یه رفرنس mutable داشته باشیم **یا** چند
    تا رفرنس non-mutable، **ولی نه هر دو با هم**.

    * یه رفرنس هیچ‌وقت نباید از مالکش **عمر بیشتری داشته باشه**.


    این معمولاً وقتی که رفرنس‌ها رو به تابع‌ها پاس می‌دیم، مشکلی
    ایجاد نمی‌کنه.


    جزئیات حافظه:

    * قانون اول رفرنس‌ها جلوی data race رو می‌گیره. data race چیه؟
    وقتی که خوندن از داده امکان داره خارج از سینک باشه، چون یه
    نویسنده هم‌زمان روی همون داده داره می‌نویسه، یه data race اتفاق
    میفته. این توی برنامه‌نویسی چندنخی (multi-threaded) خیلی پیش
    میاد.

    * قانون دوم رفرنس‌ها جلوی سوءاستفاده از رفرنس‌هایی رو می‌گیره
    که به داده‌ای اشاره می‌کنن که دیگه وجود نداره (توی C بهشون
    dangling pointer می‌گن).
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: &mut Foo) {
        f.x += 1;
        // mutable reference f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        do_something(&mut foo);
        // because all mutable references are dropped within
        // the function do_something, we can create another.
        do_something(&mut foo);
        // foo is dropped here
    }
- title: رفرنس‌های رفرنس‌ها
  content_markdown: |
    حتی می‌شه از رفرنس‌ها روی بخش‌هایی از رفرنس‌های دیگه هم استفاده
    کرد.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(a: &Foo) -> &i32 {
        return &a.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here allow us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: طول عمرهای صریح
  content_markdown: >
    با اینکه راست همیشه توی کد نشونش نمی‌ده، کامپایلر طول عمر
    (lifetime) هر متغیر رو می‌فهمه و سعی می‌کنه مطمئن بشه که یه
    رفرنس هیچ‌وقت از مالکش عمر بیشتری نداره.


    تابع‌ها می‌تونن با پارامتری کردن امضای تابع با نمادهایی که کمک
    می‌کنن مشخص بشه کدوم پارامترها و مقدارهای بازگشتی طول عمر
    یکسانی دارن، صریح بشن.


    مشخص‌کننده‌های طول عمر همیشه با `'` شروع می‌شن (مثلاً `'a`، `'b`،
    `'c`)
  code: |
    struct Foo {
        x: i32,
    }

    // the parameter foo and return value share the same lifetime
    fn do_something<'a>(foo: &'a Foo) -> &'a i32 {
        return &foo.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here, allowing us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: طول عمرهای چندگانه
  content_markdown: >
    مشخص‌کننده‌های طول عمر بهمون اجازه می‌دن توی بعضی سناریوها که
    کامپایلر خودش نمی‌تونه حلشون کنه، با متمایز کردن طول عمر همه‌ی
    اجزای امضای یه تابع، صریح باشیم.
  code: |
    struct Foo {
        x: i32,
    }

    // foo_b and the return value share the same lifetime
    // foo_a has an unrelated lifetime
    fn do_something<'a, 'b>(foo_a: &'a Foo, foo_b: &'b Foo) -> &'b i32 {
        println!("{}", foo_a.x);
        println!("{}", foo_b.x);
        return &foo_b.x;
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 12 };
        let x = do_something(&foo_a, &foo_b);
        // foo_a is dropped here because only foo_b's lifetime exist beyond here
        println!("{}", x);
        // x is dropped here
        // foo_b is dropped here
    }
- title: طول عمرهای Static
  content_markdown: >
    یه متغیر **static** یه منبع حافظه‌ست که در زمان کامپایل ساخته
    می‌شه و از شروع تا پایان یه برنامه وجود داره. نوعشون باید صریح
    مشخص بشه.


    یه **طول عمر static** یه منبع حافظه‌ست که تا پایان یه برنامه به
    شکل نامحدود باقی می‌مونه. توجه کن که طبق این تعریف، بعضی از
    منابع با طول عمر static می‌تونن در زمان اجرا هم ساخته بشن.


    منابعی که طول عمر static دارن، یه مشخص‌کننده‌ی طول عمر خاص به
    اسم `'static` دارن.


    منابع `'static` هیچ‌وقت **دراپ** نمی‌شن.


    اگه منابع با طول عمر static شامل رفرنس باشن، همه‌شون باید
    `'static` باشن (هر چیز کمتر از این، به‌اندازه‌ی کافی عمر
    نمی‌کنه).


    جزئیات حافظه:


    * تغییر دادن متغیرهای static ذاتاً خطرناکه، چون این متغیرها
    به‌شکل سراسری برای همه قابل خوندنن و همین امکان یه data race رو
    به وجود میاره. بعداً در مورد چالش‌های داده‌ی سراسری صحبت
    می‌کنیم.
    * راست اجازه می‌ده از بلوک‌های `unsafe { ... }‎` برای انجام بعضی
    عملیات‌هایی استفاده کنیم که کامپایلر نمی‌تونه در موردشون تضمین
    حافظه‌ای بده. نباید سرسری در مورد [<span
    style="color:red; font-weight:
    bold;">R̸͉̟͈͔̄͛̾̇͜U̶͓͖͋̅Ṡ̴͉͇̃̉̀T̵̻̻͔̟͉́͆Ơ̷̥̟̳̓͝N̶̨̼̹̲͛Ö̵̝͉̖̏̾̔M̶̡̠̺̠̐͜Î̷̛͓̣̃̐̏C̸̥̤̭̏͛̎͜O̶̧͚͖͔̊͗̇͠N̸͇̰̏̏̽̃</span>](https://doc.rust-lang.org/nomicon/)
    حرف زد.
  code: |
    static PI: f64 = 3.1415;

    fn main() {
        // static variables can also be scoped to a function
        static mut SECRET: &'static str = "swordfish";

        // string literals have a 'static lifetime
        let msg: &'static str = "Hello World!";
        let p: &'static f64 = &PI;
        println!("{} {}", msg, p);

        // You can break some rules, but you must be explicit
        unsafe {
            // we can set SECRET to a string literal because it is also `static
            SECRET = "abracadabra";
            println!("{}", SECRET);
        }
    }
- title: طول عمر توی نوع‌های داده
  content_markdown: >
    شبیه تابع‌ها، نوع‌های داده هم می‌تونن با مشخص‌کننده‌های طول عمر
    اعضاشون پارامتری بشن.


    راست اعتبارسنجی می‌کنه که ساختار داده‌ای که رفرنس‌ها رو نگه
    می‌داره، هیچ‌وقت از مالک‌هایی که رفرنس‌هاش بهشون اشاره می‌کنن،
    عمر بیشتری نداشته باشه.


    نمی‌تونیم struct هایی داشته باشیم که با رفرنس‌هایی که به هیچ‌جا
    اشاره می‌کنن، دور و بر بچرخن!
  code: |
    struct Foo<'a> {
        i:&'a i32
    }

    fn main() {
        let x = 42;
        let foo = Foo {
            i: &x
        };
        println!("{}",foo.i);
    }
- title: فصل 5 - جمع‌بندی
  content_markdown: >
    وای، تبریک می‌گم که تا اینجا اومدی! می‌دونم که اطلاعات زیادیه که
    باید هضمشون کنی، ولی داری خوب پیش می‌ری تا یه Rustacean بشی.
    امیدواریم روشن شده باشه که راست به‌عنوان یه زبان چطوری سعی
    می‌کنه خیلی از این چالش‌های رایج توی برنامه‌نویسی سیستمی رو حل
    کنه:


    * تغییر ناخواسته‌ی منابع

    * فراموش کردن واسازی منابع

    * منابعی که تصادفاً دو بار واسازی می‌شن

    * استفاده از منابع بعد از اینکه واسازی شدن

    * data race هایی که به خاطر نوشتن روی منابع در حالی که بقیه دارن
    ازشون می‌خونن، اتفاق میفتن

    * دیدن واضح بخش‌هایی از کد که کامپایلر نمی‌تونه در موردشون تضمین
    بده


    توی فصل بعدی بخشی از این دونسته‌ها رو به کار می‌گیریم و می‌بینیم
    که راست چطوری با متن سر و کار داره.
