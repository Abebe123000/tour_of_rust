- title: 第 4 章 - ジェネリック型
  content_markdown: |
    ジェネリック型は Rust において非常に重要です。
    これらの型は null 許容な値（つまりまだ値を持たない変数）の表現、エラー処理、コレクションなどに使用されます。
    このセクションでは、あなたがいつも使用するであろう基本的なジェネリック型について学習します。
- title: ジェネリック型とは？
  content_markdown: |
    ジェネリック型は `struct` や `enum` を部分的に定義することを可能にします。
    コンパイル時にコードでの使用状況に基づいて完全に定義されたバージョンが生成されます。

    Rust は通常、インスタンスを生成するコードから最終的な型を推論できます。
    しかし補助が必要な場合は、`::<T>` 演算子を使って明示的に指定できます。
    この演算子は `turbofish` という名前でも知られています（彼とは仲良しです！）。
  code: |
    // 部分的に定義された構造体型
    struct BagOfHolding<T> {
        item: T,
    }

    fn main() {
        // 注意: ジェネリック型を使用すると、型はコンパイル時に作成される。
        // ::<> (turbofish) で明示的に型を指定
        let i32_bag = BagOfHolding::<i32> { item: 42 };
        let bool_bag = BagOfHolding::<bool> { item: true };
        
        // ジェネリック型でも型推論可能
        let float_bag = BagOfHolding { item: 3.14 };
        
        // 注意: 実生活では手提げ袋を手提げ袋に入れないように
        let bag_in_bag = BagOfHolding {
            item: BagOfHolding { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_bag.item, bool_bag.item, float_bag.item, bag_in_bag.item.item
        );
    }
- title: 値がないことの表現
  content_markdown: |
    他の言語では、値が存在しないことを表すためにキーワード `null` が用いられます。
    これは変数やフィールドの操作に失敗する可能性があることを意味するため、プログラミング言語に困難をもたらします。

    Rust には `null` はありませんが、値がないことを表現することの重要性を無視しているわけではありません。
    既に知っているツールを使った素朴な表現を考えてみましょう。

    1つ以上の値を `None` によって代替するパターンは、`null` がない Rust ではとても一般的です。
    ジェネリック型はこの問題を解決するのに役立ちます。
  code: |
    enum Item {
        Inventory(String),
        // None は項目がないことを表す
        None,
    }

    struct BagOfHolding {
        item: Item,
    }
- title: Option
  content_markdown: |
    Rust には `Option` と呼ばれるジェネリックな列挙型が組み込まれており、`null` を使わずに null 許容な値を表現できます。

    ```
    enum Option<T> {
        None,
        Some(T),
    }
    ```

    この列挙型はとても一般的なもので、`Some` と `None` を使えばどこでもインスタンスを生成できます。
  code: |
    // 部分的に定義された構造体型
    struct BagOfHolding<T> {
        // パラメータ T を渡すことが可能
        item: Option<T>,
    }

    fn main() {
        // 注意: i32 が入るバッグに、何も入っていません！
        // None からは型が決められないため、型を指定する必要があります。
        let i32_bag = BagOfHolding::<i32> { item: None };

        if i32_bag.item.is_none() {
            println!("バッグには何もない！")
        } else {
            println!("バッグには何かある！")
        }

        let i32_bag = BagOfHolding::<i32> { item: Some(42) };

        if i32_bag.item.is_some() {
            println!("バッグには何かある！")
        } else {
            println!("バッグには何もない！")
        }

        // match は Option をエレガントに分解して、
        // すべてのケースが処理されることを保証できます！
        match i32_bag.item {
            Some(v) => println!("バッグに {} を発見！", v),
            None => println!("何も見付からなかった"),
        }
    }
- title: Result
  content_markdown: |
    Rust には `Result` と呼ばれるジェネリックな列挙型が組み込まれており、失敗する可能性のある値を返せます。
    これは言語がエラーを処理する際の慣用的な方法です。

    ```
    enum Result<T, E> {
        Ok(T),
        Err(E),
    }
    ```

    このジェネリック型はカンマで区切られた複数の*パラメータ化された型*を持つことに注意してください。

    この列挙型はとても一般的なもので、`Ok` と `Err` を使えばどこでもインスタンスを生成できます。
  code: |
    fn do_something_that_might_fail(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("正しい値ではありません"))
        }
    }

    fn main() {
        let result = do_something_that_might_fail(12);

        // match は Result をエレガントに分解して、
        // すべてのケースが処理されることを保証できます！
        match result {
            Ok(v) => println!("発見 {}", v),
            Err(e) => println!("Error: {}",e),
        }
    }
- title: 失敗するかもしれない main
  content_markdown: |
    `main` は `Result` を返すことができます。
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("正しい値ではありません"))
        }
    }

    // main は値を返しませんが、エラーを返すことがあります！
    fn main() -> Result<(), String> {
        let result = do_something_that_might_fail(12);

        match result {
            Ok(v) => println!("発見 {}", v),
            Err(_e) => {
                // エラーをうまく処理
                
                // 何が起きたのかを説明する新しい Err を main から返します！
                return Err(String::from("main で何か問題が起きました！"));
            }
        }

        // Result の Ok の中にある unit 値によって、
        // すべてが正常であることを表現していることに注意してください。
        Ok(())
    }
- title: 簡潔なエラー処理
  content_markdown: |
    `Result` はとてもよく使うので、Rust にはそれを扱うための強力な演算子 `?` が用意されています。
    以下の2つのコードは等価です。

    ```
    do_something_that_might_fail()?
    ```

    ```
    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }
    ```
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("正しい値ではありません"))
        }
    }

    fn main() -> Result<(), String> {
        // コードが簡潔なのに注目！
        let v = do_something_that_might_fail(42)?;
        println!("発見 {}", v);
        Ok(())
    }
- title: やっつけな Option/Result 処理
  content_markdown: |
    `Option`/`Result` を使って作業するのは、ちょっとしたコードを書くのには厄介です。
    `Option` と `Result` の両方には `unwrap` と呼ばれる関数があり、手っ取り早く値を取得するのには便利です。
    `unwrap` は以下のことを行います。
     
    1. `Option`/`Result` 内の値を取得します。
    2. 列挙型が `None`/`Err` の場合、`panic!` します。

    以下の2つのコードは等価です。

    ```
    my_option.unwrap()
    ```

    ```
    match my_option {
        Some(v) => v,
        None => panic!("Rust によって生成されたエラーメッセージ！"),
    }
    ```

    同様に:

    ```
    my_result.unwrap()
    ```

    ```
    match my_result {
        Ok(v) => v,
        Err(e) => panic!("Rust によって生成されたエラーメッセージ！"),
    }
    ```

    良い Rust 使い（Rustacean）であるためには、可能な限り適切に `match` を使用してください。
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("正しい値ではありません"))
        }
    }

    fn main() -> Result<(), String> {
        // 簡潔ですが、値が存在することを仮定しており、
        // すぐにダメになる可能性があります。
        let v = do_something_that_might_fail(42).unwrap();
        println!("発見 {}", v);
        
        // パニックするでしょう！
        let v = do_something_that_might_fail(1).unwrap();
        println!("発見 {}", v);
        
        Ok(())
    }
- title: ベクタ型
  content_markdown: |
    最も有用なジェネリック型のいくつかはコレクション型です。
    ベクタは構造体 `Vec` で表される可変サイズのリストです。

    マクロ `vec!` を使えば、手動で構築するよりも簡単にベクタを生成できます。

    `Vec` にはメソッド `iter()` があります。
    これによってベクタからイテレータを生成すれば、ベクタを簡単に `for` ループに入れることができます。

    メモリに関する詳細：

    * `Vec` は構造体ですが、内部的にはヒープ上の固定リストへの参照を含んでいます。
    * ベクタはデフォルトの容量で始まります。
      容量よりも多くの項目が追加された場合、ヒープ上により大きな容量の固定リストを生成して、データを再割り当てします。
  code: |
    fn main() {
        // 型を明示的に指定
        let mut i32_vec = Vec::<i32>::new(); // ターボフィッシュ <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // もっと賢く、型を自動的に推論
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // きれいなマクロ！
        let string_vec = vec![String::from("Hello"), String::from("World")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: 第 4 章 - まとめ
  content_markdown: |
    この章でジェネリック型がどれだけの力を発揮するのかがわかりました。
    すべて使いこなせなくても心配しないでください。
    今は、コードの中で何度も目にするであろう主要なアイデアを意識するだけで良いと思います。
    私たちの関数はかなり長くなっています。
    次の章では、Rust の重要な概念であるデータの所有権について説明します。
