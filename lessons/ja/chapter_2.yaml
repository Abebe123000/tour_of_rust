- title: 第 2 章 - 基本制御フロー
  content_markdown: |
    この章では、Rustの基本的な制御フローについて説明します。
    C 系の言語に慣れていればすぐに馴染めますし、ちょっとした驚きがあるかもしれません。
- title: if/else if/else
  content_markdown: |
    Rust でのコード分岐はそれほど目新しくはありません。

    条件には括弧がありませんが、本当に必要だったでしょうか？これでコードはすっきりします。

    いつもの論理演算子が使えます: `==`, `!=`, `<`, `>`, `<=`, `>=`, `!`, `||`, `&&`
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("42 より小さい");
        } else if x == 42 {
            println!("42 に等しい");
        } else {
            println!("42 より大きい");
        }
    }
- title: loop
  content_markdown: |
    無限ループが必要ですか？

    Rust では簡単です。

    `break` によってループから脱出できます。</p><p>後で見ますが `loop` には秘密があります。
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    `while` を使えば、ループに条件を簡単に追加できます。

    条件が `false` と評価された場合、ループは終了します。
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
    }
- title: for
  content_markdown: |
    Rust の `for` ループは強力に改良されています。
    イテレータとして評価される式を反復処理します。
    イテレータとは何でしょうか？
    イテレータとは、項目がなくなるまで「次の項目は何ですか？」と質問することができるオブジェクトです。

    それについては後の章で詳しく説明します。とりあえず、Rust では整数のシーケンスを生成するイテレータを、簡単に作成できることを知っておいてください。

    `..` 演算子は、開始番号から終了番号の手前までの数値を生成するイテレータを作成します。

    `..=` 演算子は、開始番号から終了番号までの数値を生成するイテレータを作成します。
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: |
    switch 文が足りない？
    Rust には、値が取り得るすべての条件にマッチさせて、マッチが真であればコードパスを実行するための、とても便利なキーワードがあります。
    これが数値に対してどのように機能するか見てみましょう。
    より複雑なデータのパターンマッチングについては、後の章で詳しく説明します。
    待つだけの価値があることをお約束します。

    `match` は網羅的なので、すべてのケースを処理しなければなりません。

    マッチングと分解を組み合わせたパターンは、Rust の中で最も一般的なパターンの一つです。
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // 複数の値にマッチ
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // 範囲にマッチ
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // マッチした数字を変数に束縛
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // どのパターンにもマッチしない場合のデフォルトマッチが必須
            _ => {
                println!("found something else!");
            }
        }
    }
- title: loop から値を返す
  content_markdown: |
    `loop` は `break` で抜けて値を返すことができます。
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "13 を発見";
            }
        };
        println!("loop の戻り値: {}", v);
    }
- title: ブロック式から値を返す
  content_markdown: |
    `if`、`match`、関数、ブロックは、単一の方法で値を返すことができます。

    `if`、`match`、関数、ブロックの最後が `;` のない式であれば、戻り値として使用されます。
    これは値を返すための簡潔なロジックを作成するのに最適な方法で、その値は新しい変数に入れることができます。

    また、`if` 文を三項演算子のように使用できることにも注目してください。
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust の三項式
        let v = if x < 42 { -1 } else { 1 };
        println!("if より: {}", v);

        let food = "ハンバーガー";
        let result = match food {
            "ホットドッグ" => "ホットドッグです",
            // 単一の式で値を返す場合、中括弧は省略可能
            _ => "ホットドッグではありません",
        };
        println!("食品の識別: {}", result);

        let v = {
            // ブロックのスコープは関数のスコープから分離されている
            let a = 1;
            let b = 2;
            a + b
        };
        println!("ブロックより: {}", v);

        // Rust で関数の最後から値を返す慣用的な方法
        v + 4
    }

    fn main() {
        println!("関数より: {}", example());
    }
- title: 第 2 章 - まとめ
  content_markdown: |
    基本的な言語機能においても、Rust の力を垣間見ることができたでしょうか。
    今後は `for` と `match` について、その能力を活用できるように知識を深めながら、進めていきます。
    次回は Rust の基礎となるデータ構造に入ります。
