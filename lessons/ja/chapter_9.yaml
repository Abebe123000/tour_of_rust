- title: 第 9 章 - プロジェクトの構成と構造
  content_markdown: |
    これまでのコード例はすべて1つのファイルに収まっていました。コードをより良く整理し、他の人と共有できるようにする方法について話しましょう！
- title: モジュール
  content_markdown: |
    すべての Rust プログラムやライブラリは *クレート* です。

    すべてのクレートは *モジュール* の階層で構成されています。

    すべてのクレートはルートモジュールを持っています。

    モジュールは、グローバル変数、関数、構造体、トレイト、さらには他のモジュールさえも保持できます！

    Rust では、ファイルとモジュールツリーの階層は1対1で対応しているわけではありません。モジュールツリーは、コードの中で明示的に手作業で構築する必要があります。
- title: プログラムを書く
  content_markdown: |
    プログラムは、`main.rs` というファイルにルートモジュールを持ちます。
- title: ライブラリを書く
  content_markdown: |
    ライブラリは、`lib.rs` というファイルにルートモジュールを持ちます。
- title: 他のモジュールやクレートの参照
  code: |
    use std::f64::consts::PI;

    fn main() {
        println!("Welcome to the playground!");
        println!("I would love a slice of {}!", PI);
    }
  content_markdown: |
    モジュール内の項目は、`std::f64::consts::PI` のように完全なモジュールパスで参照できます。

    もっと簡単な方法は **use** キーワードです。これを使うと、コード全体で完全なパスを書かずに、モジュールから使いたい特定の項目を指定できます。例えば `use std::f64::consts::PI` とすることで、`main` 関数の中で識別子 `PI` だけを使えるようになります。

    **std** は Rust の **標準ライブラリ** のクレートで、オペレーティングシステムとやり取りするための便利なデータ構造や関数がたくさん詰まっています。

    コミュニティによって作成されたクレートの検索可能なディレクトリは [https://crates.io](https://crates.io/) にあります。
- title: 複数の項目の参照
  content_markdown: |
    次のように、複数の項目を1つのモジュールパスで参照することができます。

    ```rust
    use std::f64::consts::{PI,TAU}
    ```

    Ferris は TAU を食べません。PI しか食べないのです。
- title: モジュールの作成
  content_markdown: |
    コードと言えば、通常はディレクトリの中に整理されたファイルの階層を思い浮かべます。Rust では、ファイル構造と密接に関連したモジュールを作成できます。

    Rust には、モジュールを宣言する方法が2つあります。例えば、モジュール `foo` は次のように表すことができます。
      * `foo.rs` という名前のファイル
      * `mod.rs` というファイルを中に持つ `foo` という名前のディレクトリ
- title: モジュールの階層
  content_markdown: |
    モジュールは他のモジュールに依存することができます。モジュールとそのサブモジュールの間の関係を確立するには、親モジュールの中に次のように書く必要があります。

    ```rust
    mod foo;
    ```

    上記の宣言は、`foo.rs` または `foo/mod.rs` という名前のファイルを探し、そのスコープの下にある `foo` という名前のモジュールの中にその内容を挿入します。
- title: インラインモジュール
  content_markdown: |
    サブモジュールは、モジュールのコードの中に直接インラインで書くこともできます。

    インラインモジュールの非常によくある使い道の1つは、単体テストの作成です。Rust がテストモードで使われているときにだけ存在するインラインモジュールを作成できます！

    ```
    // このマクロは、Rust がテストモードでないときに
    // このインラインモジュールを取り除きます。
    #[cfg(test)]
    mod tests {
        // 親モジュールへのアクセスは自動的には
        // 得られないことに注意してください。明示する必要があります。
        use super::*;

        ... tests go here ...
    }
    ```
- title: モジュール内部の参照
  content_markdown: |
    Rust には、`use` パスの中ですぐに目的のモジュールを取得するために使えるいくつかのキーワードがあります。

    * `crate` - あなたのクレートのルートモジュール

    * `super` - 現在のモジュールの親モジュール

    * `self` - 現在のモジュール
- title: エクスポート
  content_markdown: |
    デフォルトでは、*モジュール* のメンバはモジュールの外部からアクセスできません（子モジュールからでさえもです！）。モジュールのメンバを `pub` キーワードでアクセス可能にすることができます。

    デフォルトでは、*クレート* のメンバはクレートの外部からアクセスできません。クレートのメンバをクレートの *ルートモジュール*（`lib.rs` または `main.rs`）の中で `pub` としてマークすることで、アクセス可能にすることができます。
- title: 構造体の可視性
  content_markdown: |
    関数と同じように、構造体も `pub` を使ってモジュールの外部に何を公開したいかを宣言できます。
  code: |
    // SeaCreature 構造体はモジュールの外からも使用可能
    pub struct SeaCreature {
        pub animal_type: String,
        pub name: String,
        pub arms: i32,
        pub legs: i32,
        // weapon は非公開のままにしておく
        weapon: String,
    }
- title: プレリュード
  content_markdown: |
    `use` でインポートしなくても、なぜ `Vec` や `Box` をどこでも使えるのか不思議に思うかもしれません。それは標準ライブラリの `prelude` というモジュールのおかげです。

    Rust の標準ライブラリでは、`std::prelude::*` としてエクスポートされているものは何であれ、Rust のすべての場所で自動的に利用可能になることを知っておいてください。それは `Vec` や `Box` だけでなく、他のもの（`Option`、`Copy` など）にも当てはまります。
- title: 独自のプレリュード
  content_markdown: |
    標準ライブラリのプレリュードにならって、自分のライブラリにも独自の `prelude` モジュールを持たせるのはよくあることです。これは、ライブラリの利用者が最もよく使うデータ構造をインポートするための出発点として使われます（例えば `use my_library::prelude::*`）。

    あなたのクレートを使うプログラムやライブラリで自動的に使われるわけではありませんが、人々がどこから始めればよいか分かるように、これに従うのは良い慣習です。

    Ferris「良いラスタシアンになって、仲間のカニのために良いプレリュードを用意してあげよう！」
- title: 第 9 章 - まとめ
  content_markdown: |
    これで、世界に向けて公開できる Rust のアプリケーションやライブラリを作る上でのちょっとしたコツをいくつか身につけましたね。すべてを覚えておく必要はありません。ライブラリが成長し、他の人々に使われるようになるにつれて、それぞれの節目で何が最善かが分かってくるでしょう。

    資料:

    - [Guidelines For Writing Rust APIs](https://rust-lang.github.io/api-guidelines/)
