- title: 第 6 章 - テキスト
  content_markdown: >
    さて、Rust におけるメモリの考え方について少し理解できたので、テキストについて深掘りするための準備が整いました。

    Rust では、他の言語ではあまり馴染みのない国際的なテキストやバイトレベルの問題が考慮されています。

    それでも、Rust にはこれらの問題を管理するための優れたツールが多くあります。
- title: 文字列リテラル
  content_markdown: >
    文字列リテラルは常にUnicodeです。

    文字列リテラルの型は`&'static str`です。:

    * `&` はメモリ中の場所を参照していることを意味しており、 `&mut` を欠いているのは、
    コンパイラがそれを修正することを認めていないということです。

    * `'static` は文字列データがプログラムの終了まで有効であるということを意味しています。（文字列データは決して消えません。）

    * `str` は常に有効な**utf-8**であるバイト列を指していることを意味しています。


    メモリに関する詳細：

    * Rust のコンパイラは文字列をプログラムメモリのデータセグメントに入れるでしょう。
  code: |
    fn main() {
        let a: &'static str = "こんにちは 🦀";
        println!("{} {}", a, a.len());
    }
- title: utf-8とは
  content_markdown: "様々な言語がコンピューター上で使われるようになるにつれて, ASCIIで許可されている以上のテキスト文字を表現する必要が出てきました。（ASCIIで許可されているのは1バイト、つまり256文字です）\n\n**utf-8** は1～4バイトの可変バイト長で導入され、それによって表現可能な文字の範囲が大幅に広がりました。\n\n可変サイズ文字の利点として挙げられるのは、一般的なASCIIで使われる文字について余計なバイトを必要としなかったことです。（一般的なASCIIで使われる文字について**utf-8** で必要とするのはASCIIと変わらずたった1バイトです）\n\n可変サイズの文字の欠点として挙げられるのは、簡単なインデキシング（例：4番目の文字を取得するために `my_text[3]` を使用すること）における文字の検索が（**O(1)** 定数時間で）素早くできなくなることです。すぐ前にある文字が可変幅を持つことで、4番目の文字がバイト列のどこから実際に始まるのかが変わってしまう可能性があります。\n\nその代わり、Unicode文字が実際にどこから始まるのかを知るために **utf-8** バイトのシーケンスを繰り返さなければなりません。（計算量は線形時間 **O(n)**）\n\nFerris「水中にいるお友達の絵文字を表現するのに **utf-8** があると嬉しいね！」\n\n<span class=\"emoji\">\U0001F420\U0001F419\U0001F41F\U0001F42C\U0001F40B</span>\n"
- title: エスケープ文字
  content_markdown: >
    特定の文字を視覚的に表現するのは難しいので、**エスケープ
    コード** を使用することでその場所に記号を挿入することができます。


    Rust ではC言語の共通エスケープコードがサポートされています。:

    * `\n` - 改行

    * `\r` - キャリッジ・リターン

    * `\t` - タブ

    * `\\` - バックスラッシュ

    * `\0` - null

    * `\'` - シングルクォート


    エスケープ文字の一覧は[ここ](https://doc.rust-lang.org/reference/tokens.html)にあります。
  code: |
    fn main() {
        let a: &'static str = "Ferrisは言う:\t\"こんにちは\"";
        println!("{}",a);
    }
- title: 複数行の文字列リテラル
  content_markdown: |
    Rust における文字列はデフォルトで複数行に対応しています。

    改行したくない場合は、行の最後に `\` を挿入しましょう。
  code: |
    fn main() {
        let haiku: &'static str = "
            書いてみたり
            けしたり果ては
            けしの花
            - 立花北枝";
        println!("{}", haiku);
        
        
        println!("こんにちは \
        世界") // 世界の前にある間隔は無視されます
    }
- title: 生文字列リテラル
  content_markdown: >
    生文字列では、`r#"`で始まり`"#`で終わる文字列を逐語的に書くことができます。

    これによって、通常の文字列との区別がつかない可能性のある文字をリテラルとして挿入することができます。(二重引用符やバックスラッシュなど)
  code: |
    fn main() {
        let a: &'static str = r#"
            <div class="advice">
                生文字列は様々な場面で役に立ちます。
            </div>
            "#;
        println!("{}", a);
    }
- title: ファイルから文字列リテラルを読み込む
  content_markdown: >
    非常に大きなテキストがある場合は, `include_str!` というマクロを使って
    ローカルファイルのテキストをプログラムの中でインクルードしてみてください。：


    ```rust

    let hello_html = include_str!("hello.html");

    ```
- title: 文字列スライス
  content_markdown: >
    文字列スライスは、常に有効な utf-8 でなければならないメモリ内のバイト列への参照です。


    文字列のスライス(サブスライス)である `str` のスライスも有効な utf-8 でなければなりません。


    `&str` の一般的なメソッド：

    * `len` は文字列リテラルの長さをバイト単位で取得します。（文字数ではない）

    * 基本的なテストのための `starts_with`/`ends_with`

    * `is_empty` は長さがゼロの時にtrueを返します。

    * `find` はテキストの最初の位置の `Option<usize>` を返します。
  code: |
    fn main() {
        let a = "hi 🦀";
        println!("{}", a.len());
        let first_word = &a[0..2];
        let second_word = &a[3..7];
        // let half_crab = &a[3..5]; は失敗します。
        // Rust は無効な unicode 文字のスライスを受け付けません。
        println!("{} {}", first_word, second_word);
    }
- title: Chars
  content_markdown: >
    Unicodeでの作業が非常に困難なため、Rust ではutf-8バイトのシーケンスを `char` 型の文字のベクトルとして取得する方法が提供されています。


    `char` は常に 4 バイトの長さです。(これによって個々の文字を効率的に検索できるようになっています)
  code: |
    fn main() {
        // 文字をcharのベクトルとして集める
        let chars = "hi 🦀".chars().collect::<Vec<char>>();
        println!("{}", chars.len()); // 4 になるはず
        // chars は 4 バイトなので、u32 に変換することができる
        println!("{}", chars[3] as u32);
    }
- title: String
  content_markdown: >
    **String** はヒープにutf-8バイト列をもつ構造体です。


    そのメモリはヒープ上にあるため、文字列リテラルでは出来ないような、拡張や修正などが可能です。


    共通のメソッド:


    * `push_str` 文字列の最後にutf-8バイトを追加します。

    * `replace` utf-8バイト列を他のutf-8バイト列で置換します。

    * `to_lowercase`/`to_uppercase` 大文字や小文字に変えます。

    * `trim` 空白を切り取ります。


    Stringがドロップされると、そのヒープ内のメモリもドロップされます。


    `String` には `&str`で文字列を拡張し、自分自身を返す `+` 演算子がありますが、
    期待しているほど使い勝手は良くないかもしれません。
  code: |
    fn main() {
        let mut helloworld = String::from("hello");
        helloworld.push_str(" world");
        helloworld = helloworld + "!";
        println!("{}", helloworld);
    }
- title: 関数パラメータとしてのテキスト
  content_markdown: >
    文字列リテラルや文字列は、一般的に文字列スライスとして関数に渡されます。
    これによって、実際には所有権を渡す必要がないほとんど場合において柔軟性が増します。
  code: |
    fn say_it_loud(msg:&str){
        println!("{}!!!",msg.to_string().to_uppercase());
    }

    fn main() {
        // say_it_loudは&'static strを&strとして借用することができます
        say_it_loud("hello");
        // say_it_loudはStringを&strとして借用することもできます
        say_it_loud(&String::from("goodbye"));
    }
- title: 文字列の構築
  content_markdown: |
    `concat` と `join` は、文字列を構築するためのシンプルだが強力な方法です。
  code: |
    fn main() {
        let helloworld = ["hello", " ", "world", "!"].concat();
        let abc = ["a", "b", "c"].join(",");
        println!("{}", helloworld);
        println!("{}",abc);
    }
- title: 文字列のフォーマット
  content_markdown: >
    `format!`マクロを使うと、パラメータ化された文字列を定義して文字列を作成することができ、
    値をどこにどのように配置すべきかはプレースホルダ（例：`{}`）で指定します。


    `format!` は `println!` と同じパラメータ付きの文字列を使用します。


    この関数の機能は、*Tour of Rust* では説明しきれません。
    [ドキュメント](https://doc.rust-lang.org/std/fmt/) をチェックしてください。
  code: |
    fn main() {
        let a = 42;
        let f = format!("secret to life: {}",a);
        println!("{}",f);
    }
- title: 文字列変換
  content_markdown: |
    多くの型は `to_string` を用いて文字列に変換することができます。

    ジェネリック関数 `parse` を用いることで文字列や文字列リテラルを型付きの値に変換できます。この関数は失敗する可能性があるので、`Result`を返します。
  code: |
    fn main() -> Result<(), std::num::ParseIntError> {
        let a = 42;
        let a_string = a.to_string();
        let b = a_string.parse::<i32>()?;
        println!("{} {}", a, b);
        Ok(())
    }
- title: 第 6 章 - まとめ
  content_markdown: >
    これで、テキストの基本が分かりましたね！これまで見てきたようにUnicodeによってテキストの操作は少し厄介になりますが、標準ライブラリにはその管理を簡単にするための多くの機能があります。 


    これまでほとんどの場合、手続き的なパラダイム（つまり、関数とデータだけ）から Rust を見てきましたが、今回は Rust のオブジェクト指向パラダイムによって開放される traits と能力について話します。
