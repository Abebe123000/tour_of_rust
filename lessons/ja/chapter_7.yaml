- title: 第 7 章 - オブジェクト指向プログラミング
  content_markdown: >
    関数でアイデアを表現することは、動作やデータを表現する方法として実績があります（C言語では何十年もそうしてきました！）。
    歴史的に見ると、コンピュータサイエンスは他にも有用なデータの表現方法と抽象化を発見してきました。
    オブジェクト指向プログラミング(OOP)は、そのような方法の1つとしてお馴染みかもしれません。
    この章では、ただの関数だけではないRustプログラミング言語を探求していきます。
- title: オブジェクト指向プログラミングとは？
  content_markdown: >
    オブジェクト指向プログラミングとは、大まかに以下のようないくつかの象徴的な特徴を持つプログラミング言語のことです。

    * カプセル化 - データと関数を *オブジェクト* という一つの型の概念的な単位で関連付けること。

    * 抽象化 - データや関数のメンバを隠して、オブジェクトの実装の詳細を難読化すること。

    * ポリモーフィズム - 1つのインターフェースを通して、異なるタイプのオブジェクトと相互作用する能力のこと。

    * 継承 - 他のオブジェクトからデータや振る舞いを引き継ぐこと。
- title: Rust はオブジェクト指向プログラミング言語ではない
  content_markdown: >
    Rust は、データと動作の継承機能を意図的に持っていません。


    * 構造体は親構造体からフィールドを継承することはできない。

    * 構造体は親構造体から関数を継承することができない。


    しかし、Rust は多くのプログラミング言語機能を実装しているので、この不足は気にならないかもしれません。
- title: メソッドによるカプセル化
  code: |
    struct SeaCreature {
        noise: String,
    }

    impl SeaCreature {
        fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust は、いくつかの関数（*メソッド* とも呼ばれる）に関連付けられた構造体である *オブジェクト* の概念をサポートしています。


    どのメソッドの最初のパラメータも、メソッド呼び出しに関連付けられたインスタンスへの参照でなければなりません（例： `instanceOfObj.foo()`）。Rust が使うのは下記の通り：

    * `&self` - インスタンスへの不変の参照。

    * `&mut self` - インスタンスへの可変の参照。


    メソッドは、キーワード `impl` を持つ実装ブロックの中で定義されます。

    ```rust

    impl MyStruct { 
        ...
        fn foo(&self) {
            ...
        }
    }

    ```
- title: 選択的な公開による抽象化
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust はオブジェクトの内部構造を隠すことができます。


    デフォルトでは、フィールドとメソッドは、それらが属しているモジュールにのみアクセス可能です。


    `pub` キーワードは、構造体のフィールドとメソッドをモジュールの外部に公開します。
- title: トレイトを用いたポリモーフィズム
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_noise();
    }
  content_markdown: >
    Rust は、トレイトによるポリモーフィズムをサポートしています。トレイトを使うと、構造体型にメソッド群を関連付けることができます。


    まず、トレイト内のメソッドのシグネチャを定義します。


    ```

    trait MyTrait {
        fn foo(&self);
        ...
    }

    ```


    構造体がトレイトを実装すると、実際の型を知らなくてもトレイトの型（例：`&dyn MyTrait`）を通じて間接的に構造体と対話できる契約が確立されます。
    

    構造体に実装されたトレイトメソッドは、実装ブロックの中で定義されます。


    ```rust

    impl MyTrait for MyStruct { 
        fn foo(&self) {
            ...
        }
        ... 
    }

    ```
- title: トレイトに実装されたメソッド
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
        
        fn make_alot_of_noise(&self){
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: >
    トレイトは実装されたメソッドを持つことができます。


    この関数は構造体の内部フィールドに直接アクセスすることはできませんが、多くのトレイトの実装の間で動作を共有するのに便利です。
- title: トレイトの継承
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    trait LoudNoiseMaker: NoiseMaker {
        fn make_alot_of_noise(&self) {
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    impl LoudNoiseMaker for SeaCreature {}

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: |
    トレイトは他のトレイトからメソッドを継承することができます。
- title: 動的ディスパッチと静的ディスパッチ
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn static_make_noise(creature: &SeaCreature) {
        // 実際の型がわかっている
        creature.make_noise();
    }

    fn dynamic_make_noise(noise_maker: &dyn NoiseMaker) {
        // 実際の型はわからない
        noise_maker.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        static_make_noise(&creature);
        dynamic_make_noise(&creature);
    }
  content_markdown: >
    メソッドは2つの方法で実行されます。

    * 静的ディスパッチ - インスタンスの型がわかっている場合、どの関数を呼び出せばよいかを直接知ることができる。

    * 動的ディスパッチ - インスタンスタイプが不明な場合、正しい関数を呼び出す方法を見つけなければならない。


    トレイト型である `&dyn MyTrait` は、動的ディスパッチを使って間接的にオブジェクトのインスタンスを操作する機能を提供します。


    動的ディスパッチを使用する場合、Rust は、人々が認識できるように、トレイト型の前に `dyn` を置くことを推奨します。


    メモリの詳細:

    * 動的ディスパッチは、実際の関数呼び出しを見つけるためにポインタを追跡するため、わずかに遅くなります。
- title: トレイトオブジェクト
  content_markdown: >
    オブジェクトのインスタンスを `&dyn MyTrait` 型のパラメータに渡すとき、 *トレイトオブジェクト* と呼ばれるものを渡します。


    インスタンスの正しいメソッドを間接的に呼び出すことを可能にするのがトレイトオブジェクトです。
    トレイトオブジェクトは、インスタンスのポインタと、インスタンスのメソッドへの関数ポインタのリストを保持する構造体です。


    メモリの詳細:

    * この関数のリストをC++ではvtableと呼んでいます。
- title: サイズの合わないデータの処理
  content_markdown: >
    トレイトを別の構造体の中に格納する場合、興味深い問題が発生します。
    
    トレイトは元の構造体を難読化するため、元のサイズも難読化されます。
    
    Rust では、構造体に格納されるサイズの合わない値は、2つの方法で処理されます。


    * `generics` - パラメータ化された型を使用して、既知の型、つまり既知のサイズの構造体/関数を効果的に作成します。

    * `indirection` - ヒープ上にインスタンスを置くことで、実際の型のサイズを気にすることなく、単にそのポインタを格納することができるインダイレクトのレベルを得ることができます。
    他の方法もあります。
- title: ジェネリック関数
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise<T>(creature: &T)
    where
        T: NoiseMaker,
    {
        // コンパイル時に実際の型がわかっている
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: >
    Rust のジェネリクスは、トレイトと密接に連携しています。パラメータ化された型 `T` を記述するとき、引数に実装しなければならない必須のトレイトを列挙することで、引数として使用できる型を制限することができます。


    この例では、型 `T` はトレイト `Foo` を実装していなければなりません。

    ```rust

    fn my_function<T>(foo: T)

    where
        T:Foo
    {
        ...
    }

    ```


    ジェネリクスを使うことで、コンパイル時に型とサイズが既知の静的型付け関数を作成し、静的ディスパッチとサイズ付きの値としての保存を可能にします。
- title: ジェネリクス関数の省略記法
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise(creature: &impl NoiseMaker)
    {
        // コンパイル時に実際の型がわかっている
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: |
    Rust には、トレイトに制約されたジェネリクスを表現するための略記法があります。

    ```rust
    fn my_function(foo: impl Foo) {
        ...
    }
    ```

    上記の記法は下記のものと同等です。

    ```rust
    fn my_function<T>(foo: T)
    where
        T:Foo
    {
        ...
    }
    ```
- title: ボックス
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    struct Ocean {
        animals: Vec<Box<dyn NoiseMaker>>,
    }

    fn main() {
        let ferris = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        let sarah = SeaCreature {
            name: String::from("Sarah"),
            noise: String::from("swish"),
        };
        let ocean = Ocean {
            animals: vec![Box::new(ferris), Box::new(sarah)],
        };
        for a in ocean.animals.iter() {
            a.make_noise();
        }
    }
  content_markdown: >
    `Box` は、データをスタックからヒープに移動させるためのデータ構造です。


    `Box` はスマートポインタと呼ばれる構造体で、ヒープ上のデータへのポインタを保持します。


    `Box` はサイズが既知の構造体であるため（ポインタを保持しているだけなので）、
    フィールドのサイズを知っていなければならない構造体の中で、何かの参照を格納する方法としてよく使われます。


    `Box` は一般的なものなので、どこからでも使うことができます。


    ```rust

    Box::new(Foo { ... })

    ```
- title: ジェネリクス構造体のおさらい
  content_markdown: >
    ジェネリクス構造体は、そのパラメータ化された型がtraitによって制約されることもあります。


    ```rust

    struct MyStruct<T>

    where
        T: MyTrait
    {
        foo: T
        ...
    }

    ```


    ジェネリクス構造体は、その実装ブロックにパラメータ化された型を持っています。


    ```rust

    impl<T> MyStruct<T> {
        ...
    }

    ```
- title: 第 7 章 - まとめ
  content_markdown: >
    私たちのアイデアを明確に表現するために、本章でより多くの言語機能を学んできました。

    Rust の抽象化機能はシンプルかもしれませんが、コードを書くのが楽しくなるような強力なものです。

    この章では、 `Box` を使用してスマートポインタを垣間見ることができました。

    次の章では、スマートポインタが他の特殊なメモリの状況でどのように役立つかについて学びます。


    参考:

    * [Video - Object-oriented Programming in 7
    minutes](https://www.youtube.com/watch?v=pTB0EiLXUC8)

    * [Article - "The faster you unlearn OOP, the better for you and your
    software"](https://dpc.pw/the-faster-you-unlearn-oop-the-better-for-you-and-your-software)
