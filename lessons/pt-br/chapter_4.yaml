- title: Capítulo 4 - Tipos Genéricos
  content_markdown: >
    Tipos genéricos são incrivelmente importantes no Rust. Eles são usados na representação de valores *null* (ou seja, variáveis que ainda não tenham um valor atribuído), tratamento de erros, coleções e muito mais! Nesta seção aprenderemos sobre os tipos genéricos fundamentais que você provavelmente usará o tempo todo.
- title: O Que São Tipos Genéricos?
  content_markdown: >
    Tipos genéricos nos permitem definir parcialmente uma `struct` ou `enum`, deixando que o compilador instancie uma versão dela definida em tempo de compilação totalmente com base em nosso código.


    Geralmente o Rust pode inferir o tipo final observando a nossa instanciação, mas se ele precisar de ajuda você sempre pode ser explícito usando o operador `::<T>`, também conhecido pelo nome `turbofish` (ele é um bom amigo meu!).
  code: |
    // Um tipo struct definido parcialmente
    struct Sacola<T> {
        item: T,
    }

    fn main() {
        // Nota: usando tipos genéricos aqui nós criamos tipos em tempo de compilação
        // fazendo o nosso código ficar maior. O turbofish nos permite ser explícitos.
        let i32_sacola = Sacola::<i32> { item: 42 };
        let bool_sacola = Sacola::<bool> { item: true };
        
        // O Rust pode inferir os tipos para genéricos também!
        let float_sacola = Sacola { item: 3.14 };
        
        // Nota: nunca coloque uma sacola dentro da outra na vida real
        let sacola_na_sacola = Sacola {
            item: Sacola { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_sacola.item, bool_sacola.item, float_sacola.item, sacola_na_sacola.item.item
        );
    }
- title: Representando o Nada
  content_markdown: >
    Em outras linguagens, a palavra-chave `null` é usada para representar a ausência de um valor. Isso cria dificuldades nas linguagens de programação, porque possibilita que o nosso programa possa falhar ao interagir com uma variável/campo.


    O Rust não tem `null`, mas não ignora a importância de representar o *nada*! Considere uma representação ingênua usando uma ferramenta que já conhecemos.


    Esse padrão para fornecer uma representação alternativa ao `None` por um ou vários valores alternados é muito comum em Rust devido à falta de um valor `null`. Os tipos genéricos ajudam a resolver esse desafio.
  code: |
    enum Item {
        Inventario(String),
        // None representa a ausência de um item
        None,
    }

    struct Sacola {
        item: Item,
    }
- title: Option
  content_markdown: >
    O Rust possui uma enumeração genérica embutida chamada `Option` que nos permite representar valores nulos sem precisar usar o `null`.


    ```

    enum Option<T> {
        None,
        Some(T),
    }

    ```


    Essa enumeração é tão comum que as suas instâncias podem ser criadas em qualquer lugar com a palavra-chave `Some` e `None`.
  code: |
    // Um tipo struct parcialmente definido
    struct Sacola<T> {
        // Nosso parâmetro T pode ser entregue a outros
        item: Option<T>,
    }

    fn main() {
        // Nota: Uma sacola para i32, contendo nada! Precisamos especificar o tipo
        // porque senão o Rust não saberá qual o tipo que sacola é.
        let i32_sacola = Sacola::<i32> { item: None };

        if i32_sacola.item.is_none() {
            println!("não há nada na sacola!")
        } else {
            println!("tem alguma coisa na sacola!")
        }

        let i32_sacola = Sacola::<i32> { item: Some(42) };

        if i32_sacola.item.is_some() {
            println!("tem alguma coisa na sacola!")
        } else {
            println!("não há nada na sacola!")
        }

        // match lets us deconstruct Option elegantly and ensure we handle all cases!
        match i32_sacola.item {
            Some(v) => println!("encontrei {} na sacola!", v),
            None => println!("não encontrei nada"),
        }
    }
- title: Result
  content_markdown: >
    O Rust possui uma enumeração genérica chamada `Result` que nos permite retornar um valor que tem a possibilidade de falhar.


    Esta é a maneira idiomática pela qual a linguagem faz a manipulação de erros.


    ```

    enum Result<T, E> {
        Ok(T),
        Err(E),
    }

    ```


    Observe que os nosso tipos genéricos possuem vários *tipos parametrizados* separados por vírgula.


    Esta enumeração é tão comum que instâncias dela podem ser criadas em qualquer lugar com as palavras-chave `Ok` e `Err`.
  code: |
    fn faz_alguma_coisa_que_pode_falhar(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("este não é o número correto"))   
        }
    }

    fn main() {
        let result = faz_alguma_coisa_que_pode_falhar(12);

        // o match nos permite desconstruir o Result elegantemente 
        // e garante que lidemos com todos os casos!
        match result {
            Ok(v) => println!("encontrei {}", v),
            Err(e) => println!("Erro: {}", e),
        }
    }
- title: Main Falível
  content_markdown: |
    O `main` tem a capacidade de retornar um `Result`!
  code: |
    fn faz_alguma_coisa_que_pode_falhar(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("este não é o número correto"))
        }
    }

    // o Main não retorna um valor, mas pode retornar um erro!
    fn main() -> Result<(), String> {
        let result = faz_alguma_coisa_que_pode_falhar(12);

        match result {
            Ok(v) => println!("encontrei {}", v),
            Err(_e) => {
                // lida com o erro normalmente
                
                // retorna um novo erro do main que nos informa o que houve!
                return Err(String::from("alguma coisa deu errado em main!"));
            }
        }

        // Observe que usamos um valor unit dentro de um Result Ok
        // para representar que está tudo bem
        Ok(())
    }
- title: Manipulação de Erros Elegantes
  content_markdown: >
    O `Result` é tão comum que o Rust tem o poderoso operador `?` para trabalhar com ele. Estas duas declarações são equivalentes:


    ```

    do_something_that_might_fail()?

    ```


    ```

    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }

    ```
  code: |
    fn faz_alguma_coisa_que_pode_falhar(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("este não é o número correto"))
        }
    }

    fn main() -> Result<(), String> {
        // Olha quanto código nós salvamos!
        let v = faz_alguma_coisa_que_pode_falhar(42)?;
        println!("encontrei {}", v);
        Ok(())
    }
- title: Manipulação de Option/Erros Deselegante
  content_markdown: >
    Trabalhar com `Option`/`Result` pode ser entediante quando você está apenas tentando escrever um código rápido. Tanto `Option` quanto `Result` têm uma função chamada `unwrap` que pode ser útil para obter um valor de maneira rápida e *feia*. `unwrap` irá:


    1. Obter o valor de Option/Result

    2. Se a enumeração for do tipo None/Err, `panic!`


    Esses dois trechos de código são equivalentes:


    ```

    my_option.unwrap()

    ```


    ```

    match my_option {
        Some(v) => v,
        None => panic!("alguma mensagem de erro gerada pelo Rust!"),
    }

    ```


    Similarmente:


    ```

    my_result.unwrap()

    ```


    ```

    match my_result {
        Ok(v) => v,
        Err(e) => panic!("alguma mensagem de erro gerada pelo Rust!"),
    }

    ```


    Seja um bom rustáceo e use `match` apropriadamente quando puder!
  code: |
    fn faz_alguma_coisa_que_pode_falhar(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("este não é o número correto"))   
        }
    }

    fn main() -> Result<(), String> {
        // conciso, mas pretencioso e falha rápido
        let v = faz_alguma_coisa_que_pode_falhar(42).unwrap();
        println!("encontrei {}", v);
        
        // erro de panic!
        let v = faz_alguma_coisa_que_pode_falhar(1).unwrap();
        println!("encontrei {}", v);
        
        Ok(())
    }
- title: Vetores
  content_markdown: >
    Alguns dos tipos genéricos mais úteis são os tipos de coleção. Um vetor é uma lista de itens de tamanho variável representada pela estrutura `Vec`.


    A macro `vec!` nos permite criar facilmente um ao invés de construir um manualmente.


    `Vec` possui o método `iter()` o qual cria um iterador a partir de um vetor, permitindo-nos facilmente usar um vetor em um loop `for`.


    Detalhes da Memória:


    * `Vec` é um struct, mas internamente contém uma referência a uma lista fixa de seus itens no heap.

    * Um vetor começa com uma capacidade padrão. Quando são adicionados mais itens do que a capacidade inicial, ele realoca seus dados no heap para ter uma nova lista fixa com capacidade maior.
  code: |
    fn main() {
        // Podemos ser explícitos com o tipo
        let mut i32_vec = Vec::<i32>::new(); // turbofish <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // Veja quão esperto o Rust é determinando o tipo automaticamente
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // Olha que macro linda!
        let string_vec = vec![String::from("Olá"), String::from("Mundo")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: Capítulo 4 - Conclusão
  content_markdown: >
    Em um capítulo aprendemos quanta força os tipos genéricos nos dão! Não se preocupe se você não souber como usar tudo, porque agora é bom estar ciente das principais ideias que você verá repetidas vezes no código. Nossas funções estão ficando muito longas! No próximo capítulo, falaremos sobre um conceito importante no Rust: propriedade de dados.
