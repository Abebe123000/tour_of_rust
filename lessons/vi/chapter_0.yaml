    **Chúc mừng sinh nhật 1 tuổi 🎉**

    Chào mừng tới với *Tour of Rust*. Đây là hướng dẫn từng bước về các tính năng của ngôn ngữ lập trình Rust. Rust thường được coi là một ngôn ngữ có đường cong học tập khó khăn, nhưng tôi hy vọng tôi có thể thuyết phục bạn rằng có rất nhiều điều để khám phá trước khi chúng ta đi đến những phần phức tạp.

    Bạn cũng có thể đọc bài hướng dẫn này bằng những ngôn ngữ sau:

    <!--TOUR_LANGUAGE_LINKS-->

    Nếu bạn có đề xuất nội dung hoặc muốn đóng góp vào bản dịch, hãy truy cập vào [repository github](https://github.com/richardanaya/tour_of_rust) của Tour of Rust.

    Bạn có thể điều hướng qua bàn phím bằng nút <span class="emoji">⬅️</span> và nút <span class="emoji">➡️</span>.

    Trong ví dụ đơn giản này, chúng ta hãy xem sự hỗ trợ của Rust cho các chuỗi Unicode.
