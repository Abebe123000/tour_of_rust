- title: Enumerationes
  content_markdown: >

    Enumerationes possibilisa li creation de un nov tip quel usa li clave-parol
    `enum` e quel posse posseder li valore 

    de pluri marcat elementes.


    Con `match` on es assecurat tractar se con omni possibil valores del enum,
    fante it un potent utensile in li creation 

    de code de alt qualitá.
  code: |
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Specie {
        Crabe,
        Octopus,
        Pisc,
        Mollusco,
    }

    struct CreaturaMarin {
        specie: Specie,
        nomine: String,
        brasses: i32,
        jambes: i32,
        arme: String,
    }

    fn main() {
        // Li data de CreaturaMarin es sur li stack
        let ferris = CreaturaMarin {
            // Li struct String es anc sur li stack,
            // ma possede un referentie de data sur li heap
            specie: Specie::Crabe,
            nomine: String::from("Ferris"),
            brasses: 2,
            jambes: 4,
            arme: String::from("griffe"),
        };

        // Ci on usa match por comparar contra omni possibil 'brasse' (arm) del
        // enum. Li compilator va incolerar se si on ne include omni possibil
        // brasses in li comparation.
        match ferris.specie {
            Specie::Crabe => println!("ferris es un crabe"),
            Specie::Octopus => println!("ferris es un octopus"),
            Specie::Pisc => println!("ferris es un pisc"),
            Specie::Mollusco => println!("ferris es un mollusco"),
        }
    }
- title: Enumerationes con Data
  content_markdown: >
    Li elementes de `enum` posse haver un o plu data-tipes, quel es un poc simil
    a *union* in C.


    Quande on fa un pattern match (filtrage de mustres) con `match`, on posse
    ligar un nómine de variabile a chascun data-valore.


    Detallies pri `enum` in memorie:

    * Un data-valore por un enum va posseder un grandore egal a su max grand
    element. Con to, omni possibil valores 

    va posser intrar li sam loc de memorie.

    * Ultra le data-tipes de elementes (si ili trova se), chascun element have
    un valore numeric 

    quel representa su tag (marcation).


    Altri detallies:

    * `enum` in Rust es anc conosset quam un *tagged-union* (marcat union)

    * Li combination de tipes por crear un nov tip es li cose pri quel li gente
    parla quande ili di que Rust 

    possede *algebraic types*.
  code: |
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Specie { Crabe, Octopus, Pisc, Mollusco }
    enum TipVenen { Acidic, Dolorosi, Mortific }
    enum Grandore { Grand, Litt }
    enum Arme {
        Griffe(i32, Grandore),
        Venen(TipVenen),
        None
    }

    struct CreaturaMarin {
        specie: Specie,
        nomine: String,
        brasses: i32,
        jambes: i32,
        arme: Arme,
    }

    fn main() {
        // Li data de CreaturaMarin es sur li stack
        let ferris = CreaturaMarin {
            // Anc li struct String es sur li stack,
            // ma possede un referentie al data sur li heap
            specie: Specie::Crabe,
            nomine: String::from("Ferris"),
            brasses: 2,
            jambes: 4,
            arme: Arme::Griffe(2, Grandore::Litt),
        };

        match ferris.specie {
            Specie::Crabe => {
                match ferris.arme {
                    Arme::Griffe(num_griffes, grandore) => {
                        let descrition_de_grandore = match grandore {
                            Grandore::Grand => "grand",
                            Grandore::Litt => "litt"
                        };
                        println!("ferris es un crabe con {} {} griffes", num_griffes, descrition_de_grandore)
                    },
                    _ => println!("ferris es un crabe con alquel altri arme")
                }
            },
            _ => println!("ferris es alquel altri animale"),
        }
    }
- title: Capitul 3 - Conclusion
  content_markdown: >
    Quam excitant! Noi ja nu possede un tre basic utensilarium por representar
    li forme de nor idés in nor code. 

    Esperabilmen desde nu noi va posseder un poc aclaration pri qualmen li
    operationes fundamental in Rust labora junt 

    in harmonie e con concision con su tipes. A sequer noi va parlar pri un
