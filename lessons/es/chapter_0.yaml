  content_markdown: >
    Bienvenido al *Tour de Rust*. Esta es una guía paso a

    paso de las características del lenguaje de programación Rust. Rust está
    considerado

    como un lenguaje que hay que ir aprendiendo poco a poco, por lo que hay mucho
    que explorar

    antes de llegar a las partes complejas.

    Puedes encontrar esta guía en los siguientes idiomas:


