- title: Hoofdstuk 10 - Het Einde
  content_markdown: >
    Het was een genoegen u op de Tour of Rust te hebben. Ferris en
    het Tour of Rust-team hopen oprecht dat u geniet van de reis die
    voor u ligt! Als u zich tot nu toe op uw gemak heeft gevoeld,
    raden we u sterk aan om dieper te duiken met deze bronnen:


    * [The Official Rust Programming
    Book](https://doc.rust-lang.org/stable/book/)
