- title: Hoofdstuk 8 - Smart Pointers
  content_markdown: >
    In dit hoofdstuk ontrafelen we smart pointers. Laten we deze
    gegevensstructuren verkennen waarmee we kunnen interageren met
    het laagste niveau van het geheugen.


    Ferris zegt: "Voel u niet overweldigd door dit hoofdstuk als u
    niet het gevoel heeft dat u uw eigen low-level
    geheugenbeheercode kunt schrijven na één korte lezing. Dit
    hoofdstuk is vooral bedoeld om u kennis te laten maken met enkele
    nuttige hulpmiddelen en u een idee te geven van hoe ze werken!"
- title: Referenties Opnieuw Bekeken
  content_markdown: >
    Een referentie is in feite gewoon een getal dat de beginpositie
    is van enkele bytes in het geheugen. Het enige doel ervan is om
    het concept weer te geven van waar gegevens van een specifiek
    type zich bevinden. Wat een referentie anders maakt dan gewoon
    een getal, is dat Rust controleert of de levensduur van
    referenties niet langer duurt dan waarnaar ze verwijzen (anders
    zouden we een fout krijgen wanneer we het gebruikten!).
- title: Raw Pointers
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    Referenties kunnen worden omgezet in een meer primitief type
    genaamd een *raw pointer*. Net als een getal kan het worden
    gekopieerd en verplaatst met weinig beperkingen. Rust geeft geen
    garanties over de geldigheid van de geheugenlocatie waarnaar het
    verwijst.


    Er zijn twee soorten raw pointers:


    * `*const T` - Een raw pointer naar gegevens van type T die nooit
    zouden mogen veranderen.

    * `*mut T` - Een raw pointer naar gegevens van type T die kunnen
    veranderen.


    Raw pointers kunnen worden geconverteerd van en naar getallen
    (bijv. `usize`).


    Raw pointers kunnen gegevens benaderen met *unsafe*-code (meer
    hierover later).


    Geheugendetails:

    * Een referentie in Rust lijkt qua gebruik erg op een pointer in
    C, maar met veel meer beperkingen die tijdens het compileren
    worden gecontroleerd voor hoe deze kan worden opgeslagen en
    doorgegeven aan andere functies.
    * Een raw pointer in Rust lijkt op een pointer in C doordat het
    een getal vertegenwoordigt dat kan worden gekopieerd of
    doorgegeven, en zelfs kan worden omgezet in numerieke types
    waar het als een getal kan worden gewijzigd voor
    pointerrekenkunde.
- title: Dereferentie
  content_markdown: |
    Het proces van het benaderen/manipuleren van gegevens waarnaar
    een *referentie* (bijv. `&i32`) verwijst, wordt *dereferentie*
    genoemd.

    Referenties worden op twee manieren gebruikt om gegevens te
    benaderen/manipuleren:
    * Toegang tot de gerefereerde gegevens tijdens het toewijzen van variabelen.
    * Toegang tot velden of methoden van de gerefereerde gegevens.

    Rust heeft enkele krachtige operatoren die ons dit laten doen.
- title: De *-Operator
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    De `*`-operator is een expliciete manier om een referentie te
    dereferentiëren.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Geheugendetail:

    - Omdat i32 een primitief type is dat de trait `Copy`
    implementeert, worden de bytes van variabele `a` op de stack
    gekopieerd naar de bytes van variabele `b`.
- title: De .-Operator
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    De `.`-operator wordt gebruikt om velden en methoden van een
    referentie te benaderen. Het werkt iets subtieler.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    Wauw, waarom hoefden we geen `***` toe te voegen vóór
    `ref_ref_ref_f`? Dit komt doordat de `.`-operator automatisch
    een keten van referenties dereferentieert. Die laatste regel
    wordt automatisch door de compiler omgezet in het volgende:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart Pointers
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Naast de mogelijkheid om referenties te maken naar bestaande
    getypeerde gegevens met de `&`-operator, geeft Rust ons de
    mogelijkheid om *referentie-achtige* structs te maken, genaamd
    **smart pointers**.


    We kunnen referenties op hoog niveau zien als een type dat ons
    toegang geeft tot een ander type. Smart pointers verschillen in
    hun gedrag van gewone referenties doordat ze opereren op basis
    van interne logica die door de programmeur wordt geschreven. U —
    de programmeur — bent het *smart*-gedeelte.


    Doorgaans implementeren smart pointers de traits `Deref`,
    `DerefMut` en `Drop` om de logica te specificeren van wat er moet
    gebeuren wanneer de structuur wordt gedereferentieerd met de `*`-
    en `.`-operatoren.
- title: Smart Unsafe-Code
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Smart pointers gebruiken vrij vaak *unsafe*-code. Zoals eerder
    vermeld, zijn het gebruikelijke hulpmiddelen voor het interageren
    met de laagste niveaus van het geheugen in Rust.


    Wat is unsafe-code? Unsafe-code gedraagt zich precies als normale
    Rust-code, met uitzondering van enkele mogelijkheden waarover de
    Rust-compiler geen garanties kan geven.


    Een belangrijke mogelijkheid van unsafe-code is het
    *dereferentiëren van een raw pointer*. Dat betekent het nemen
    van een *raw pointer* naar een positie in het geheugen en te
    verklaren "hier bestaat een gegevensstructuur!", en het om te
    zetten in een representatie van gegevens die u kunt gebruiken
    (bijv. `*const u8` naar `u8`).


    Rust heeft geen manier om de betekenis bij te houden van elke
    byte die naar het geheugen wordt geschreven. Omdat Rust geen
    garanties kan geven over wat er bestaat op een willekeurig getal
    dat wordt gebruikt als *raw pointer*, plaatst het de dereferentie
    in een `unsafe { ... }`-blok.


    Smart pointers *dereferentiëren raw pointers* uitgebreid, maar ze
    zijn goed getest in wat ze doen.
- title: Bekende Vrienden
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Laten we nadenken over enkele smart pointers die we al hebben
    gezien, zoals `Vec<T>` en `String`.


    `Vec<T>` is een smart pointer die simpelweg een geheugenregio van
    bytes bezit. De Rust-compiler heeft geen idee wat er in deze
    bytes zit. De smart pointer interpreteert wat het betekent om
    items uit de geheugenregio te halen die het beheert, houdt bij
    waar gegevensstructuren binnen die bytes beginnen en eindigen, en
    dereferentieert uiteindelijk een raw pointer naar
    gegevensstructuren in een mooie, ergonomische interface voor ons
    om te gebruiken (bijv. `my_vec[3]`).


    Op vergelijkbare wijze houdt `String` een geheugenregio van bytes
    bij, en beperkt programmatisch de inhoud die erin wordt
    geschreven om altijd geldige `utf-8` te zijn, en helpt die
    geheugenregio te dereferentiëren naar een type `&str`.


    Beide gegevensstructuren gebruiken unsafe dereferentie van raw
    pointers om hun werk te doen.


    Geheugendetails:

    * Rust heeft een equivalent van de `malloc` van C, met behulp
    van [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html)
    en [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html)
    om eigen geheugenregio's te verkrijgen om te beheren.
- title: Op De Heap Gealloceerd Geheugen
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` is een smart pointer waarmee we gegevens van de stack naar
    de heap kunnen verplaatsen.


    Door dereferentie kunnen we de op de heap gealloceerde gegevens
    ergonomisch gebruiken, alsof het het oorspronkelijke type was.
- title: Falende Main Opnieuw Bekeken
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Rust-code kan een overvloed aan representaties van fouten hebben,
    maar de standaardbibliotheek heeft een universele trait
    `std::error::Error` voor het beschrijven van fouten.


    Met behulp van een smart pointer `Box` kunnen we het type
    `Box<dyn Error>` gebruiken als een gemeenschappelijk type voor
    het teruggeven van fouten, omdat het ons in staat stelt een fout
    op de heap te propageren en er op hoog niveau mee te interageren
    zonder een specifiek type te hoeven kennen.


    Eerder in Tour of Rust hebben we geleerd dat `main` een fout kan
    teruggeven. We kunnen nu een type teruggeven dat bijna elke
    soort fout kan beschrijven die in ons programma kan optreden,
    zolang de gegevensstructuur van de fout de gemeenschappelijke
    `Error`-trait van Rust implementeert.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Referentietelling
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` is een smart pointer die gegevens van de stack naar de heap
    verplaatst. Het stelt ons in staat om andere `Rc`-smart pointers
    te klonen, die allemaal de mogelijkheid hebben om de op de heap
    geplaatste gegevens niet-wijzigbaar te lenen.


    Pas wanneer de laatste smart pointer wordt gedropt, worden de
    gegevens op de heap uiteindelijk gedealloceerd.
- title: Toegang Delen
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` is een gegevensstructuur-container, vaak in bezit van
    smart pointers, die gegevens ontvangt en ons in staat stelt om
    wijzigbare en niet-wijzigbare referenties te lenen naar wat het
    bevat. Het voorkomt misbruik van lenen door de
    geheugenveiligheidsregels van Rust tijdens runtime af te dwingen
    wanneer u vraagt om de gegevens erin te lenen:


    **Slechts één wijzigbare referentie OF meerdere niet-wijzigbare
    referenties, nooit beide!**


    Als u deze regels overtreedt, zal `RefCell` panicken.
- title: Delen Tussen Threads
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` is een gegevensstructuur-container, vaak in bezit van
    smart pointers, die gegevens ontvangt en ons in staat stelt om
    wijzigbare en niet-wijzigbare referenties te lenen naar de
    gegevens erin. Dit voorkomt misbruik van lenen doordat het
    besturingssysteem slechts één CPU-thread tegelijk toegang geeft
    tot de gegevens, waarbij andere threads worden geblokkeerd
    totdat die oorspronkelijke thread klaar is met zijn vergrendelde
    lening.


    Multithreading valt buiten de scope van Tour of Rust, maar
    `Mutex` is een fundamenteel onderdeel bij het coördineren van
    meerdere CPU-threads die toegang hebben tot dezelfde gegevens.


    Er is een speciale smart pointer `Arc`, die identiek is aan `Rc`
    behalve dat het een thread-veilige verhoging van
    referentietellingen gebruikt. Het wordt vaak gebruikt om veel
    referenties naar dezelfde `Mutex` te hebben.
- title: Smart Pointers Combineren
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Smart pointers lijken misschien beperkt, maar ze kunnen zeer
    krachtige combinaties vormen.


    `Rc<Vec<Foo>>` - Staat het klonen toe van meerdere smart pointers
    die dezelfde vector van niet-wijzigbare gegevensstructuren op de
    heap kunnen lenen.


    `Rc<RefCell<Foo>>` - Geeft meerdere smart pointers de
    mogelijkheid om, wijzigbaar/niet-wijzigbaar, dezelfde struct
    `Foo` te lenen.


    `Arc<Mutex<Foo>>` - Geeft meerdere smart pointers de mogelijkheid
    om tijdelijke wijzigbare/niet-wijzigbare leningen te vergrendelen
    op een manier die exclusief is voor één CPU-thread.


    Geheugendetail:

    * U zult een terugkerend thema opmerken in veel van deze
    combinaties. Het gebruik van een niet-wijzigbaar gegevenstype
    (mogelijk in bezit van meerdere smart pointers) om interne
    gegevens te wijzigen. Dit wordt in Rust het "interior mutability"
    patroon genoemd (interne wijzigbaarheid). Het is een patroon
    waarmee we de regels van geheugengebruik tijdens runtime kunnen
    buigen, met hetzelfde veiligheidsniveau als de controles van
    Rust tijdens het compileren.
- title: Hoofdstuk 8 - Conclusie
  content_markdown: >
    Smart pointers zijn de idiomen van Rust-programmeren en zorgen
    ervoor dat we de zeer gebruikelijke patronen van geheugengebruik
    niet opnieuw hoeven te creëren. Hiermee bent u klaar om de
    lastigste uitdagingen aan te pakken! Nu we de basis van Rust
    hebben, laten we het even hebben over hoe we grotere projecten
    maken. In hoofdstuk 9 breken we uit de coderegels van één enkele
    pagina.
