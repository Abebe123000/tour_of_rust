- title: 2. Fejezet - Egyszerű ciklusok és elágazások
  content_markdown: |
    Ebben a fejezetben a Rust alapvető ciklusairól és elágazásairól lesz szó. Ha használtál már C-re
    alapuló nyelveket, akkor itt otthon fogod magad érezni, bár érhet egy-két meglepetés is.
- title: if/else if/else
  content_markdown: |
    A Rust elágazásai nem éppen meglepőek.

    Az elágazások feltételei nincsenek zárójelbe téve. Őszintén, volt bármikor is szükségünk ezekre?
    A logika így szépen és tisztán néz ki.

    Minden logikai és összehasonlító operátor ugyanúgy működik: `==`, `!=`, `<`, `>`, `<=`, `>=`,
    `!`, `||`, `&&`.
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("less than 42");
        } else if x == 42 {
            println!("is 42");
        } else {
            println!("greater than 42");
        }
    }
- title: loop
  content_markdown: |
    Szükséged volna egy végtelen ciklusra?

    A Rust-tal ez egyszerű.

    A `break` utasítás pedig kitör a ciklusból, ha arra van szükség.

    A `loop`-nak van egy titka, amire hamarosan még kitérünk.
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    A `while` segítségével egy feltételt szabhatsz a ciklusodnak.

    Amint a feltétel `false` (hamis) értéket vesz, a ciklus megszakad.
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
    }
- title: for
  content_markdown: |
    A Rust `for` ciklusa egy hatalmas előrelépést jelent. Képes minden iterátorrá váló kifejezés
    elemein végiglépkedni. Mit is jelent az, hogy valami iterátor? Olyan objektumok, amiknél
    megkérdezhető, hogy "Mi a következő elem?" egészen addig, amíg már nem marad elem.

    Ezt egy későbbi fejezetben jobban is át fogjuk nézni. Addig is elég ha azt tudod, hogy a Rust
    egyszerűvé teszi a számok sorait létrehozó iterárotok készítését.

    A `..` operátor egy olyan iterátort hoz létre, ami egy megadott kezdőszámtól elszámol a megadott
    végső szám előtti számig.

    A `..=` operátor pedig ugyanezt teszi, viszont ekkor a végső szám is benne van a sorban.
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: |
    Hiányolod a switch szerkezetet? A Rust rendelkezik egy nagyon hasznos kulcsszóval, ami lehetővé
    teszi, hogy minden lehetséges esetet lekezelj úgy, hogy ezek közül az első illeszkedő ág fog
    lefutni. Egyelőre azt fogjuk megnézni, hogy ez hogyan működik számok esetén. A későbbi fejezetek
    során még több szó is lesz az ennél komplexebb adatok mintáinak összehasonlításáról. Ígérem,
    megéri várni rá!

    A `match` szerkezet elvárja, hogy az összes eset le legyen kezelve.

    Az adatok szétbontásával kombinált összehasonlítás a Rust egyik leggyakrabban előforduló
    mintája.
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // we can match against multiple values
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // we can match against ranges
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // we can bind the matched number to a variable
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // this is the default match that must exist if not all cases are handled
            _ => {
                println!("found something else!");
            }
        }
    }
- title: Értékkel való visszatérés ciklusokból
  content_markdown: |
    Lehetséges úgy kitörni egy `loop`-ból, hogy közben egy értékkel is visszatérünk.
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "found the 13";
            }
        };
        println!("from loop: {}", v);
    }
- title: Értékkel való visszatérés blokk kifejezésekből
  content_markdown: |
    Az `if`, a `match`, a függvények és a változók hatásköreit jelző blokkok mind képesek értékkel
    visszatérni a Rust nyelvben.

    Ha ezekben az utolsó utasítás egy nem `;`-vel lezárt kifejezés, akkor a Rust automatikusan
    visszatér ennek az értékével. Ez remek arra, hogy tömör logikai kifejezéseket írhassunk, melyek
    ezután változókba kerülnek.

    Figyeljük meg, hogy ennek segítségével az `if` utasítást használhatjuk úgy, mint más nyelvekben
    a `feltétel ? ha_igaz : ha_hamis` operátort.
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust's ternary expression
        let v = if x < 42 { -1 } else { 1 };
        println!("from if: {}", v);

        let food = "hamburger";
        let result = match food {
            "hotdog" => "is hotdog",
            // notice the braces are optional when its just a single return expression
            _ => "is not hotdog",
        };
        println!("identifying food: {}", result);

        let v = {
            // This scope block lets us get a result without polluting function scope
            let a = 1;
            let b = 2;
            a + b
        };
        println!("from block: {}", v);

        // The idiomatic way to return a value in rust from a function at the end
        v + 4
    }

    fn main() {
        println!("from function: {}", example());
    }
- title: 2. Fejezet - Konklúzió
  content_markdown: |
    Remélhetőleg ezzel sikerült egy kis betekintést nyújtanom a Rust alapvető képességeibe és az
    ezekben megbúvó erőbe. A későbbiekben még több szót is ejtünk a `for`-ról és a `match`-ről,
    amint eleget tanultunk ahhoz, hogy az előzőleg átvetteknél bonyolultabb képességeiket is
    hasznosítani tudjuk.
