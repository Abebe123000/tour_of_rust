- title: Κεφάλαιο 6 - Κείμενο
  content_markdown: >
    Τώρα που καταλαβαίνουμε λίγο το πώς σκέφτεται η Rust τη μνήμη, είμαστε
    έτοιμοι να μιλήσουμε για το κείμενο με περισσότερη λεπτομέρεια.


    Η Rust ενδιαφέρεται πολύ για το διεθνές κείμενο και για ζητήματα σε
    επίπεδο byte που ίσως να μη σας είναι οικεία από άλλες γλώσσες.
    Τούτου λεχθέντος, η Rust διαθέτει πολλά εξαιρετικά εργαλεία για τη
    διαχείριση αυτών των ζητημάτων.
- title: Κυριολεκτικές συμβολοσειρές
  content_markdown: >
    Οι κυριολεκτικές συμβολοσειρές είναι πάντα σε Unicode.


    Ο τύπος των κυριολεκτικών συμβολοσειρών είναι `&'static str`:


    * Το `&` σημαίνει ότι αναφέρεται σε μία θέση στη μνήμη, και η απουσία
    `&mut` σημαίνει ότι ο μεταφραστής δεν θα επιτρέψει τροποποίηση

    * Το `'static` σημαίνει ότι τα δεδομένα της συμβολοσειράς θα είναι
    διαθέσιμα μέχρι το τέλος του προγράμματός μας (δεν απορρίπτονται
    ποτέ)

    * Το `str` σημαίνει ότι δείχνει σε μία ακολουθία από byte που είναι
    πάντα έγκυρα **utf-8**


    Λεπτομέρειες μνήμης:

    * Ο μεταφραστής της Rust πιθανότατα θα τοποθετήσει τη συμβολοσειρά
    σας στο τμήμα δεδομένων της μνήμης του προγράμματός σας
  code: |
    fn main() {
        let a: &'static str = "hi 🦀";
        println!("{} {}", a, a.len());
    }
- title: Τι είναι το utf-8
  content_markdown: "Καθώς όλο και περισσότερες γλώσσες χρησιμοποιούνταν στους υπολογιστές, ο κόσμος χρειαζόταν έναν τρόπο ν' αναπαραστήσει περισσότερους χαρακτήρες κειμένου\nαπ' όσους επέτρεπε το ASCII (1 byte επέτρεπε μόνο 256 χαρακτήρες). \n\nΈτσι εισήχθη το **utf-8**, με μεταβλητό μήκος από 1 έως 4 byte, αυξάνοντας σημαντικά το εύρος των δυνατών χαρακτήρων.\n\nΈνα πλεονέκτημα των χαρακτήρων μεταβλητού μεγέθους είναι ότι το κείμενο δεν έχει περιττά byte για τους πολύ συνήθεις χαρακτήρες ASCII (που εξακολουθούν να χρειάζονται μόνο 1 byte στο **utf-8**).\n\nΈνα μειονέκτημα των χαρακτήρων μεταβλητού μεγέθους είναι ότι η αναζήτηση ενός χαρακτήρα δεν μπορεί πια να γίνει γρήγορα \n(σε σταθερό χρόνο **O(1)**) με απλή δεικτοδότηση (π.χ. `my_text[3]` για να πάρουμε τον 4ο χαρακτήρα). Είναι πιθανό οι \nπροηγούμενοι χαρακτήρες να έχουν μεταβλητό πλάτος, αλλάζοντας το πού πραγματικά ξεκινάει ο 4ος χαρακτήρας μέσα στην ακολουθία byte.\n\nΑντ' αυτού πρέπει να διατρέξουμε μία ακολουθία byte **utf-8** για να καταλάβουμε πού πραγματικά ξεκινούν οι χαρακτήρες Unicode (σε γραμμικό χρόνο **O(n)**).\n\nFerris: «Κυρίως χαίρομαι που έχω το **utf-8** για ν' αναπαριστώ τα emoji των υποβρύχιων φίλων μου.»\n\n<span class=\"emoji\">\U0001F420\U0001F419\U0001F41F\U0001F42C\U0001F40B</span>\n"
- title: Διαφυγή χαρακτήρων
  content_markdown: >
    Είναι δύσκολο να αναπαρασταθούν οπτικά ορισμένοι χαρακτήρες, γι' αυτό
    οι **κωδικοί διαφυγής** μάς επιτρέπουν να βάλουμε ένα σύμβολο στη
    θέση τους.


    Η Rust υποστηρίζει τους συνήθεις κωδικούς διαφυγής από γλώσσες
    βασισμένες στη C:

    * `\n` - νέα γραμμή

    * `\r` - επαναφορά κεφαλής (carriage return)

    * `\t` - στηλοθέτης (tab)

    * `\\` - ανάστροφη κάθετος

    * `\0` - μηδενικός χαρακτήρας

    * `\'` - μονό εισαγωγικό


    Ο πλήρης κατάλογος υπάρχει
    [εδώ](https://doc.rust-lang.org/reference/tokens.html).
  code: |
    fn main() {
        let a: &'static str = "Ferris says:\t\"hello\"";
        println!("{}",a);
    }
- title: Κυριολεκτικές συμβολοσειρές πολλαπλών γραμμών
  content_markdown: |
    Οι συμβολοσειρές στη Rust είναι εξ ορισμού πολλαπλών γραμμών.

    Χρησιμοποιήστε ένα `\` στο τέλος μίας γραμμής αν δεν θέλετε αλλαγή
    γραμμής εκεί.
  code: |
    fn main() {
        let haiku: &'static str = "
            I write, erase, rewrite
            Erase again, and then
            A poppy blooms.
            - Tachibana Hokushi";
        println!("{}", haiku);
        
        
        println!("hello \
        world") // notice that the spacing before w is ignored
    }
- title: Ακατέργαστες κυριολεκτικές συμβολοσειρές
  content_markdown: >
    Οι ακατέργαστες συμβολοσειρές μάς επιτρέπουν να γράψουμε μία
    ακολουθία χαρακτήρων αυτολεξεί, ξεκινώντας με `r#"` και τελειώνοντας
    με `"#`. Αυτό μάς επιτρέπει να εισάγουμε χαρακτήρες που διαφορετικά
    θα μπέρδευαν μία κανονική συμβολοσειρά ως κυριολεκτικά σύμβολα (όπως
    τα διπλά εισαγωγικά και οι ανάστροφες κάθετοι).
  code: |
    fn main() {
        let a: &'static str = r#"
            <div class="advice">
                Raw strings are useful for some situations.
            </div>
            "#;
        println!("{}", a);
    }
- title: Κυριολεκτικές συμβολοσειρές από αρχεία
  content_markdown: >
    Αν έχετε κάποιο πολύ μεγάλο κείμενο, σκεφτείτε να χρησιμοποιήσετε τη
    μακροεντολή `include_str!` για να συμπεριλάβετε κείμενο από τοπικά
    αρχεία στο πρόγραμμά σας:


    ```rust

    let hello_html = include_str!("hello.html");

    ```
- title: Τμήμα συμβολοσειράς
  content_markdown: >
    Ένα τμήμα συμβολοσειράς είναι μία αναφορά σε μία ακολουθία byte στη
    μνήμη που πρέπει πάντα να είναι έγκυρο utf-8.


    Ένα τμήμα (ένα υπο-τμήμα) ενός τμήματος `str` πρέπει επίσης να είναι
    έγκυρο utf-8.


    Συνήθεις μέθοδοι του `&str`:

    * Η `len` δίνει το μήκος της κυριολεκτικής συμβολοσειράς σε byte
    (όχι τον αριθμό χαρακτήρων).

    * Οι `starts_with`/`ends_with` για βασικούς ελέγχους.

    * Η `is_empty` επιστρέφει `true` αν το μήκος είναι μηδέν.

    * Η `find` επιστρέφει ένα `Option<usize>` με την πρώτη θέση κάποιου
    κειμένου.
  code: |
    fn main() {
        let a = "hi 🦀";
        println!("{}", a.len());
        let first_word = &a[0..2];
        let second_word = &a[3..7];
        // let half_crab = &a[3..5]; FAILS
        // Rust does not accept slices of invalid unicode characters
        println!("{} {}", first_word, second_word);
    }
- title: Χαρακτήρες (Chars)
  content_markdown: >
    Με τόση δυσκολία στη δουλειά με το Unicode, η Rust προσφέρει έναν
    τρόπο ν' ανακτήσουμε μία ακολουθία byte utf-8 ως ένα άνυσμα
    χαρακτήρων τύπου `char`.


    Ένας `char` έχει πάντα μήκος 4 byte (επιτρέποντας αποδοτική
    αναζήτηση μεμονωμένων χαρακτήρων).
  code: |
    fn main() {
        // collect the characters as a vector of char
        let chars = "hi 🦀".chars().collect::<Vec<char>>();
        println!("{}", chars.len()); // should be 4
        // since chars are 4 bytes we can convert to u32
        println!("{}", chars[3] as u32);
    }
- title: Η Συμβολοσειρά (String)
  content_markdown: >
    Η **Συμβολοσειρά** (`String`) είναι μία δομή που έχει την κυριότητα
    μίας ακολουθίας byte utf-8 στη μνήμη σωρού.


    Επειδή η μνήμη της βρίσκεται στο σωρό, μπορεί να επεκταθεί, να
    τροποποιηθεί κ.λπ., με τρόπους που δεν μπορούν οι κυριολεκτικές
    συμβολοσειρές.


    Συνήθεις μέθοδοι:


    * Η `push_str` για να προσθέσετε περισσότερα byte utf-8 στο τέλος
    μίας συμβολοσειράς.

    * Η `replace` για ν' αντικαταστήσετε ακολουθίες byte utf-8 με
    άλλες.

    * Οι `to_lowercase`/`to_uppercase` για αλλαγές πεζών/κεφαλαίων.

    * Η `trim` για ν' αφαιρέσετε κενά.


    Όταν μία Συμβολοσειρά απορρίπτεται, απορρίπτεται και η μνήμη σωρού
    της.


    Η `String` διαθέτει έναν τελεστή `+` που επεκτείνει τη συμβολοσειρά
    με ένα `&str` και επιστρέφει τον εαυτό της, αλλά ίσως να μην είναι
    τόσο βολικό όσο θα ελπίζατε.
  code: |
    fn main() {
        let mut helloworld = String::from("hello");
        helloworld.push_str(" world");
        helloworld = helloworld + "!";
        println!("{}", helloworld);
    }
- title: Το κείμενο ως παράμετρος συναρτήσεων
  content_markdown: >
    Οι κυριολεκτικές συμβολοσειρές και οι συμβολοσειρές περνιούνται
    γενικά σε συναρτήσεις ως τμήμα συμβολοσειράς. Αυτό προσφέρει μεγάλη
    ευελιξία στις περισσότερες περιπτώσεις όπου στην πραγματικότητα δεν
    χρειάζεται να μεταβιβάσετε την κυριότητα.
  code: |
    fn say_it_loud(msg:&str){
        println!("{}!!!",msg.to_string().to_uppercase());
    }

    fn main() {
        // say_it_loud can borrow &'static str as a &str
        say_it_loud("hello");
        // say_it_loud can also borrow String as a &str
        say_it_loud(&String::from("goodbye"));
    }
- title: Κατασκευή συμβολοσειρών
  content_markdown: |
    Οι `concat` και `join` είναι δύο απλοί αλλά ισχυροί τρόποι για την
    κατασκευή συμβολοσειρών.
  code: |
    fn main() {
        let helloworld = ["hello", " ", "world", "!"].concat();
        let abc = ["a", "b", "c"].join(",");
        println!("{}", helloworld);
        println!("{}",abc);
    }
- title: Μορφοποίηση συμβολοσειρών
  content_markdown: >
    Η μακροεντολή `format!` μάς επιτρέπει να δημιουργήσουμε μία
    συμβολοσειρά ορίζοντας μία παραμετροποιημένη συμβολοσειρά με σύμβολα
    υποκατάστασης για το πού και πώς πρέπει να τοποθετηθούν οι τιμές
    (π.χ. `{}`).


    Η `format!` χρησιμοποιεί τις ίδιες παραμετροποιημένες συμβολοσειρές
    όπως η `println!`


    Οι δυνατότητες αυτής της συνάρτησης είναι πολύ ευρείες για το
    πλαίσιο της *Ξενάγησης στη Rust*· δείτε την τεκμηρίωση
    [εδώ](https://doc.rust-lang.org/std/fmt/).
  code: |
    fn main() {
        let a = 42;
        let f = format!("secret to life: {}",a);
        println!("{}",f);
    }
- title: Μετατροπή συμβολοσειρών
  content_markdown: |
    Πολλοί τύποι μπορούν να μετατραπούν σε συμβολοσειρά χρησιμοποιώντας
    την `to_string`.

    Η γενική συνάρτηση `parse` μπορεί να χρησιμοποιηθεί για να μετατρέψει
    συμβολοσειρές ή κυριολεκτικές συμβολοσειρές σε μία τιμή συγκεκριμένου
    τύπου. Αυτή η συνάρτηση επιστρέφει ένα `Result` επειδή μπορεί ν'
    αποτύχει.
  code: |
    fn main() -> Result<(), std::num::ParseIntError> {
        let a = 42;
        let a_string = a.to_string();
        let b = a_string.parse::<i32>()?;
        println!("{} {}", a, b);
        Ok(())
    }
- title: Κεφάλαιο 6 - Κατάληξη
  content_markdown: >
    Τώρα ξέρετε τα βασικά του κειμένου! Όπως είδατε, το Unicode κάνει τη
    δουλειά με το κείμενο λίγο πιο περίπλοκη, αλλά η βασική βιβλιοθήκη
    διαθέτει άφθονη λειτουργικότητα που τη διευκολύνει.


    Μέχρι τώρα έχουμε κοιτάξει τη Rust κυρίως μέσα απ' το πρίσμα ενός
    διαδικαστικού παραδείγματος (δηλαδή απλώς συναρτήσεις και δεδομένα),
    αλλά ήρθε η ώρα να μιλήσουμε για τα traits και τις δυνατότητες που
    ξεκλειδώνει το αντικειμενοστραφές παράδειγμα της Rust.
