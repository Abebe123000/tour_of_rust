- title: Κεφάλαιο 8 - Smart Pointers
  content_markdown: >
    Σ' αυτό το κεφάλαιο θα αποδομήσουμε τους smart pointers. Ας
    εξερευνήσουμε αυτές τις δομές δεδομένων που μάς επιτρέπουν ν'
    αλληλεπιδρούμε με το χαμηλότερο επίπεδο της μνήμης.


    Ο Ferris λέει: «Μην αισθάνεστε πνιγμένοι απ' αυτό το κεφάλαιο αν δεν
    νιώθετε ότι μπορείτε να γράψετε τον δικό σας κώδικα διαχείρισης
    μνήμης χαμηλού επιπέδου μετά από ένα σύντομο διάβασμα. Αυτό το
    κεφάλαιο υπάρχει κυρίως για να σάς γνωρίσει μερικά χρήσιμα εργαλεία
    και να σάς δώσει μία γεύση του πώς λειτουργούν!»
- title: Οι αναφορές ξανά
  content_markdown: >
    Μία αναφορά είναι στην ουσία απλώς ένας αριθμός που είναι η θέση
    εκκίνησης κάποιων byte στη μνήμη. Ο μοναδικός σκοπός της είναι ν'
    αναπαραστήσει την έννοια του πού υπάρχουν δεδομένα ενός συγκεκριμένου
    τύπου. Αυτό που κάνει μία αναφορά διαφορετική από έναν απλό αριθμό
    είναι ότι η Rust επαληθεύει πως ο βίος των αναφορών δεν διαρκεί
    περισσότερο απ' αυτό στο οποίο αναφέρονται (αλλιώς θα παίρναμε
    σφάλμα όταν τη χρησιμοποιούσαμε!).
- title: Ακατέργαστοι δείκτες
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    Οι αναφορές μπορούν να μετατραπούν σε έναν πιο πρωτόγονο τύπο που
    ονομάζεται *ακατέργαστος δείκτης* (raw pointer). Όπως κι ένας αριθμός,
    μπορεί ν' αντιγραφεί και να μετακινηθεί με λίγους περιορισμούς. Η
    Rust δεν παρέχει καμία διαβεβαίωση για την εγκυρότητα της θέσης
    μνήμης στην οποία δείχνει.


    Υπάρχουν δύο είδη ακατέργαστων δεικτών:


    * `*const T` - Ένας ακατέργαστος δείκτης προς δεδομένα τύπου T που
    δεν πρέπει ποτέ ν' αλλάξουν.

    * `*mut T` - Ένας ακατέργαστος δείκτης προς δεδομένα τύπου T που
    μπορούν ν' αλλάξουν.


    Οι ακατέργαστοι δείκτες μπορούν να μετατραπούν σε αριθμούς (π.χ.
    `usize`) και αντίστροφα.


    Οι ακατέργαστοι δείκτες μπορούν να έχουν πρόσβαση σε δεδομένα μέσω
    *unsafe* κώδικα (περισσότερα γι' αυτό αργότερα).


    Λεπτομέρειες μνήμης:

    * Μία αναφορά στη Rust είναι πολύ παρόμοια μ' έναν δείκτη στη C όσον
    αφορά τη χρήση της, αλλά με πολύ περισσότερους περιορισμούς κατά τη
    μεταγλώττιση σχετικά με το πώς μπορεί ν' αποθηκευτεί και να
    μετακινηθεί σε άλλες συναρτήσεις.
    * Ένας ακατέργαστος δείκτης στη Rust μοιάζει μ' έναν δείκτη στη C,
    καθώς αναπαριστά έναν αριθμό που μπορεί ν' αντιγραφεί ή να
    μετακινηθεί, ακόμα και να μετατραπεί σε αριθμητικούς τύπους όπου
    μπορεί να τροποποιηθεί σαν αριθμός για αριθμητική δεικτών.
- title: Αναίρεση αναφοράς δεικτών
  content_markdown: |
    Η διαδικασία πρόσβασης/χειρισμού δεδομένων στα οποία δείχνει μία
    *αναφορά* (π.χ. `&i32`) ονομάζεται *αναίρεση αναφοράς*
    (dereferencing).

    Οι αναφορές χρησιμοποιούνται για την πρόσβαση/χειρισμό δεδομένων με
    δύο τρόπους:
    * Πρόσβαση στα δεδομένα στα οποία δείχνουν, κατά την ανάθεση μεταβλητών.
    * Πρόσβαση σε πεδία ή μεθόδους των δεδομένων στα οποία δείχνουν.

    Η Rust διαθέτει ισχυρούς τελεστές που μάς επιτρέπουν να το κάνουμε
    αυτό.
- title: Ο τελεστής *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    Ο τελεστής `*` είναι ένας ρητός τρόπος ν' αναιρέσουμε την αναφορά
    μίας αναφοράς.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Λεπτομέρεια μνήμης:

    - Επειδή το i32 είναι ένας πρωτόγονος τύπος που υλοποιεί το trait
    `Copy`, τα byte της μεταβλητής `a` στη στοίβα αντιγράφονται στα byte
    της μεταβλητής `b`.
- title: Ο τελεστής .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    Ο τελεστής `.` χρησιμοποιείται για την πρόσβαση σε πεδία και μεθόδους
    μίας αναφοράς. Λειτουργεί κάπως πιο υπόγεια.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    Ουάου, γιατί δεν χρειάστηκε να προσθέσουμε `***` πριν το
    `ref_ref_ref_f`; Αυτό συμβαίνει επειδή ο τελεστής `.` αναιρεί
    αυτόματα την αναφορά μίας ολόκληρης ακολουθίας αναφορών. Αυτή η
    τελευταία γραμμή μετατρέπεται αυτόματα απ' τον μεταφραστή στην εξής:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart pointers
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Εκτός απ' τη δυνατότητα να δημιουργούμε αναφορές προς υπάρχοντα
    τυποποιημένα δεδομένα με τον τελεστή `&`, η Rust μάς δίνει τη
    δυνατότητα να δημιουργούμε δομές *σαν αναφορές*, που ονομάζονται
    **smart pointers**.


    Μπορούμε να σκεφτούμε τις αναφορές, σε υψηλό επίπεδο, ως έναν τύπο
    που μάς δίνει πρόσβαση σ' έναν άλλο τύπο. Οι smart pointers διαφέρουν
    στη συμπεριφορά τους από τις κανονικές αναφορές, καθώς λειτουργούν
    βάσει εσωτερικής λογικής που γράφει ο προγραμματιστής. Εσείς — ο
    προγραμματιστής — είστε το *smart* κομμάτι.


    Συνήθως οι smart pointers υλοποιούν τα traits `Deref`, `DerefMut` και
    `Drop` για να καθορίσουν τη λογική του τι πρέπει να συμβεί όταν η
    δομή αναιρεί την αναφορά της με τους τελεστές `*` και `.`.
- title: Smart unsafe κώδικας
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Οι smart pointers τείνουν να χρησιμοποιούν αρκετά συχνά *unsafe*
    κώδικα. Όπως αναφέρθηκε νωρίτερα, είναι κοινά εργαλεία για την
    αλληλεπίδραση με τα χαμηλότερα επίπεδα της μνήμης στη Rust.


    Τι είναι ο unsafe κώδικας; Ο unsafe κώδικας συμπεριφέρεται ακριβώς
    όπως ο κανονικός κώδικας Rust, με εξαίρεση κάποιες δυνατότητες για
    τις οποίες ο μεταφραστής της Rust δεν μπορεί να παρέχει εγγυήσεις.


    Μία βασική δυνατότητα του unsafe κώδικα είναι η *αναίρεση αναφοράς
    ενός ακατέργαστου δείκτη*. Αυτό σημαίνει να παίρνουμε έναν
    *ακατέργαστο δείκτη* προς μία θέση στη μνήμη και να δηλώνουμε «εδώ
    υπάρχει μία δομή δεδομένων!», μετατρέποντάς τον σε μία αναπαράσταση
    δεδομένων που μπορούμε να χρησιμοποιήσουμε (π.χ. `*const u8` σε
    `u8`).


    Η Rust δεν έχει τρόπο να παρακολουθεί τη σημασία κάθε byte που
    γράφεται στη μνήμη. Επειδή η Rust δεν μπορεί να παρέχει εγγυήσεις
    για το τι υπάρχει σε έναν αυθαίρετο αριθμό που χρησιμοποιείται ως
    *ακατέργαστος δείκτης*, τοποθετεί την αναίρεση αναφοράς μέσα σ' ένα
    μπλοκ `unsafe { ... }`.


    Οι smart pointers *αναιρούν την αναφορά ακατέργαστων δεικτών*
    εκτενώς, αλλά είναι καλά δοκιμασμένοι σ' αυτό που κάνουν.
- title: Παλιοί γνώριμοι
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Ας σκεφτούμε μερικούς smart pointers που έχουμε ήδη δει, όπως το
    `Vec<T>` και το `String`.


    Το `Vec<T>` είναι ένας smart pointer που απλώς έχει την κυριότητα
    μίας περιοχής μνήμης από byte. Ο μεταφραστής της Rust δεν έχει ιδέα
    τι υπάρχει σ' αυτά τα byte. Ο smart pointer ερμηνεύει τι σημαίνει να
    πάρουμε στοιχεία απ' την περιοχή μνήμης που διαχειρίζεται, κρατά
    λογαριασμό του πού ξεκινούν και πού τελειώνουν οι δομές δεδομένων
    μέσα σ' αυτά τα byte, και τέλος αναιρεί την αναφορά ενός ακατέργαστου
    δείκτη σε δομές δεδομένων, δίνοντάς μας μία ωραία, εργονομική
    διεπαφή για χρήση (π.χ. `my_vec[3]`).


    Παρομοίως, το `String` κρατά λογαριασμό μίας περιοχής μνήμης από
    byte, περιορίζει προγραμματιστικά το περιεχόμενο που γράφεται σ'
    αυτήν ώστε να είναι πάντα έγκυρο `utf-8`, και βοηθά ν' αναιρεθεί η
    αναφορά αυτής της περιοχής μνήμης σ' έναν τύπο `&str`.


    Και οι δύο αυτές δομές δεδομένων χρησιμοποιούν unsafe αναίρεση
    αναφοράς ακατέργαστων δεικτών για να κάνουν τη δουλειά τους.


    Λεπτομέρειες μνήμης:

    * Η Rust έχει ένα αντίστοιχο της `malloc` της C, χρησιμοποιώντας τις
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html) και
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html) για
    ν' αποκτήσουμε δικές μας περιοχές μνήμης προς διαχείριση.
- title: Μνήμη δεσμευμένη στο σωρό
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    Το `Box` είναι ένας smart pointer που μάς επιτρέπει να μετακινήσουμε
    δεδομένα από τη στοίβα στο σωρό.


    Η αναίρεση της αναφοράς του μάς επιτρέπει να χρησιμοποιήσουμε τα
    δεδομένα που βρίσκονται στο σωρό εργονομικά, σαν να ήταν ο αρχικός
    τύπος.
- title: Η Main ξανά, ενδεχομένως εσφαλμένη
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Ο κώδικας Rust μπορεί να 'χει πληθώρα αναπαραστάσεων σφαλμάτων, αλλά
    η βασική βιβλιοθήκη διαθέτει ένα καθολικό trait `std::error::Error`
    για την περιγραφή σφαλμάτων.


    Χρησιμοποιώντας τον smart pointer `Box`, μπορούμε να χρησιμοποιήσουμε
    τον τύπο `Box<dyn Error>` ως έναν κοινό τύπο για την επιστροφή
    σφαλμάτων, επειδή μάς επιτρέπει να διαδώσουμε ένα σφάλμα στο σωρό
    και ν' αλληλεπιδράσουμε μαζί του σε υψηλό επίπεδο, χωρίς να χρειάζεται
    να γνωρίζουμε τον συγκεκριμένο τύπο του.


    Νωρίς στην Ξενάγηση στη Rust μάθαμε ότι η `main` μπορεί ν' επιστρέψει
    ένα σφάλμα. Τώρα μπορούμε ν' επιστρέψουμε έναν τύπο ικανό να
    περιγράψει σχεδόν κάθε είδος σφάλματος που μπορεί να συμβεί στο
    πρόγραμμά μας, αρκεί η δομή δεδομένων του σφάλματος να υλοποιεί το
    κοινό trait `Error` της Rust.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Καταμέτρηση αναφορών
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    Το `Rc` είναι ένας smart pointer που μετακινεί δεδομένα από τη
    στοίβα στο σωρό. Μάς επιτρέπει να κλωνοποιούμε κι άλλους smart
    pointers `Rc`, οι οποίοι έχουν όλοι τη δυνατότητα ν' αντλήσουν
    αμετάβλητη πρόσβαση (δανεισμό) στα δεδομένα που τοποθετήθηκαν στο
    σωρό.


    Μόνο όταν απορριφθεί ο τελευταίος smart pointer αποδεσμεύονται τα
    δεδομένα στο σωρό.
- title: Διαμοιρασμός πρόσβασης
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    Το `RefCell` είναι μία δομή δεδομένων-περιέκτης, συχνά κρατημένη από
    smart pointers, που παίρνει δεδομένα και μάς επιτρέπει να δανειζόμαστε
    μεταβλητές και αμετάβλητες αναφορές προς το περιεχόμενό της.
    Αποτρέπει την κατάχρηση του δανεισμού, επιβάλλοντας τους κανόνες
    ασφάλειας μνήμης της Rust κατά την εκτέλεση, όταν ζητάτε να
    δανειστείτε τα δεδομένα που βρίσκονται μέσα:


    **Μόνο μία μεταβλητή αναφορά Ή πολλαπλές αμετάβλητες αναφορές, ποτέ
    και τα δύο!**


    Αν παραβιάσετε αυτούς τους κανόνες, το `RefCell` θα πανικοβληθεί
    (panic).
- title: Διαμοιρασμός ανάμεσα σε threads
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    Το `Mutex` είναι μία δομή δεδομένων-περιέκτης, συχνά κρατημένη από
    smart pointers, που παίρνει δεδομένα και μάς επιτρέπει να δανειζόμαστε
    μεταβλητές και αμετάβλητες αναφορές προς τα δεδομένα που βρίσκονται
    μέσα. Αυτό αποτρέπει την κατάχρηση του δανεισμού, καθώς το
    λειτουργικό σύστημα επιτρέπει μόνο σ' ένα νήμα CPU τη φορά να 'χει
    πρόσβαση στα δεδομένα, μπλοκάροντας τα άλλα νήματα μέχρι να
    τελειώσει το αρχικό νήμα με τον κλειδωμένο δανεισμό του.


    Ο πολυνηματισμός (multithreading) είναι πέρα απ' το πλαίσιο της
    Ξενάγησης στη Rust, αλλά το `Mutex` είναι θεμελιώδες κομμάτι στον
    συντονισμό πολλαπλών νημάτων CPU που έχουν πρόσβαση στα ίδια
    δεδομένα.


    Υπάρχει ένας ειδικός smart pointer, το `Arc`, που είναι πανομοιότυπο
    με το `Rc`, μόνο που χρησιμοποιεί ασφαλή για threads αύξηση της
    καταμέτρησης αναφορών. Χρησιμοποιείται συχνά για να 'χουμε πολλές
    αναφορές προς το ίδιο `Mutex`.
- title: Συνδυάζοντας smart pointers
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Οι smart pointers μπορεί να φαίνονται περιορισμένοι, αλλά μπορούν να
    δημιουργήσουν πολύ ισχυρούς συνδυασμούς.


    `Rc<Vec<Foo>>` - Επιτρέπει την κλωνοποίηση πολλαπλών smart pointers
    που μπορούν να δανειστούν το ίδιο άνυσμα αμετάβλητων δομών δεδομένων
    στο σωρό.


    `Rc<RefCell<Foo>>` - Επιτρέπει σε πολλαπλούς smart pointers τη
    δυνατότητα να δανειστούν, μεταβλητά ή αμετάβλητα, την ίδια δομή
    `Foo`.


    `Arc<Mutex<Foo>>` - Επιτρέπει σε πολλαπλούς smart pointers τη
    δυνατότητα να κλειδώσουν προσωρινούς μεταβλητούς/αμετάβλητους
    δανεισμούς με τρόπο αποκλειστικό για κάθε νήμα CPU.


    Λεπτομέρεια μνήμης:

    * Θα παρατηρήσετε ένα κοινό μοτίβο σε πολλούς απ' αυτούς τους
    συνδυασμούς. Τη χρήση ενός αμετάβλητου τύπου δεδομένων (πιθανώς με
    πολλούς ιδιοκτήτες smart pointers) για την τροποποίηση εσωτερικών
    δεδομένων. Αυτό αναφέρεται στη Rust ως το μοτίβο «interior
    mutability» (εσωτερική μεταβλητότητα). Είναι ένα μοτίβο που μάς
    επιτρέπει να λυγίζουμε τους κανόνες χρήσης μνήμης κατά την εκτέλεση,
    με το ίδιο επίπεδο ασφάλειας που έχουν οι έλεγχοι της Rust κατά τη
    μεταγλώττιση.
- title: Κεφάλαιο 8 - Κατάληξη
  content_markdown: >
    Οι smart pointers είναι τα ιδιώματα του προγραμματισμού στη Rust και
    μάς επιτρέπουν να μη χρειάζεται να αναδημιουργούμε τα πολύ συνήθη
    μοτίβα χρήσης μνήμης. Μ' αυτά είστε έτοιμοι ν' αντιμετωπίσετε ακόμα
    και τις πιο δύσκολες προκλήσεις! Τώρα που έχουμε τα θεμέλια της
    Rust, ας μιλήσουμε λίγο για το πώς φτιάχνουμε μεγαλύτερα έργα. Στο
    κεφάλαιο 9 απελευθερωνόμαστε απ' τις γραμμές κώδικα μίας μοναδικής
    σελίδας.
