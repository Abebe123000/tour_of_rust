- title: Κεφάλαιο 9 - Οργάνωση και δομή έργου
  content_markdown: >
    Μέχρι τώρα όλα τα παραδείγματα κώδικά μας ήταν σ' ένα μοναδικό αρχείο.
    Ας συζητήσουμε πώς μπορεί ο κώδικάς μας να οργανωθεί καλύτερα και να
    μοιραστεί με άλλους!
- title: Μονάδες (Modules)
  content_markdown: |
    Κάθε πρόγραμμα ή βιβλιοθήκη σε Rust είναι ένα *crate*.

    Κάθε crate αποτελείται από μία ιεραρχία *μονάδων* (modules).

    Κάθε crate έχει μία ριζική μονάδα (root module).

    Μία μονάδα μπορεί να κρατά καθολικές μεταβλητές, συναρτήσεις, δομές,
    traits, ή ακόμα κι άλλες μονάδες!

    Στη Rust δεν υπάρχει αντιστοίχιση ένα-προς-ένα ανάμεσα στα αρχεία και
    στην ιεραρχία του δέντρου μονάδων. Πρέπει να χτίσουμε το δέντρο
    μονάδων ρητά, με το χέρι, στον κώδικά μας.
- title: Γράφοντας ένα πρόγραμμα
  content_markdown: |
    Ένα πρόγραμμα έχει μία ριζική μονάδα σ' ένα αρχείο ονόματι `main.rs`.
- title: Γράφοντας μία βιβλιοθήκη
  content_markdown: |
    Μία βιβλιοθήκη έχει μία ριζική μονάδα σ' ένα αρχείο ονόματι `lib.rs`.
- title: Αναφορά σε άλλες μονάδες και crates
  code: |
    use std::f64::consts::PI;

    fn main() {
        println!("Welcome to the playground!");
        println!("I would love a slice of {}!", PI);
    }
  content_markdown: >
    Τα στοιχεία μέσα σε μονάδες μπορούν ν' αναφέρονται με την πλήρη
    διαδρομή τους, π.χ. `std::f64::consts::PI`.


    Ένας απλούστερος τρόπος είναι η λέξη-κλειδί **use**. Μάς επιτρέπει να
    προσδιορίσουμε συγκεκριμένα στοιχεία από μονάδες που θέλουμε να
    χρησιμοποιούμε σ' όλον τον κώδικά μας, χωρίς πλήρη διαδρομή. Για
    παράδειγμα, το `use std::f64::consts::PI` μού επιτρέπει να
    χρησιμοποιώ απλώς το αναγνωριστικό `PI` μέσα στη συνάρτηση main.


    Το **std** είναι το crate της **βασικής βιβλιοθήκης** της Rust, που
    είναι γεμάτο χρήσιμες δομές δεδομένων και συναρτήσεις για την
    αλληλεπίδραση με το λειτουργικό σας σύστημα.


    Έναν αναζητήσιμο κατάλογο crates που έχουν δημιουργηθεί απ' την
    κοινότητα θα τον βρείτε στο
    [https://crates.io](https://crates.io/).
- title: Αναφορά σε πολλαπλά στοιχεία
  content_markdown: |
    Πολλαπλά στοιχεία μπορούν ν' αναφερθούν με μία μοναδική διαδρομή
    μονάδας, όπως εδώ:

    ```rust
    use std::f64::consts::{PI,TAU}
    ```

    Ο Ferris δεν τρώει TAU, τρώει μόνο PI.
- title: Δημιουργία μονάδων
  content_markdown: |
    Όταν σκεφτόμαστε τον κώδικα, συνήθως φανταζόμαστε μία ιεραρχία
    αρχείων οργανωμένων σε καταλόγους. Η Rust σάς επιτρέπει να
    δημιουργείτε μονάδες στενά συνδεδεμένες με τη δομή των αρχείων σας.

    Υπάρχουν δύο τρόποι στη Rust να δηλώσετε μία μονάδα. Για παράδειγμα,
    μία μονάδα `foo` μπορεί ν' αναπαρασταθεί ως:
      * ένα αρχείο ονόματι `foo.rs`
      * ένας κατάλογος ονόματι `foo` που περιέχει ένα αρχείο `mod.rs`
- title: Ιεραρχία μονάδων
  content_markdown: >
    Μία μονάδα μπορεί να εξαρτάται από μία άλλη. Για να καθιερώσετε
    μία σχέση ανάμεσα σε μία μονάδα και μία υπο-μονάδα της, πρέπει να
    γράψετε στη γονική μονάδα:


    ```rust

    mod foo;

    ```


    Η παραπάνω δήλωση θα αναζητήσει ένα αρχείο ονόματι `foo.rs` ή
    `foo/mod.rs` και θα εισαγάγει το περιεχόμενό του μέσα σε μία μονάδα
    ονόματι `foo`, κάτω απ' αυτό το πεδίο εφαρμογής.
- title: Ενσωματωμένη μονάδα
  content_markdown: >
    Μία υπο-μονάδα μπορεί να ενσωματωθεί απευθείας μέσα στον κώδικα μίας
    μονάδας.


    Μία πολύ συνήθης χρήση των ενσωματωμένων μονάδων είναι η δημιουργία
    unit tests. Δημιουργούμε μία ενσωματωμένη μονάδα που υπάρχει μόνο
    όταν η Rust χρησιμοποιείται για δοκιμές!


    ```

    // This macro removes this inline module when Rust

    // is not in test mode.

    #[cfg(test)]

    mod tests {
        // Notice that we don't immediately get access to the
        // parent module. We must be explicit.
        use super::*;

        ... tests go here ...
    }

    ```
- title: Εσωτερική αναφορά μονάδων
  content_markdown: >
    Η Rust διαθέτει αρκετές λέξεις-κλειδιά που μπορείτε να χρησιμοποιήσετε
    στη διαδρομή `use` για να βρείτε γρήγορα τη μονάδα που θέλετε:


    * `crate` - η ριζική μονάδα του crate σας

    * `super` - η γονική μονάδα της τρέχουσας μονάδας σας

    * `self` - η τρέχουσα μονάδα
- title: Εξαγωγή
  content_markdown: >
    Εξ ορισμού, τα μέλη μίας *μονάδας* δεν είναι προσβάσιμα εκτός της
    μονάδας (ούτε καν στις θυγατρικές της μονάδες!). Κάνουμε τα μέλη μίας
    μονάδας προσβάσιμα χρησιμοποιώντας τη λέξη-κλειδί `pub`.


    Εξ ορισμού, τα μέλη ενός *crate* δεν είναι προσβάσιμα εκτός του
    crate. Κάνουμε τα μέλη ενός crate προσβάσιμα σημειώνοντάς τα ως
    `pub` στη *ριζική μονάδα* του crate σας (`lib.rs` ή `main.rs`).
- title: Ορατότητα δομών
  content_markdown: >
    Ακριβώς όπως οι συναρτήσεις, οι δομές μπορούν να δηλώσουν τι θέλουν
    ν' αποκαλυφθεί εκτός της μονάδας τους, χρησιμοποιώντας το `pub`.
  code: |
    // SeaCreature struct will be usable outside of our module
    pub struct SeaCreature {
        pub animal_type: String,
        pub name: String,
        pub arms: i32,
        pub legs: i32,
        // let's keep our weapon private
        weapon: String,
    }
- title: Prelude
  content_markdown: |
    Ίσως αναρωτιέστε πώς έχουμε πρόσβαση στα `Vec` ή `Box` παντού χωρίς
    ένα `use` για να τα εισαγάγουμε. Αυτό συμβαίνει εξαιτίας της μονάδας
    `prelude` στη βασική βιβλιοθήκη.

    Να ξέρετε ότι στη βασική βιβλιοθήκη της Rust, οτιδήποτε εξάγεται
    στο `std::prelude::*` είναι αυτόματα διαθέσιμο σε κάθε κομμάτι της
    Rust. Αυτό ισχύει για τα `Vec` και `Box`, αλλά και για άλλα (Option,
    Copy, κ.λπ.).
- title: Το δικό σας Prelude
  content_markdown: >
    Εξαιτίας του prelude της βασικής βιβλιοθήκης, είναι σύνηθες η
    βιβλιοθήκη σας να 'χει τη δική της μονάδα prelude ως αφετηρία, απ'
    όπου οι χρήστες μπορούν ν' εισαγάγουν όλες τις πιο συνήθεις δομές
    δεδομένων που χρειάζονται για να χρησιμοποιήσουν τη βιβλιοθήκη σας
    (π.χ. `use my_library::prelude::*`).


    Δεν χρησιμοποιείται αυτόματα σε προγράμματα/βιβλιοθήκες που
    χρησιμοποιούν το crate σας, αλλά είναι μία καλή σύμβαση για να την
    ακολουθείτε, ώστε ο κόσμος να ξέρει από πού ν' αρχίσει.


    Ο Ferris λέει: «Να 'στε καλός rustacean και βοηθήστε έναν συνάδελφο
    κάβουρα μ' ένα καλό prelude!»
- title: Κεφάλαιο 9 - Κατάληξη
  content_markdown: >
    Έχετε τώρα μερικά κόλπα στο μανίκι σας όσον αφορά τη δημιουργία
    εφαρμογών και βιβλιοθηκών Rust, έτοιμων για τον κόσμο. Μην
    ανησυχείτε για το να τα θυμάστε όλα. Καθώς η βιβλιοθήκη σας θα
    μεγαλώνει και θα χρησιμοποιείται από άλλο κόσμο, θα ανακαλύπτετε τι
    λειτουργεί καλύτερα σε κάθε στάδιο.


    Πόροι:

    - [Guidelines For Writing Rust
    APIs](https://rust-lang.github.io/api-guidelines/)
