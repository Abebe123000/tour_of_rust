- title: Bab 2 - Dasar Flow Kontrol
  content_markdown: >
    Di dalam bab ini kita akan membahas tentang metode dasar flow kontrol dari Rust.

    Jika kamu familiar dengan bahasa pemprograman berbasis C, kamu tidak akan kesulitan atau mungkin menyukai satu atau dua kejutan.
- title: if/else if/else
  content_markdown: >
    Code branching pada Rust tidaklah mengejutkan.


    Kondisi tidak mempunyai tanda kurung! Apakah kita sangat membutuhkannya? Logika kita sekarang terlihat bagus dan bersih.


    Semua operator relasional dan logika tetap bekerja: `==`, `!=`, `<`, `>`, `<=`, `>=`, `!`, `||`, `&&`.
  code: |-
    fn main() {
        let x = 42;
        if x < 42 {
            println!("less than 42");
        } else if x == 42 {
            println!("is 42");
        } else {
            println!("greater than 42");
        }
    }
- title: loop
  content_markdown: |
    Butuh loop tak-terbatas?

    Rust membuat hal tersebut menjadi mudah.

    `break` akan menghentikan loop ketika kamu siap.

    `loop` mempunyai rahasia, kita akan membicarakannya nanti.
  code: |
    fn main() {
        let mut x = 0;
        loop {
            x += 1;
            if x == 42 {
                break;
            }
        }
        println!("{}", x);
    }
- title: while
  content_markdown: |
    `while` mempermudah kita untuk menambahkan kondisi pada loop.

    Jika kondisi terevaluasi menjadi `false`, maka loop akan selesai.
  code: |
    fn main() {
        let mut x = 0;
        while x != 42 {
            x += 1;
        }
    }
- title: for
  content_markdown: >
    Rust `for` loop sangatlah powerful untuk mengiterasi suatu nilai dengan expresi apapun yang dievaluasi sebagai iterator.

    Apa itu Iterator? Iterator adalah objek yang dapat menjawab pernyataan seperti "item apa yang selanjutnya kau punya?" sampai tidak ada item lagi.


    Kita akan menjelajahi hal ini lebih lanjut pada bab selanjutnya. Sementara itu, ketahuilah bahwa Rust membuat hal tersebut mudah dengan membuat iterator yang menghasilkan serangkaian integer.


    `..` operator membuat sebuah iterator yang menghasilkan angka-angka dari suatu angka sampai sebuah angka lain yang menandakan akhiran tetapi tanpa angka akhir tersesbut.


    `..=` operator membuat sebuah iterator yang menghasilkan angka-angka dari suatu angka sampai sebuah angka lain yang menandakan akhiran beserta angka tersebut.
  code: |
    fn main() {
        for x in 0..5 {
            println!("{}", x);
        }

        for x in 0..=5 {
            println!("{}", x);
        }
    }
- title: match
  content_markdown: >
    Kangen dengan switch statement? Rust mempunyai kata kunci yang sangat powerful untuk mencocokkan semua kemungkinan kondisi dari sebuah nilai dan mengeksekusi code tersebut ketika kondisi cocok (dievaluasi sebagai true). Kita akan melihat bagaimana hal ini bekerja pada angka. Kita punya banyak hal yang akan disampaikan pada bab yang akan datang pada bab pencocokkan pola pada data struktur kompleks. Saya berjanji hal tersebut sangatlah layak untuk ditunggu.


    `match` merupakan kata kunci yang bersifat menyeluruh, jadi semua kasus harus ditangani.


    Match dikombinasikan dengan destructuring, sampai saat ini sangatlah umum dan kamu akan melihat hal tersebut disepanjang Rust.
  code: |
    fn main() {
        let x = 42;

        match x {
            0 => {
                println!("found zero");
            }
            // we can match against multiple values
            1 | 2 => {
                println!("found 1 or 2!");
            }
            // we can match against ranges
            3..=9 => {
                println!("found a number 3 to 9 inclusively");
            }
            // we can bind the matched number to a variable
            matched_num @ 10..=100 => {
                println!("found {} number between 10 to 100!", matched_num);
            }
            // this is the default match that must exist if not all cases are handled
            _ => {
                println!("found something else!");
            }
        }
    }
- title: Mengembalikan Nilai dari Loop
  content_markdown: |
    `loop` dapat menggunakan `break` untuk mengembalikan nilai.
  code: |
    fn main() {
        let mut x = 0;
        let v = loop {
            x += 1;
            if x == 13 {
                break "found the 13";
            }
        };
        println!("from loop: {}", v);
    }
- title: Mengembalikan Nilai dari Expresi Blok
  content_markdown: >
    `if`, `match`, fungsi, dan blok scope semua mempunyai sebuah hal unik untuk mengembalikan nilai di dalam Rust.


    Jika statement terakhir di dalam `if`, `match`, fungsi, atau blok scope adalah tanpa menggunakan `;`, maka Rust akan mengembalikan nilai tersebut dari blok. Ini merupakan cara yang bagus untuk membuat sebuah logika ringkas yang mengembalikan sebuah nilai yang dapat dimasukkan ke dalam sebuah variabel.


    Perhatikan bahwa hal tersebut juga memperbolehkan kita menggunakan `if` statement layaknya expresi ternary.
  code: |
    fn example() -> i32 {
        let x = 42;
        // Rust's ternary expression
        let v = if x < 42 { -1 } else { 1 };
        println!("from if: {}", v);

        let food = "hamburger";
        let result = match food {
            "hotdog" => "is hotdog",
            // notice the braces are optional when its just a single return expression
            _ => "is not hotdog",
        };
        println!("identifying food: {}", result);

        let v = {
            // This scope block lets us get a result without polluting function scope
            let a = 1;
            let b = 2;
            a + b
        };
        println!("from block: {}", v);

        // The idiomatic way to return a value in rust from a function at the end
        v + 4
    }

    fn main() {
        println!("from function: {}", example());
    }
- title: Bab 2 - Kesimpulan
  content_markdown: >
    Saya berharap bahwa saya telah memperlihatkan sekilas kekuatan dari Rust bahkan pada fitur dasar dari bahasa pemprograman. Kita akan membicarakan tentang `for` dan `match` lebih lanjut secara mendalam sambil kita mendapatkan pengetahuan yang dapat memanfaatkan kemampuan mereka. Selanjutnya kita akan masuk pada data struktur dasar pada Rust.
