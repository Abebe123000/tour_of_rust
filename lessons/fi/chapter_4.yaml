- title: Kappale 4 - Geneeriset Tyypit
  content_markdown: >
    Geneeriset tyypit ovat uskomattoman tärkeitä Rustissa. Niitä
    käytetään esittämään mahdollisesti tyhjiä arvoja (eli muuttujia,
    joilla ei ehkä vielä ole arvoa), virheenkäsittelyä, kokoelmia ja
    paljon muuta! Tässä osiossa opimme geneeristen tyyppien
    perusteita, joita todennäköisesti käytät jatkuvasti.
- title: Mitä Ovat Geneeriset Tyypit?
  content_markdown: >
    Geneeriset tyypit antavat meidän määritellä `structin` tai
    `enumin` osittain, jolloin kääntäjä voi luoda täysin määritellyn
    version sen perusteella, miten käytämme sitä koodissamme.


    Rust osaa yleensä päätellä lopullisen tyypin käytön perusteella,
    mutta jos se tarvitsee apua, voit aina olla eksplisiittinen
    `::<T>`-operaattorilla, joka tunnetaan myös nimellä `turbofish`
    (vanha ystäväni).
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        item: T,
    }

    fn main() {
        // Note: by using generic types here, we create compile-time created types. 
        // Turbofish lets us be explicit.
        let i32_bag = BagOfHolding::<i32> { item: 42 };
        let bool_bag = BagOfHolding::<bool> { item: true };
        
        // Rust can infer types for generics too!
        let float_bag = BagOfHolding { item: 3.14 };
        
        // Note: never put a bag of holding in a bag of holding in real life
        let bag_in_bag = BagOfHolding {
            item: BagOfHolding { item: "boom!" },
        };

        println!(
            "{} {} {} {}",
            i32_bag.item, bool_bag.item, float_bag.item, bag_in_bag.item.item
        );
    }
- title: Ei-Minkään Esittäminen
  content_markdown: >
    Muissa ohjelmointikielissä avainsanaa `null` käytetään esittämään
    arvon puuttumista. Tämä aiheuttaa usein hankaluuksia, koska se
    avaa mahdollisuuden, että ohjelmamme voi epäonnistua, kun se
    lopulta on vuorovaikutuksessa muuttujan tai kentän kanssa, jolla
    ei ole arvoa.


    Rustissa ei ole `null`-avainsanaa, mutta se ei sivuuta
    mahdollisuutta esittää käsitettä *"ei arvoa"*.


    Tarkastele yksinkertaista esitystapaa, joka käyttää työkalua,
    jonka jo tunnemme.


    Kaava, jossa vaihtoehtoinen `None`-arvo sisällytetään yhden tai
    useamman muun mahdollisuuden joukkoon, on hyvin yleinen Rustissa
    juuri siksi, että `null`-arvoa ei ole. Geneeriset tyypit auttavat
    ratkaisemaan tämän haasteen.
  code: |
    enum Item {
        Inventory(String),
        // None represents the absence of an item
        None,
    }

    struct BagOfHolding {
        item: Item,
    }
- title: Option
  content_markdown: >
    Rustissa on valmiiksi määritelty geneerinen enum nimeltä `Option`,
    jonka avulla voimme esittää mahdollisesti tyhjiä arvoja ilman
    `null`-avainsanaa.


    ```

    enum Option<T> {
        None,
        Some(T),
    }

    ```


    Tämä enum on niin yleinen, että voimme luoda tämän tyypin
    instansseja missä tahansa käyttäen vaihtoehtoja `Some` ja `None`.
  code: |
    // A partially defined struct type
    struct BagOfHolding<T> {
        // Our parameter type T can be handed to others
        item: Option<T>,
    }

    fn main() {
        // Note: A bag for i32, holding nothing! We have to specify the type
        // because otherwise Rust would not know what type of bag it is.
        let i32_bag = BagOfHolding::<i32> { item: None };

        if i32_bag.item.is_none() {
            println!("there's nothing in the bag!")
        } else {
            println!("there's something in the bag!")
        }

        let i32_bag = BagOfHolding::<i32> { item: Some(42) };

        if i32_bag.item.is_some() {
            println!("there's something in the bag!")
        } else {
            println!("there's nothing in the bag!")
        }

        // match lets us deconstruct Option elegantly and ensure we handle all cases!
        match i32_bag.item {
            Some(v) => println!("found {} in bag!", v),
            None => println!("found nothing"),
        }
    }
- title: Result
  content_markdown: >
    Rustissa on myös valmiiksi määritelty geneerinen enum nimeltä
    `Result`, jonka avulla voimme palauttaa tuloksen, joka saattaa
    epäonnistua. Se on Rustin idiomaattinen tapa käsitellä virheitä.


    ```

    enum Result<T, E> {
        Ok(T),
        Err(E),
    }

    ```


    Huomaa, että geneerisellä tyypillämme on nyt useita
    *tyyppiparametreja* (`<T, E>`), jotka on erotettu pilkulla.


    Tämäkin enum on hyvin yleinen, joten voimme luoda tämän tyypin
    instansseja missä tahansa käyttäen vaihtoehtoja `Ok` ja `Err`.
  code: |
    fn do_something_that_might_fail(i:i32) -> Result<f32,String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))   
        }
    }

    fn main() {
        let result = do_something_that_might_fail(12);

        // match lets us deconstruct Result elegantly and ensure we handle all cases!
        match result {
            Ok(v) => println!("found {}", v),
            Err(e) => println!("Error: {}",e),
        }
    }
- title: Mahdollisesti Epäonnistuva Main
  content_markdown: |
    `main`:illa on mahdollisuus palauttaa `Result`! (`Option` ei
    onnistu, kokeilin.)
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    // Main returns no value, but could return an error!
    fn main() -> Result<(), String> {
        let result = do_something_that_might_fail(12);

        match result {
            Ok(v) => println!("found {}", v),
            Err(_e) => {
                // handle this error gracefully
                
                // return a new error from main that said what happened!
                return Err(String::from("something went wrong in main!"));
            }
        }

        // Notice we use a unit value inside a Result Ok
        // to represent everything is fine
        Ok(())
    }
- title: Tyylikäs Virheenkäsittely
  content_markdown: >
    Mahdollisesti epäonnistuvat tietotyypit `Result` ja `Option` ovat
    niin yleisiä, että Rust tarjoaa meille monikäyttöisen ja tehokkaan
    operaattorin niiden kanssa työskentelyyn: `?`. Nämä kaksi
    koodinpätkää ovat samanarvoisia:


    ```

    do_something_that_might_fail()?

    ```


    ```

    match do_something_that_might_fail() {
        Ok(v) => v,
        Err(e) => return Err(e),
    }

    ```


    Samaa voidaan käyttää myös `Option`:in kanssa.
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // Look at how much code we saved!
        let v = do_something_that_might_fail(42)?;
        println!("found {}", v);
        Ok(())
    }
- title: Option:in Ja Result:in Käsittely Rosoisesti
  content_markdown: >
    Nopeaa ja likaista koodin kirjoittamista varten `Option`/`Result`
    kanssa työskentely voi olla puuduttavaa. Molemmilla tyypeillä on
    funktio nimeltä `unwrap`, joka on hyödyllinen arvon saamiseksi
    ilman suurempia mutkia. Tämä funktio:


    1. Ottaa arvon, joka on Option/Result:in sisällä

    2. Jos tällaista arvoa ei löydy, se pysäyttää koko ohjelman
    käyttäen `panic!`-makroa.


    Nämä kaksi koodinpätkää ovat samanarvoisia:


    ```

    my_option.unwrap()

    ```


    ```

    match my_option {
        Some(v) => v,
        None => panic!("some error message generated by Rust!"),
    }

    ```


    Samoin:


    ```

    my_result.unwrap()

    ```


    ```

    match my_result {
        Ok(v) => v,
        Err(e) => panic!("some error message generated by Rust!"),
    }

    ```


    On aina paljon parempi käyttää mahdollisuuksia, jotka antavat
    ohjelman jatkua, vaikka virhe olisi tapahtunut, kuten `match` ja
    `?`. On myös mukavampia vaihtoehtoja, kuten `unwrap_or` tai `map`
    ja `and_then`. Joten muista käyttää `unwrap`:ia niin harvoin kuin
    mahdollista!
  code: |
    fn do_something_that_might_fail(i: i32) -> Result<f32, String> {
        if i == 42 {
            Ok(13.0)
        } else {
            Err(String::from("this is not the right number"))
        }
    }

    fn main() -> Result<(), String> {
        // concise but assumptive and gets ugly fast
        let v = do_something_that_might_fail(42).unwrap();
        println!("found {}", v);
        
        // this will panic!
        let v = do_something_that_might_fail(1).unwrap();
        println!("found {}", v);
        
        Ok(())
    }
- title: Vektorit
  content_markdown: >
    Joitakin hyödyllisimpiä geneerisiä tyyppejä ovat niin sanotut
    "kokoelmatyypit". Esimerkiksi vektori on mielivaltaisen pituinen
    lista samankaltaisia arvoja, jota `Vec`-struct edustaa.


    `vec!`-makro antaa meidän helposti täyttää vektorin, sen sijaan
    että tekisimme sen käsin.


    Vektoreilla on `iter()`-metodi, joka muuttaa vektorin
    iteraattoriksi, minkä ansiosta voimme helposti käyttää sitä
    `for`-silmukassa.


    Muistin yksityiskohdat:

    * Vektori on struct, ja se tallennetaan pinoon; vektorin
    *sisältö* tallennetaan kuitenkin kekoon, jotta se voi kasvaa
    pituudeltaan. Pino säilyttää viittauksen tähän kekomuistin
    sijaintiin.

    * Vektori alkaa oletuskapasiteetilla. Kun sille lisätään enemmän
    elementtejä kuin tämä kapasiteetti sallii, se uudelleenallokoi
    datan kekoon, jotta sillä on uutta saatavilla olevaa tilaa
    suuremmalla kapasiteetilla, yleensä kaksinkertaisella.
  code: |
    fn main() {
        // We can be explicit with type
        let mut i32_vec = Vec::<i32>::new(); // turbofish <3
        i32_vec.push(1);
        i32_vec.push(2);
        i32_vec.push(3);

        // But look how clever Rust is about determining the type automatically
        let mut float_vec = Vec::new();
        float_vec.push(1.3);
        float_vec.push(2.3);
        float_vec.push(3.4);

        // That's a beautiful macro!
        let string_vec = vec![String::from("Hello"), String::from("World")];

        for word in string_vec.iter() {
            println!("{}", word);
        }
    }
- title: Kappale 4 - Päätelmä
  content_markdown: >
    Yhdessä kappaleessa opimme, kuinka tehokkaita geneeriset tyypit
    ovat! Älä huoli, jos et vielä täysin ymmärrä, miten kaikkia
    käytetään; tässä vaiheessa riittää, että tiedät niiden olemassa
    olevan, koska törmäät niihin yhä useammin lukiessasi koodia.
    Funktiomme ovat alkaneet käydä melko pitkiksi! Seuraavassa
    kappaleessa käsittelemme tärkeää käsitettä Rustissa: datan
    omistajuutta.
