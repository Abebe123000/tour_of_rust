    **Tervetuloa,**<img src="/favicon-32x32.png" style="display:inline; vertical-align:bottom">

    Tervetuloa *Rustin ympäriajoon*. Tämä on johdatus Rustin ominaisuuksiin
    askel askeleelta.
    Rustin opettelun sanotaan kestävän jonkin aikaa,
    ja Rustissa onkin paljon tutkittavaa jo ennen kuin pääsemme
    monimutkaisiin asioihin.

    Tämä opas on saatavilla myös näillä kielillä:

    <!--TOUR_LANGUAGE_LINKS-->

    Jos haluat ehdottaa muutoksia sisältöön tai haluat auttaa
    käännöksissä, ohjeet löytyvät Tour of Rust -repositorysta
    [Githubista](https://github.com/richardanaya/tour_of_rust).

    Ohjesivuilla voi liikkua näppäimillä <span class="emoji">⬅️</span> ja <span class="emoji">➡️</span>.

    Oheisessa perinteisessä esimerkissä esittelemme Rustin tukea Unicode-merkkijonoille.
