- title: Kappale 8 - Smart Pointerit
  content_markdown: >
    Tässä kappaleessa selvitämme smart pointereiden mysteerin.
    Tutkitaan näitä tietorakenteita, jotka antavat meidän olla
    vuorovaikutuksessa muistin alimman tason kanssa.


    Ferris sanoo: "Älä tunne oloasi ylivoimaiseksi tämän kappaleen
    suhteen, jos et koe pystyväsi kirjoittamaan omaa matalan tason
    muistinhallintakoodiasi yhdellä lyhyellä lukukerralla. Tämä
    kappale on tarkoitettu lähinnä esittelemään sinulle joitakin
    hyödyllisiä työkaluja ja antamaan aavistuksen siitä, miten ne
    toimivat!"
- title: Referenssit Uudelleen Tarkasteltuna
  content_markdown: >
    Referenssi on pohjimmiltaan vain luku, joka on jonkin muistissa
    olevan tavujoukon alkusijainti. Sen ainoa tarkoitus on esittää
    käsite siitä, missä tietyn tyypin data sijaitsee. Se, mikä
    erottaa referenssin pelkästä luvusta, on se, että Rust
    varmistaa, ettei referenssien elinaika kestä pidempään kuin se,
    mihin ne viittaavat (muuten saisimme virheen käyttäessämme
    niitä!).
- title: Raa'at Osoittimet
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    Referenssit voidaan muuntaa primitiivisemmäksi tyypiksi, jota
    kutsutaan *raa'aksi osoittimeksi* (raw pointer). Kuten luku, se
    voidaan kopioida ja siirtää melko vapaasti. Rust ei anna mitään
    takuita sen osoittaman muistisijainnin validiudesta.


    Raakoja osoittimia on kahta tyyppiä:


    * `*const T` - Raaka osoitin tyypin T dataan, jonka ei pitäisi
    koskaan muuttua.

    * `*mut T` - Raaka osoitin tyypin T dataan, joka voi muuttua.


    Raa'at osoittimet voidaan muuntaa luvuiksi (esim. `usize`) ja
    takaisin.


    Raa'at osoittimet voivat käyttää dataa *unsafe*-koodilla
    (lisää tästä myöhemmin).


    Muistin yksityiskohdat:

    * Referenssi Rustissa muistuttaa käytöltään hyvin paljon
    osoitinta C:ssä, mutta sillä on paljon enemmän käännösaikana
    tarkistettuja rajoituksia sille, miten sitä voidaan tallentaa ja
    siirtää muihin funktioihin.
    * Raaka osoitin Rustissa muistuttaa osoitinta C:ssä siinä
    mielessä, että se edustaa lukua, joka voidaan kopioida tai
    välittää eteenpäin, ja jopa muuttaa numeeriseksi tyypiksi, jossa
    sitä voidaan muokata lukuna osoitinaritmetiikkaa varten.
- title: Dereferensointi
  content_markdown: |
    Prosessia, jossa käsitellään/muokataan dataa, johon
    *referenssi* (esim. `&i32`) viittaa, kutsutaan
    *dereferensoinniksi*.

    Referenssejä käytetään datan käsittelyyn/muokkaamiseen kahdella
    tavalla:
    * Pääsy referoituun dataan muuttujien sijoituksen aikana.
    * Pääsy referoidun datan kenttiin tai metodeihin.

    Rustilla on muutamia tehokkaita operaattoreita, jotka antavat
    meidän tehdä tämän.
- title: Operaattori *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    Operaattori `*` on eksplisiittinen tapa dereferensoida
    referenssi.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Muistin yksityiskohta:

    - Koska i32 on primitiivinen tyyppi, joka toteuttaa `Copy`-
    traitin, muuttujan `a` tavut pinossa kopioidaan muuttujan `b`
    tavuiksi.
- title: Operaattori .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    Operaattoria `.` käytetään referenssin kenttien ja metodien
    käyttämiseen. Se toimii hieman hienovaraisemmin.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    Huh, miksi meidän ei tarvinnut lisätä `***`:aa ennen
    `ref_ref_ref_f`:ää? Tämä johtuu siitä, että operaattori `.`
    dereferensoi automaattisesti referenssien ketjun. Tuo viimeinen
    rivi muuttuu kääntäjän toimesta automaattisesti tähän muotoon:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart Pointerit
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Sen lisäksi, että voimme luoda referenssejä olemassa olevaan
    tyypitettyyn dataan `&`-operaattorilla, Rust antaa meille
    mahdollisuuden luoda *referenssin kaltaisia* structeja, joita
    kutsutaan **smart pointereiksi**.


    Voimme ajatella referenssejä korkealla tasolla tyyppinä, joka
    antaa meille pääsyn toiseen tyyppiin. Smart pointerit eroavat
    tavallisista referensseistä käyttäytymisessään siten, että ne
    toimivat ohjelmoijan kirjoittaman sisäisen logiikan perusteella.
    Sinä — ohjelmoija — olet se *smart*-osa.


    Yleensä smart pointerit toteuttavat traitit `Deref`, `DerefMut`
    ja `Drop` määrittääkseen logiikan sille, mitä tulisi tapahtua,
    kun rakenne dereferensoidaan operaattoreilla `*` ja `.`.
- title: Smartti Unsafe-Koodi
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Smart pointerit käyttävät melko usein *unsafe*-koodia. Kuten
    aiemmin mainittiin, ne ovat yleisiä työkaluja Rustin muistin
    alimpien tasojen kanssa työskentelyyn.


    Mitä on unsafe-koodi? Unsafe-koodi käyttäytyy täsmälleen kuten
    tavallinen Rust-koodi, paitsi muutamien kykyjen osalta, joista
    Rust-kääntäjä ei voi antaa takuita.


    Yksi unsafe-koodin keskeinen kyky on *raa'an osoittimen
    dereferensointi*. Tämä tarkoittaa raa'an osoittimen ottamista
    muistin sijaintiin ja julistamista "täällä on tietorakenne!",
    muuttaen sen käytettäväksi datan esitykseksi (esim. `*const u8`
    tyypiksi `u8`).


    Rustilla ei ole tapaa seurata jokaisen muistiin kirjoitetun tavun
    merkitystä. Koska Rust ei voi antaa takuita siitä, mitä
    mielivaltaisessa luvussa, jota käytetään *raakana osoittimena*,
    todella on, se sijoittaa dereferensoinnin `unsafe { ... }`-
    lohkon sisälle.


    Smart pointerit *dereferensoivat raakoja osoittimia* laajasti,
    mutta ne on hyvin testattu siinä, mitä ne tekevät.
- title: Vanhat Tutut
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Ajatellaan muutamia smart pointereita, jotka olemme jo nähneet,
    kuten `Vec<T>` ja `String`.


    `Vec<T>` on smart pointer, joka vain omistaa tavuista koostuvan
    muistialueen. Rust-kääntäjällä ei ole aavistustakaan, mitä
    näissä tavuissa on. Smart pointer tulkitsee, mitä tarkoittaa
    hakea elementtejä hallinnoimastaan muistialueesta, seuraa, mistä
    tietorakenteet näiden tavujen sisällä alkavat ja loppuvat, ja
    lopulta dereferensoi raa'an osoittimen tietorakenteiksi
    siistiksi ja ergonomiseksi rajapinnaksi käytettäväksemme (esim.
    `my_vec[3]`).


    Vastaavasti `String` seuraa tavuista koostuvaa muistialuetta ja
    rajoittaa ohjelmallisesti siihen kirjoitettavan sisällön aina
    validiksi `utf-8`:ksi, sekä auttaa dereferensoimaan tuon
    muistialueen `&str`-tyypiksi.


    Molemmat nämä tietorakenteet käyttävät raakojen osoittimien
    unsafe-dereferensointia tehtävänsä suorittamiseen.


    Muistin yksityiskohdat:

    * Rustissa on vastine C:n `malloc`:lle käyttäen
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html):ia ja
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html):ia
    omien muistialueiden hallintaan.
- title: Kekoon Allokoitu Muisti
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` on smart pointer, joka antaa meidän siirtää dataa pinosta
    kekoon.


    Sen dereferensointi antaa meidän käyttää kekoon allokoitua dataa
    ergonomisesti, ikään kuin se olisi alkuperäinen tyyppi.
- title: Mahdollisesti Epäonnistuva Main Uudelleen Tarkasteltuna
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Rust-koodilla voi olla runsaasti erilaisia virheiden esitystapoja,
    mutta standardikirjastossa on universaali trait
    `std::error::Error` virheiden kuvaamiseen.


    Käyttämällä smart pointeria `Box`, voimme käyttää tyyppiä
    `Box<dyn Error>` yleisenä tyyppinä virheiden palauttamiseen,
    koska se antaa meidän levittää virheen keossa ja olla sen kanssa
    vuorovaikutuksessa korkealla tasolla ilman, että meidän
    tarvitsee tietää tiettyä tyyppiä.


    Aiemmin Tour of Rustissa opimme, että `main` voi palauttaa
    virheen. Nyt voimme palauttaa tyypin, joka pystyy kuvaamaan
    lähes minkä tahansa virheen, joka saattaa tapahtua ohjelmassamme,
    kunhan virheen tietorakenne toteuttaa Rustin yleisen
    `Error`-traitin.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Referenssien Laskenta
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` on smart pointer, joka siirtää dataa pinosta kekoon. Se
    antaa meidän kloonata muita `Rc`-smart pointereita, joilla
    kaikilla on kyky lainata muuttumattomasti kekoon sijoitettua
    dataa.


    Vasta kun viimeinen smart pointer droppaataan, keossa oleva data
    lopulta dealllokoidaan.
- title: Pääsyn Jakaminen
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` on säilötietorakenne, jota smart pointerit usein
    omistavat, ja joka ottaa dataa ja antaa meidän lainata muuttuvia
    ja muuttumattomia referenssejä sen sisältöön. Se estää lainauksen
    väärinkäytön varmistamalla Rustin muistiturvallisuussäännöt
    ajonaikana, kun pyydät lainaamaan sisällä olevaa dataa:


    **Vain yksi muuttuva referenssi TAI useita muuttumattomia
    referenssejä, ei koskaan molempia!**


    Jos rikot näitä sääntöjä, `RefCell` joutuu panickiin.
- title: Jakaminen Säikeiden Välillä
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` on säilötietorakenne, jota smart pointerit usein
    omistavat, ja joka ottaa dataa ja antaa meidän lainata muuttuvia
    ja muuttumattomia referenssejä sisällä olevaan dataan. Tämä
    estää lainauksen väärinkäytön antamalla käyttöjärjestelmän
    sallia vain yhden CPU-säikeen kerrallaan käyttää dataa,
    estäen muita säikeitä siihen asti, kunnes alkuperäinen säie on
    valmis lukitun lainauksensa kanssa.


    Monisäikeisyys on Tour of Rustin laajuuden ulkopuolella, mutta
    `Mutex` on perustavanlaatuinen osa useiden CPU-säikeiden, jotka
    käyttävät samaa dataa, koordinointia.


    On olemassa erityinen smart pointer `Arc`, joka on identtinen
    `Rc`:n kanssa paitsi että se käyttää säieturvallista
    referenssilaskureiden kasvattamista. Sitä käytetään usein, kun
    halutaan monta referenssiä samaan `Mutex`:iin.
- title: Smart Pointereiden Yhdistäminen
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Smart pointerit saattavat vaikuttaa rajoittuneilta, mutta ne
    voivat luoda hyvin tehokkaita yhdistelmiä.


    `Rc<Vec<Foo>>` - Sallii useiden smart pointereiden kloonaamisen,
    jotka voivat lainata samaa muuttumattomien tietorakenteiden
    vektoria keossa.


    `Rc<RefCell<Foo>>` - Sallii useille smart pointereille kyvyn
    lainata, joko muuttuvasti tai muuttumattomasti, samaa `Foo`-
    structia.


    `Arc<Mutex<Foo>>` - Sallii useille smart pointereille kyvyn
    lukita väliaikaisia muuttuvia/muuttumattomia lainauksia tavalla,
    joka on yksinomainen yhdelle CPU-säikeelle.


    Muistin yksityiskohta:

    * Huomaat toistuvan teeman monissa näissä yhdistelmissä.
    Muuttumattoman tietotyypin (mahdollisesti useiden smart
    pointereiden omistaman) käytön sisäisen datan muokkaamiseen.
    Tätä kutsutaan Rustissa "interior mutability" -kaavaksi
    (sisäinen muuttuvuus). Se on kaava, joka antaa meidän taivuttaa
    muistin käytön sääntöjä ajonaikana, samalla turvallisuustasolla
    kuin Rustin käännösaikaiset tarkistukset.
- title: Kappale 8 - Päätelmä
  content_markdown: >
    Smart pointerit ovat Rust-ohjelmoinnin idioomeja, ja ne antavat
    meidän olla luomatta uudelleen hyvin yleisiä muistin
    käyttötapoja. Näiden avulla olet valmis kohtaamaan kaikkein
    vaikeimmat haasteet! Nyt kun meillä on Rustin perusteet
    hallussa, puhutaan hieman siitä, miten teemme isompia
    projekteja. Kappaleessa 9 vapaudumme yhden sivun koodiriveistä.
