- title: Kappale 10 - Loppu
  content_markdown: >
    On ollut ilo saada sinut mukaan Rustin ympäriajolle. Ferris ja
    Tour of Rust -tiimi toivovat vilpittömästi, että nautit
    edessäsi olevasta matkasta! Jos olet tuntenut olosi mukavaksi
    tähän asti, suosittelemme lämpimästi syventymään aiheeseen
    näiden resurssien avulla:


    * [The Official Rust Programming
    Book](https://doc.rust-lang.org/stable/book/)
