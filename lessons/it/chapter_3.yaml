- title: Capitolo 3 - Strutture Dati Fondamentali
  content_markdown: >
    E' ora di spingerci oltre i tipi dato semplici! In questo capitolo vedremo le strutture dati più primitive in Rust, 
    facendo attenzione alla loro rappresentazione in memoria. Credo che ti piacerà il fatto che Rust tenda a nascondere quanto meno possibile
    del funzionamento interno.
   
- title: Le Struct
  content_markdown: >
    Un tipo di dato `struct` è un insieme di campi.


    Un *campo* è semplicemente un dato contenuto nella struttura. Il suo valore può essere di un tipo dati primitivo oppure a sua volta di un'altra struttura.


    La definizione di una `struct` è come un modello per il compilatore, da seguire per stabilire come i campi sono posizionati in memoria l'uno rispetto all'altro. 
  code: |-
    struct SeaCreature {
        // String is a struct
        animal_type: String,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }
- title: Invocare i Metodi
  content_markdown: >
    I metodi non sono normali funzioni, ma sono funzioni associate con un tipo dati specifico. Possiamo dividerli in:


    **metodi static** — metodi che appartengono al tipo stesso (in altri linguaggi si chiamerebbero metodi di Classe) e vanno chiamati con l'operatore `::` .


    **metodi instanza** — metodi che appartengono all'instanza del tipo e sono chiamati con l'operatore `.`


    Parleremo di come creare i propri metodi nei prossimi capitoli.
  code: |
    fn main() {
        // Using a static method to create an instance of String
        let s = String::from("Hello world!");
        // Using a method on the instance
        println!("{} is {} characters long.", s, s.len());
    }
- title: La Memoria
  content_markdown: >
    I programmi Rust hanno 3 zone di memoria che possono contenere dati:

    * **memoria programma** - Per i dati che hanno dimensione fissa e **statici** (cioè sempre accessibile per tutta la vita del programma). 
      Considera il testo nel programma (es. "Hello World!"): i byte di questo testo sono letti da un solo posto e quindi possono essere memorizzati in questo spazio. I compilatori eseguono molte ottimizzazioni su questi dati, e sono anche molto veloci da usare perchè la posizione è conosciuta e fissa.  
    * **memoria stack** - Per i dati che sono dichiarati come variabili dentro una funzione.
      L'indirizzo di questa zona di memoria non cambia mai per la durata della funzione; grazie a questa proprietà, il compilatore può ottimizzare il codice e quindi accedere più velocemente ai dati sullo stack. 
    * **memoria heap** - Per i dati che vengono creati mentre l'applicazione sta girando. 
      In questa zona è possibile ingrandire, rimpicciolire, spostare, aggiungere o togliere dati; per via di questa natura dinamica è generalmente considerata più lenta nell'utilizzo, ma permette una enorme flessibilità nell'uso della memoria. Quando inseriamo dati in questa regione, parliamo di **allocazione**, mentre quando rimuoviamo dati avviene una **deallocazione**.
- title: Creare dati in memoria
  content_markdown: >
    Quando **instanziamo** una **struct** nel nostro codice, il nostro programma crea
    i rispettivi campi in memoria.


    Instanziamo specificando il valore di tutti i campi con  


    `StructName { ... }`.


    I campi nella struct sono accessibili usando l'operatore punto `.`.


    Vediamo il dettaglio dell'uso di memoria nell'esempio:

    * Il testo tra virgolette sono dati in sola lettura ("Ferris"), quindi verrà collocato in *memoria dati programma*.
    * La chiamata funzione `String::from` crea una struttura `String` che viene posta, vicino ai campi della struttura SeaCreature, nello *stack*. Una String rappresenta testo che può essere modificato e funziona in questo modo:
      1. Alloca memoria nello *heap* per il testo, dove potrà essere modificato
      2. Memorizza l'indirizzo di quella locazione di memoria nella struct `String`, insieme ad altri dati della stringa (su questo approfondiremo nelle prossime lezioni) 
    * I nostri due amici *Ferris* and *Sarah* hanno campi con una locazione di memoria fissa nel programma, e quindi saranno strutture dati che vivranno nello *stack*.
  code: |
    struct SeaCreature {
        animal_type: String,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }

    fn main() {
        // SeaCreature's data is on stack
        let ferris = SeaCreature {
            // String struct is also on stack,
            // but holds a reference to data on heap
            animal_type: String::from("crab"),
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: String::from("claw"),
        };

        let sarah = SeaCreature {
            animal_type: String::from("octopus"),
            name: String::from("Sarah"),
            arms: 8,
            legs: 0,
            weapon: String::from("brain"),
        };
        
        println!(
            "{} is a {}. They have {} arms, {} legs, and a {} weapon",
            ferris.name, ferris.animal_type, ferris.arms, ferris.legs, ferris.weapon
        );
        println!(
            "{} is a {}. They have {} arms, and {} legs. They have no weapon..",
            sarah.name, sarah.animal_type, sarah.arms, sarah.legs
        );
    }
- title: Tuple-like Struct
  content_markdown: |
    Come scorciatoia, puoi anche creare struct e poi usarle come Tuple.
  code: |
    struct Location(i32, i32);

    fn main() {
        // This is still a struct on a stack
        let loc = Location(42, 32);
        println!("{}, {}", loc.0, loc.1);
    }
- title: Unit-like Struct
  content_markdown: >
    Una Struct può anche essere vuota, ovvero non avere campi.

    Come accennato nel Capitolo 1, una *unit* è un sinonimo per una tupla vuota `()`.
    Questo è il motivo per cui questo tipo di strutture viene chiamato *Unit-like*.


    Questo tipo di strutture è usato raramente.
  code: |
    struct Marker;

    fn main() {
        let _m = Marker;
    }
- title: Enumerazioni
  content_markdown: >
    La parola chiave `enum` ti permette di creare un nuovo tipo che può assumere uno tra i valori predefiniti.


    il costrutto `match` è un potente strumento per gestire in maniera esaustiva tutti i possibili valori di una enumerazione, contribuendo a migliorare la qualità del codice.
  code: |
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Species {
        Crab,
        Octopus,
        Fish,
        Clam
    }

    struct SeaCreature {
        species: Species,
        name: String,
        arms: i32,
        legs: i32,
        weapon: String,
    }

    fn main() {
        let ferris = SeaCreature {
            species: Species::Crab,
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: String::from("claw"),
        };

        match ferris.species {
            Species::Crab => println!("{} is a crab",ferris.name),
            Species::Octopus => println!("{} is a octopus",ferris.name),
            Species::Fish => println!("{} is a fish",ferris.name),
            Species::Clam => println!("{} is a clam",ferris.name),
        }
    }
- title: Enumerazioni con dati
  content_markdown: >
    ogni elemento di una `enum` può avere uno o più dati associati, che si comportano come le *union* del C.


    Quando facciamo pattern matching tramite `match` di una `enum`, possiamo associare un nome di variabile ad ogni valore.


    Un dettaglio nell'uso di memoria di `enum`:

    * Ogni valore di un determinato enum occuperà una dimensione di memoria pari a quella dell'elemento più grande.
    Questo permette a tutti i potenziali valori di essere contenuti nello stesso spazio di memoria.

    * Oltre al tipo di dati dell'elemento (se specificato), ogni componente ha anche un codice numerico che rappresenta quale dei possibili valori assume.


    Altri dettagli:

    * `enum` di Rust è qualcosa che in altri linguaggi è conosciuto come *tagged union*.

    * La combinazione di tipi per creare un nuovo tipo è una caratteristica per la quale possiamo dire che Rust ha i *tipi algebrici*, ovvero *algebraic types*.
  code: |-
    #![allow(dead_code)] // this line prevents compiler warnings

    enum Species { Crab, Octopus, Fish, Clam }
    enum PoisonType { Acidic, Painful, Lethal }
    enum Size { Big, Small }
    enum Weapon {
        Claw(i32, Size),
        Poison(PoisonType),
        None
    }

    struct SeaCreature {
        species: Species,
        name: String,
        arms: i32,
        legs: i32,
        weapon: Weapon,
    }

    fn main() {
        // SeaCreature's data is on stack
        let ferris = SeaCreature {
            // String struct is also on stack,
            // but holds a reference to data on heap
            species: Species::Crab,
            name: String::from("Ferris"),
            arms: 2,
            legs: 4,
            weapon: Weapon::Claw(2, Size::Small),
        };

        match ferris.species {
            Species::Crab => {
                match ferris.weapon {
                    Weapon::Claw(num_claws,size) => {
                        let size_description = match size {
                            Size::Big => "big",
                            Size::Small => "small"
                        };
                        println!("ferris is a crab with {} {} claws", num_claws, size_description)
                    },
                    _ => println!("ferris is a crab with some other weapon")
                }
            },
            _ => println!("ferris is some other animal"),
        }
    }
- title: Capitolo 3 - Conclusioni
  content_markdown: >
    Molto interessante! Ora abbiamo gli strumenti fondamentali per rappresentare le nostre idee sotto forma di codice. Dovresti poter intravedere un barlume di come in Rust il codice ed i dati lavorano in modo armonico e conciso. Prossimamente parleremo di un concetto che da ancora più flessibilità di rappresentazione ai nostri tipi dato: i *generics* .
