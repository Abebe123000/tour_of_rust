- title: Capitolo 10 - La Fine
  content_markdown: >
    È stato un piacere averti con noi in questo Tour of Rust. Ferris e il
    team di Tour of Rust sperano sinceramente che tu possa goderti il
    viaggio che ti aspetta! Se ti sei sentito a tuo agio fin qui, ti
    consigliamo vivamente di approfondire con queste risorse:


    * [Il libro ufficiale di Rust](https://doc.rust-lang.org/stable/book/)
