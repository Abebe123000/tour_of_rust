- title: Capitolo 8 - Smart Pointer
  content_markdown: >
    In questo capitolo demistificheremo gli smart pointer. Esploriamo
    queste strutture dati che ci permettono di interagire con il livello
    più basso della memoria.


    Ferris dice: "Non sentirti sopraffatto da questo capitolo se non
    pensi di riuscire a scrivere il tuo codice di gestione della memoria
    di basso livello dopo una lettura veloce. Questo capitolo serve
    soprattutto a farti conoscere alcuni strumenti utili e a darti
    un'idea di come funzionano!"
- title: I Riferimenti Rivisitati
  content_markdown: >
    Un riferimento è in fondo solo un numero che rappresenta la
    posizione di partenza di alcuni byte in memoria. Il suo unico scopo
    è rappresentare il concetto di dove esistono i dati di un tipo
    specifico. Ciò che rende un riferimento diverso da un semplice
    numero è che Rust verifica che la vita dei riferimenti non duri più
    a lungo di ciò a cui si riferiscono (altrimenti otterremmo un errore
    quando li usassimo!).
- title: Puntatori Grezzi
  code: |
    fn main() {
        let a = 42;
        let memory_location = &a as *const i32 as usize;
        println!("Data is here {}", memory_location);
    }
  content_markdown: >
    I riferimenti possono essere convertiti in un tipo più primitivo
    chiamato *puntatore grezzo* (raw pointer). Come un numero, può
    essere copiato e spostato con poche restrizioni. Rust non dà nessuna
    garanzia sulla validità della posizione di memoria a cui punta.


    Esistono due tipi di puntatori grezzi:


    * `*const T` - Un puntatore grezzo a dati di tipo T che non
    dovrebbero mai cambiare.

    * `*mut T` - Un puntatore grezzo a dati di tipo T che possono
    cambiare.


    I puntatori grezzi possono essere convertiti da e verso numeri (es.
    `usize`).


    I puntatori grezzi possono accedere ai dati con codice *unsafe*
    (maggiori dettagli più avanti).


    Dettagli sulla memoria:

    * Un riferimento in Rust è molto simile, per come viene usato, a un
    puntatore in C, ma con molte più restrizioni verificate a tempo di
    compilazione su come può essere memorizzato e spostato verso altre
    funzioni.
    * Un puntatore grezzo in Rust è simile a un puntatore in C, in
    quanto rappresenta un numero che può essere copiato o passato in
    giro, e persino trasformato in tipi numerici dove può essere
    modificato come un numero per fare aritmetica dei puntatori.
- title: Dereferenziazione
  content_markdown: |
    Il processo di accesso/manipolazione dei dati a cui punta un
    *riferimento* (es. `&i32`) è chiamato *dereferenziazione*.

    I riferimenti sono usati per accedere/manipolare i dati in due modi:
    * Accesso ai dati a cui puntano durante l'assegnazione di variabili.
    * Accesso a campi o metodi dei dati a cui puntano.

    Rust ha alcuni operatori potenti che ci permettono di farlo.
- title: L'Operatore *
  code: |-
    fn main() {
        let a: i32 = 42;
        let ref_ref_ref_a: &&&i32 = &&&a;
        let ref_a: &i32 = **ref_ref_ref_a;
        let b: i32 = *ref_a;
        println!("{}", b)
    }
  content_markdown: >
    L'operatore `*` è un modo esplicito per dereferenziare un
    riferimento.


    ```rust

    let a: i32 = 42;

    let ref_ref_ref_a: &&&i32 = &&&a;

    let ref_a: &i32 = **ref_ref_ref_a;

    let b: i32 = *ref_a;

    ```


    Dettaglio sulla memoria:

    - Poiché i32 è un tipo primitivo che implementa il trait `Copy`, i
    byte della variabile `a` sullo stack vengono copiati nei byte della
    variabile `b`.
- title: L'Operatore .
  code: |-
    struct Foo {
        value: i32
    }

    fn main() {
        let f = Foo { value: 42 };
        let ref_ref_ref_f = &&&f;
        println!("{}", ref_ref_ref_f.value);
    }
  content_markdown: >
    L'operatore `.` viene usato per accedere a campi e metodi di un
    riferimento. Funziona in modo un po' più sottile.


    ```rust

    let f = Foo { value: 42 };

    let ref_ref_ref_f = &&&f;

    println!("{}", ref_ref_ref_f.value);

    ```


    Perché non abbiamo dovuto aggiungere `***` prima di `ref_ref_ref_f`?
    È perché l'operatore `.` dereferenzia automaticamente una sequenza
    di riferimenti. L'ultima riga viene trasformata automaticamente dal
    compilatore in questo modo:


    ```rust

    println!("{}", (***ref_ref_ref_f).value);

    ```
- title: Smart Pointer
  code: |
    use std::ops::Deref;
    struct TattleTell<T> {
        value: T,
    }
    impl<T> Deref for TattleTell<T> {
        type Target = T;
        fn deref(&self) -> &T {
            println!("{} was used!", std::any::type_name::<T>());
            &self.value
        }
    }
    fn main() {
        let foo = TattleTell {
            value: "secret message",
        };
        // dereference occurs here immediately 
        // after foo is auto-referenced for the
        // function `len`
        println!("{}", foo.len());
    }
  content_markdown: >
    Oltre alla possibilità di creare riferimenti a dati tipizzati
    esistenti con l'operatore `&`, Rust ci dà la possibilità di creare
    struct *simili a riferimenti*, chiamate **smart pointer**.


    Possiamo pensare ai riferimenti, a un livello alto, come un tipo che
    ci dà accesso a un altro tipo. Gli smart pointer si distinguono dai
    normali riferimenti per il loro comportamento, in quanto operano in
    base a una logica interna scritta dal programmatore. Tu — il
    programmatore — sei la parte *smart*.


    Tipicamente gli smart pointer implementano i trait `Deref`,
    `DerefMut` e `Drop` per specificare la logica di cosa deve accadere
    quando la struttura viene dereferenziata con gli operatori `*` e
    `.`.
- title: Codice Unsafe Smart
  code: |
    fn main() {
        let a: [u8; 4] = [86, 14, 73, 64];
        // this is a raw pointer. Getting the memory address
        // of something as a number is totally safe
        let pointer_a = &a as *const u8 as usize;
        println!("Data memory location: {}", pointer_a);
        // Turning our number into a raw pointer to a f32 is
        // also safe to do.
        let pointer_b = pointer_a as *const f32;
        let b = unsafe {
            // This is unsafe because we are telling the compiler
            // to assume our pointer is a valid f32 and
            // dereference its value into the variable b.
            // Rust has no way to verify this assumption is true.
            *pointer_b
        };
        println!("I swear this is a pie! {}", b);
    }
  content_markdown: >
    Gli smart pointer tendono a usare abbastanza spesso codice
    *unsafe*. Come accennato prima, sono strumenti comuni per
    interagire con i livelli più bassi della memoria in Rust.


    Cos'è il codice unsafe? Il codice unsafe si comporta esattamente
    come il normale codice Rust, con l'eccezione di alcune capacità
    sulle quali il compilatore di Rust non può dare garanzie.


    Una capacità fondamentale del codice unsafe è *dereferenziare un
    puntatore grezzo*. Questo significa prendere un *puntatore grezzo*
    verso una posizione in memoria e dichiarare "qui esiste una
    struttura dati!", trasformandolo in una rappresentazione di dati che
    puoi usare (es. `*const u8` in `u8`).


    Rust non ha modo di tenere traccia del significato di ogni byte
    scritto in memoria. Poiché Rust non può dare garanzie su cosa esiste
    a un numero arbitrario usato come *puntatore grezzo*, mette la
    dereferenziazione in un blocco `unsafe { ... }`.


    Gli smart pointer *dereferenziano puntatori grezzi* estensivamente,
    ma sono ben collaudati in ciò che fanno.
- title: Vecchi Amici
  code: |
    use std::alloc::{alloc, Layout};
    use std::ops::Deref;

    struct Pie {
        secret_recipe: usize,
    }

    impl Pie {
        fn new() -> Self {
            // let's ask for 4 bytes
            let layout = Layout::from_size_align(4, 1).unwrap();

            unsafe {
                // allocate and save the memory location as a number
                let ptr = alloc(layout) as *mut u8;
                // use pointer math and write a few 
                // u8 values to memory
                ptr.write(86);
                ptr.add(1).write(14);
                ptr.add(2).write(73);
                ptr.add(3).write(64);

                Pie { secret_recipe: ptr as usize }
            }
        }
    }
    impl Deref for Pie {
        type Target = f32;
        fn deref(&self) -> &f32 {
            // interpret secret_recipe pointer as a f32 raw pointer
            let pointer = self.secret_recipe as *const f32;
            // dereference it into a return value &f32
            unsafe { &*pointer }
        }
    }
    fn main() {
        let p = Pie::new();
        // "make a pie" by dereferencing our 
        // Pie struct smart pointer
        println!("{:?}", *p);
    }
  content_markdown: >
    Pensiamo ad alcuni smart pointer che abbiamo già visto, come
    `Vec<T>` e `String`.


    `Vec<T>` è uno smart pointer che possiede semplicemente una regione
    di memoria fatta di byte. Il compilatore di Rust non ha idea di
    cosa esista in questi byte. Lo smart pointer interpreta cosa
    significa prendere elementi dalla regione di memoria che gestisce,
    tiene traccia di dove iniziano e finiscono le strutture dati
    all'interno di quei byte, e infine dereferenzia un puntatore grezzo
    in strutture dati per darci un'interfaccia bella ed ergonomica da
    usare (es. `my_vec[3]`).


    Allo stesso modo, `String` tiene traccia di una regione di memoria
    fatta di byte, e limita programmaticamente il contenuto scritto in
    essa affinché sia sempre `utf-8` valido, aiutando a dereferenziare
    quella regione di memoria in un tipo `&str`.


    Entrambe queste strutture dati usano la dereferenziazione unsafe di
    puntatori grezzi per fare il loro lavoro.


    Dettagli sulla memoria:

    * Rust ha un equivalente della `malloc` di C usando
    [alloc](https://doc.rust-lang.org/std/alloc/fn.alloc.html) e
    [Layout](https://doc.rust-lang.org/std/alloc/struct.Layout.html)
    per ottenere delle regioni di memoria proprie da gestire.
- title: Memoria Allocata Sull'Heap
  code: |
    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Box::new(Pie);
        heap_pie.eat();
    }
  content_markdown: >
    `Box` è uno smart pointer che ci permette di spostare dati dallo
    stack all'heap.


    Dereferenziarlo ci permette di usare i dati allocati sull'heap in
    modo ergonomico, come se fossero il tipo originale.
- title: Main Fallibile Rivisitata
  code: |
    use std::fmt::Display;
    use std::error::Error;

    struct Pie;

    #[derive(Debug)]
    struct NotFreshError;

    impl Display for NotFreshError {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            write!(f, "This pie is not fresh!")
        }
    }

    impl Error for NotFreshError {}

    impl Pie {
        fn eat(&self) -> Result<(), Box<dyn Error>> {
            Err(Box::new(NotFreshError))
        }
    }

    fn main() -> Result<(), Box<dyn Error>> {
        let heap_pie = Box::new(Pie);
        heap_pie.eat()?;
        Ok(())
    }
  content_markdown: >
    Il codice Rust può avere una pletora di rappresentazioni per gli
    errori, ma la libreria standard ha un trait universale
    `std::error::Error` per descrivere gli errori.


    Usando uno smart pointer `Box`, possiamo usare il tipo `Box<dyn
    Error>` come tipo comune per restituire errori, perché ci permette
    di propagare un errore sull'heap e interagire con esso a un livello
    alto, senza dover conoscere un tipo specifico.


    All'inizio di Tour of Rust abbiamo imparato che `main` può
    restituire un errore. Ora possiamo restituire un tipo capace di
    descrivere quasi ogni tipo di errore che potrebbe verificarsi nel
    nostro programma, purché la struttura dati dell'errore implementi il
    trait comune `Error` di Rust.


    ```rust

    fn main() -> Result<(), Box<dyn std::error::Error>>

    ```
- title: Conteggio Dei Riferimenti
  code: |
    use std::rc::Rc;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("tastes better on the heap!")
        }
    }

    fn main() {
        let heap_pie = Rc::new(Pie);
        let heap_pie2 = heap_pie.clone();
        let heap_pie3 = heap_pie2.clone();

        heap_pie3.eat();
        heap_pie2.eat();
        heap_pie.eat();

        // all reference count smart pointers are dropped now
        // the heap data Pie finally deallocates
    }
  content_markdown: >
    `Rc` è uno smart pointer che sposta i dati dallo stack all'heap.
    Ci permette di clonare altri smart pointer `Rc`, che hanno tutti la
    possibilità di prendere in prestito in modo immutabile i dati messi
    sull'heap.


    Solo quando l'ultimo smart pointer viene rilasciato, i dati
    sull'heap vengono finalmente deallocati.
- title: Condividere L'Accesso
  code: |
    use std::cell::RefCell;

    struct Pie {
        slices: u8
    }

    impl Pie {
        fn eat(&mut self) {
            println!("tastes better on the heap!");
            self.slices -= 1;
        }
    }

    fn main() {
        // RefCell validates memory safety at runtime
        // notice: pie_cell is not mut!
        let pie_cell = RefCell::new(Pie{slices:8});
        
        {
            // but we can borrow mutable references!
            let mut mut_ref_pie = pie_cell.borrow_mut();
            mut_ref_pie.eat();
            mut_ref_pie.eat();
            
            // mut_ref_pie is dropped at end of scope
        }
        
        // now we can borrow immutably once our mutable reference drops
         let ref_pie = pie_cell.borrow();
         println!("{} slices left",ref_pie.slices);
    }
  content_markdown: >
    `RefCell` è una struttura dati contenitore, spesso posseduta da
    smart pointer, che prende dei dati e ci permette di prendere in
    prestito riferimenti mutabili e immutabili a ciò che contiene.
    Impedisce che il prestito venga abusato, applicando le regole di
    sicurezza della memoria di Rust a runtime quando chiedi di prendere
    in prestito i dati al suo interno:


    **Solo un riferimento mutabile OPPURE più riferimenti immutabili,
    mai entrambi!**


    Se violi queste regole, `RefCell` andrà in panic.
- title: Condividere Tra I Thread
  code: |
    use std::sync::Mutex;

    struct Pie;

    impl Pie {
        fn eat(&self) {
            println!("only I eat the pie right now!");
        }
    }

    fn main() {
        let mutex_pie = Mutex::new(Pie);
        // let's borrow a locked immutable reference of pie
        // we have to unwrap the result of a lock
        // because it might fail
        let ref_pie = mutex_pie.lock().unwrap();
        ref_pie.eat();
        // locked reference drops here, and mutex protected value can be used by someone else
    }
  content_markdown: >
    `Mutex` è una struttura dati contenitore, spesso posseduta da smart
    pointer, che prende dei dati e ci permette di prendere in prestito
    riferimenti mutabili e immutabili ai dati al suo interno. Questo
    impedisce che il prestito venga abusato, facendo in modo che il
    sistema operativo permetta a un solo thread della CPU per volta di
    accedere ai dati, bloccando gli altri thread finché quello
    originale non ha finito con il suo prestito bloccato.


    Il multithreading va oltre lo scopo di Tour of Rust, ma `Mutex` è
    una parte fondamentale nel coordinare più thread della CPU che
    accedono agli stessi dati.


    Esiste uno smart pointer speciale, `Arc`, identico a `Rc` tranne per
    il fatto che usa un incremento thread-safe dei conteggi dei
    riferimenti. Viene spesso usato per avere molti riferimenti allo
    stesso `Mutex`.
- title: Combinare Gli Smart Pointer
  code: |
    use std::cell::RefCell;
    use std::rc::Rc;

    struct Pie {
        slices: u8,
    }

    impl Pie {
        fn eat_slice(&mut self, name: &str) {
            println!("{} took a slice!", name);
            self.slices -= 1;
        }
    }

    struct SeaCreature {
        name: String,
        pie: Rc<RefCell<Pie>>,
    }

    impl SeaCreature {
        fn eat(&self) {
            // use smart pointer to pie for a mutable borrow
            let mut p = self.pie.borrow_mut();
            // take a bite!
            p.eat_slice(&self.name);
        }
    }

    fn main() {
        let pie = Rc::new(RefCell::new(Pie { slices: 8 }));
        // ferris and sarah are given clones of smart pointer to pie
        let ferris = SeaCreature {
            name: String::from("ferris"),
            pie: pie.clone(),
        };
        let sarah = SeaCreature {
            name: String::from("sarah"),
            pie: pie.clone(),
        };
        ferris.eat();
        sarah.eat();

        let p = pie.borrow();
        println!("{} slices left", p.slices);
    }
  content_markdown: >
    Gli smart pointer possono sembrare limitati, ma possono creare
    combinazioni molto potenti.


    `Rc<Vec<Foo>>` - Permette la clonazione di più smart pointer che
    possono prendere in prestito lo stesso vettore di strutture dati
    immutabili sull'heap.


    `Rc<RefCell<Foo>>` - Permette a più smart pointer la possibilità di
    prendere in prestito, in modo mutabile o immutabile, la stessa
    struct `Foo`.


    `Arc<Mutex<Foo>>` - Permette a più smart pointer la possibilità di
    bloccare prestiti temporanei mutabili/immutabili in un modo
    esclusivo a un thread della CPU.


    Dettaglio sulla memoria:

    * Noterai un tema ricorrente in molte di queste combinazioni. L'uso
    di un tipo di dato immutabile (posseduto eventualmente da più smart
    pointer) per modificare dati interni. Questo viene chiamato, in
    Rust, il pattern dell'"interior mutability" (mutabilità interna). È
    un pattern che ci permette di piegare le regole dell'uso della
    memoria a runtime, con lo stesso livello di sicurezza dei controlli
    a tempo di compilazione di Rust.
- title: Capitolo 8 - Conclusione
  content_markdown: >
    Gli smart pointer sono gli idiomi della programmazione in Rust e ci
    permettono di non dover ricreare i pattern molto comuni dell'uso
    della memoria. Con questi strumenti sei pronto ad affrontare le
    sfide più difficili! Ora che abbiamo le fondamenta di Rust,
    parliamo un po' di come costruire progetti più grandi. Nel capitolo
    9 usciamo dalle righe di codice di una singola pagina.
