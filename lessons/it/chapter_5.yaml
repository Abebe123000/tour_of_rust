- title: Capitolo 5 - Proprietà e Prestito dei Dati
  content_markdown: >
    Rust ha un paradigma unico per la gestione della memoria rispetto ad
    altri linguaggi di programmazione. Vedremo i comportamenti e le
    verifiche del compilatore uno per uno, in modo che non ti sembrino
    eccessivi. È importante ricordare che le regole che mostriamo non
    esistono per renderti la vita difficile, ma per aiutarti a scrivere
    codice meno soggetto a errori!
- title: Proprietà
  content_markdown: >
    Istanziare un tipo e **associarlo** a un nome di variabile crea una
    risorsa di memoria che il compilatore Rust verificherà per tutta la
    sua **vita** (lifetime). La variabile associata è chiamata
    **proprietario** (owner) della risorsa.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        // We instantiate structs and bind to variables
        // to create memory resources
        let foo = Foo { x: 42 };
        // foo is the owner
    }
- title: Gestione Delle Risorse Basata Sull'Ambito
  content_markdown: |
    Rust usa la fine di un ambito (scope) come il punto in cui una
    risorsa viene decostruita e deallocata.

    Il termine per questa decostruzione e deallocazione è **drop**.

    Dettaglio sulla memoria:
    * Rust non ha un garbage collector.
    * Questo viene anche chiamato Resource Acquisition Is Initialization (RAII) in C++.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 13 };

        println!("{}", foo_a.x);

        println!("{}", foo_b.x);
        // foo_b is dropped here 
        // foo_a is dropped here
    }
- title: Il Drop È Gerarchico
  content_markdown: >
    Quando una struct viene rilasciata (dropped), viene rilasciata prima
    la struct stessa, poi i suoi campi vengono rilasciati uno per uno, e
    così via.


    Dettagli sulla memoria:

    * Liberando automaticamente la memoria, Rust aiuta a garantire che
    ci siano meno perdite di memoria.

    * Una risorsa di memoria può essere rilasciata solo una volta.
  code: |
    struct Bar {
        x: i32,
    }

    struct Foo {
        bar: Bar,
    }

    fn main() {
        let foo = Foo { bar: Bar { x: 42 } };
        println!("{}", foo.bar.x);
        // foo is dropped first
        // then foo.bar is dropped
    }
- title: Spostare La Proprietà
  content_markdown: >
    Quando un proprietario viene passato come argomento a una funzione,
    la proprietà viene spostata al parametro della funzione.


    Dopo uno **spostamento** (move) la variabile nella funzione
    originale non può più essere usata.


    Dettagli sulla memoria:

    * Durante uno **spostamento**, la memoria dello stack del valore
    del proprietario viene copiata nella memoria dello stack del
    parametro della chiamata di funzione.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let foo = Foo { x: 42 };
        // foo is moved to do_something
        do_something(foo);
        // foo can no longer be used
    }
- title: Restituire La Proprietà
  content_markdown: |
    La proprietà può anche essere restituita da una funzione.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something() -> Foo {
        Foo { x: 42 }
        // ownership is moved out
    }

    fn main() {
        let foo = do_something();
        // foo becomes the owner
        // foo is dropped because of end of function scope
    }
- title: Prendere In Prestito La Proprietà Con I Riferimenti
  content_markdown: |
    I riferimenti ci permettono di prendere in prestito l'accesso a una
    risorsa con l'operatore `&`.

    Anche i riferimenti vengono rilasciati come qualsiasi altra risorsa.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo = Foo { x: 42 };
        let f = &foo;
        println!("{}", f.x);
        // f is dropped here
        // foo is dropped here
    }
- title: Prendere In Prestito La Proprietà Mutabile Con I Riferimenti
  content_markdown: >
    Possiamo anche prendere in prestito l'accesso mutabile a una risorsa
    con l'operatore `&mut`.


    Un proprietario di una risorsa non può essere spostato né modificato
    mentre è preso in prestito in modo mutabile.


    Dettaglio sulla memoria:

    * Rust impedisce che esistano due modi per modificare un valore di
    proprietà, perché ciò introdurrebbe la possibilità di una *data
    race*.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let f = &mut foo;

        // FAILURE: do_something(foo) would fail because
        // foo cannot be moved while mutably borrowed

        // FAILURE: foo.x = 13; would fail here because
        // foo is not modifiable while mutably borrowed

        f.x = 13;
        // f is dropped here because it's no longer used after this point
        
        println!("{}", foo.x);
        
        // this works now because all mutable references were dropped
        foo.x = 7;
        
        // move foo's ownership to a function
        do_something(foo);
    }
- title: Dereferenziazione
  content_markdown: >
    Usando i riferimenti `&mut`, puoi impostare il valore del
    proprietario usando l'operatore `*`.


    Puoi anche ottenere una copia di un valore posseduto usando
    l'operatore `*` (se il valore può essere copiato - discuteremo dei
    tipi copiabili nei capitoli successivi).
  code: |
    fn main() {
        let mut foo = 42;
        let f = &mut foo;
        let bar = *f; // get a copy of the owner's value
        *f = 13;      // set the reference's owner's value
        println!("{}", bar);
        println!("{}", foo);
    }
- title: Gestire I Dati Presi In Prestito
  content_markdown: >
    Le regole di Rust per i riferimenti si possono riassumere così:


    * Rust permette di avere un solo riferimento mutabile **oppure**
    più riferimenti non mutabili, **ma non entrambi**.

    * Un riferimento non deve mai **vivere più a lungo** del suo
    proprietario.


    Questo di solito non è un problema quando si passano riferimenti a
    funzioni.


    Dettagli sulla memoria:

    * La prima regola dei riferimenti previene le *data race*. Cos'è
    una data race? Una data race si verifica quando la lettura di dati
    rischia di non essere sincronizzata, a causa dell'esistenza
    contemporanea di uno scrittore su quegli stessi dati. Questo accade
    spesso nella programmazione multi-thread.

    * La seconda regola dei riferimenti previene l'uso improprio di
    riferimenti che puntano a dati inesistenti (chiamati *dangling
    pointer* in C).
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: &mut Foo) {
        f.x += 1;
        // mutable reference f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        do_something(&mut foo);
        // because all mutable references are dropped within
        // the function do_something, we can create another.
        do_something(&mut foo);
        // foo is dropped here
    }
- title: Riferimenti Di Riferimenti
  content_markdown: |
    I riferimenti possono essere usati anche su pezzi di altri
    riferimenti.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(a: &Foo) -> &i32 {
        return &a.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here allow us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: Vite Esplicite
  content_markdown: >
    Anche se Rust non lo mostra sempre nel codice, il compilatore
    comprende la vita (lifetime) di ogni variabile e cercherà di
    verificare che un riferimento non esista mai più a lungo del suo
    proprietario.


    Le funzioni possono essere esplicite parametrizzando la firma della
    funzione con simboli che aiutano a identificare quali parametri e
    valori di ritorno condividono la stessa vita.


    Gli specificatori di vita iniziano sempre con `'` (ad es. `'a`,
    `'b`, `'c`)
  code: |
    struct Foo {
        x: i32,
    }

    // the parameter foo and return value share the same lifetime
    fn do_something<'a>(foo: &'a Foo) -> &'a i32 {
        return &foo.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here, allowing us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: Vite Multiple
  content_markdown: >
    Gli specificatori di vita ci permettono di essere espliciti in
    determinati scenari che il compilatore non può risolvere da solo,
    distinguendo le vite di tutti i componenti della firma di una
    funzione.
  code: |
    struct Foo {
        x: i32,
    }

    // foo_b and the return value share the same lifetime
    // foo_a has an unrelated lifetime
    fn do_something<'a, 'b>(foo_a: &'a Foo, foo_b: &'b Foo) -> &'b i32 {
        println!("{}", foo_a.x);
        println!("{}", foo_b.x);
        return &foo_b.x;
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 12 };
        let x = do_something(&foo_a, &foo_b);
        // foo_a is dropped here because only foo_b's lifetime exist beyond here
        println!("{}", x);
        // x is dropped here
        // foo_b is dropped here
    }
- title: Vite Statiche
  content_markdown: >
    Una variabile **statica** è una risorsa di memoria creata in fase di
    compilazione, che esiste dall'inizio alla fine di un programma. Il
    suo tipo deve essere specificato esplicitamente.


    Una **vita statica** è una risorsa di memoria che dura
    indefinitamente fino alla fine di un programma. Nota che, secondo
    questa definizione, alcune risorse a vita statica possono essere
    create anche a runtime.


    Le risorse con vita statica hanno uno specificatore di vita
    speciale, `'static`.


    Le risorse `'static` non vengono **mai rilasciate**.


    Se una risorsa a vita statica contiene dei riferimenti, questi
    devono essere tutti `'static` (qualsiasi cosa di meno non vivrebbe
    abbastanza a lungo).


    Dettaglio sulla memoria:


    * Modificare variabili statiche è intrinsecamente pericoloso,
    perché sono accessibili globalmente in lettura da chiunque,
      introducendo la possibilità di una data race. Parleremo più avanti delle sfide poste dai dati globali.
    * Rust permette di usare blocchi `unsafe { ... }` per eseguire
    alcune operazioni sulle quali il compilatore non può fornire
    garanzie di memoria. Il [<span
    style="color:red; font-weight:
    bold;">R̸͉̟͈͔̄͛̾̇͜U̶͓͖͋̅Ṡ̴͉͇̃̉̀T̵̻̻͔̟͉́͆Ơ̷̥̟̳̓͝N̶̨̼̹̲͛Ö̵̝͉̖̏̾̔M̶̡̠̺̠̐͜Î̷̛͓̣̃̐̏C̸̥̤̭̏͛̎͜O̶̧͚͖͔̊͗̇͠N̸͇̰̏̏̽̃</span>](https://doc.rust-lang.org/nomicon/)
    non dovrebbe essere nominato con leggerezza.
  code: |
    static PI: f64 = 3.1415;

    fn main() {
        // static variables can also be scoped to a function
        static mut SECRET: &'static str = "swordfish";

        // string literals have a 'static lifetime
        let msg: &'static str = "Hello World!";
        let p: &'static f64 = &PI;
        println!("{} {}", msg, p);

        // You can break some rules, but you must be explicit
        unsafe {
            // we can set SECRET to a string literal because it is also `static
            SECRET = "abracadabra";
            println!("{}", SECRET);
        }
    }
- title: Vite Nei Tipi Di Dati
  content_markdown: >
    Analogamente alle funzioni, i tipi di dati possono essere
    parametrizzati con specificatori di vita per i loro membri.


    Rust verifica che la struttura dati contenente i riferimenti non
    duri mai più a lungo dei proprietari a cui puntano i suoi
    riferimenti.


    Non possiamo avere struct che girano in giro con riferimenti che
    puntano al nulla!
  code: |
    struct Foo<'a> {
        i:&'a i32
    }

    fn main() {
        let x = 42;
        let foo = Foo {
            i: &x
        };
        println!("{}",foo.i);
    }
- title: Capitolo 5 - Conclusione
  content_markdown: >
    Complimenti per essere arrivato fin qui! So che è tanta roba da
    assimilare, ma sei ormai a buon punto nel tuo cammino per diventare
    un Rustacean. Speriamo sia chiaro come Rust, come linguaggio, punti
    a risolvere molte di queste sfide comuni della programmazione di
    sistema:


    * Modifica involontaria delle risorse

    * Dimenticarsi di decostruire le risorse

    * Risorse decostruite accidentalmente due volte

    * Uso delle risorse dopo che sono state decostruite

    * Data race causate dalla scrittura su risorse mentre altri le
    leggono

    * Individuare chiaramente le aree del codice dove il compilatore
    non può dare garanzie


    Nel prossimo capitolo applicheremo un po' di questa conoscenza
    vedendo come Rust gestisce il testo.
