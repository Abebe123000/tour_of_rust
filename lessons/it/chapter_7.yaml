- title: Capitolo 7 - Programmazione Orientata Agli Oggetti
  content_markdown: >
    Esprimere idee tramite le funzioni è un modo collaudato per
    rappresentare comportamento e dati (il C lo fa da decenni!).
    Storicamente, l'informatica ha trovato altri modi utili ed espressivi
    per aggregare e astrarre i dati. Forse conosci la programmazione
    orientata agli oggetti (OOP) come uno di questi modi. In questo
    capitolo esploreremo cosa ha da offrire Rust oltre alle semplici
    funzioni.
- title: Cos'è L'OOP?
  content_markdown: >
    La programmazione orientata agli oggetti si riferisce, a grandi
    linee, ai linguaggi di programmazione che possiedono una serie di
    caratteristiche distintive:


    * Incapsulamento (Encapsulation) - Raggruppare dati e funzioni
    nell'unità concettuale di un singolo tipo, chiamato *oggetto*.

    * Astrazione (Abstraction) - Nascondere dati e membri delle funzioni
    per offuscare i dettagli implementativi di un oggetto.

    * Polimorfismo (Polymorphism) - La capacità di interagire con un
    oggetto da diverse prospettive funzionali.

    * Ereditarietà (Inheritance) - La capacità di ereditare dati e
    comportamento da altri oggetti.
- title: Rust Non È OOP
  content_markdown: >
    A Rust manca l'ereditarietà di dati e comportamento in modo
    significativo.


    * Le struct non possono ereditare campi da una struct genitore.

    * Le struct non possono ereditare funzioni da una struct genitore.


    Tuttavia, Rust implementa molte altre caratteristiche del linguaggio,
    quindi potresti anche non accorgerti di questa mancanza.
- title: Incapsulamento Con I Metodi
  code: |
    struct SeaCreature {
        noise: String,
    }

    impl SeaCreature {
        fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust supporta il concetto di *oggetto*, cioè una struct associata ad
    alcune funzioni (conosciute anche come *metodi*).


    Il primo parametro di ogni metodo deve essere un riferimento
    all'istanza associata alla chiamata del metodo (es.
    `instanceOfObj.foo()`). Rust usa:

    * `&self` - Riferimento immutabile all'istanza.

    * `&mut self` - Riferimento mutabile all'istanza.


    I metodi sono definiti all'interno di un blocco di implementazione
    con la parola chiave `impl`:


    ```rust

    impl MyStruct {
        ...
        fn foo(&self) {
            ...
        }
    }

    ```
- title: Astrazione Con Esposizione Selettiva
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        println!("{}", creature.get_sound());
    }
  content_markdown: >
    Rust può nascondere il funzionamento interno degli oggetti.


    Per impostazione predefinita, i campi e i metodi sono accessibili
    solo dal modulo a cui appartengono.


    La parola chiave `pub` rende accessibili i campi e i metodi di una
    struct anche fuori dal modulo.
- title: Polimorfismo Con I Trait
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_noise();
    }
  content_markdown: >
    Rust supporta il polimorfismo con i trait. I trait ci permettono di
    associare un insieme di metodi a un tipo struct.


    Per prima cosa definiamo le firme dei metodi di un trait:


    ```

    trait MyTrait {
        fn foo(&self);
        ...
    }

    ```


    Quando una struct implementa un trait, si stabilisce un contratto
    che ci permette di interagire indirettamente con la struct tramite
    il tipo trait (es. `&dyn MyTrait`), senza dover conoscere il tipo
    reale.


    I metodi trait implementati da una struct sono definiti all'interno
    di un blocco di implementazione:


    ```rust

    impl MyTrait for MyStruct {
        fn foo(&self) {
            ...
        }
        ...
    }

    ```
- title: Metodi Implementati Sui Trait
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
        
        fn make_alot_of_noise(&self){
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: >
    I trait possono avere metodi implementati.


    Queste funzioni non hanno accesso diretto ai campi interni di una
    struct, ma possono essere utili per condividere il comportamento tra
    molti tipi che implementano un trait.
- title: Ereditarietà Dei Trait
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    trait LoudNoiseMaker: NoiseMaker {
        fn make_alot_of_noise(&self) {
            self.make_noise();
            self.make_noise();
            self.make_noise();
        }
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    impl LoudNoiseMaker for SeaCreature {}

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        creature.make_alot_of_noise();
    }
  content_markdown: |
    I trait possono ereditare metodi da altri trait.
- title: Dispatch Dinamico Contro Statico
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn static_make_noise(creature: &SeaCreature) {
        // we know the real type
        creature.make_noise();
    }

    fn dynamic_make_noise(noise_maker: &dyn NoiseMaker) {
        // we don't know the real type
        noise_maker.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        static_make_noise(&creature);
        dynamic_make_noise(&creature);
    }
  content_markdown: >
    I metodi vengono eseguiti in due modi:

    * dispatch statico - Quando il tipo dell'istanza è noto, sappiamo
    direttamente quale funzione chiamare.

    * dispatch dinamico - Quando il tipo di un'istanza non è noto,
    dobbiamo trovare un modo per chiamare la funzione giusta.


    I tipi trait come `&dyn MyTrait` ci danno la possibilità di lavorare
    indirettamente con istanze di oggetti usando il dispatch dinamico.


    Quando si usa il dispatch dinamico, Rust ti incoraggia a mettere
    `dyn` prima del tuo tipo trait, così che sia chiaro anche agli
    altri.


    Dettagli sulla memoria:

    * Il dispatch dinamico è leggermente più lento, a causa
    dell'inseguimento di puntatori necessario per trovare la chiamata di
    funzione reale.
- title: Trait Object
  content_markdown: >
    Quando passiamo un'istanza di un oggetto a un parametro di tipo
    `&dyn MyTrait`, stiamo passando quello che viene chiamato un *trait
    object*.


    Un trait object è ciò che ci permette di chiamare indirettamente i
    metodi corretti di un'istanza. Un trait object è una struct che
    contiene il puntatore alla nostra istanza insieme a una lista di
    puntatori a funzione verso i metodi della nostra istanza.


    Dettagli sulla memoria:

    * Questa lista di funzioni è conosciuta in C++ come *vtable*.
- title: Gestire Dati Di Dimensione Sconosciuta
  content_markdown: >
    I trait rappresentano una sfida interessante quando vogliamo
    memorizzarli dentro un'altra struct. I trait nascondono la struct
    originale, e con essa anche la sua dimensione originale. I valori di
    dimensione sconosciuta memorizzati in struct vengono gestiti in Rust
    in due modi:


    * `generics` (generici) - Usare tipi parametrizzati crea di fatto
    struct/funzioni con tipi noti, e quindi dimensioni note.

    * `indirection` (indirezione) - Mettere le istanze sull'heap ci dà
    un livello di indirezione grazie al quale non dobbiamo preoccuparci
    della dimensione del tipo reale, e invece memorizziamo solo un
    puntatore ad esso. Esistono anche altri modi!
- title: Funzioni Generiche
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise<T>(creature: &T)
    where
        T: NoiseMaker,
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: >
    I generici in Rust lavorano di pari passo con i trait. Quando
    descriviamo un tipo parametrizzato `T`, possiamo limitare quali
    tipi possono essere usati come argomento, elencando quali trait
    l'argomento deve implementare.


    In questo esempio, il tipo `T` deve implementare `Foo`:

    ```rust

    fn my_function<T>(foo: T)

    where
        T:Foo
    {
        ...
    }

    ```


    Usando i generici, creiamo a tempo di compilazione funzioni tipizzate
    staticamente con tipi e dimensioni noti, il che ci permette di fare
    dispatch statico e di memorizzarle come valore di dimensione nota.
- title: Scorciatoia Per Le Funzioni Generiche
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    fn generic_make_noise(creature: &impl NoiseMaker)
    {
        // we know the real type at compile-time
        creature.make_noise();
    }

    fn main() {
        let creature = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        generic_make_noise(&creature);
    }
  content_markdown: |
    Rust ha una scorciatoia per esprimere i generici vincolati da un
    trait:

    ```rust
    fn my_function(foo: impl Foo) {
        ...
    }
    ```

    Questo equivale a:

    ```rust
    fn my_function<T>(foo: T)
    where
        T:Foo
    {
        ...
    }
    ```
- title: Box
  code: |
    struct SeaCreature {
        pub name: String,
        noise: String,
    }

    impl SeaCreature {
        pub fn get_sound(&self) -> &str {
            &self.noise
        }
    }

    trait NoiseMaker {
        fn make_noise(&self);
    }

    impl NoiseMaker for SeaCreature {
        fn make_noise(&self) {
            println!("{}", &self.get_sound());
        }
    }

    struct Ocean {
        animals: Vec<Box<dyn NoiseMaker>>,
    }

    fn main() {
        let ferris = SeaCreature {
            name: String::from("Ferris"),
            noise: String::from("blub"),
        };
        let sarah = SeaCreature {
            name: String::from("Sarah"),
            noise: String::from("swish"),
        };
        let ocean = Ocean {
            animals: vec![Box::new(ferris), Box::new(sarah)],
        };
        for a in ocean.animals.iter() {
            a.make_noise();
        }
    }
  content_markdown: >
    `Box` è una struttura dati che ci permette di spostare i nostri dati
    dallo stack all'heap.


    Dereferenziarlo ci permette di usare i dati allocati sull'heap in
    modo ergonomico, come se fossero il tipo originale.


    Poiché `Box` è una struct di dimensione nota (dato che contiene solo
    un puntatore), viene spesso usato come modo per memorizzare un
    riferimento a qualcosa dentro una struct che deve conoscere la
    dimensione dei suoi campi.


    `Box` è così comune che può essere usato da qualsiasi parte:


    ```rust

    Box::new(Foo { ... })

    ```
- title: Struct Generiche Rivisitate
  content_markdown: >
    Anche le struct generiche possono avere i propri tipi parametrizzati
    vincolati da trait.


    ```rust

    struct MyStruct<T>

    where
        T: MyTrait
    {
        foo: T
        ...
    }

    ```


    Le struct generiche portano il proprio tipo parametrizzato anche nel
    loro blocco di implementazione:


    ```rust

    impl<T> MyStruct<T> {
        ...
    }

    ```
- title: Capitolo 7 - Conclusione
  content_markdown: >
    Ora abbiamo più caratteristiche del linguaggio a disposizione per
    rappresentare chiaramente le nostre idee!


    Le astrazioni di Rust possono essere semplici, ma sono abbastanza
    potenti da rendere piacevole lavorare col codice. In questo capitolo
    abbiamo dato una breve occhiata agli smart pointer con `Box`. Nel
    prossimo capitolo impareremo come gli smart pointer possano aiutarci
    in altre situazioni di memoria più specializzate.


    Risorse:

    * [Video - Object-oriented Programming in 7
    minutes](https://www.youtube.com/watch?v=pTB0EiLXUC8)

    * [Articolo - "The faster you unlearn OOP, the better for you and
    your
    software"](https://dpc.pw/the-faster-you-unlearn-oop-the-better-for-you-and-your-software)
