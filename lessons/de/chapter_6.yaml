- title: Kapitel 6 - Text
  content_markdown: >
    Jetzt, wo wir ein wenig verstehen, wie Rust über Speicher denkt, sind wir
    bereit, ausführlicher über Text zu sprechen.


    Rust legt großen Wert auf internationalen Text und Belange auf Byte-Ebene,
    die Dir aus anderen Sprachen vielleicht nicht vertraut sind. Trotzdem
    besitzt Rust viele großartige Werkzeuge, um mit diesen Belangen
    umzugehen.
- title: String-Literale
  content_markdown: >
    String-Literale sind immer Unicode.


    Der Typ von String-Literalen ist `&'static str`:


    * `&` bedeutet, dass es sich auf eine Stelle im Speicher bezieht, und da
    kein `&mut` vorhanden ist, wird der Compiler keine Veränderung erlauben

    * `'static` bedeutet, dass die String-Daten bis zum Ende unseres
    Programms verfügbar sind (sie werden niemals fallen gelassen)

    * `str` bedeutet, dass es auf eine Byte-Sequenz zeigt, die immer
    gültiges **utf-8** sein muss


    Speicherdetails:

    * Der Rust-Compiler wird Deinen String wahrscheinlich in das
    Datensegment des Programmspeichers legen
  code: |
    fn main() {
        let a: &'static str = "hi 🦀";
        println!("{} {}", a, a.len());
    }
- title: Was Ist utf-8
  content_markdown: "Als immer mehr Sprachen auf Computern verwendet wurden, brauchte die Welt eine Möglichkeit, mehr Textzeichen darzustellen, als ASCII erlaubte (1 Byte erlaubte nur 256 Zeichen).\n\n**utf-8** wurde mit einer variablen Byte-Länge von 1-4 Bytes eingeführt, was die Bandbreite möglicher Zeichen stark vergrößerte.\n\nEin Vorteil von Zeichen variabler Größe ist, dass Text keine unnötigen Bytes für sehr häufige ASCII-Zeichen enthält (diese benötigen weiterhin nur 1 Byte in **utf-8**).\n\nEin Nachteil von Zeichen variabler Größe ist, dass das Auffinden eines Zeichens nicht mehr schnell (in konstanter Zeit **O(1)**) über eine einfache Indizierung möglich ist (z. B. `my_text[3]`, um das 4. Zeichen zu erhalten). Es ist möglich, dass die vorangehenden Zeichen unterschiedliche Breiten haben, wodurch sich verändert, wo das 4. Zeichen tatsächlich in der Byte-Sequenz beginnt.\n\nStattdessen müssen wir durch eine **utf-8**-Byte-Sequenz iterieren, um zu verstehen, wo die Unicode-Zeichen tatsächlich beginnen (in linearer Zeit **O(n)**).\n\nFerris: \"Ich bin vor allem einfach froh, **utf-8** zu haben, um die Emojis meiner Unterwasserfreunde darzustellen.\"\n\n<span class=\"emoji\">\U0001F420\U0001F419\U0001F41F\U0001F42C\U0001F40B</span>\n"
- title: Escape-Zeichen
  content_markdown: >
    Es ist schwierig, bestimmte Zeichen visuell darzustellen, daher
    erlauben uns **Escape-Codes**, an ihrer Stelle ein Symbol zu setzen.


    Rust unterstützt die gängigen Escape-Codes aus C-basierten Sprachen:

    * `\n` - Zeilenumbruch

    * `\r` - Wagenrücklauf

    * `\t` - Tabulator

    * `\\` - Backslash

    * `\0` - Null-Zeichen

    * `\'` - einfaches Anführungszeichen


    Die vollständige Liste findest Du
    [hier](https://doc.rust-lang.org/reference/tokens.html).
  code: |
    fn main() {
        let a: &'static str = "Ferris says:\t\"hello\"";
        println!("{}",a);
    }
- title: Mehrzeilige String-Literale
  content_markdown: |
    Rust-Strings sind standardmäßig mehrzeilig.

    Verwende ein `\` am Ende einer Zeile, wenn Du dort keinen Zeilenumbruch
    möchtest.
  code: |
    fn main() {
        let haiku: &'static str = "
            I write, erase, rewrite
            Erase again, and then
            A poppy blooms.
            - Tachibana Hokushi";
        println!("{}", haiku);
        
        
        println!("hello \
        world") // notice that the spacing before w is ignored
    }
- title: Raw-String-Literale
  content_markdown: >
    Raw-Strings erlauben es uns, eine Zeichenfolge wortwörtlich zu
    schreiben, indem wir mit `r#"` beginnen und mit `"#` enden. Dadurch
    können wir Zeichen einfügen, die einen normalen String sonst als
    Literal verwirren könnten (wie doppelte Anführungszeichen und
    Backslashes).
  code: |
    fn main() {
        let a: &'static str = r#"
            <div class="advice">
                Raw strings are useful for some situations.
            </div>
            "#;
        println!("{}", a);
    }
- title: String-Literale Aus Dateien
  content_markdown: >
    Wenn Du sehr großen Text hast, solltest Du das Makro `include_str!` in
    Betracht ziehen, um Text aus lokalen Dateien in Dein Programm
    einzubinden:


    ```rust

    let hello_html = include_str!("hello.html");

    ```
- title: String-Slice
  content_markdown: >
    Ein String-Slice ist eine Referenz auf eine Byte-Sequenz im Speicher,
    die immer gültiges utf-8 sein muss.


    Ein Slice (ein Sub-Slice) eines `str`-Slices muss ebenfalls gültiges
    utf-8 sein.


    Gängige Methoden von `&str`:

    * `len` liefert die Länge des String-Literals in Bytes (nicht die
    Anzahl der Zeichen).

    * `starts_with`/`ends_with` für einfache Prüfungen.

    * `is_empty` gibt `true` zurück, wenn die Länge null ist.

    * `find` gibt ein `Option<usize>` der ersten Position eines Textes
    zurück.
  code: |
    fn main() {
        let a = "hi 🦀";
        println!("{}", a.len());
        let first_word = &a[0..2];
        let second_word = &a[3..7];
        // let half_crab = &a[3..5]; FAILS
        // Rust does not accept slices of invalid unicode characters
        println!("{} {}", first_word, second_word);
    }
- title: Chars
  content_markdown: >
    Wegen der großen Schwierigkeiten bei der Arbeit mit Unicode bietet Rust
    einen Weg, eine Sequenz von utf-8-Bytes als Vektor von Zeichen vom Typ
    `char` abzurufen.


    Ein `char` ist immer 4 Bytes lang (was eine effiziente Suche nach
    einzelnen Zeichen ermöglicht).
  code: |
    fn main() {
        // collect the characters as a vector of char
        let chars = "hi 🦀".chars().collect::<Vec<char>>();
        println!("{}", chars.len()); // should be 4
        // since chars are 4 bytes we can convert to u32
        println!("{}", chars[3] as u32);
    }
- title: String
  content_markdown: >
    Ein **String** ist ein Struct, das eine Sequenz von utf-8-Bytes im
    Heap-Speicher besitzt.


    Da sich sein Speicher auf dem Heap befindet, kann er erweitert,
    verändert usw. werden, auf eine Weise, wie es bei String-Literalen
    nicht möglich ist.


    Gängige Methoden:


    * `push_str` fügt weitere utf-8-Bytes an das Ende eines Strings an.

    * `replace` ersetzt Sequenzen von utf-8-Bytes durch andere.

    * `to_lowercase`/`to_uppercase` für Änderungen der Groß-/
    Kleinschreibung.

    * `trim` zum Entfernen von Leerraum.


    Wenn ein String fallen gelassen wird, wird auch sein Heap-Speicher
    fallen gelassen.


    `String` besitzt einen `+`-Operator, der den String um einen `&str`
    erweitert und sich selbst zurückgibt, aber das ist vielleicht nicht so
    ergonomisch, wie Du hoffen würdest.
  code: |
    fn main() {
        let mut helloworld = String::from("hello");
        helloworld.push_str(" world");
        helloworld = helloworld + "!";
        println!("{}", helloworld);
    }
- title: Text Als Funktionsparameter
  content_markdown: >
    String-Literale und Strings werden Funktionen im Allgemeinen als
    String-Slice übergeben. Das bietet viel Flexibilität in den meisten
    Szenarien, in denen Du gar nicht wirklich das Eigentum übergeben
    musst.
  code: |
    fn say_it_loud(msg:&str){
        println!("{}!!!",msg.to_string().to_uppercase());
    }

    fn main() {
        // say_it_loud can borrow &'static str as a &str
        say_it_loud("hello");
        // say_it_loud can also borrow String as a &str
        say_it_loud(&String::from("goodbye"));
    }
- title: Strings Bauen
  content_markdown: |
    `concat` und `join` sind zwei einfache, aber mächtige Wege, um Strings
    zu bauen.
  code: |
    fn main() {
        let helloworld = ["hello", " ", "world", "!"].concat();
        let abc = ["a", "b", "c"].join(",");
        println!("{}", helloworld);
        println!("{}",abc);
    }
- title: Strings Formatieren
  content_markdown: >
    Das Makro `format!` erlaubt es uns, einen String zu erstellen, indem
    wir einen parametrisierten String mit Platzhaltern definieren, die
    festlegen, wo und wie Werte eingesetzt werden sollen (z. B. `{}`).


    `format!` verwendet dieselben parametrisierten Strings wie `println!`


    Die Fähigkeiten dieser Funktion würden den Rahmen von *Tour of Rust*
    sprengen; schau Dir die [Dokumentation](https://doc.rust-lang.org/std/fmt/)
    an, um mehr zu erfahren.
  code: |
    fn main() {
        let a = 42;
        let f = format!("secret to life: {}",a);
        println!("{}",f);
    }
- title: Strings Umwandeln
  content_markdown: |
    Viele Typen können mit `to_string` in einen String umgewandelt werden.

    Die generische Funktion `parse` kann verwendet werden, um Strings oder
    String-Literale in einen typisierten Wert umzuwandeln. Diese Funktion
    gibt ein `Result` zurück, weil sie fehlschlagen kann.
  code: |
    fn main() -> Result<(), std::num::ParseIntError> {
        let a = 42;
        let a_string = a.to_string();
        let b = a_string.parse::<i32>()?;
        println!("{} {}", a, b);
        Ok(())
    }
- title: Kapitel 6 - Fazit
  content_markdown: >
    Jetzt kennst Du die Grundlagen von Text! Wie Du gesehen hast, macht
    Unicode die Arbeit mit Text etwas kniffliger, aber die
    Standardbibliothek bietet jede Menge Funktionalität, um damit leicht
    umzugehen.


    Bis jetzt haben wir Rust vor allem aus der Perspektive eines
    prozeduralen Paradigmas betrachtet (also nur Funktionen und Daten),
    aber es ist Zeit, dass wir jetzt über Traits sprechen und die
    Fähigkeiten, die Rusts objektorientiertes Paradigma freischaltet.
