- title: Kapitel 5 - Eigentum & Ausleihen von Daten
  content_markdown: >
    Rust hat im Vergleich zu anderen Programmiersprachen ein einzigartiges
    Paradigma für die Speicherverwaltung. Wir werden uns die Verhaltensweisen
    und Validierungen des Compilers nach und nach ansehen, damit es nicht
    überwältigend wird. Es ist wichtig, sich daran zu erinnern, dass die
    Regeln, die wir zeigen, letztendlich nicht dazu da sind, Dir das Leben
    schwer zu machen, sondern Dir zu helfen, Deinen Code weniger
    fehleranfällig zu machen!
- title: Eigentum
  content_markdown: >
    Das Instanziieren eines Typs und das **Binden** an einen Variablennamen
    erzeugt eine Speicherressource, die der Rust-Compiler während ihrer
    gesamten **Lebensdauer** (lifetime) validiert. Die gebundene Variable
    wird der **Eigentümer** (owner) der Ressource genannt.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        // We instantiate structs and bind to variables
        // to create memory resources
        let foo = Foo { x: 42 };
        // foo is the owner
    }
- title: Gültigkeitsbereich-Basiertes Ressourcenmanagement
  content_markdown: |
    Rust verwendet das Ende eines Gültigkeitsbereichs (scope) als den Ort,
    an dem eine Ressource dekonstruiert und freigegeben wird.

    Der Begriff für diese Dekonstruktion und Freigabe wird **Drop** genannt.

    Speicherdetail:
    * Rust besitzt keine Garbage Collection.
    * Dies wird in C++ auch als Resource Acquisition Is Initialization (RAII) bezeichnet.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 13 };

        println!("{}", foo_a.x);

        println!("{}", foo_b.x);
        // foo_b is dropped here 
        // foo_a is dropped here
    }
- title: Fallenlassen Ist Hierarchisch
  content_markdown: >
    Wenn ein Struct fallen gelassen (dropped) wird, wird zuerst das Struct
    selbst fallen gelassen, dann werden seine Kinder einzeln fallen
    gelassen, und so weiter.


    Speicherdetails:

    * Indem Speicher automatisch freigegeben wird, hilft Rust dabei
    sicherzustellen, dass es weniger Speicherlecks gibt.

    * Speicherressourcen können nur einmal fallen gelassen werden.
  code: |
    struct Bar {
        x: i32,
    }

    struct Foo {
        bar: Bar,
    }

    fn main() {
        let foo = Foo { bar: Bar { x: 42 } };
        println!("{}", foo.bar.x);
        // foo is dropped first
        // then foo.bar is dropped
    }
- title: Eigentum Verschieben
  content_markdown: >
    Wenn ein Eigentümer als Argument an eine Funktion übergeben wird, wird
    das Eigentum auf den Funktionsparameter verschoben.


    Nach einer **Verschiebung** (move) kann die Variable in der
    ursprünglichen Funktion nicht mehr verwendet werden.


    Speicherdetails:

    * Während einer **Verschiebung** wird der Stack-Speicher des
    Eigentümerwerts in den Stack-Speicher des Parameters des Funktionsaufrufs
    kopiert.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let foo = Foo { x: 42 };
        // foo is moved to do_something
        do_something(foo);
        // foo can no longer be used
    }
- title: Eigentum Zurückgeben
  content_markdown: |
    Eigentum kann auch von einer Funktion zurückgegeben werden.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something() -> Foo {
        Foo { x: 42 }
        // ownership is moved out
    }

    fn main() {
        let foo = do_something();
        // foo becomes the owner
        // foo is dropped because of end of function scope
    }
- title: Eigentum Mit Referenzen Ausleihen
  content_markdown: |
    Referenzen erlauben es uns, mit dem Operator `&` Zugriff auf eine
    Ressource zu leihen (borrow).

    Referenzen werden ebenfalls fallen gelassen, wie andere Ressourcen auch.
  code: |
    struct Foo {
        x: i32,
    }

    fn main() {
        let foo = Foo { x: 42 };
        let f = &foo;
        println!("{}", f.x);
        // f is dropped here
        // foo is dropped here
    }
- title: Veränderliches Eigentum Mit Referenzen Ausleihen
  content_markdown: >
    Wir können mit dem Operator `&mut` auch veränderlichen (mutable) Zugriff
    auf eine Ressource leihen.


    Ein Ressourceneigentümer kann nicht verschoben oder verändert werden,
    während er veränderlich ausgeliehen ist.


    Speicherdetail:

    * Rust verhindert, dass es zwei Wege gibt, einen im Eigentum stehenden
    Wert zu verändern, weil dies die Möglichkeit eines Data Race einführen
    würde.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: Foo) {
        println!("{}", f.x);
        // f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let f = &mut foo;

        // FAILURE: do_something(foo) would fail because
        // foo cannot be moved while mutably borrowed

        // FAILURE: foo.x = 13; would fail here because
        // foo is not modifiable while mutably borrowed

        f.x = 13;
        // f is dropped here because it's no longer used after this point
        
        println!("{}", foo.x);
        
        // this works now because all mutable references were dropped
        foo.x = 7;
        
        // move foo's ownership to a function
        do_something(foo);
    }
- title: Dereferenzieren
  content_markdown: >
    Mit `&mut`-Referenzen kannst Du den Wert des Eigentümers mit dem
    Operator `*` setzen.


    Du kannst mit dem Operator `*` auch eine Kopie eines im Eigentum
    stehenden Werts erhalten (wenn der Wert kopiert werden kann - wir werden
    kopierbare Typen in späteren Kapiteln besprechen).
  code: |
    fn main() {
        let mut foo = 42;
        let f = &mut foo;
        let bar = *f; // get a copy of the owner's value
        *f = 13;      // set the reference's owner's value
        println!("{}", bar);
        println!("{}", foo);
    }
- title: Umgang Mit Geliehenen Daten
  content_markdown: >
    Rusts Regeln für Referenzen lassen sich am besten so zusammenfassen:


    * Rust erlaubt entweder nur eine veränderliche Referenz **oder**
    mehrere nicht-veränderliche Referenzen, **aber nicht beides**.

    * Eine Referenz darf niemals **länger leben** als ihr Eigentümer.


    Das ist in der Regel kein Problem, wenn Referenzen an Funktionen
    weitergegeben werden.


    Speicherdetails:

    * Die erste Regel für Referenzen verhindert Data Races. Was ist ein
    Data Race? Ein Data Race entsteht, wenn beim Lesen von Daten die
    Möglichkeit besteht, dass diese nicht synchron sind, weil gleichzeitig
    ein Schreibzugriff auf die Daten existiert. Das passiert häufig in der
    Multithread-Programmierung.

    * Die zweite Regel für Referenzen verhindert den Missbrauch von
    Referenzen, die auf nicht mehr existierende Daten verweisen (in C
    "dangling pointers" genannt).
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(f: &mut Foo) {
        f.x += 1;
        // mutable reference f is dropped here
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        do_something(&mut foo);
        // because all mutable references are dropped within
        // the function do_something, we can create another.
        do_something(&mut foo);
        // foo is dropped here
    }
- title: Referenzen Von Referenzen
  content_markdown: |
    Referenzen können sogar auf Teile von Referenzen angewendet werden.
  code: |
    struct Foo {
        x: i32,
    }

    fn do_something(a: &Foo) -> &i32 {
        return &a.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here allow us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: Explizite Lebensdauern
  content_markdown: >
    Auch wenn Rust es nicht immer im Code anzeigt, versteht der Compiler
    die Lebensdauer (lifetime) jeder Variable und wird versuchen zu
    validieren, dass eine Referenz niemals länger existiert als ihr
    Eigentümer.


    Funktionen können explizit sein, indem die Funktionssignatur mit
    Symbolen parametrisiert wird, die dabei helfen zu erkennen, welche
    Parameter und Rückgabewerte dieselbe Lebensdauer teilen.


    Lebensdauer-Spezifizierer beginnen immer mit einem `'` (z. B. `'a`,
    `'b`, `'c`)
  code: |
    struct Foo {
        x: i32,
    }

    // the parameter foo and return value share the same lifetime
    fn do_something<'a>(foo: &'a Foo) -> &'a i32 {
        return &foo.x;
    }

    fn main() {
        let mut foo = Foo { x: 42 };
        let x = &mut foo.x;
        *x = 13;
        // x is dropped here, allowing us to create a non-mutable reference
        let y = do_something(&foo);
        println!("{}", y);
        // y is dropped here
        // foo is dropped here
    }
- title: Mehrere Lebensdauern
  content_markdown: >
    Lebensdauer-Spezifizierer erlauben es uns, bei bestimmten Szenarien,
    die der Compiler nicht selbst auflösen kann, explizit zu sein, indem
    wir alle Lebensdauern der Bestandteile einer Funktionssignatur
    unterscheiden.
  code: |
    struct Foo {
        x: i32,
    }

    // foo_b and the return value share the same lifetime
    // foo_a has an unrelated lifetime
    fn do_something<'a, 'b>(foo_a: &'a Foo, foo_b: &'b Foo) -> &'b i32 {
        println!("{}", foo_a.x);
        println!("{}", foo_b.x);
        return &foo_b.x;
    }

    fn main() {
        let foo_a = Foo { x: 42 };
        let foo_b = Foo { x: 12 };
        let x = do_something(&foo_a, &foo_b);
        // foo_a is dropped here because only foo_b's lifetime exist beyond here
        println!("{}", x);
        // x is dropped here
        // foo_b is dropped here
    }
- title: Statische Lebensdauern
  content_markdown: >
    Eine **statische** Variable ist eine zur Kompilierzeit erstellte
    Speicherressource, die vom Programmstart bis zum Programmende besteht.
    Ihr Typ muss explizit angegeben werden.


    Eine **statische Lebensdauer** ist eine Speicherressource, die
    unbegrenzt bis zum Ende eines Programms besteht. Beachte, dass nach
    dieser Definition einige Ressourcen mit statischer Lebensdauer auch
    zur Laufzeit erstellt werden können.


    Ressourcen mit statischer Lebensdauer haben einen speziellen
    Lebensdauer-Spezifizierer `'static`.


    `'static`-Ressourcen werden niemals **fallen gelassen** (dropped).


    Wenn Ressourcen mit statischer Lebensdauer Referenzen enthalten,
    müssen diese ebenfalls alle `'static` sein (alles andere würde nicht
    lange genug leben).


    Speicherdetail:


    * Das Verändern statischer Variablen ist von Natur aus gefährlich, weil
    sie global zugänglich sind und von jedem gelesen werden können, was die
    Möglichkeit eines Data Race einführt. Wir werden später über die
    Herausforderungen globaler Daten sprechen.
    * Rust erlaubt die Verwendung von `unsafe { ... }`-Blöcken, um einige
    Operationen durchzuführen, über die der Compiler keine
    Speichergarantien geben kann. Das [<span style="color:red;
    font-weight: bold;">R̸͉̟͈͔̄͛̾̇͜U̶͓͖͋̅Ṡ̴͉͇̃̉̀T̵̻̻͔̟͉́͆Ơ̷̥̟̳̓͝N̶̨̼̹̲͛Ö̵̝͉̖̏̾̔M̶̡̠̺̠̐͜Î̷̛͓̣̃̐̏C̸̥̤̭̏͛̎͜O̶̧͚͖͔̊͗̇͠N̸͇̰̏̏̽̃</span>](https://doc.rust-lang.org/nomicon/)
    sollte nicht leichtfertig zur Sprache gebracht werden.
  code: |
    static PI: f64 = 3.1415;

    fn main() {
        // static variables can also be scoped to a function
        static mut SECRET: &'static str = "swordfish";

        // string literals have a 'static lifetime
        let msg: &'static str = "Hello World!";
        let p: &'static f64 = &PI;
        println!("{} {}", msg, p);

        // You can break some rules, but you must be explicit
        unsafe {
            // we can set SECRET to a string literal because it is also `static
            SECRET = "abracadabra";
            println!("{}", SECRET);
        }
    }
- title: Lebensdauern In Datentypen
  content_markdown: >
    Ähnlich wie bei Funktionen können Datentypen mit Lebensdauer-
    Spezifizierern für ihre Mitglieder parametrisiert werden.


    Rust validiert, dass die Datenstruktur, die die Referenzen enthält,
    niemals länger besteht als die Eigentümer, auf die ihre Referenzen
    zeigen.


    Wir können keine Structs mit Referenzen herumlaufen lassen, die ins
    Nichts zeigen!
  code: |
    struct Foo<'a> {
        i:&'a i32
    }

    fn main() {
        let x = 42;
        let foo = Foo {
            i: &x
        };
        println!("{}",foo.i);
    }
- title: Kapitel 5 - Fazit
  content_markdown: >
    Puh, herzlichen Glückwunsch, dass Du es bis hierher geschafft hast! Ich
    weiß, es ist eine Menge zum Verarbeiten, aber Du bist auf dem besten
    Weg, ein Rustacean zu werden. Hoffentlich ist klar geworden, wie Rust
    als Sprache versucht, viele dieser häufigen Herausforderungen der
    Systemprogrammierung zu lösen:


    * Unbeabsichtigte Veränderung von Ressourcen

    * Vergessen, Ressourcen zu dekonstruieren

    * Ressourcen, die versehentlich zweimal dekonstruiert werden

    * Die Verwendung von Ressourcen, nachdem sie dekonstruiert wurden

    * Data Races, verursacht durch das Schreiben in Ressourcen, während
    andere aus diesen Ressourcen lesen

    * Klar erkennbare Bereiche im Code, für die der Compiler keine
    Garantien geben kann


    Im nächsten Kapitel wenden wir etwas von diesem Wissen an, indem wir
    uns ansehen, wie Rust mit Text umgeht.
