    Якщо у вас є пропозиції щодо контенту чи ви хотіли б долучитися до перекладу, зверніть увагу на github репозиторій [Tour of Rust](https://github.com/richardanaya/tour_of_rust)

    Ви можете переходити між сторінками сайту використовуючи клавіші <span class="emoji">⬅️</span> і <span class="emoji">➡️</span>.

    В цьому класичному прикладі ми хочемо показати підтримку Unicode рядків у Rust.
