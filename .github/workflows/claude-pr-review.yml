name: Claude PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    # Only run when the "claude" label is added to the PR
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            1. Correctness and potential bugs
            2. Code quality, readability and maintainability
            3. Security issues
            4. Missing or inadequate test coverage

            Leave inline comments on specific lines where relevant, and a
            top-level summary comment with your overall assessment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
